name: Diagnose self-hosted signing

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: typeflux-macos-vm
    timeout-minutes: 30
    steps:
      - name: Inspect temporary signing identity
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing-diagnostic.keychain-db"
          package="$RUNNER_TEMP/signing-diagnostic.p12"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            security delete-keychain "$RUNNER_TEMP/repacked-signing.keychain-db" >/dev/null 2>&1 || true
            rm -f "$package" "$RUNNER_TEMP/signing-leaf.pem" \
              "$RUNNER_TEMP/repacked-signing.p12" \
              "$RUNNER_TEMP/verify-cert.log"
          }
          trap cleanup EXIT

          echo "Guest time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$package"
          openssl pkcs12 -in "$package" -clcerts -nokeys \
            -passin env:APPLE_CERTIFICATE_PASSWORD -out "$RUNNER_TEMP/signing-leaf.pem"
          openssl x509 -in "$RUNNER_TEMP/signing-leaf.pem" -noout -dates
          openssl pkcs12 -in "$package" -passin env:APPLE_CERTIFICATE_PASSWORD \
            -info -noout 2>&1 | awk '/Keybag|Key bag/ { keys++ } /Certificate bag/ { certificates++ } END { print "P12 key bags: " keys+0 "; certificate bags: " certificates+0 }'

          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$package" -P "$APPLE_CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$keychain"

          echo "Imported certificates: $(security find-certificate -a -p "$keychain" | grep -c 'BEGIN CERTIFICATE')"
          if security find-key -t private "$keychain" >/dev/null 2>&1; then
            echo "Private key present in temporary keychain: yes"
          else
            echo "Private key present in temporary keychain: no"
          fi
          security find-identity -p codesigning "$keychain" | tail -1
          security find-identity -v -p codesigning "$keychain" | tail -1
          security find-identity -p codesigning | tail -1
          set +e
          security verify-cert -c "$RUNNER_TEMP/signing-leaf.pem" -p codeSign \
            -k "$keychain" -L -v > "$RUNNER_TEMP/verify-cert.log" 2>&1
          result=$?
          set -e
          echo "Offline code-signing trust check exit: $result"
          grep -Ei 'error|status|failed|result' "$RUNNER_TEMP/verify-cert.log" | tail -12 || true

          echo "OpenSSL version: $(openssl version)"
          repack_password="$(openssl rand -hex 32)"
          echo "::add-mask::$repack_password"
          export REPACK_PASSWORD="$repack_password"
          openssl pkcs12 -in "$package" -nodes -passin env:APPLE_CERTIFICATE_PASSWORD \
            | openssl pkcs12 -export -passout env:REPACK_PASSWORD \
              -out "$RUNNER_TEMP/repacked-signing.p12"
          repacked_keychain="$RUNNER_TEMP/repacked-signing.keychain-db"
          security create-keychain -p "$password" "$repacked_keychain"
          security unlock-keychain -p "$password" "$repacked_keychain"
          security import "$RUNNER_TEMP/repacked-signing.p12" -P "$repack_password" \
            -A -f pkcs12 -k "$repacked_keychain"
          security find-identity -p codesigning "$repacked_keychain" | tail -1
          security find-identity -v -p codesigning "$repacked_keychain" | tail -1
