name: Tests

on:
  pull_request:
  push:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: tests-autotest-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  account-boundary:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags --depth=1 origin refs/tags/v0.4.0
      - run: python3 scripts/check_account_module_boundary.py
      - run: python3 -m unittest discover -s scripts/tests -p test_account_module_boundary.py

  test:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(github.event.comment.body, '@autotest') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: macos-latest
    name: macOS / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [unit, integration, ui]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge

      - name: Fetch Classic baseline
        if: matrix.group == 'unit'
        run: git fetch --no-tags --depth=1 origin refs/tags/v0.4.0

      - name: Test development scripts
        if: matrix.group == 'unit'
        run: make test-scripts

      - name: Run macOS tests
        run: python3 scripts/test_groups.py ${{ matrix.group }}

  ios:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(github.event.comment.body, '@autotest') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge

      - name: Test shared chat package
        run: swift test --package-path Packages/TypefluxChat --enable-code-coverage

      - name: Test iOS chat client
        run: scripts/test_ios.sh
