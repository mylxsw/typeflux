name: Self-hosted VM runner smoke test

on:
  workflow_dispatch:
    inputs:
      target:
        description: VM runner to verify
        required: true
        type: choice
        options:
          - linux
          - macos

permissions:
  contents: read

jobs:
  linux:
    if: inputs.target == 'linux'
    runs-on: typeflux-linux-vm
    timeout-minutes: 10
    steps:
      - name: Verify Linux ARM64 runner
        shell: bash
        run: |
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          uname -srm

  macos:
    if: inputs.target == 'macos'
    runs-on: typeflux-macos-vm
    timeout-minutes: 10
    steps:
      - name: Verify macOS ARM64 runner and Swift compiler
        shell: bash
        run: |
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          sw_vers
          xcodebuild -version
          printf 'print("swift-compiler-ok")\n' > "$RUNNER_TEMP/smoke.swift"
          xcrun swiftc "$RUNNER_TEMP/smoke.swift" -o "$RUNNER_TEMP/smoke"
          test "$("$RUNNER_TEMP/smoke")" = swift-compiler-ok
