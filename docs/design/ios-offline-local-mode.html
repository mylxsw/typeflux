<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typeflux iOS · 离线可用、本地模式与手动选模型 — 交互设计稿（GUL-418）</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Helvetica Neue", sans-serif;
  --ease: cubic-bezier(.22, .9, .3, 1);
}
[data-theme="light"] {
  color-scheme: light;
  --page: #e4e6ee; --bg: #f5f5f7; --card: #ffffff; --glass: rgba(255,255,255,.80);
  --text: rgba(0,0,0,.88); --text-2: rgba(60,60,67,.66); --text-3: rgba(60,60,67,.40);
  --accent: #2e6ef0; --accent-text: #1b57d6; --accent-soft: #e6eefd;
  --bubble: #e4edfd; --bubble-text: #10234d; --purple: #7d40f0; --local: #8a4fe0; --local-soft: #f1e9fd;
  --fill: rgba(120,120,128,.10); --fill-2: rgba(120,120,128,.16);
  --border: rgba(0,0,0,.08); --success: #30b158; --warn: #c27c00; --warn-soft: #fff4dc; --danger: #e5352b; --danger-soft: #fdeceb;
  --shadow: 0 24px 60px rgba(30,30,60,.20), 0 2px 6px rgba(30,30,60,.10);
}
[data-theme="dark"] {
  color-scheme: dark;
  --page: #0b0b10; --bg: #0f0f12; --card: #1c1c21; --glass: rgba(44,44,52,.78);
  --text: rgba(255,255,255,.92); --text-2: rgba(235,235,245,.62); --text-3: rgba(235,235,245,.36);
  --accent: #178cff; --accent-text: #8ebdff; --accent-soft: #15263e;
  --bubble: #1e3357; --bubble-text: #e1ebff; --purple: #b58cff; --local: #c09bff; --local-soft: #2a2140;
  --fill: rgba(120,120,128,.20); --fill-2: rgba(120,120,128,.28);
  --border: rgba(255,255,255,.09); --success: #32d74b; --warn: #ffcc4d; --warn-soft: #3a2f12; --danger: #ff5a4f; --danger-soft: #3d1a18;
  --shadow: 0 24px 60px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); font-size: 13px; color: var(--text); background: var(--page); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }

/* ---------- board ---------- */
.board { display: grid; grid-template-columns: 220px 430px minmax(300px, 1fr); gap: 28px; max-width: 1360px; margin: 0 auto; padding: 22px 28px 48px; align-items: start; }
header.top { max-width: 1360px; margin: 0 auto; padding: 22px 28px 0; }
header.top h1 { font-size: 20px; margin: 0 0 6px; }
header.top p { margin: 0; color: var(--text-2); line-height: 1.6; max-width: 980px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; margin-top: 14px; }
.toolbar label { color: var(--text-2); margin-right: 6px; }
.seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; }
.seg button { padding: 5px 11px; border-radius: 7px; color: var(--text-2); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
.reset { padding: 5px 11px; border-radius: 8px; background: var(--fill); }

.index { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 4px; }
.index h3, .notes h3 { margin: 4px 0 8px; font-size: 12px; color: var(--text-3); font-weight: 600; letter-spacing: .02em; }
.index button { text-align: left; padding: 8px 10px; border-radius: 9px; color: var(--text-2); line-height: 1.35; }
.index button b { display: block; color: var(--text); font-weight: 600; }
.index button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.notes { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; }
.note { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; line-height: 1.65; }
.note h4 { margin: 0 0 6px; font-size: 14px; }
.note ul { margin: 4px 0 0; padding-left: 18px; }
.note li { margin: 2px 0; }
.note code { background: var(--fill); border-radius: 4px; padding: 0 4px; font-size: 12px; }
.note table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 6px; }
.note td, .note th { border-top: 1px solid var(--border); padding: 5px 4px; text-align: left; vertical-align: top; }
.note th { color: var(--text-3); font-weight: 600; }

/* ---------- phone ---------- */
.phone { width: 402px; height: 860px; border-radius: 58px; padding: 12px; background: #1d1d22; box-shadow: var(--shadow); position: sticky; top: 16px; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 47px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
.status { height: 50px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font-weight: 600; font-size: 15px; z-index: 30; }
.status .r { display: flex; gap: 6px; align-items: center; font-size: 12px; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 35px; border-radius: 20px; background: #000; z-index: 40; }
.home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 136px; height: 5px; border-radius: 3px; background: var(--text); opacity: .85; z-index: 60; }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

.gbtn { width: 40px; height: 40px; border-radius: 50%; background: var(--glass); backdrop-filter: blur(18px); border: 1px solid var(--border); display: grid; place-items: center; font-size: 17px; flex: none; }
.navbar { display: flex; align-items: center; gap: 8px; padding: 4px 14px 8px; z-index: 5; }
.pill { flex: 1; min-width: 0; height: 40px; border-radius: 20px; background: var(--glass); backdrop-filter: blur(18px); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 12px; }
.pill b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pill small { font-size: 10.5px; color: var(--text-2); white-space: nowrap; }
.pill small.local { color: var(--local); }

.banner { margin: 0 14px 8px; border-radius: 14px; padding: 9px 12px; display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; line-height: 1.45; }
.banner.warn { background: var(--warn-soft); color: var(--text); }
.banner.warn .ico { color: var(--warn); }
.banner .ico { font-size: 15px; line-height: 1.2; }
.banner .act { margin-left: auto; color: var(--accent-text); font-weight: 600; white-space: nowrap; }

.msgs { padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.u { align-self: flex-end; max-width: 80%; background: var(--bubble); color: var(--bubble-text); padding: 9px 13px; border-radius: 19px; font-size: 15px; line-height: 1.45; }
.a { font-size: 15px; line-height: 1.6; }
.a p { margin: 0 0 6px; }
.think { color: var(--text-2); font-size: 13px; margin-bottom: 4px; }
.acts { display: flex; gap: 14px; align-items: center; color: var(--text-3); font-size: 13px; margin-top: 2px; }
.mtag { margin-left: auto; font-size: 11.5px; color: var(--text-3); display: inline-flex; gap: 4px; align-items: center; }
.mtag b { color: var(--text-2); font-weight: 500; }
.typing { color: var(--text-2); font-size: 14px; }
.typing::after { content: "▍"; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 30px 40px; text-align: center; }
.orb { width: 84px; height: 84px; border-radius: 50%; background: conic-gradient(from 200deg, #2e6ef0, #8c5cf5, #ffb347, #2e6ef0); filter: blur(.4px); box-shadow: 0 0 40px rgba(46,110,240,.35); }
.orb.local { background: conic-gradient(from 200deg, #8a4fe0, #c37cf5, #6aa6ff, #8a4fe0); box-shadow: 0 0 40px rgba(138,79,224,.35); }
.empty h2 { margin: 0; font-size: 22px; }
.empty p { margin: 0; color: var(--text-2); line-height: 1.5; font-size: 13.5px; }

/* composer */
.composer-wrap { padding: 0 12px 26px; z-index: 6; }
.errcard { margin: 0 2px 8px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 12px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
.errcard .t { display: flex; gap: 8px; font-size: 13.5px; line-height: 1.45; }
.errcard .t .ico { color: var(--danger); }
.errcard .t.info .ico { color: var(--accent); }
.errcard .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn { height: 34px; padding: 0 14px; border-radius: 17px; background: var(--fill); font-weight: 600; font-size: 13px; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.local { background: var(--local); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.composer { background: var(--glass); backdrop-filter: blur(22px); border: 1px solid var(--border); border-radius: 26px; padding: 10px 10px 8px 14px; box-shadow: 0 8px 26px rgba(0,0,0,.10); }
.composer textarea { width: 100%; border: 0; outline: 0; background: transparent; resize: none; font-size: 15.5px; height: 44px; line-height: 1.4; }
.crow { display: flex; align-items: center; gap: 6px; }
.cbtn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; color: var(--text-2); }
.chip { height: 32px; border-radius: 16px; background: var(--fill); padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; max-width: 200px; }
.chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .lk { color: var(--local); }
.chip.warn { background: var(--warn-soft); }
.send { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 17px; font-weight: 700; }
.send.local { background: var(--local); }
.send:disabled { background: var(--fill-2); color: var(--text-3); }

/* sheet */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.26); z-index: 20; animation: fade .2s var(--ease); }
@keyframes fade { from { opacity: 0; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 84%; background: var(--bg); border-radius: 30px 30px 0 0; z-index: 21; display: flex; flex-direction: column; animation: up .28s var(--ease); }
@keyframes up { from { transform: translateY(40%); opacity: .4; } }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 8px auto 4px; flex: none; }
.sheet .sh { display: flex; align-items: center; padding: 6px 18px 10px; }
.sheet .sh b { font-size: 17px; flex: 1; text-align: center; }
.sheet .sh button { color: var(--accent-text); font-size: 15px; width: 60px; text-align: left; }
.sheet .sh button.r { text-align: right; }
.sheet .scroll { padding: 0 16px 34px; }

.sec { font-size: 12.5px; color: var(--text-2); margin: 14px 6px 6px; display: flex; justify-content: space-between; }
.group { background: var(--card); border-radius: 16px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 11px; padding: 11px 14px; min-height: 50px; border-top: 1px solid var(--border); width: 100%; text-align: left; }
.group > .row:first-child, .group > :first-child .row { border-top: 0; }
.row .lg { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; flex: none; }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-weight: 500; font-size: 15px; }
.row .tx small { display: block; color: var(--text-2); font-size: 12px; margin-top: 1px; line-height: 1.4; }
.row .end { color: var(--text-3); font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.row.dis { opacity: .42; cursor: not-allowed; }
.row .chk { color: var(--accent); font-weight: 700; font-size: 16px; }
.badge { font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: var(--fill); color: var(--text-2); font-weight: 600; }
.badge.def { background: var(--accent-soft); color: var(--accent-text); }
.badge.lk { background: var(--local-soft); color: var(--local); }
.badge.ok { color: var(--success); }
.badge.bad { color: var(--danger); background: var(--danger-soft); }
.badge.wn { color: var(--warn); background: var(--warn-soft); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.link { color: var(--accent-text); }
.foot { font-size: 12px; color: var(--text-2); margin: 8px 8px 0; line-height: 1.5; }
.mini { font-size: 12.5px; color: var(--accent-text); font-weight: 600; padding: 4px 8px; border-radius: 8px; background: var(--accent-soft); }

/* sidebar */
.side { position: absolute; top: 0; bottom: 0; left: 0; width: 318px; background: var(--bg); z-index: 22; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding-top: 50px; animation: slide .28s var(--ease); box-shadow: 10px 0 30px rgba(0,0,0,.12); }
@keyframes slide { from { transform: translateX(-60%); opacity: .4; } }
.side .hd { display: flex; align-items: center; padding: 6px 16px 10px; }
.side .hd b { font-size: 22px; flex: 1; }
.search { margin: 0 14px 8px; height: 38px; border-radius: 12px; background: var(--fill); display: flex; align-items: center; padding: 0 12px; color: var(--text-3); gap: 6px; font-size: 15px; }
.filter { margin: 0 14px 6px; }
.filter .seg { display: flex; }
.filter .seg button { flex: 1; }
.hist { padding: 0 8px; }
.hist .g { font-size: 12.5px; color: var(--text-3); padding: 12px 10px 4px; font-weight: 600; }
.hist button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 10px 10px; border-radius: 11px; font-size: 15px; text-align: left; }
.hist button.on { background: var(--fill); }
.hist button .lk { color: var(--local); font-size: 12px; flex: none; }
.hist button span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist button small { color: var(--text-3); font-size: 11px; }
.acct { border-top: 1px solid var(--border); padding: 12px 16px 30px; display: flex; align-items: center; gap: 10px; }
.av { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #6aa6ff, #8c5cf5); color: #fff; display: grid; place-items: center; font-weight: 700; }

/* pages (settings / providers) */
.page-hd { display: flex; align-items: center; padding: 4px 14px 6px; gap: 8px; }
.page-hd b { flex: 1; text-align: center; font-size: 17px; }
.page-hd .sp { width: 40px; }
.page { padding: 0 16px 40px; }
.big { font-size: 30px; font-weight: 700; margin: 4px 4px 8px; }
.field { display: flex; align-items: center; gap: 10px; padding: 0 14px; min-height: 48px; border-top: 1px solid var(--border); }
.field:first-child { border-top: 0; }
.field label { width: 74px; color: var(--text-2); font-size: 14px; flex: none; }
.field input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 15px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ptype { background: var(--card); border-radius: 14px; padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; border: 1.5px solid transparent; }
.ptype.on { border-color: var(--accent); }
.ptype .lg { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-weight: 700; }
.toggle { width: 44px; height: 26px; border-radius: 13px; background: var(--fill-2); position: relative; flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s var(--ease); }
.toggle.on { background: var(--success); }
.toggle.on::after { left: 20px; }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--fill-2); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -2px; }
@keyframes rot { to { transform: rotate(360deg); } }

/* welcome */
.welcome { flex: 1; display: flex; flex-direction: column; padding: 30px 26px 40px; }
.welcome .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
.welcome h2 { font-size: 28px; margin: 6px 0 0; }
.welcome p { margin: 0; color: var(--text-2); line-height: 1.55; font-size: 15px; }
.wbtn { height: 52px; border-radius: 26px; font-size: 16px; font-weight: 600; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
.wbtn.apple { background: var(--text); color: var(--bg); }
.wbtn.mail { background: var(--card); border: 1px solid var(--border); }
.wbtn.local { background: var(--local-soft); color: var(--local); }
.wsub { text-align: center; color: var(--text-3); font-size: 12px; margin-top: 10px; line-height: 1.5; }

/* storage popover */
.pop { position: absolute; left: 14px; right: 14px; bottom: 120px; background: var(--card); border-radius: 22px; z-index: 21; padding: 14px 16px; box-shadow: var(--shadow); animation: up .24s var(--ease); line-height: 1.55; font-size: 13.5px; }
.pop h5 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 6px; align-items: center; }

.toast { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 18px; padding: 8px 14px; z-index: 50; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.12); white-space: nowrap; animation: fade .2s; }
</style>
</head>
<body>
<header class="top">
  <h1>Typeflux iOS · 离线可用、本地模式与手动选模型 <span style="color:var(--text-3);font-weight:500">GUL-418 交互设计稿</span></h1>
  <p>手机里的界面都可以点：侧边栏、模型选择、设置、添加服务商、发送消息。用上方的开关模拟 <b>服务端不可用</b>、<b>设备无网络</b> 和 <b>未登录</b>，看每个页面怎么降级。方案正文见 <code>docs/design/ios-offline-local-mode.md</code>。</p>
  <div class="toolbar">
    <div><label>服务状态</label><span class="seg" id="tServer"><button data-v="online">在线</button><button data-v="down">服务不可用</button><button data-v="offline">设备无网络</button></span></div>
    <div><label>账号</label><span class="seg" id="tAuth"><button data-v="in">已登录</button><button data-v="out">未登录</button></span></div>
    <div><label>我的服务商</label><span class="seg" id="tProv"><button data-v="yes">已配置 DeepSeek</button><button data-v="no">未配置</button></span></div>
    <div><label>主题</label><span class="seg" id="tTheme"><button data-v="light">浅色</button><button data-v="dark">深色</button></span></div>
    <button class="reset" id="reset">重置</button>
  </div>
</header>

<div class="board">
  <nav class="index" id="index"></nav>
  <div class="phone"><div class="screen" id="screen"></div></div>
  <aside class="notes" id="notes"></aside>
</div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const CLOUD = [
  { id: 'auto', name: '自动', sub: 'Typeflux 推荐 · 由后台按负载与能力路由', logo: 'T', color: '#2e6ef0', mult: '1×', vision: true },
  { id: 'gpt', name: 'GPT-5.2', sub: '400K 上下文', logo: 'G', color: '#10a37f', mult: '2×', vision: true },
  { id: 'claude', name: 'Claude Sonnet 5.5', sub: '1M 上下文', logo: 'A', color: '#d97757', mult: '3×', vision: true },
  { id: 'gemini', name: 'Gemini 3 Pro', sub: '1M 上下文', logo: 'G', color: '#4285f4', mult: '2×', vision: true },
  { id: 'dsv', name: 'DeepSeek V4', sub: '128K 上下文', logo: 'D', color: '#4d6bfe', mult: '0.5×', vision: false },
];
const PTYPES = [
  { id: 'openai', name: 'OpenAI', logo: 'O', color: '#10a37f', url: 'https://api.openai.com/v1', models: ['gpt-5.2', 'gpt-5.2-mini', 'o5'] },
  { id: 'anthropic', name: 'Anthropic', logo: 'A', color: '#d97757', url: 'https://api.anthropic.com', models: ['claude-opus-5-5', 'claude-sonnet-5-5', 'claude-haiku-5-5'] },
  { id: 'gemini', name: 'Gemini', logo: 'G', color: '#4285f4', url: 'https://generativelanguage.googleapis.com', models: ['gemini-3-pro', 'gemini-3-flash'] },

const cloudOK = () => S.signedIn && S.server === 'online';
const isLocalRef = ref => ref && ref.includes(':');
function modelInfo(ref) {
  if (!ref) return null;
  if (!isLocalRef(ref)) { const m = CLOUD.find(x => x.id === ref); return m && { ...m, kind: 'cloud' }; }
  const [pid, mid] = ref.split(':');
  const p = S.providers.find(x => x.id === pid); if (!p) return null;
  const m = p.models.find(x => x.id === mid); if (!m) return null;
  const t = PTYPES.find(x => x.id === p.type);
  return { id: ref, name: m.name, provider: p.name, logo: t.logo, color: t.color, vision: m.vision, kind: 'local', lan: t.lan };
}
function modelIssue(ref) {
  const m = modelInfo(ref);
  if (!m) return '默认模型已不可用，请重新选择';
  if (m.kind === 'cloud') {
    if (!S.signedIn) return '登录后才能使用 Typeflux Cloud 模型';
    if (S.server === 'offline') return '设备未联网';
    if (S.server === 'down') return 'Typeflux 服务暂不可用';
  } else if (S.server === 'offline' && !m.lan) return '设备未联网，无法连接 ' + m.provider;
  return null;
}
const allConvs = () => [...(S.signedIn ? CLOUD_CONVS : []), ...S.localConvs];
const convStorage = () => S.conv ? S.conv.storage : (isLocalRef(S.model) ? 'local' : 'cloud');
function toast(t) { S.toast = t; render(); clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = null; render(); }, 1800); }
function go(screen, extra = {}) { Object.assign(S, { screen, overlay: null }, extra); render(); }

function ensureUsableModel() {

  if (!S.signedIn && !isLocalRef(S.model)) {

const INDEX = [
  ['welcome', '首次启动', '登录 / 使用自己的模型'],
  ['chat', '对话', '存储位置、模型芯片、离线降级'],
  ['sidebar', '侧边栏历史', '本机副本、云端 / 本机筛选'],
  ['picker', '模型选择', '自动 / 云端 / 我的服务商、设为默认'],
  ['settings', '设置', '默认模型、存储、离线积分'],
  ['providers', '模型服务商', 'Cloud 状态与自己的服务商'],
  ['addProvider', '添加服务商', '测试连接、选择模型'],
];

/* ---------- render ---------- */
function currentKey() {
  if (S.screen === 'chat' && S.overlay) return S.overlay;
  if (S.screen === 'settings' && S.overlay === 'picker') return 'picker';
  return S.screen;
}
function render() {
  document.documentElement.dataset.theme = S.theme || 'light';
  const sc = $('#screen');
  const html = { welcome: screenWelcome, chat: screenChat, settings: screenSettings, providers: screenProviders, addProvider: screenAddProvider }[S.screen]();
  sc.innerHTML = html + (S.toast ? `<div class="toast">${S.toast}</div>` : '') + '<div class="home-ind"></div>';
  const key = currentKey();
  $('#index').innerHTML = '<h3>页面</h3>' + INDEX.map(([k, t, d]) => `<button class="${k === key ? 'on' : ''}" data-go="${k}"><b>${t}</b>${d}</button>`).join('');
  $('#notes').innerHTML = '<h3>当前页面说明</h3>' + (NOTES[key] || '');
  setSeg('#tServer', S.server); setSeg('#tAuth', S.signedIn ? 'in' : 'out'); setSeg('#tProv', S.providers.length ? 'yes' : 'no'); setSeg('#tTheme', S.theme || 'light');
  const d = $('#draft'); if (d) d.addEventListener('input', () => { S.draft = d.value; const b = $('[data-a="send"]'); if (b) b.disabled = !(S.draft.trim() && (S.signedIn || S.providers.length)); });
}
function setSeg(sel, v) { document.querySelectorAll(sel + ' button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }

/* ---------- actions ---------- */
function send() {
  const text = S.draft.trim(); if (!text) return;
  const ref = S.model;
  const issue = modelIssue(ref);
  const info = modelInfo(ref);
  if (!S.signedIn && !S.providers.length) return;
  if (issue) {
    const buttons = [{ t: '重试', a: 'send', cls: 'primary' }];
    if (info && info.kind === 'cloud' && S.providers.length && !S.conv) buttons.push({ t: '改用我的模型', a: 'switchLocal', cls: 'local' });
    if (info && info.kind === 'cloud' && S.providers.length && S.conv) buttons.push({ t: '在本机新对话中继续', a: 'forkLocal', cls: 'local' });
    S.error = { text: `${issue}，消息没有发出，草稿已保留。`, buttons };
    render(); return;
  }
  S.error = null;
  if (!S.conv) {
    const storage = info.kind === 'local' ? 'local' : 'cloud';
    S.conv = { id: 'n' + Date.now(), title: text.slice(0, 14), group: '今天', storage, model: ref, messages: [] };
    if (storage === 'local') S.localConvs.unshift(S.conv); else CLOUD_CONVS.unshift(S.conv);
  }
  S.conv.model = ref;
  S.conv.messages.push({ r: 'u', t: esc(text) });
  const reply = { r: 'a', typing: true, model: ref };
  S.conv.messages.push(reply);
  S.draft = ''; render();
  setTimeout(() => {
    reply.typing = false;
    reply.t = info.kind === 'local' ? `（${info.provider} 直连）这是由你自己的服务商回答的示例内容，对话只保存在这台 iPhone。` : '这是 Typeflux Cloud 的示例回答，对话已同步到云端并在本机保留副本。';
    if (ref === 'auto') reply.routed = 'DeepSeek V4';
    render();
  }, 900);
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) {
    const k = g.dataset.go;
    if (k === 'sidebar' || k === 'picker' || k === 'storage') { S.screen = 'chat'; S.overlay = k; S.pickerFor = 'chat'; render(); return; }
    if (k === 'addProvider') { openForm(); return; }
    go(k); return;
  }
  const seg = e.target.closest('.toolbar .seg button');
  if (seg) {
    const id = seg.parentElement.id, v = seg.dataset.v;
    if (id === 'tServer') { S.server = v; S.error = null; }
    if (id === 'tAuth') { S.signedIn = v === 'in'; if (!S.signedIn && S.conv && S.conv.storage === 'cloud') S.conv = null; ensureUsableModel(); if (S.signedIn && !isLocalRef(S.defaultModel) && !S.conv) S.model = S.defaultModel; S.error = null; }
    if (id === 'tProv') {
      if (v === 'yes' && !S.providers.length) { S.providers = [SEED_PROVIDER()]; S.localConvs = LOCAL_CONVS(); }
      if (v === 'no') { S.providers = []; S.localConvs = []; if (S.conv && S.conv.storage === 'local') S.conv = null; if (isLocalRef(S.model)) S.model = 'auto'; if (isLocalRef(S.defaultModel)) S.defaultModel = 'auto'; }
      S.error = null;
    }
    if (id === 'tTheme') S.theme = v;
    render(); return;
  }
  const el = e.target.closest('[data-a]'); if (!el || !$('#screen').contains(el)) return;
  const a = el.dataset.a, id = el.dataset.id;
  switch (a) {
    case 'sidebar': S.overlay = 'sidebar'; break;
    case 'close': S.overlay = null; break;
    case 'noop': return;
    case 'newChat': S.conv = null; S.error = null; S.overlay = null; S.screen = 'chat'; S.model = modelInfo(S.defaultModel) && !(S.signedIn === false && !isLocalRef(S.defaultModel)) ? S.defaultModel : S.model; ensureUsableModel(); break;
    case 'open': S.conv = allConvs().find(x => x.id === id); S.model = S.conv.model; S.error = null; S.overlay = null; break;
    case 'filter': S.filter = el.dataset.v; break;
    case 'openPicker': S.overlay = 'picker'; S.pickerFor = 'chat'; break;
    case 'defaultPicker': S.overlay = 'picker'; S.pickerFor = 'default'; break;
    case 'pick':
      if (S.pickerFor === 'default') { S.defaultModel = id; S.overlay = null; render(); toast('已设为默认模型'); return; }
      S.model = id; S.error = null; S.overlay = null; break;
    case 'setDefault': S.defaultModel = S.model; render(); toast('已设为默认，新对话将使用它'); return;
    case 'storage': S.overlay = 'storage'; break;
    case 'send': send(); return;
    case 'retry': toast(S.server === 'online' ? '已刷新' : '仍然无法连接 Typeflux'); return;
    case 'switchLocal': {
      const p = S.providers[0]; const m = p && p.models.find(x => x.on);
      if (m) { S.model = p.id + ':' + m.id; S.error = null; }
      break;
    }
    case 'forkLocal': {
      const p = S.providers[0]; const m = p && p.models.find(x => x.on);
      if (m) { const d = S.draft || ($('#draft') && $('#draft').value); S.conv = null; S.model = p.id + ':' + m.id; S.error = null; S.draft = d; render(); $('#draft').value = d; toast('已带上草稿，新的本机对话'); return; }
      break;
    }
    case 'settings': S.screen = 'settings'; S.overlay = null; break;
    case 'back': S.screen = 'chat'; S.overlay = null; break;
    case 'providers': S.screen = 'providers'; S.overlay = null; break;
    case 'addProvider': openForm(); return;
    case 'editProvider': {
      const p = S.providers.find(x => x.id === id); const t = PTYPES.find(x => x.id === p.type);
      S.form = { editing: p.id, type: p.type, name: p.name, url: t.url, key: '••••••••••••', phase: 'ok', models: p.models.map(m => ({ ...m })) };
      S.screen = 'addProvider'; break;
    }
    case 'ptype': { const t = PTYPES.find(x => x.id === id); S.form = { type: id, name: t.name, url: t.url, key: '', phase: 'idle', models: [] }; break; }
    case 'test': {
      readForm();
      const t = PTYPES.find(x => x.id === S.form.type);
      S.form.phase = 'testing'; render();
      setTimeout(() => {
        if (S.server === 'offline' && !t.lan) { S.form.phase = 'error'; S.form.err = `设备未联网，无法连接 ${t.name}。联网后再试。`; }
        else if (!t.lan && !S.form.key) { S.form.phase = 'error'; S.form.err = '请填写 API Key。'; }
        else if (!S.form.url) { S.form.phase = 'error'; S.form.err = '请填写服务地址。'; }
        else { S.form.phase = 'ok'; S.form.models = t.models.map((m, i) => ({ id: m, name: m, on: i < 2, vision: /vl|gpt-5|claude|gemini/.test(m) })); }
        render();
      }, 800);
      return;
    }
    case 'mtoggle': S.form.models[+el.dataset.i].on = !S.form.models[+el.dataset.i].on; break;
    case 'mvision': S.form.models[+el.dataset.i].vision = !S.form.models[+el.dataset.i].vision; break;
    case 'saveProvider': {
      readForm();
      const f = S.form;
      if (!f.models.some(m => m.on)) { toast('至少选择一个模型'); return; }
      if (f.editing) { const p = S.providers.find(x => x.id === f.editing); p.name = f.name; p.models = f.models; }
      else {
        const p = { id: 'p' + Date.now(), type: f.type, name: f.name || f.type, status: 'ok', models: f.models };
        S.providers.push(p);
        if (!S.signedIn || S.fromWelcome) { const m = f.models.find(x => x.on); S.defaultModel = p.id + ':' + m.id; S.model = S.defaultModel; S.conv = null; S.screen = 'chat'; S.fromWelcome = false; render(); toast('已添加，默认模型已设为 ' + m.name); return; }
      }
      S.screen = 'providers'; render(); toast('已保存'); return;
    }
    case 'deleteProvider': {
      S.providers = S.providers.filter(x => x.id !== S.form.editing);
      if (isLocalRef(S.defaultModel) && !modelInfo(S.defaultModel)) S.defaultModel = S.signedIn ? 'auto' : S.defaultModel;
      S.screen = 'providers'; break;
    }
    case 'clearCache': S.cacheCleared = true; render(); toast('已清除云端副本'); return;
    case 'signin': S.signedIn = true; S.screen = 'chat'; S.overlay = null; if (!S.conv && !isLocalRef(S.model)) S.model = S.defaultModel; render(); toast('已登录（演示）'); return;
    case 'signout': S.signedIn = false; S.cacheCleared = false; if (S.conv && S.conv.storage === 'cloud') S.conv = null; ensureUsableModel(); S.screen = 'chat'; render(); toast('已退出，本机对话已保留'); return;
    case 'useLocal': S.fromWelcome = true; openForm(); return;
    case 'skip': S.screen = 'chat'; break;
  }
  render();
});
function openForm() { S.form = { type: 'deepseek', name: 'DeepSeek', url: PTYPES[3].url, key: '', phase: 'idle', models: [] }; S.screen = 'addProvider'; S.overlay = null; render(); }
function readForm() { const n = $('#fName'), u = $('#fURL'), k = $('#fKey'); if (n) S.form.name = n.value; if (u) S.form.url = u.value; if (k) S.form.key = k.value; }
$('#reset').onclick = () => { const theme = S.theme; S = fresh(); S.theme = theme; CLOUD_CONVS.splice(0, CLOUD_CONVS.length - 4); render(); };
render();
})();
</script>
</body>
</html>
