<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typeflux · 人设页改版（可交互设计稿）</title>
<style>
:root {
  --bg: #1b1b1d; --sidebar: #161617; --card: rgba(255,255,255,.045);
  --card-hover: rgba(255,255,255,.07); --border: rgba(255,255,255,.115); --border-soft: rgba(255,255,255,.07);
  --text: #eeeeef; --text2: #b8b8bb; --text3: #85858a; --accent: #2f8cff; --accent-soft: rgba(47,140,255,.16);
  --ok: #29c76e; --ok-soft: rgba(41,199,110,.14); --warn: #eb8040; --warn-soft: rgba(235,128,64,.15);
  --danger: #dc5252; --danger-soft: rgba(220,82,82,.13); --field: rgba(255,255,255,.06); --tile: rgba(255,255,255,.07);
  --ai: #a970ff; --ai-soft: rgba(169,112,255,.15); --key: rgba(255,255,255,.09);
  --shadow: 0 30px 80px rgba(0,0,0,.45); --stage: #0e0e10; --pop: #2a2a2d; --scrim: rgba(0,0,0,.45);
}
body.light {
  --bg: #f4f5f7; --sidebar: #eceef1; --card: rgba(255,255,255,.95); --card-hover: #f2f4f7;
  --border: rgba(97,115,143,.16); --border-soft: rgba(97,115,143,.10); --text: #141414; --text2: #474747; --text3: #85868a; --accent: #1f6fe0;
  --accent-soft: rgba(31,111,224,.12); --ok: #1fab63; --ok-soft: rgba(31,171,99,.12); --warn: #ed5c2e;
  --warn-soft: rgba(237,92,46,.12); --danger-soft: rgba(220,82,82,.10); --field: #fff; --tile: #eef0f3; --key: #fff;
  --ai: #8a4fe8; --ai-soft: rgba(138,79,232,.11);
  --shadow: 0 30px 80px rgba(30,40,60,.18); --stage: #d9dde3; --pop: #fff; --scrim: rgba(30,40,60,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  color: var(--text); background: var(--stage); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
svg { flex: none; }

/* ---------- Stage ---------- */
.stagebar { width: 1180px; max-width: calc(100vw - 32px); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 18px 0 6px; color: var(--text2); }
.stagebar b { color: var(--text); font-size: 14px; margin-right: 6px; }
.stagebar .sp { flex: 1; }
.pill { border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 12px; }
.pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.caption { width: 1180px; max-width: calc(100vw - 32px); color: var(--text3); font-size: 12px; padding: 0 0 12px; min-height: 30px; }
.caption b { color: var(--text2); font-weight: 600; }
body.solo .stagebar, body.solo .caption { display: none; }
body.solo { padding: 0; }

/* ---------- Shared controls ---------- */
.btn { height: 28px; border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 0 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 500; font-size: 12.5px; }
.btn:hover { background: var(--card-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text2); }
.btn.ghost:hover { background: var(--card-hover); color: var(--text); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm { height: 24px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
.btn:disabled { opacity: .45; cursor: default; }
.ibtn { width: 26px; height: 26px; border-radius: 7px; border: 1px solid transparent; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--text3); }
.ibtn:hover { background: var(--card-hover); color: var(--text); }
.ibtn.boxed { border-color: var(--border); background: var(--card); color: var(--text2); }
.switch { width: 32px; height: 19px; border-radius: 999px; background: var(--tile); border: 1px solid var(--border); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 1px; left: 1px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
.switch.on { background: var(--ok); border-color: var(--ok); }
.switch.on::after { left: 14px; }
.seg { display: inline-flex; background: var(--tile); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 2px 10px; border-radius: 6px; cursor: pointer; color: var(--text2); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.seg button.on { background: var(--card-hover); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
body.light .seg button.on { background: #fff; }
.seg button .n { font-size: 10.5px; color: var(--text3); }
.keys { display: inline-flex; gap: 3px; align-items: center; }
.keys kbd { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; background: var(--key); border: 1px solid var(--border); border-bottom-width: 2px;
  font: 600 11px -apple-system, "SF Pro Text", sans-serif; display: inline-grid; place-items: center; color: var(--text); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; line-height: 17px; }
.badge.def { background: var(--ok-soft); color: var(--ok); }
.badge.aux { background: var(--ai-soft); color: var(--ai); }
.badge.app { background: var(--tile); color: var(--text2); }
.badge.off { background: var(--tile); color: var(--text3); }
.badge.sys { background: var(--tile); color: var(--text3); font-weight: 500; }

/* ---------- Window ---------- */
.window { position: relative; display: flex; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow); background: var(--bg); width: 1180px; height: 780px; transition: width .2s; }
body.narrow .window { width: 940px; }
body.solo .window { border-radius: 0; box-shadow: none; border: 0; }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.mainnav { width: 200px; background: var(--sidebar); padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--border); flex: none; }
body.narrow .mainnav { width: 168px; }
.mainnav .lights { margin: 2px 4px 22px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; margin: 0 6px 22px; }
.brand .logo { width: 28px; height: 28px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.brand small { font-size: 11px; color: var(--text3); font-weight: 500; }
.navitem { display: flex; align-items: center; gap: 11px; padding: 8px 12px; border-radius: 9px; color: var(--text2); font-weight: 500; }
.navitem.on { background: var(--accent-soft); color: var(--text); }
.navsp { flex: 1; }
.content { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; padding: 24px 28px 22px; }
.ph h1 { margin: 0 0 12px; font-size: 26px; font-weight: 700; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--border-soft); margin-bottom: 16px; }
.tabs span { padding: 0 0 9px; color: var(--text2); font-weight: 600; font-size: 14px; position: relative; }
.tabs span small { color: var(--text3); font-weight: 500; margin-left: 4px; }
.tabs span.on { color: var(--text); }
.tabs span.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }

/* ---------- Usage strip ---------- */
.usage { display: grid; grid-template-columns: 1fr 1fr 1.15fr; gap: 10px; margin-bottom: 14px; }
body.narrow .usage { grid-template-columns: 1fr 1fr; }
body.narrow .usage .slot.apps { grid-column: 1 / -1; }
body.narrow .usage .slot.apps { flex-direction: row; align-items: center; gap: 14px; padding: 8px 13px; }
body.narrow .usage .slot.apps .apps-row { flex: 1; min-width: 0; }
.slot { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; display: flex; flex-direction: column; gap: 8px; position: relative; min-width: 0; }
.slot .top { display: flex; align-items: center; gap: 7px; color: var(--text2); font-size: 12px; font-weight: 600; }
.slot .top .sp { flex: 1; }
.slot .top .hint { font-weight: 400; color: var(--text3); }
.slot .ico { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; }
.slot .ico.g { background: var(--ok-soft); color: var(--ok); }
.slot .ico.p { background: var(--ai-soft); color: var(--ai); }
.slot .ico.b { background: var(--accent-soft); color: var(--accent); }
.picker { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--field); cursor: pointer; min-width: 0; text-align: left; }
.picker:hover { border-color: var(--text3); }
.picker .nm { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.picker .chev { color: var(--text3); }
.apps-row { display: flex; align-items: center; gap: 8px; height: 32px; }
.appstack { display: flex; }
.appstack .ai { width: 24px; height: 24px; border-radius: 6px; margin-left: -5px; border: 2px solid var(--bg); font-size: 10px; font-weight: 700; display: grid; place-items: center; color: #fff; }
.appstack .ai:first-child { margin-left: 0; }
.apps-row .txt { flex: 1; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.apps-row .txt b { color: var(--text); }
.priority { display: flex; align-items: center; gap: 6px; color: var(--text3); font-size: 11.5px; margin: -6px 2px 12px; }
.priority b { color: var(--text2); font-weight: 600; }

/* ---------- Library ---------- */
.lib { flex: 1; display: flex; gap: 14px; min-height: 0; }
.roster { width: 300px; flex: none; display: flex; flex-direction: column; min-height: 0; }
body.narrow .roster { width: 250px; }
.rhead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.rhead h3 { margin: 0; font-size: 14px; }
.rhead .n { color: var(--text3); font-weight: 500; font-size: 12px; }
.rhead .sp { flex: 1; }
.search { display: flex; align-items: center; gap: 6px; background: var(--field); border: 1px solid var(--border); border-radius: 8px; padding: 0 9px; color: var(--text3); height: 30px; margin-bottom: 8px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--text); font-size: 12.5px; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.rlist { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.gl { font-size: 11.5px; font-weight: 600; color: var(--text3); margin: 10px 6px 4px; display: flex; gap: 6px; }
.gl:first-child { margin-top: 2px; }
.prow { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 9px; cursor: pointer; position: relative; }
.prow:hover { background: var(--card-hover); }
.prow.on { background: var(--accent-soft); }
.prow .meta { flex: 1; min-width: 0; }
.prow .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.prow .nm .t { overflow: hidden; text-overflow: ellipsis; }
.prow .ds { color: var(--text3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .tags { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
.prow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex: none; }
.av { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.av.lg { width: 46px; height: 46px; border-radius: 12px; font-size: 19px; }
.empty { text-align: center; color: var(--text3); padding: 28px 12px; font-size: 12.5px; }
.empty b { display: block; color: var(--text2); margin-bottom: 4px; }

/* ---------- Detail ---------- */
.detail { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; position: relative; }
.dhead { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 12px; }
.dhead .meta { flex: 1; min-width: 0; }
.dhead h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.dhead h2 input { font-size: 18px; font-weight: 700; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 1px 6px; margin-left: -7px; outline: none; width: 100%; min-width: 0; }
.dhead h2 input:hover { border-color: var(--border); }
.dhead h2 input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--field); }
.dhead .sub { color: var(--text3); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dhead .acts { display: flex; gap: 6px; align-items: center; position: relative; }
.uses { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 18px 12px; border-bottom: 1px solid var(--border-soft); }
.uses .lbl { color: var(--text3); font-size: 12px; margin-right: 2px; }
.uses .none { color: var(--text3); font-size: 12px; }
.uses .lnk { color: var(--accent); cursor: pointer; font-size: 12px; background: none; border: 0; padding: 0; }
.dbody { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 18px 14px; gap: 10px; }
.note { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--tile); color: var(--text2); font-size: 12.5px; }
.note .sp { flex: 1; }
.flabel { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text3); font-weight: 600; }
.flabel .sp { flex: 1; }
.flabel .aux { font-weight: 400; }
.prompt { flex: 1; min-height: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--field); padding: 12px 14px; overflow-y: auto; line-height: 1.7; font-size: 13px; white-space: pre-wrap; color: var(--text); outline: none; resize: none; width: 100%; }
.prompt.ro { background: transparent; color: var(--text2); }
textarea.prompt:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.savebar { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--border-soft); background: var(--card); }
.savebar .sp { flex: 1; }
.savebar .st { color: var(--warn); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.savebar .st.ok { color: var(--text3); }
.savebar .kh { color: var(--text3); font-size: 11.5px; }

/* Templates */
.tpl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
body.narrow .tpl { grid-template-columns: 1fr 1fr; }
.tpl button { text-align: left; border: 1px solid var(--border); background: var(--field); border-radius: 10px; padding: 9px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.tpl .av { width: 26px; height: 26px; border-radius: 7px; font-size: 12px; }
.tpl button:hover { border-color: var(--accent); }
.tpl button.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tpl b { display: block; margin-bottom: 2px; }
.tpl span { color: var(--text3); font-size: 12px; }

/* ---------- Popovers / menus ---------- */
.menu { position: absolute; z-index: 50; background: var(--pop); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.35); padding: 5px; min-width: 240px; display: none; }
.menu.open { display: block; }
.menu .mi { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.menu .mi:hover { background: var(--accent); color: #fff; }
.menu .mi:hover .mh, .menu .mi:hover .ck { color: #fff; }
.menu .mi .mt { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.menu .mi .mh { color: var(--text3); font-size: 11.5px; }
.menu .mi .ck { width: 14px; color: var(--accent); }
.menu .mi.danger { color: var(--danger); }
.menu .mi.danger:hover { background: var(--danger); color: #fff; }
.menu .sep { height: 1px; background: var(--border-soft); margin: 4px 2px; }
.menu .mg { font-size: 11px; color: var(--text3); font-weight: 600; padding: 5px 8px 2px; }
.menu .msearch { margin: 2px 2px 4px; height: 26px; }

/* ---------- App rules drawer ---------- */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 40; display: none; }
.scrim.open { display: block; }
.drawer { visibility: hidden; position: absolute; top: 0; right: 0; bottom: 0; width: 520px; background: var(--bg); border-left: 1px solid var(--border); z-index: 41; box-shadow: -20px 0 60px rgba(0,0,0,.35);
  transform: translateX(105%); transition: transform .22s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; visibility: visible; }
.drawer .dh { display: flex; align-items: center; gap: 10px; padding: 18px 20px 6px; }
.drawer .dh h3 { margin: 0; font-size: 17px; flex: 1; }
.drawer .lead { color: var(--text3); padding: 0 20px 12px; font-size: 12.5px; }
.drawer .master { display: flex; align-items: center; gap: 10px; margin: 0 20px 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
.drawer .master .meta { flex: 1; }
.drawer .master .meta b { display: block; }
.drawer .master .meta span { color: var(--text3); font-size: 12px; }
.drawer .rules { flex: 1; overflow-y: auto; padding: 0 20px 16px; }
.drawer.paused .rules .rule { opacity: .5; }
.rule { display: grid; grid-template-columns: 30px 1fr 180px 32px 26px; align-items: center; gap: 10px; padding: 9px 4px; border-top: 1px solid var(--border-soft); }
.rule:first-of-type { border-top: 0; }
.rule.off .an, .rule.off .rp { opacity: .5; }
.rule .an { min-width: 0; }
.rule .an b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rule .an span { color: var(--text3); font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.rule .rp { position: relative; }
.rule .rp .picker { height: 28px; width: 100%; }
.rule .rp .picker.missing .nm { color: var(--danger); }
.appicon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; }
.addapp { margin: 4px 0 0; }
.apppick { border: 1px solid var(--border); border-radius: 11px; background: var(--card); margin-top: 10px; overflow: hidden; display: none; }
.apppick.open { display: block; }
.apppick .ah { display: flex; gap: 8px; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-soft); }
.apppick .ah .search { flex: 1; margin: 0; }
.apppick .al { max-height: 220px; overflow-y: auto; padding: 4px; }
.apppick .ar { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.apppick .ar:hover { background: var(--card-hover); }
.apppick .ar .an { flex: 1; min-width: 0; }
.apppick .ar .an span { color: var(--text3); font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; }
.apppick .ar .appicon { width: 26px; height: 26px; font-size: 11px; }
.apppick .ar.bound { opacity: .45; cursor: default; }
.apppick .manual { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border-soft); align-items: center; color: var(--text3); font-size: 12px; }
.apppick .manual input { flex: 1; height: 26px; border: 1px solid var(--border); background: var(--field); border-radius: 7px; padding: 0 8px; outline: none; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

/* ---------- Dialog & toast ---------- */
.modal { position: absolute; inset: 0; display: none; place-items: center; z-index: 60; background: var(--scrim); }
.modal.open { display: grid; }
.dialog { width: 380px; background: var(--pop); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; }
.dialog h4 { margin: 0 0 6px; font-size: 15px; }
.dialog p { margin: 0 0 10px; color: var(--text2); }
.dialog ul { margin: 0 0 14px; padding: 10px 12px 10px 28px; background: var(--tile); border-radius: 9px; color: var(--text2); font-size: 12.5px; }
.dialog ul li + li { margin-top: 4px; }
.dialog .row { display: flex; justify-content: flex-end; gap: 8px; }
.toast { position: absolute; left: 50%; bottom: 22px; transform: translate(-50%, 30px); opacity: 0; transition: all .2s; z-index: 70; background: var(--pop); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.35); padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 12px; pointer-events: none; }
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast .lnk { color: var(--accent); background: none; border: 0; cursor: pointer; font-weight: 600; }
</style>
</head>
<body>
<div class="stagebar">
  <b>人设页改版</b>
  <span class="pill" data-state="builtin">① 浏览内置人设</span>
  <span class="pill" data-state="custom">② 编辑我的人设</span>
  <span class="pill" data-state="create">③ 新建人设</span>
  <span class="pill" data-state="apps">④ 应用专属规则</span>

<script>
const PALETTE = ['#2f8cff', '#29c76e', '#a970ff', '#eb8040', '#20b2aa', '#e5577a', '#c9a227', '#6f7bf7'];
const SYS_TF = 'tf', SYS_EN = 'en';
const TF_PROMPT = `人设语言模式：继承。
- 不要自行决定输出语言。
- 遵循任务、源内容和更高优先级语言策略已经确定的语言。
- 如果任务内容无法确定语言，使用系统提供的默认语言，不要臆造语言。

核心原则：
- 主动整理内容，不要只删除语气词。
- 识别不同的主题、要点、决定、请求和行动项；归拢相关细节、合并重复信息，并按合理顺序组织。
- 理解用户真正想表达的意思，而不是机械保留不流畅的口语字面表达。
- 去除口头填充词（如 um、uh、like、you know、basically 等）、重复和语病，同时保留意图、语气和重要细节。
- 让结果更清晰、更有结构、更有用，但不要添加用户没有表达或暗示的新事实。
- 保留关键约束、请求、决定、行动项、人名、数字和承诺。
- 在不改变原意的前提下，提升句子结构与表达清晰度。
- 保持用户整体语气自然，不要无故改得更正式或更华丽。

编辑与成稿：
- 修正语法、标点、语序和明显的口语修正痕迹。
- 单一思路用简洁段落；有多个并列事项时，用简单的项目符号或编号列表。
- 最终文本简洁但完整。

输出规则：
- 只返回整理后的最终文本。
- 不要包含解释、引号、代码块、标题或复杂 Markdown。`;
const EN_PROMPT = `Persona language mode: English.
- Always output English, regardless of the spoken language.

Translate the dictated content into natural, fluent English.
- Preserve meaning, tone, names, numbers and commitments.
- Remove filler words and spoken repairs before translating.
- Return only the translated text.`;

let personas = [
  { id: SYS_TF, name: 'Typeflux', sys: true, summary: '整理口述，保留原意', prompt: TF_PROMPT },
  { id: SYS_EN, name: 'English Translator', sys: true, summary: '将口述内容翻译为英文', prompt: EN_PROMPT },
  { id: 'c1', name: '候选：英文口语化表达', prompt: 'ASR post-processing editor. Clean up spoken English into casual, natural phrasing.\n\n- Keep contractions and a friendly tone.\n- Remove fillers and false starts.\n- Return only the final text.' },
  { id: 'c2', name: '候选：结构化输出', prompt: '# Role\n把口述整理成结构化的要点。\n\n- 先给一句话结论。\n- 再用编号列出要点、待办和负责人。\n- 不要添加原文没有的信息。' },
  { id: 'c3', name: '候选：英文翻译', prompt: 'ASR post-processing editor role: translate the dictation into concise business English.\n\n- Keep product names untouched.\n- Return only the translation.' },
  { id: 'c4', name: '职场助手', prompt: '你是一名语音转写文本润色助手。把口述内容改写成适合发给同事的消息：\n\n- 语气礼貌、简洁、直接。\n- 有请求时把请求放在最前面。\n- 保留所有人名、时间和数字。' },
  { id: 'c5', name: '邮件回复', prompt: '把口述整理成一封可直接发送的邮件正文：称呼、正文、结尾敬语。\n\n- 正式但不生硬。\n- 不要编造事实。' },
  { id: 'c6', name: '会议纪要', prompt: '把口述整理为会议纪要：\n\n1. 议题\n2. 结论\n3. 待办（负责人 · 截止时间）' },
  { id: 'c7', name: '代码提交说明', prompt: 'Turn the dictation into a git commit message.\n\n- Imperative subject line under 60 characters.\n- Optional body wrapped at 72 characters explaining why.' },
];
let settings = { def: SYS_TF, aux: 'c1' };
let appsEnabled = true;
let rules = [
  { id: 'r1', app: 'Slack', bundle: 'com.tinyspeck.slackmacgap', persona: 'c4', on: true, color: '#4a154b' },
  { id: 'r2', app: '邮件', bundle: 'com.apple.mail', persona: 'c5', on: true, color: '#2f8cff' },
  { id: 'r3', app: 'Xcode', bundle: 'com.apple.dt.Xcode', persona: 'c7', on: false, color: '#147efb' },
  { id: 'r4', app: 'Cursor', bundle: 'com.todesktop.230313mzl4w4u92', persona: null, on: true, color: '#222' },
];
const INSTALLED = [
  { app: '飞书', bundle: 'com.bytedance.lark', color: '#3370ff', running: true },
  { app: '微信', bundle: 'com.tencent.xinWeChat', color: '#07c160', running: true },
  { app: 'Notion', bundle: 'notion.id', color: '#111', running: true },
  { app: 'Slack', bundle: 'com.tinyspeck.slackmacgap', color: '#4a154b', running: true },
  { app: 'Safari', bundle: 'com.apple.Safari', color: '#1e90ff', running: false },
  { app: 'Obsidian', bundle: 'md.obsidian', color: '#7c3aed', running: false },
  { app: '备忘录', bundle: 'com.apple.Notes', color: '#e3b122', running: false },
];

let sel = SYS_TF, q = '', draft = null, creating = null, pendingSelect = null, undo = null;

const $ = (id) => document.getElementById(id);
const byId = (id) => personas.find(p => p.id === id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; }
function glyph(p) {
  if (!p) return '∅';
  if (p.id === SYS_TF) return '∞';
  const n = p.name.replace(/^候选[:：]\s*/, '');
  return /^[A-Za-z]/.test(n) ? n[0].toUpperCase() : n[0];
}
function avStyle(p) {
  if (!p) return 'background:var(--tile);color:var(--text3)';
  const c = p.id === SYS_TF ? '#2f8cff' : PALETTE[hash(p.name) % PALETTE.length];
  return `background:${c}26;color:${c}`;
}
function summary(p) {
  if (p.summary) return p.summary;
  // Custom personas have no summary field: show the first meaningful line without Markdown markers.
  const line = p.prompt.split('\n').map(l => l.replace(/^[#>\-*\d.\s]+/, '').trim()).find(l => l && !/^role$/i.test(l));
  return line || '自定义人设';
}
function usesOf(id) {
  const u = [];
  if (settings.def === id) u.push({ k: 'def', t: '听写默认' });
  if (settings.aux === id) u.push({ k: 'aux', t: '辅助输入' });
  const apps = rules.filter(r => r.persona === id);
  if (apps.length) {
    const live = apps.filter(r => r.on && appsEnabled);
    const t = apps.length === 1 ? apps[0].app : `${apps[0].app} 等 ${apps.length} 个应用`;
    u.push({ k: live.length ? 'app' : 'off', t: live.length ? t : t + ' · 已暂停', apps });
  }
  return u;
}
const dirty = () => !!draft && (draft.name !== byId(draft.id)?.name || draft.prompt !== byId(draft.id)?.prompt);

/* ---------- Usage strip ---------- */
function renderUsage() {
  const d = byId(settings.def), a = byId(settings.aux);
  const mini = 'width:22px;height:22px;border-radius:6px;font-size:11px;';
  $('defAv').textContent = glyph(d); $('defAv').style.cssText = mini + avStyle(d);
  $('defName').textContent = d ? d.name : '不使用人设（原样输出）';
  $('auxAv').textContent = glyph(a); $('auxAv').style.cssText = mini + avStyle(a);
  $('auxName').textContent = a.name;
  const active = rules.filter(r => r.on);
  $('appStack').innerHTML = rules.slice(0, 4).map(r => `<span class="ai" style="background:${r.color};${r.on && appsEnabled ? '' : 'opacity:.4'}">${esc(r.app[0])}</span>`).join('');
  $('appsHint').textContent = appsEnabled ? '' : '已暂停';
  $('appsTxt').innerHTML = !rules.length ? '还没有规则，可以让 Slack 自动换成「职场助手」'
    : appsEnabled ? `<b>${active.length}</b> 个应用${rules.length > active.length ? ` · ${rules.length - active.length} 个暂停` : ''}` : '全部规则已暂停';
  $('tabCount').textContent = personas.length; $('libCount').textContent = personas.length;
}

/* ---------- Roster ---------- */
function rowHTML(p) {
  const tags = usesOf(p.id).map(u => `<span class="badge ${u.k}">${u.k === 'def' ? '✓ ' : ''}${esc(u.t)}</span>`).join('');
  const isDirty = draft && draft.id === p.id && dirty();
  return `<div class="prow ${sel === p.id && !creating ? 'on' : ''}" data-id="${p.id}">
    <span class="av" style="${avStyle(p)}">${esc(glyph(p))}</span>
    <div class="meta"><div class="nm"><span class="t">${esc(p.name)}</span>${isDirty ? '<span class="dot" title="未保存"></span>' : ''}</div>
      <div class="ds">${esc(summary(p))}</div>${tags ? `<div class="tags">${tags}</div>` : ''}</div></div>`;
}
function renderRoster() {
  const k = q.trim().toLowerCase();
  const match = (p) => !k || p.name.toLowerCase().includes(k) || p.prompt.toLowerCase().includes(k) || summary(p).toLowerCase().includes(k);
  const sys = personas.filter(p => p.sys && match(p)), mine = personas.filter(p => !p.sys && match(p));
  let h = '';
  if (creating) h += `<div class="gl">新建中</div><div class="prow on"><span class="av" style="background:var(--accent-soft);color:var(--accent)">+</span><div class="meta"><div class="nm">${esc(creating.name || '未命名人设')}</div><div class="ds">尚未保存</div></div></div>`;
  if (mine.length) h += `<div class="gl">我的人设 · ${mine.length}</div>` + mine.map(rowHTML).join('');
  if (sys.length) h += `<div class="gl">内置 · ${sys.length}</div>` + sys.map(rowHTML).join('');
  if (!sys.length && !mine.length) h += `<div class="empty"><b>没有找到「${esc(q)}」</b>可以搜索名称或人设定义里的文字。<br><br><button class="btn sm" id="createFromSearch">新建「${esc(q)}」</button></div>`;
  $('rlist').innerHTML = h;
  $('qClear').style.display = q ? 'grid' : 'none';
}

/* ---------- Detail ---------- */
function usesHTML(id) {
  const u = usesOf(id);
  if (!u.length) return `<span class="lbl">使用于</span><span class="none">暂未使用 ·</span><button class="lnk" data-act="useMenu">设为听写默认、辅助输入或绑定应用</button>`;
  return `<span class="lbl">使用于</span>` + u.map(x => `<span class="badge ${x.k}" ${x.apps ? 'style="cursor:pointer" data-act="openApps"' : ''}>${x.k === 'def' ? '✓ ' : ''}${esc(x.t)}</span>`).join('');
}
function renderDetail() {
  const el = $('detail');
  if (creating) return renderCreate(el);
  const p = byId(sel);
  if (!p) { el.innerHTML = '<div class="empty" style="margin:auto">选择一个人设查看详情</div>'; return; }
  if (!p.sys && (!draft || draft.id !== p.id)) draft = { id: p.id, name: p.name, prompt: p.prompt };
  if (p.sys) draft = null;
  const chars = (draft ? draft.prompt : p.prompt).length;
  el.innerHTML = `
    <div class="dhead">
      <span class="av lg" style="${avStyle(p)}">${esc(glyph(p))}</span>
      <div class="meta">
        <h2>${p.sys ? esc(p.name) + ' <span class="badge sys">内置</span>' : `<input id="nameIn" value="${esc(draft.name)}" aria-label="人设名称" placeholder="人设名称">`}</h2>
        <div class="sub">${p.sys ? esc(summary(p)) : '我的人设 · 点名称即可改名'}</div>
      </div>
      <div class="acts">
        <button class="btn" data-act="useMenu">设为…<svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3.5L5 6.5 8 3.5"/></svg></button>
        <button class="ibtn boxed" data-act="moreMenu" aria-label="更多"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg></button>
      </div>
    </div>
    <div class="uses">${usesHTML(p.id)}</div>
    <div class="dbody">
      ${p.sys ? `<div class="note"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 016 0v2"/></svg>
        内置人设由 Typeflux 维护，会随版本改进。<span class="sp"></span><button class="btn sm" data-act="duplicate">复制一份来修改</button></div>` : ''}
      <div class="flabel">人设定义<span class="aux">· 发给模型的改写指令</span><span class="sp"></span><span class="aux" id="charCount">${chars} 字</span></div>
      ${p.sys ? `<div class="prompt ro">${esc(p.prompt)}</div>` : `<textarea class="prompt" id="promptIn" spellcheck="false" placeholder="描述这个人设要把口述改成什么样，例如：改成礼貌、简洁的工作消息，保留人名和数字。">${esc(draft.prompt)}</textarea>`}
    </div>
    ${p.sys ? '' : `<div class="savebar" id="savebar"></div>`}`;
  if (!p.sys) {
    $('nameIn').addEventListener('input', e => { draft.name = e.target.value; syncDirty(); });
    $('promptIn').addEventListener('input', e => { draft.prompt = e.target.value; $('charCount').textContent = draft.prompt.length + ' 字'; syncDirty(); });
    renderSavebar();
  }
}
function renderSavebar() {
  const bar = $('savebar'); if (!bar) return;
  const d = dirty(), valid = draft.name.trim() && draft.prompt.trim();
  bar.innerHTML = d
    ? `<span class="st">● 有未保存的修改</span><span class="sp"></span><span class="kh">⌘S 保存</span><button class="btn ghost" data-act="revert">放弃修改</button><button class="btn primary" data-act="save" ${valid ? '' : 'disabled'}>保存</button>`
    : `<span class="st ok">修改后在这里保存 · 自动同步到已登录的设备</span>`;
}
function syncDirty() { renderSavebar(); renderRoster(); }

function renderCreate(el) {
  const t = creating.template;
  el.innerHTML = `
    <div class="dhead"><span class="av lg" style="background:var(--accent-soft);color:var(--accent)">+</span>
      <div class="meta"><h2><input id="nameIn" value="${esc(creating.name)}" placeholder="给人设起个名字，例如：周报助手" aria-label="人设名称"></h2>

/* ---------- Menus ---------- */
function closeMenus() { document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open')); }
function placeMenu(menu, anchor, alignRight) {
  const host = document.querySelector('.content').getBoundingClientRect(), r = anchor.getBoundingClientRect();
  menu.classList.add('open');
  const w = menu.offsetWidth;
  let left = (alignRight ? r.right - w : r.left) - host.left;
  left = Math.max(8, Math.min(left, host.width - w - 8));
  let top = r.bottom - host.top + 4;
  if (top + menu.offsetHeight > host.height - 8) top = r.top - host.top - menu.offsetHeight - 4;
  menu.style.left = left + 'px'; menu.style.top = top + 'px';
}
function openPicker(anchor, current, allowNone, onPick, opts = {}) {
  const m = $('pickMenu');
  const item = (p) => `<div class="mi" data-pick="${p ? p.id : ''}"><span class="ck">${(p ? p.id : null) === current ? '✓' : ''}</span>
    <span class="av" style="width:20px;height:20px;border-radius:5px;font-size:10px;${avStyle(p)}">${esc(glyph(p))}</span><span class="mt">${p ? esc(p.name) : '不使用人设'}</span><span class="mh">${p ? esc(summary(p)).slice(0, 14) : '原样输出'}</span></div>`;

function openUseMenu(anchor) {

/* ---------- Actions ---------- */
function guardDirty(next) {
  if (!dirty()) { next(); return; }
  const p = byId(draft.id);
  showDialog(`<h4>保存对「${esc(p.name)}」的修改？</h4><p>切换前不保存，修改会丢失。</p>
    <div class="row"><button class="btn ghost" data-d="discard">不保存</button><button class="btn" data-d="cancel">取消</button><button class="btn primary" data-d="save">保存</button></div>`, (k) => {
    if (k === 'cancel') return;
    if (k === 'save') save(true); else draft = null;
    next();
  });
}
function select(id) { guardDirty(() => { creating = null; sel = id; draft = null; renderAll(); }); }
function save(silent) {
  const p = byId(draft.id); if (!draft.name.trim() || !draft.prompt.trim()) return;
  p.name = draft.name.trim(); p.prompt = draft.prompt; draft = null;
  if (!silent) { renderAll(); toast('已保存'); }
}
function beginCreate(name = '', template = 'blank') {
  guardDirty(() => { draft = null; creating = { name, template, prompt: '' }; renderAll(); setTimeout(() => $('nameIn')?.focus(), 0); });
}
function duplicate(p) {
  guardDirty(() => {
    draft = null; creating = { name: p.name + ' 副本', template: p.sys ? p.id : 'other', prompt: p.prompt };
    renderAll(); setTimeout(() => { const n = $('nameIn'); n.focus(); n.select(); }, 0);
  });
}
function confirmDelete(p) {
  const impacts = [];
  if (settings.def === p.id) impacts.push('听写默认将改为 <b>Typeflux</b>');
  if (settings.aux === p.id) impacts.push('辅助输入将改为 <b>English Translator</b>');
  const apps = rules.filter(r => r.persona === p.id);
  if (apps.length) impacts.push(`${apps.map(r => esc(r.app)).join('、')} 的应用规则会一并删除`);
  showDialog(`<h4>删除「${esc(p.name)}」？</h4>
    ${impacts.length ? `<p>这个人设正在使用中，删除后：</p><ul>${impacts.map(i => `<li>${i}</li>`).join('')}</ul>` : '<p>删除后可以在提示里撤销。</p>'}
    <div class="row"><button class="btn" data-d="cancel">取消</button><button class="btn danger" data-d="ok">删除</button></div>`, (k) => {
    if (k !== 'ok') return;
    const snap = { personas: personas.slice(), settings: { ...settings }, rules: rules.map(r => ({ ...r })), sel };
    personas = personas.filter(x => x.id !== p.id);
    if (settings.def === p.id) settings.def = SYS_TF;
    if (settings.aux === p.id) settings.aux = SYS_EN;
    rules = rules.filter(r => r.persona !== p.id);
    sel = personas.find(x => !x.sys)?.id || SYS_TF; draft = null;
    renderAll();
    toast(`已删除「${p.name}」`, () => { personas = snap.personas; settings = snap.settings; rules = snap.rules; sel = snap.sel; draft = null; renderAll(); });
  });
}

$('narrowToggle').onclick = () => { document.body.classList.toggle('narrow'); $('narrowToggle').classList.toggle('on'); };

const params = new URLSearchParams(location.search);
if (params.get('theme') === 'light') { document.body.classList.add('light'); $('themeToggle').classList.add('on'); }
if (params.get('narrow')) { document.body.classList.add('narrow'); $('narrowToggle').classList.add('on'); }
if (params.get('solo')) document.body.classList.add('solo');
go(params.get('state') || 'builtin');
</script>
</body>
</html>
