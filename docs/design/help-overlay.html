<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typeflux · 使用指南（可交互设计稿）</title>
<style>
/* Tokens mirror Sources/Typeflux: AskTheme, AskClassic, StudioTheme.accent.
   data-style = glass | classic (Settings › 界面风格); data-theme = dark | light. */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
}
[data-theme="dark"] {
  color-scheme: dark;
  --text: rgba(255,255,255,.92); --text2: rgba(235,235,245,.62); --text3: rgba(235,235,245,.40);
  --accent: #178cff; --accent-text: #8ebdff; --ok: #32d74b; --warn: #ff9f0a;
  --kw: rgba(56,56,56,.72); --kw-text: #b3b3b3; --keycap: rgba(255,255,255,.08); --keycap-edge: rgba(255,255,255,.07);
  --hover: rgba(255,255,255,.06); --sep: rgba(255,255,255,.07);
  --win: #1e1e1e; --win-text: rgba(255,255,255,.55);
}
[data-theme="light"] {
  color-scheme: light;
  --text: rgba(0,0,0,.86); --text2: rgba(60,60,67,.68); --text3: rgba(60,60,67,.44);
  --accent: #2563eb; --accent-text: #1d4ed8; --ok: #28a745; --warn: #c76a00;
  --kw: rgba(0,0,0,.06); --kw-text: #454545; --keycap: #fff; --keycap-edge: rgba(15,23,42,.14);
  --hover: rgba(0,0,0,.05); --sep: rgba(15,23,42,.08);
  --win: #fbfbfb; --win-text: rgba(0,0,0,.5);
}
/* Liquid Glass: panel and inset sidebar are glass; selection is a blue wash with a hairline. */
[data-style="glass"][data-theme="dark"] {
  --scrim: rgba(0,0,0,.34); --scrim-blur: 28px;
  --panel: rgba(28,28,30,.66); --panel-edge: rgba(255,255,255,.14); --panel-hi: rgba(255,255,255,.10);
  --side: rgba(44,44,52,.42); --side-edge: rgba(255,255,255,.10);
  --block: rgba(255,255,255,.045); --block-edge: rgba(255,255,255,.07);
  --sel: rgba(23,140,255,.20); --sel-edge: rgba(23,140,255,.42);
  --field: rgba(255,255,255,.07); --seg-on: rgba(255,255,255,.14);
  --r-panel: 26px; --r-side: 20px; --r-row: 10px; --r-block: 14px; --r-field: 12px; --r-btn: 999px;
}
[data-style="glass"][data-theme="light"] {
  --scrim: rgba(255,255,255,.18); --scrim-blur: 28px;
  --panel: rgba(246,246,248,.82); --panel-edge: rgba(0,0,0,.08); --panel-hi: rgba(255,255,255,.85);
  --side: rgba(255,255,255,.55); --side-edge: rgba(255,255,255,.9);
  --block: rgba(255,255,255,.66); --block-edge: rgba(0,0,0,.06);
  --sel: rgba(37,99,235,.13); --sel-edge: rgba(37,99,235,.28);
  --field: rgba(0,0,0,.05); --seg-on: #fff;
  --r-panel: 26px; --r-side: 20px; --r-row: 10px; --r-block: 14px; --r-field: 12px; --r-btn: 999px;
}
/* Classic: opaque and flat, sidebar flush with a hairline; selection is the neutral source-list wash. */
[data-style="classic"][data-theme="dark"] {
  --scrim: rgba(0,0,0,.55); --scrim-blur: 0px;
  --panel: #1e1e1e; --panel-edge: rgba(255,255,255,.10); --panel-hi: transparent;
  --side: #262626; --side-edge: rgba(0,0,0,.55);
  --block: #2a2a2a; --block-edge: rgba(255,255,255,.11);
  --sel: rgba(255,255,255,.10); --sel-edge: transparent;
  --field: #2a2a2a; --seg-on: #4a4a4a;
  --r-panel: 12px; --r-side: 0px; --r-row: 6px; --r-block: 10px; --r-field: 7px; --r-btn: 6px;
}
[data-style="classic"][data-theme="light"] {
  --scrim: rgba(0,0,0,.28); --scrim-blur: 0px;
  --panel: #ffffff; --panel-edge: rgba(0,0,0,.12); --panel-hi: transparent;
  --side: #f3f4f6; --side-edge: rgba(0,0,0,.10);
  --block: #ffffff; --block-edge: rgba(0,0,0,.11);
  --sel: rgba(0,0,0,.08); --sel-edge: transparent;
  --field: #ffffff; --seg-on: #fff;
  --r-panel: 12px; --r-side: 0px; --r-row: 6px; --r-block: 10px; --r-field: 7px; --r-btn: 6px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; background: #111; color: #ddd; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
button, input { font: inherit; color: inherit; }
svg { flex: none; }

/* ---------- Stage chrome (not part of the design) ---------- */
.stagebar { width: 1440px; max-width: calc(100vw - 32px); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 16px 0 6px; font-size: 12px; }
.stagebar b { font-size: 14px; margin-right: 8px; color: #fff; }
.stagebar .sp { flex: 1; }
.stagebar .grp { display: inline-flex; border: 1px solid #3a3a3a; border-radius: 7px; overflow: hidden; }
.stagebar .grp span { padding: 4px 10px; cursor: pointer; color: #bbb; }
.stagebar .grp span.on { background: #3a3a3a; color: #fff; }
.pill { padding: 4px 10px; border-radius: 7px; border: 1px solid #3a3a3a; cursor: pointer; color: #bbb; }
.pill.on { background: #3a3a3a; color: #fff; }
.caption { width: 1440px; max-width: calc(100vw - 32px); color: #8a8a8a; font-size: 12px; padding: 2px 0 12px; min-height: 30px; }
.caption b { color: #ccc; }
body.solo .stagebar, body.solo .caption { display: none; }

/* ---------- Screen: a 1440×900 display with a quiet desktop ---------- */
.screen { position: relative; width: 1440px; height: 900px; overflow: hidden; color: var(--text); flex: none; }
[data-theme="dark"] .screen { background: radial-gradient(120% 90% at 30% 20%, #2a3340 0%, #1a1e25 60%, #14171c 100%); }
[data-theme="light"] .screen { background: radial-gradient(120% 90% at 30% 20%, #e3e8ef 0%, #cdd4de 60%, #bfc7d2 100%); }
.menubar { height: 26px; display: flex; align-items: center; gap: 18px; padding: 0 16px; font-size: 13px; background: rgba(0,0,0,.18); }
[data-theme="light"] .menubar { background: rgba(255,255,255,.4); }
.menubar .sp { flex: 1; }
.appwin { position: absolute; left: 150px; top: 90px; width: 820px; height: 560px; border-radius: 12px; background: var(--win); border: 1px solid var(--sep); box-shadow: 0 20px 60px rgba(0,0,0,.3); padding: 54px 48px; color: var(--win-text); font-size: 15px; line-height: 1.9; }
.appwin h1 { font-size: 22px; color: var(--text); margin: 0 0 14px; font-weight: 600; }
.appwin .tl { position: absolute; left: 16px; top: 16px; display: flex; gap: 8px; }
.appwin .tl i { width: 12px; height: 12px; border-radius: 50%; background: rgba(128,128,128,.35); }
.appwin2 { left: 760px; top: 220px; width: 560px; height: 420px; }

/* ---------- Launcher (entry) ---------- */
.launcher { position: absolute; left: 50%; top: 190px; transform: translateX(-50%); width: 700px; border-radius: 16px; z-index: 5; overflow: hidden;
  background: var(--panel); border: 1px solid var(--panel-edge); box-shadow: 0 24px 70px rgba(0,0,0,.35), inset 0 1px 0 var(--panel-hi); backdrop-filter: blur(40px) saturate(1.4); }
[data-style="classic"] .launcher { border-radius: 12px; }
.launcher .in { display: flex; align-items: center; gap: 10px; padding: 16px 18px; font-size: 18px; border-bottom: 1px solid var(--sep); }
.caret { width: 1.5px; height: 21px; background: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.launcher .rows { padding: 6px; }
.lrow { display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; border-radius: var(--r-row); cursor: pointer; }
.lrow.on { background: var(--sel); box-shadow: inset 0 0 0 1px var(--sel-edge); }
.lrow .t { font-size: 14px; }
.lrow .d { color: var(--text3); font-size: 12.5px; }
.lrow .r { margin-left: auto; color: var(--text2); font-size: 12px; }
.launcher .bar { display: flex; align-items: center; gap: 10px; padding: 9px 18px; border-top: 1px solid var(--sep); color: var(--text2); font-size: 12px; }
.launcher .bar .sp { flex: 1; }
.chip { display: inline-flex; align-items: center; height: 26px; padding: 0 9px; border-radius: 7px; background: var(--kw); color: var(--kw-text); font: 14px var(--mono); }

/* ---------- Overlay ---------- */
.scrim { position: absolute; inset: 0; z-index: 10; display: none; }
.scrim.on { display: block; animation: fade .18s ease-out; }
/* The dimmed backdrop and the panel are siblings: a backdrop filter nested in another one only samples its parent. */
.scrim .dim { position: absolute; inset: 0; background: var(--scrim); backdrop-filter: blur(var(--scrim-blur)) saturate(1.1); }
@keyframes fade { from { opacity: 0; } }
.panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 1120px; height: 728px; display: flex; overflow: hidden;
  border-radius: var(--r-panel); background: var(--panel); border: 1px solid var(--panel-edge);
  box-shadow: 0 30px 90px rgba(0,0,0,.38), inset 0 1px 0 var(--panel-hi); backdrop-filter: blur(50px) saturate(1.5); }

/* Classic draws no glass anywhere: opaque surfaces, no backdrop sampling. */
[data-style="classic"] .panel, [data-style="classic"] .launcher, [data-style="classic"] .toast { backdrop-filter: none; }
/* Sidebar: an inset glass column, or a flush classic column */
.side { width: 248px; flex: none; display: flex; flex-direction: column; padding: 14px 10px 12px; background: var(--side); }
[data-style="glass"] .side { margin: 8px 0 8px 8px; border-radius: var(--r-side); box-shadow: inset 0 0 0 1px var(--side-edge); }
[data-style="classic"] .side { border-right: 1px solid var(--side-edge); }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 14px; font-weight: 600; font-size: 14px; }
.brand .mk { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--kw); color: var(--text2); }
.search { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: var(--r-field); background: var(--field); color: var(--text3); margin-bottom: 12px; }
[data-style="classic"] .search { height: 28px; box-shadow: inset 0 0 0 1px var(--block-edge); }
.search:focus-within { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); }
.search input::placeholder { color: var(--text3); }
.search .hint { font-size: 11px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .n { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--r-row); color: var(--text); cursor: pointer; font-size: 13.5px; }
[data-style="classic"] .nav .n { height: 30px; }
.nav .n svg { color: var(--text2); }
.nav .n:hover { background: var(--hover); }
.nav .n.on { background: var(--sel); box-shadow: inset 0 0 0 1px var(--sel-edge); }
[data-style="glass"] .nav .n.on svg { color: var(--accent); }
.nav .n .c { margin-left: auto; color: var(--text3); font-size: 12px; }
.nav .n .c.warn { color: var(--warn); }
.side .sp { flex: 1; }
.side .links { border-top: 1px solid var(--sep); padding-top: 8px; }
.side .links .n { height: 30px; color: var(--text2); font-size: 12.5px; }
.side .ver { padding: 6px 10px 0; color: var(--text3); font-size: 11.5px; }

/* Content */
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.head { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 18px 0 28px; flex: none; }
.head h1 { font-size: 20px; font-weight: 650; margin: 0; }
.head .sub { color: var(--text3); font-size: 12.5px; }
.head .sp { flex: 1; }
.iconbtn { width: 28px; height: 28px; display: grid; place-items: center; color: var(--text2); cursor: pointer; border-radius: 999px; }
[data-style="classic"] .iconbtn { border-radius: 6px; }
.iconbtn:hover { background: var(--hover); }
.body { flex: 1; min-height: 0; display: flex; }
.scroll { flex: 1; min-width: 0; overflow-y: auto; padding: 0 28px 24px; scrollbar-width: thin; }
.foot { height: 36px; flex: none; display: flex; align-items: center; padding: 0 28px; border-top: 1px solid var(--sep); color: var(--text3); font-size: 12px; }

/* Grouped blocks, like the settings window */
.gt { font-size: 12px; font-weight: 600; color: var(--text2); margin: 20px 4px 7px; display: flex; align-items: baseline; gap: 8px; }
.gt .m { font-weight: 400; color: var(--text3); }
.gt a { margin-left: auto; font-weight: 400; color: var(--accent-text); cursor: pointer; }
.block { background: var(--block); border: 1px solid var(--block-edge); border-radius: var(--r-block); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 7px 14px; position: relative; }
.row + .row::before { content: ''; position: absolute; top: 0; left: 46px; right: 0; height: 1px; background: var(--sep); }
.row.plain + .row.plain::before { left: 14px; }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--hover); }
.row.sel { background: var(--sel); box-shadow: inset 0 0 0 1px var(--sel-edge); }
.row.sel::before, .row.sel + .row::before { display: none; }
.row .ic { width: 20px; display: grid; place-items: center; color: var(--text2); }
.row .main { flex: 1; min-width: 0; }
.row .t { font-size: 13.5px; }
.row .d { color: var(--text3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r { margin-left: auto; display: flex; align-items: center; gap: 4px; color: var(--text3); font-size: 12px; flex: none; }
.row.off .t, .row.off .kwl { opacity: .5; }
.kwl { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 5px; background: var(--kw); color: var(--kw-text); font: 12px var(--mono); }
.alias { color: var(--text3); font: 11.5px var(--mono); }
kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; background: var(--keycap); box-shadow: inset 0 0 0 1px var(--keycap-edge); color: var(--text2); font: 11.5px var(--font); }
[data-style="classic"] kbd { border-radius: 4px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--field); margin-top: 2px; }
[data-style="classic"] .seg { border-radius: 7px; box-shadow: inset 0 0 0 1px var(--block-edge); }
.seg span { padding: 3px 12px; border-radius: 7px; cursor: pointer; color: var(--text2); font-size: 12.5px; }
[data-style="classic"] .seg span { border-radius: 5px; }
.seg span.on { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.16); }
.lead { color: var(--text2); margin: 0 4px; }

/* Detail pane (keywords) */
.detail { width: 340px; flex: none; border-left: 1px solid var(--sep); display: flex; flex-direction: column; }
.detail .in { flex: 1; overflow-y: auto; padding: 4px 24px 16px; }
.detail .hd { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.detail .tile { width: 40px; height: 40px; border-radius: 10px; background: var(--kw); display: grid; place-items: center; color: var(--text2); }
.detail .nm { font-size: 16px; font-weight: 600; }
.detail .kws { display: flex; gap: 5px; margin-top: 4px; }
.detail p { margin: 0 0 6px; color: var(--text2); line-height: 1.6; }
.detail h4 { font-size: 12px; color: var(--text3); font-weight: 600; margin: 18px 0 8px; }
.ex { display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; border-radius: var(--r-row); background: var(--block); border: 1px solid var(--block-edge); margin-bottom: 6px; cursor: pointer; }
.ex:hover { border-color: var(--accent); }
.ex .i { font: 12.5px var(--mono); }
.ex .o { color: var(--text3); font-size: 12px; }
.kv { display: flex; align-items: center; padding: 4px 0; color: var(--text2); }
.kv .r { margin-left: auto; display: flex; gap: 3px; }
.detail .ft { display: flex; gap: 8px; padding: 12px 24px 14px; border-top: 1px solid var(--sep); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: var(--r-btn); background: var(--field); cursor: pointer; font-size: 13px; white-space: nowrap; }
[data-style="classic"] .btn { box-shadow: inset 0 0 0 1px var(--block-edge); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: none; }
.btn .k { opacity: .75; font-size: 12px; }
.link { color: var(--accent-text); cursor: pointer; }

/* FAQ */
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.dot.warn { background: var(--warn); }
.qa .chev { color: var(--text3); transition: transform .15s; display: grid; }
.qa.open .chev { transform: rotate(90deg); }
.qa .a { display: none; padding: 0 18px 14px 46px; color: var(--text2); font-size: 12.5px; line-height: 1.7; }
.qa.open .a { display: block; }
.qa + .qa { border-top: 1px solid var(--sep); }
.note { font-size: 11.5px; color: var(--warn); }
.empty { text-align: center; padding: 140px 40px 0; color: var(--text2); }
.empty .big { font-size: 15px; color: var(--text); margin-bottom: 6px; }
.empty .btn { margin-top: 20px; }
.mark { background: color-mix(in srgb, var(--accent) 24%, transparent); border-radius: 3px; color: inherit; }
.toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 40; display: none; padding: 9px 14px; border-radius: 10px; font-size: 12.5px; color: var(--text);
  background: var(--panel); border: 1px solid var(--panel-edge); backdrop-filter: blur(40px); box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.toast.on { display: block; }
</style>
</head>
<body>
<div class="stagebar">
  <b>使用指南</b>
  <span class="pill" data-screen="entry">① 入口</span>
  <span class="pill" data-screen="start">② 开始</span>
  <span class="pill" data-screen="keywords">③ 关键词</span>
  <span class="pill" data-screen="shortcuts">④ 快捷键</span>
  <span class="pill" data-screen="search">⑤ 搜索</span>
  <span class="pill" data-screen="empty">⑥ 没有结果</span>
  <span class="pill" data-screen="faq">⑦ 常见问题</span>
  <span class="sp"></span>
  <span class="grp" id="styleGrp"><span data-style="glass">Liquid Glass</span><span data-style="classic">经典</span></span>
  <span class="grp" id="themeGrp"><span data-theme="dark">深色</span><span data-theme="light">浅色</span></span>
</div>
<div class="caption" id="caption"></div>

<div class="screen" id="screen">
  <div class="menubar"><b></b><span>备忘录</span><span>文件</span><span>编辑</span><span>格式</span><span class="sp"></span><span>10月14日 周三 18:06</span></div>
  <div class="appwin"><div class="tl"><i></i><i></i><i></i></div><h1>周报草稿</h1>本周完成了快捷键设置页的调研和设计评审。<br>下周进入开发，预计周五提测，之后安排一次走查。<br>需要协调：文案翻译、发布说明。</div>
  <div class="appwin appwin2"><div class="tl"><i></i><i></i><i></i></div><h1>Inbox</h1>Design review · 10:30<br>Release notes draft<br>Weekly sync</div>

  <div class="launcher" id="launcher">
    <div class="in" id="lIn"></div>
    <div class="rows" id="lRows"></div>
    <div class="bar" id="lBar"></div>
  </div>

  <div class="scrim" id="scrim">
    <div class="dim" id="dim"></div>
    <div class="panel" id="panel">
      <aside class="side">
        <div class="brand"><span class="mk" data-i="logo"></span>Typeflux 使用指南</div>
        <label class="search"><span data-i="search"></span><input id="q" placeholder="搜索" autocomplete="off"><span class="hint">⌘F</span></label>
        <nav class="nav" id="nav"></nav>
        <div class="sp"></div>
        <div class="links nav">
          <div class="n" data-i-label="ext">在线文档</div>
          <div class="n" data-i-label="bubble">反馈问题</div>
        </div>
        <div class="ver">Typeflux 1.24.0</div>
      </aside>
      <section class="content">
        <div class="head" id="head"></div>
        <div class="body" id="body"></div>
        <div class="foot" id="foot"></div>
      </section>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const ICONS = {
  logo: '<path d="M4 4.5h8M8 4.5V12"/>',
  search: '<circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/>',
  start: '<circle cx="8" cy="8" r="6.2"/><path d="m6.6 5.6 3.8 2.4-3.8 2.4Z"/>',
  kw: '<path d="M3 4h10M3 8h7M3 12h9"/>',
  key: '<rect x="1.8" y="4" width="12.4" height="8" rx="1.8"/><path d="M4.3 6.6h1M7.5 6.6h1M10.7 6.6h1M5 9.4h6"/>',

  return `<div class="row click ${st.sel === k.id ? 'sel' : ''} ${k.off ? 'off' : ''}" data-kw="${k.id}"><span class="ic">${ic(k.icon)}</span>
    <div class="main"><div class="t">${k.name}</div><div class="d">${k.off ? k.off + ' · ' : ''}${k.ds}</div></div>
    <span class="r">${k.hot ? `<span style="margin-right:6px;display:flex;gap:3px">${K(k.hot)}</span>` : ''}${kwLabels(k)}</span></div>`;
}
function pageKeywords() {
  const groups = GROUPS.map(([id, t]) => [t, KWS.filter(k => k.g === id && (st.filter === 'all' || k.g === st.filter))]).filter(([, l]) => l.length);
  return `<div class="seg">${[['all', '全部'], ...GROUPS].map(([id, t]) => `<span class="${st.filter === id ? 'on' : ''}" data-filter="${id}">${t}</span>`).join('')}</div>
    ${groups.map(([t, l]) => `<div class="gt">${t}<span class="m">${l.length}</span>${t === '我的' ? '<a data-settings>管理关键词</a>' : ''}</div><div class="block">${l.map(kwRow).join('')}</div>`).join('')}`;
}
function detail() {
  const k = KWS.find(x => x.id === st.sel);
  if (!k) return '';
  const ex = k.ex || [[k.kws[0] + (k.sel ? ' 一段文字' : ''), k.sel ? '处理这段文字' : k.name]];
  const keys = k.keys || [['运行或打开', '↩'], ['改为问 AI', '⌘ ↩'], ['退出关键词', 'esc']];
  return `<aside class="detail"><div class="in">
    <div class="hd"><div class="tile">${ic(k.icon, 20)}</div><div><div class="nm">${k.name}</div><div class="kws">${k.kws.map(w => `<span class="kwl">${w}</span>`).join('')}</div></div></div>
    <p>${k.ds}</p>${k.sel ? '<p style="font-size:12px;color:var(--text3)">可以处理选中的文字：先选中，再打开启动器输入关键词按 ↩。</p>' : ''}
    <h4>示例 · 点一下在启动器中试</h4>${ex.map(([i, o]) => `<div class="ex" data-ex="${i}"><span class="i">${i}</span><span class="o">${o}</span></div>`).join('')}
    <h4>结果上的按键</h4>${keys.map(([t, kk]) => `<div class="kv">${t}<span class="r">${K(kk)}</span></div>`).join('')}
    <h4>全局快捷键</h4>${k.hot ? `<div class="kv">选中文字后在任何应用里按下<span class="r">${K(k.hot)}</span></div>` : '<div class="kv">未设置<span class="r link" data-settings>设置…</span></div>'}
    <h4>使用</h4><div class="kv">${k.used ? `用过 ${k.used} 次` : '还没用过'}<span class="r" style="color:var(--text3)">${k.mine || (k.sys ? '系统命令' : '内置')}</span></div>
  </div><div class="ft"><span class="btn" data-settings>编辑</span><span style="flex:1"></span><span class="btn primary" id="tryKw">在启动器中试一试 <span class="k">↩</span></span></div></aside>`;
}
function pageShortcuts() {
  const box = ([t, rows, act]) => `<div class="gt">${t}${act ? `<a data-settings>${act}</a>` : ''}</div><div class="block">${rows.map(([n, d, k, m]) =>
    `<div class="row plain"><div class="main"><div class="t">${n}</div>${d ? `<div class="d">${d}</div>` : ''}</div><span class="r">${k ? K(k) + (m ? '&nbsp;' + m : '') : '<span class="link" data-settings>未设置</span>'}</span></div>`).join('')}</div>`;
  return `<p class="lead">显示的是你当前的设置。</p>
  <div class="cols"><div>${box(SHORTCUTS[0])}${box(SHORTCUTS[1])}</div><div>${box(SHORTCUTS[2])}${box(SHORTCUTS[3])}</div></div>
  ${box(SHORTCUTS[4])}
  <div class="gt">命令<span class="m">在启动器或对话窗口的输入框里先输入 /</span></div><div class="block"><div class="cols" style="gap:0">
    ${SLASH.map(([k, t]) => `<div class="row plain" style="min-height:38px"><span class="kwl">${k}</span><span style="color:var(--text2)">${t}</span></div>`).join('')}</div></div>`;
}
function pageFaq() {
  return `<div class="gt" style="margin-top:2px">状态</div><div class="block">${STATUS().map(([n, v, ok]) =>
    `<div class="row plain"><span class="dot ${ok ? '' : 'warn'}"></span><div class="main"><div class="t">${n}</div></div><span class="r" style="color:${ok ? 'var(--text3)' : 'var(--warn)'}">${v}</span>${ok ? '' : '<span class="btn" id="fixAx" style="margin-left:10px">去授权</span>'}</div>`).join('')}</div>
  <div class="gt">问题</div><div class="block">${FAQ.map(([q, a, rel], i) => `<div class="qa ${st.open === i ? 'open' : ''}"><div class="row click" data-faq="${i}"><span class="ic">${ic('help')}</span><div class="main"><div class="t">${q}</div></div>${rel && !st.axOK ? '<span class="note">可能和你有关</span>' : ''}<span class="chev">${ic('chev', 14)}</span></div><div class="a">${a}</div></div>`).join('')}</div>`;
}

/* ------------------------------ Search ------------------------------ */
const norm = s => s.toLowerCase().replace(/\s+/g, '').replace(/command|cmd/g, '⌘').replace(/option|opt|alt/g, '⌥').replace(/control|ctrl/g, '⌃').replace(/shift/g, '⇧').replace(/return|enter/g, '↩');
function search(q) {
  const n = norm(q);
  const kw = KWS.filter(k => [...k.kws, k.name, k.ds].some(s => norm(s).includes(n)));
  const keys = SHORTCUTS.flatMap(([g, rows]) => rows.filter(r => r[2]).map(r => [r[0], r[2], g])).filter(([t, k]) => norm(t).includes(n) || norm(k).includes(n));
  const cmds = SLASH.filter(([k, t]) => k.includes(n) || t.includes(q));
  const faq = FAQ.map((f, i) => [f[0], i]).filter(([t, i]) => t.includes(q) || FAQ[i][1].replace(/<[^>]+>/g, '').includes(q));
  return { kw, keys, cmds, faq, total: kw.length + keys.length + cmds.length + faq.length };
}
function pageSearch() {
  const q = st.query, r = search(q);
  if (!r.total) return `<div class="empty"><div class="big">没有找到「${q}」</div>换个说法，或者问 AI。它会参考这份指南和你当前的设置回答。<br>
    <span class="btn primary" id="askAI">${ic('spark', 14)}问 AI <span class="k">⌘↩</span></span></div>`;
  let i = 0;
  const row = (inner, attrs) => `<div class="row click ${i++ === st.focus ? 'sel' : ''}" ${attrs}>${inner}</div>`;
  const g = (t, rows) => rows.length ? `<div class="gt">${t}<span class="m">${rows.length}</span></div><div class="block">${rows.join('')}</div>` : '';
  return g('关键词', r.kw.map(k => row(`<span class="ic">${ic(k.icon)}</span><div class="main"><div class="t">${hl(k.name, q)}</div><div class="d">${hl(k.ds, q)}</div></div><span class="r">${kwLabels(k, q)}</span>`, `data-kwgo="${k.id}"`)))
    + g('快捷键', r.keys.map(([t, k, where]) => row(`<span class="ic">${ic('key')}</span><div class="main"><div class="t">${hl(t, q)}</div><div class="d">${where}</div></div><span class="r">${K(k)}</span>`, 'data-gopage="shortcuts"')))
    + g('命令', r.cmds.map(([k, t]) => row(`<span class="ic">${ic('slash')}</span><div class="main"><div class="t">${hl(t, q)}</div></div><span class="r"><span class="kwl">${k}</span></span>`, 'data-gopage="shortcuts"')))
    + g('常见问题', r.faq.map(([t, j]) => row(`<span class="ic">${ic('help')}</span><div class="main"><div class="t">${hl(t, q)}</div></div>`, `data-gofaq="${j}"`)));
}

/* ------------------------------ Render ------------------------------ */
const TITLES = { start: ['开始', ''], keywords: ['关键词', '在启动器开头输入，后面加空格'], shortcuts: ['快捷键', ''], faq: ['常见问题', ''] };
function render() {
  renderNav();
  const [t, sub] = st.query ? ['搜索', `「${st.query}」· ${search(st.query).total} 个结果`] : TITLES[st.page];
  $('#head').innerHTML = `<h1>${t}</h1><span class="sub">${sub}</span><span class="sp"></span><span class="iconbtn" id="close" title="关闭 (esc)">${ic('x', 14)}</span>`;
  const main = st.query ? pageSearch() : { start: pageStart, keywords: pageKeywords, shortcuts: pageShortcuts, faq: pageFaq }[st.page]();
  $('#body').innerHTML = `<div class="scroll" id="scroll">${main}</div>${!st.query && st.page === 'keywords' ? detail() : ''}`;
  $('#foot').textContent = st.query ? (search(st.query).total ? '↑↓ 选择 · ↩ 打开 · esc 清空搜索' : '⌘↩ 问 AI · esc 清空搜索')
    : st.page === 'keywords' ? '↑↓ 选择 · ↩ 在启动器中试一试 · ⌘F 搜索 · esc 关闭' : '直接打字即可搜索 · ⌘1–4 切换页面 · esc 关闭';
  bind();
}
function bind() {
  $('#close').onclick = () => closeHelp();
  document.querySelectorAll('[data-filter]').forEach(e => e.onclick = () => { st.filter = e.dataset.filter; render(); });
  document.querySelectorAll('[data-kw]').forEach(e => e.onclick = () => {
    st.sel = e.dataset.kw;
    if (st.page !== 'keywords') { st.filter = 'all'; go('keywords'); scrollToSel(); } else { const y = $('#scroll').scrollTop; render(); $('#scroll').scrollTop = y; }
  });
  document.querySelectorAll('[data-kwgo]').forEach(e => e.onclick = () => { st.sel = e.dataset.kwgo; st.filter = 'all'; clearQuery(); go('keywords'); scrollToSel(); });
  document.querySelectorAll('[data-gopage]').forEach(e => e.onclick = () => { clearQuery(); go(e.dataset.gopage); });
  document.querySelectorAll('[data-gofaq]').forEach(e => e.onclick = () => { st.open = +e.dataset.gofaq; clearQuery(); go('faq'); });
  document.querySelectorAll('[data-faq]').forEach(e => e.onclick = () => { st.open = st.open === +e.dataset.faq ? -1 : +e.dataset.faq; render(); });
  document.querySelectorAll('[data-act]').forEach(e => e.onclick = () => e.dataset.act === 'kw' ? go('keywords')
    : toast({ voice: '关闭指南，回到原来的应用按住 fn 说一句话', ask: '关闭指南并打开随便问', launcher: '关闭指南并打开启动器' }[e.dataset.act]));
  document.querySelectorAll('[data-settings]').forEach(e => e.onclick = () => toast('关闭指南，打开设置中对应的页面'));
  document.querySelectorAll('[data-ex]').forEach(e => e.onclick = () => tryKeyword(e.dataset.ex));
  const t = $('#tryKw'); if (t) t.onclick = () => tryKeyword();
  const ax = $('#fixAx'); if (ax) ax.onclick = () => { st.axOK = true; toast('打开系统设置的辅助功能页；授权后这里自动更新'); render(); };
  const ai = $('#askAI'); if (ai) ai.onclick = () => toast('关闭指南，在启动器中把问题交给 AI，并附上这份指南作为参考');
}
function scrollToSel() { const el = document.querySelector('#scroll .row.sel'); if (el) $('#scroll').scrollTop = el.offsetTop - 140; }
function clearQuery() { st.query = ''; $('#q').value = ''; }
$('#q').addEventListener('input', () => { st.query = $('#q').value.trim(); st.focus = 0; render(); });

/* ------------------------------ Launcher ------------------------------ */
function showLauncher(input, rows, bar) {
  $('#launcher').style.display = 'block';
  $('#lIn').innerHTML = `<span style="color:var(--text3);display:grid">${ic('search', 18)}</span>${input}`;
  $('#lRows').innerHTML = rows.map(([i, t, d, on, r]) => `<div class="lrow ${on ? 'on' : ''}"><span style="color:var(--text2);display:grid">${ic(i)}</span><span class="t">${t}</span><span class="d">${d}</span><span class="r">${r || ''}</span></div>`).join('');
  $('#lBar').innerHTML = bar;
}
function launcherEntry() {
  showLauncher('<span>help</span><span class="caret"></span>',
    [['help', '使用指南', '关键词、快捷键和常见问题', true, '↩ 打开'], ['spark', '问 AI', '「help」', false, '⌘↩']],
    `<span class="iconbtn" style="width:22px;height:22px" title="使用指南">${ic('help', 15)}</span><span class="sp"></span><span>↩ 打开 · ⌘↩ 问 AI · esc 关闭</span>`);
}
function tryKeyword(text) {
  const k = KWS.find(x => x.id === st.sel);
  closeHelp(true);
  const parts = (text || k.kws[0]).split(' ');
  const rest = parts.slice(1).join(' ');
  showLauncher(`<span class="chip">${parts[0]}</span><span>${rest}</span><span class="caret"></span>`,
    [[k.icon, k.name, rest ? '' : (k.sel ? '输入内容，或按 ↩ 处理选中的文字' : '输入内容'), true, '↩ 运行']],
    `<span>从使用指南打开</span><span class="sp"></span><span>↩ 运行 · esc 返回指南</span>`);
}
function openHelp() { $('#launcher').style.display = 'none'; $('#scrim').classList.add('on'); render(); setTimeout(() => $('#q').focus(), 0); }
function closeHelp(keepLauncherHidden) { $('#scrim').classList.remove('on'); if (!keepLauncherHidden) launcherEntry(); }
$('#lRows').addEventListener('click', openHelp);
$('#dim').addEventListener('click', () => closeHelp());

/* ------------------------------ Keyboard ------------------------------ */
document.addEventListener('keydown', e => {
  if (!$('#scrim').classList.contains('on')) {
    if (e.key === 'Enter' || (e.key === 'Escape' && $('#lBar').textContent.includes('返回指南'))) openHelp();
    return;
  }
  if (e.key === 'Escape') { e.preventDefault(); if (st.query) { clearQuery(); render(); } else closeHelp(); return; }
  if (e.metaKey && /^[1-4]$/.test(e.key)) { e.preventDefault(); clearQuery(); go(PAGES[+e.key - 1][0]); return; }
  if (e.metaKey && e.key === 'f') { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const d = e.key === 'ArrowDown' ? 1 : -1;
    if (st.query) { const n = document.querySelectorAll('#scroll .row.click').length; st.focus = Math.max(0, Math.min(n - 1, st.focus + d)); render(); }
    else if (st.page === 'keywords') { const ids = [...document.querySelectorAll('#scroll [data-kw]')].map(x => x.dataset.kw); st.sel = ids[Math.max(0, Math.min(ids.length - 1, ids.indexOf(st.sel) + d))]; render(); scrollToSel(); }
    return;
  }
  if (e.key === 'Enter') {
    if (st.query) { const f = document.querySelector('#scroll .row.sel'); if (f) f.click(); else if (e.metaKey && $('#askAI')) $('#askAI').click(); }
    else if (st.page === 'keywords') tryKeyword();
    return;
  }
  if (document.activeElement !== $('#q') && e.key.length === 1 && !e.metaKey) $('#q').focus();
});
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }

/* ============================== Screens ============================== */
const CAPTIONS = {
  entry: '<b>① 入口</b>：在启动器输入 <b>help</b>（别名「帮助」「?」）按 ↩ 打开；<b>help 截图</b> 打开后直接搜索。另外还有启动器底栏的 ? 按钮、对话里的 /help、菜单栏「使用指南…」、可选的全局快捷键（默认不设置）。按 ↩ 或点第一行打开。',
  start: '<b>② 开始</b>：全屏遮罩 + 居中面板，结构和笔记本、对话窗口一致（侧栏 + 内容）。打开时焦点在搜索框，直接打字就会搜索。右上角切换 Liquid Glass / 经典、深色 / 浅色。',
  keywords: '<b>③ 关键词</b>：读取你当前的关键词（改过的名字、别名、自建的、工作流、停用的都如实显示）。左边列表，右边详情；示例点一下就在启动器里试。↑↓ 选择，↩ 试一试。',
  shortcuts: '<b>④ 快捷键</b>：显示当前绑定，没设置的显示「未设置」，点了去设置。下面是启动器、结果、对话窗口的按键和 / 命令。',
  search: '<b>⑤ 搜索</b>：关键词、名称、说明、按键、命令和常见问题一起搜；输入「cmd k」也能找到 ⌘K。改改搜索框试试。',
  empty: '<b>⑥ 没有结果</b>：可以把问题交给 AI，它会参考这份指南和你当前的设置回答。',
  faq: '<b>⑦ 常见问题</b>：先显示权限和服务状态；有问题的项给出「去授权」，和它相关的问题标出来。点「去授权」试试。',
};
function show(id) {
  document.querySelectorAll('.pill[data-screen]').forEach(p => p.classList.toggle('on', p.dataset.screen === id));
  $('#caption').innerHTML = CAPTIONS[id];
  Object.assign(st, { page: 'start', filter: 'all', sel: 'fy', query: '', open: 0, axOK: false, focus: 0 });
  $('#q').value = '';
  if (id === 'entry') closeHelp();
  else {
    openHelp();
    if (['keywords', 'shortcuts', 'faq'].includes(id)) go(id);
    if (id === 'search' || id === 'empty') { st.query = id === 'search' ? '截图' : '怎么同步到手机'; $('#q').value = st.query; render(); }
  }
  setParam('s', id);
}
function setParam(k, v) { const p = new URLSearchParams(location.search); p.set(k, v); history.replaceState(null, '', '?' + p); }
function setStyle(s) { document.documentElement.dataset.style = s; document.querySelectorAll('#styleGrp span').forEach(x => x.classList.toggle('on', x.dataset.style === s)); setParam('style', s); }
function setTheme(t) { document.documentElement.dataset.theme = t; document.querySelectorAll('#themeGrp span').forEach(x => x.classList.toggle('on', x.dataset.theme === t)); setParam('theme', t); }
document.querySelectorAll('.pill[data-screen]').forEach(p => p.onclick = () => show(p.dataset.screen));
document.querySelectorAll('#styleGrp span').forEach(x => x.onclick = () => setStyle(x.dataset.style));
document.querySelectorAll('#themeGrp span').forEach(x => x.onclick = () => setTheme(x.dataset.theme));

const params = new URLSearchParams(location.search);
if (params.get('solo')) document.body.classList.add('solo');
setStyle(params.get('style') || 'glass');
setTheme(params.get('theme') || 'dark');
show(params.get('solo') || params.get('s') || 'start');
</script>
