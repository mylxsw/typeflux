<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typeflux · help 使用指南（可交互设计稿）</title>
<style>
:root {
  --text: #eeeeef; --text2: #b8b8bb; --text3: #85858a; --accent: #2f8cff; --accent-soft: rgba(47,140,255,.16);
  --ok: #29c76e; --ok-soft: rgba(41,199,110,.14); --warn: #eb8040; --warn-soft: rgba(235,128,64,.15);
  --danger: #dc5252; --danger-soft: rgba(220,82,82,.13); --ai: #a970ff; --ai-soft: rgba(169,112,255,.15);
  --card: rgba(255,255,255,.055); --card-hover: rgba(255,255,255,.09); --border: rgba(255,255,255,.12);
  --border-soft: rgba(255,255,255,.07); --field: rgba(255,255,255,.07); --tile: rgba(255,255,255,.08);
  --key: rgba(255,255,255,.1); --scrim: rgba(12,12,16,.74); --panel: rgba(30,30,34,.96); --glass: rgba(36,36,40,.92);
  --stage: #0e0e10; --desk: linear-gradient(135deg, #1d2a3f 0%, #2b1f3a 55%, #3a2a24 100%);
}
body.light {
  --text: #141414; --text2: #474747; --text3: #85868a; --accent: #1f6fe0; --accent-soft: rgba(31,111,224,.12);
  --ok: #1fab63; --ok-soft: rgba(31,171,99,.12); --warn: #ed5c2e; --warn-soft: rgba(237,92,46,.12);
  --danger-soft: rgba(220,82,82,.10); --ai: #8a4fe8; --ai-soft: rgba(138,79,232,.11);
  --card: rgba(255,255,255,.82); --card-hover: #fff; --border: rgba(97,115,143,.18); --border-soft: rgba(97,115,143,.11);
  --field: #fff; --tile: rgba(97,115,143,.10); --key: #fff; --scrim: rgba(236,239,244,.80); --panel: rgba(250,250,252,.98);
  --glass: rgba(250,250,252,.94); --stage: #d9dde3; --desk: linear-gradient(135deg, #b9cbe6 0%, #d8c8e8 55%, #ecd6c6 100%);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  color: var(--text); background: var(--stage); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
button, input { font: inherit; color: inherit; }
svg { flex: none; }
.mono, kbd, .kw { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; }

/* ---------- Stage ---------- */
.stagebar { width: 1280px; max-width: calc(100vw - 32px); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 18px 0 6px; color: var(--text2); }
.stagebar b { color: var(--text); font-size: 14px; margin-right: 6px; }
.stagebar .sp { flex: 1; }
.pill { border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 12px; }
.pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.caption { width: 1280px; max-width: calc(100vw - 32px); color: var(--text3); font-size: 12px; padding: 0 0 12px; min-height: 30px; }
.caption b { color: var(--text2); font-weight: 600; }
body.solo .stagebar, body.solo .caption { display: none; }
body.solo { padding: 0; justify-content: center; }

/* ---------- Screen (a 1280×800 Mac display) ---------- */
.screen { position: relative; width: 1280px; height: 800px; border-radius: 12px; overflow: hidden; background: var(--desk); box-shadow: 0 30px 80px rgba(0,0,0,.45); flex: none; }
body.solo .screen { border-radius: 0; box-shadow: none; }
.menubar { height: 25px; display: flex; align-items: center; gap: 18px; padding: 0 14px; font-size: 12.5px; background: rgba(0,0,0,.25); color: #fff; backdrop-filter: blur(20px); }
body.light .menubar { background: rgba(255,255,255,.45); color: #111; }
.menubar .sp { flex: 1; }
.appwin { position: absolute; left: 120px; top: 80px; width: 760px; height: 470px; border-radius: 12px; background: rgba(30,30,34,.9); border: 1px solid var(--border); padding: 46px 40px; color: var(--text2); font-size: 14px; line-height: 1.8; }
body.light .appwin { background: rgba(255,255,255,.9); }
.appwin::before { content: ''; position: absolute; left: 14px; top: 13px; width: 52px; height: 12px; background: radial-gradient(circle at 6px 6px, #ff5f57 5px, transparent 6px), radial-gradient(circle at 26px 6px, #febc2e 5px, transparent 6px), radial-gradient(circle at 46px 6px, #28c840 5px, transparent 6px); }
.appwin .sel { background: rgba(47,140,255,.35); border-radius: 2px; }

/* ---------- Launcher ---------- */
.launcher { position: absolute; left: 50%; top: 170px; transform: translateX(-50%); width: 680px; background: var(--glass); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 26px 70px rgba(0,0,0,.45); backdrop-filter: blur(24px); z-index: 5; }
.launcher .in { display: flex; align-items: center; gap: 9px; padding: 14px 16px; border-bottom: 1px solid var(--border-soft); font-size: 17px; }
.launcher .chip { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 8px; font-size: 14px; }
.launcher .caret { width: 1.5px; height: 20px; background: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.launcher .rows { padding: 6px; }
.lrow { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px; }
.lrow.on { background: var(--accent-soft); }
.lrow .ico { width: 28px; height: 28px; border-radius: 7px; background: var(--tile); display: grid; place-items: center; color: var(--text2); }
.lrow.on .ico { background: var(--accent); color: #fff; }
.lrow .t { font-size: 14px; }
.lrow .d { font-size: 12px; color: var(--text3); }
.lrow .sp { flex: 1; }
.lrow .r { font-size: 12px; color: var(--text3); }
.launcher .bar { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-top: 1px solid var(--border-soft); font-size: 12px; color: var(--text3); }
.launcher .bar .sp { flex: 1; }
.qbtn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; font-size: 12px; color: var(--text2); cursor: pointer; }
.qbtn:hover { background: var(--tile); }

/* ---------- Help overlay ---------- */
.help { position: absolute; inset: 0; z-index: 10; display: none; background: var(--scrim); backdrop-filter: blur(18px) saturate(1.2); }
.help.on { display: flex; flex-direction: column; animation: fade .16s ease-out; }
@keyframes fade { from { opacity: 0; transform: scale(1.01); } }
.h-top { display: flex; align-items: center; gap: 14px; padding: 34px 56px 18px; }
.h-logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #2f8cff, #a970ff); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 17px; }
.h-title { font-size: 19px; font-weight: 650; }
.h-title small { display: block; font-size: 12px; font-weight: 400; color: var(--text3); }
.h-search { flex: 1; max-width: 560px; margin-left: 28px; display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 14px; border-radius: 11px; background: var(--field); border: 1px solid var(--border); font-size: 15px; }
.h-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.h-search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 15px; }
.h-search input::placeholder { color: var(--text3); }
.h-sp { flex: 1; }
.h-close { display: flex; align-items: center; gap: 6px; color: var(--text3); font-size: 12px; cursor: pointer; }
.h-body { flex: 1; min-height: 0; display: flex; gap: 28px; padding: 6px 56px 0; }
.h-nav { width: 176px; flex: none; display: flex; flex-direction: column; gap: 2px; }
.h-nav .n { display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-radius: 8px; color: var(--text2); cursor: pointer; font-size: 13.5px; }
.h-nav .n:hover { background: var(--tile); }
.h-nav .n.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.h-nav .n .c { margin-left: auto; font-size: 11px; color: var(--text3); }
.h-nav .n kbd { margin-left: auto; }
.h-nav .sep { height: 1px; background: var(--border-soft); margin: 10px 4px; }
.h-nav .ext { font-size: 12.5px; color: var(--text3); }
.h-main { flex: 1; min-width: 0; overflow-y: auto; padding: 0 6px 30px 0; scrollbar-width: thin; }
.h-foot { display: flex; align-items: center; gap: 18px; padding: 11px 56px 16px; font-size: 12px; color: var(--text3); border-top: 1px solid var(--border-soft); }
.h-foot .sp { flex: 1; }
kbd { display: inline-block; min-width: 18px; text-align: center; font-size: 11px; background: var(--key); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; line-height: 17px; color: var(--text2); margin-right: 3px; }
kbd.big { font-size: 13px; line-height: 24px; min-width: 28px; padding: 0 8px; border-radius: 7px; }
.sec { margin-bottom: 26px; }
.sec h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.sec h2 .sub { font-weight: 400; font-size: 12px; color: var(--text3); }
.sec h2 .act { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--accent); cursor: pointer; }
.sec h3 { font-size: 12px; color: var(--text3); font-weight: 600; margin: 16px 0 8px; letter-spacing: .02em; }

/* Quick start cards */
.starts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.start { background: var(--card); border: 1px solid var(--border-soft); border-radius: 14px; padding: 16px; cursor: pointer; position: relative; }
.start:hover, .start.focus { background: var(--card-hover); border-color: var(--border); }
.start.focus { box-shadow: 0 0 0 2px var(--accent); }
.start .keys { display: flex; align-items: center; gap: 6px; height: 34px; margin-bottom: 12px; }
.start .keys .op { color: var(--text3); font-size: 12px; }
.start .nm { font-size: 14.5px; font-weight: 600; margin-bottom: 3px; }
.start .ds { font-size: 12.5px; color: var(--text2); line-height: 1.5; }
.start .try { margin-top: 10px; font-size: 12px; color: var(--accent); }
.start .hold { position: relative; }
.start .hold::after { content: ''; position: absolute; left: -3px; right: -3px; bottom: -6px; height: 3px; border-radius: 2px; background: var(--accent); animation: hold 2.2s ease-in-out infinite; transform-origin: left; }
@keyframes hold { 0% { transform: scaleX(0); } 70%, 100% { transform: scaleX(1); } }

.tips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tip { display: flex; gap: 11px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--border-soft); cursor: pointer; }
.tip:hover { background: var(--card-hover); }
.tip .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--ai-soft); color: var(--ai); flex: none; }
.tip .t { font-size: 13px; font-weight: 600; }
.tip .d { font-size: 12px; color: var(--text2); }

/* Keyword grid */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.filters .pill { background: var(--card); }
.filters .pill.on { background: var(--accent); }
.kwgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kwc { display: flex; gap: 11px; align-items: flex-start; padding: 12px 13px; border-radius: 12px; background: var(--card); border: 1px solid var(--border-soft); cursor: pointer; position: relative; }
.kwc:hover { background: var(--card-hover); border-color: var(--border); }
.kwc.focus { box-shadow: 0 0 0 2px var(--accent); background: var(--card-hover); }
.kwc.off { opacity: .55; }
.kwc .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--tile); color: var(--text2); flex: none; }
.kwc .main { min-width: 0; flex: 1; }
.kwc .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kw { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 0 6px; font-size: 12px; line-height: 19px; }
.kw.alt { background: var(--tile); color: var(--text2); }
.kwc .nm { font-size: 13px; font-weight: 600; margin-top: 4px; }
.kwc .ds { font-size: 12px; color: var(--text2); line-height: 1.45; }
.kwc .tags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.tag { font-size: 10.5px; border-radius: 4px; padding: 0 5px; line-height: 17px; background: var(--tile); color: var(--text3); }
.tag.sel { background: var(--ok-soft); color: var(--ok); }
.tag.ai { background: var(--ai-soft); color: var(--ai); }
.tag.mine { background: var(--warn-soft); color: var(--warn); }
.tag.new { background: var(--accent-soft); color: var(--accent); }
.tag.hot { background: transparent; border: 1px solid var(--border); color: var(--text2); }
.mark { background: rgba(255,214,10,.35); color: inherit; border-radius: 2px; }
.syslist { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 18px; padding: 12px 14px; background: var(--card); border: 1px solid var(--border-soft); border-radius: 12px; }
.syslist div { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text2); padding: 3px 0; }
.syslist .kw { font-size: 11px; }

/* Shortcut tables */
.kgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kbox { background: var(--card); border: 1px solid var(--border-soft); border-radius: 12px; padding: 6px 14px; }
.kbox .hd { font-size: 12px; color: var(--text3); font-weight: 600; padding: 8px 0 4px; display: flex; }
.kbox .hd a { margin-left: auto; color: var(--accent); font-weight: 400; cursor: pointer; }
.krow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border-soft); font-size: 13px; }
.kbox .hd + .krow { border-top: 0; }
.krow .lb { flex: 1; min-width: 0; }
.krow .lb small { display: block; font-size: 11.5px; color: var(--text3); }
.krow .ks { display: flex; align-items: center; gap: 2px; flex: none; }
.krow .unset { font-size: 12px; color: var(--text3); }
.krow.hl { background: rgba(255,214,10,.10); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }

/* FAQ */
.diag { display: flex; gap: 10px; margin-bottom: 14px; }
.dg { flex: 1; display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 12px; background: var(--card); border: 1px solid var(--border-soft); font-size: 12.5px; }
.dg .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dg.bad { border-color: var(--warn); background: var(--warn-soft); }
.dg.bad .dot { background: var(--warn); }
.dg .v { color: var(--text3); font-size: 12px; }
.dg .go { margin-left: auto; color: var(--accent); cursor: pointer; white-space: nowrap; }
.faq { background: var(--card); border: 1px solid var(--border-soft); border-radius: 12px; }
.qa { border-top: 1px solid var(--border-soft); }
.qa:first-child { border-top: 0; }
.qa .q { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; font-size: 13.5px; }
.qa .q .chev { margin-left: auto; color: var(--text3); transition: transform .15s; }
.qa.open .q .chev { transform: rotate(90deg); }
.qa .a { display: none; padding: 0 14px 14px 40px; font-size: 12.5px; color: var(--text2); line-height: 1.7; }
.qa.open .a { display: block; }
.qa .a .lnk { color: var(--accent); cursor: pointer; }
.qa .q .badge { font-size: 11px; color: var(--warn); }

/* Detail drawer */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 430px; background: var(--panel); border-left: 1px solid var(--border); box-shadow: -20px 0 60px rgba(0,0,0,.3); z-index: 12; display: none; flex-direction: column; }
.drawer.on { display: flex; animation: slide .18s ease-out; }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
.dr-hd { display: flex; gap: 12px; align-items: center; padding: 26px 24px 16px; border-bottom: 1px solid var(--border-soft); }
.dr-hd .ic { width: 42px; height: 42px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.dr-hd .nm { font-size: 17px; font-weight: 650; }
.dr-hd .x { margin-left: auto; color: var(--text3); cursor: pointer; font-size: 12px; }
.dr-bd { flex: 1; overflow-y: auto; padding: 16px 24px; }
.dr-bd h4 { font-size: 12px; color: var(--text3); margin: 16px 0 8px; font-weight: 600; }
.dr-bd h4:first-child { margin-top: 0; }
.dr-bd p { margin: 0 0 6px; color: var(--text2); line-height: 1.6; }
.ex { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 9px; background: var(--field); border: 1px solid var(--border-soft); margin-bottom: 6px; cursor: pointer; }
.ex:hover { border-color: var(--accent); }
.ex .in { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
.ex .out { margin-left: auto; font-size: 11.5px; color: var(--text3); text-align: right; }
.dr-ft { display: flex; gap: 8px; padding: 14px 24px 18px; border-top: 1px solid var(--border-soft); align-items: center; }
.btn { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 6px 13px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn kbd { background: rgba(255,255,255,.2); border-color: transparent; color: inherit; }
.dr-ft .sp { flex: 1; }

/* Search results */
.sr-group { margin-bottom: 18px; }
.sr-row { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; cursor: pointer; }
.sr-row:hover { background: var(--tile); }
.sr-row.focus { background: var(--accent-soft); }
.sr-row .ic { width: 28px; height: 28px; border-radius: 7px; background: var(--tile); display: grid; place-items: center; color: var(--text2); }
.sr-row .t { font-size: 13.5px; }
.sr-row .d { font-size: 12px; color: var(--text3); }
.sr-row .r { margin-left: auto; display: flex; gap: 2px; align-items: center; }
.empty { text-align: center; padding: 70px 0 20px; color: var(--text2); }
.empty .big { font-size: 15px; color: var(--text); margin-bottom: 6px; }
.askai { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 12px 16px; border-radius: 12px; background: var(--ai-soft); border: 1px solid var(--ai); color: var(--text); cursor: pointer; font-size: 13.5px; }
.askai .ic { color: var(--ai); }

/* Annotations */
.anno { position: absolute; z-index: 30; background: #ffd60a; color: #1a1a1a; font-size: 11.5px; line-height: 1.4; border-radius: 7px; padding: 5px 8px; max-width: 230px; box-shadow: 0 6px 18px rgba(0,0,0,.3); pointer-events: none; }
.anno b { font-weight: 700; }
body.noanno .anno { display: none; }
.toast { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; z-index: 40; font-size: 12.5px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.toast.on { display: block; }
</style>
</head>
<body>
<div class="stagebar">
  <b>help 使用指南</b>
  <span class="pill" data-screen="entry">① 入口</span>
  <span class="pill" data-screen="home">② 总览</span>
  <span class="pill" data-screen="keywords">③ 关键词</span>
  <span class="pill" data-screen="detail">④ 关键词详情</span>
  <span class="pill" data-screen="shortcuts">⑤ 快捷键</span>
  <span class="pill" data-screen="search">⑥ 搜索</span>
  <span class="pill" data-screen="empty">⑦ 搜不到</span>
  <span class="pill" data-screen="faq">⑧ 常见问题</span>
  <span class="sp"></span>
  <span class="pill" id="themeToggle">浅色</span>
  <span class="pill" id="annoToggle">标注</span>
</div>
<div class="caption" id="caption"></div>

<div class="screen" id="screen">
  <div class="menubar"><b></b><span>Notes</span><span>文件</span><span>编辑</span><span>显示</span><span class="sp"></span><span>⌨︎</span><span>Wi-Fi</span><span>10月14日 周三 18:06</span></div>
  <div class="appwin">
    <div style="font-size:20px;color:var(--text);margin-bottom:12px">周报草稿</div>
    本周完成了快捷键设置页的调研和设计评审，<span class="sel">we are going to ship the help overlay next week</span>。<br>
    下周进入开发，预计周五提测。
  </div>

  <!-- Launcher (entry screen) -->
  <div class="launcher" id="launcher">
    <div class="in" id="lIn"></div>
    <div class="rows" id="lRows"></div>
    <div class="bar" id="lBar"></div>
  </div>

  <!-- Help overlay -->
  <div class="help" id="help">
    <div class="h-top">
      <div class="h-logo">T</div>
      <div class="h-title">Typeflux 使用指南<small>在启动器输入 help 或 ? 随时打开</small></div>
      <label class="h-search"><span style="color:var(--text3)" data-i="search"></span>
        <input id="q" placeholder="搜索功能、关键词或快捷键（截图、fy、⌘K…）" autocomplete="off">
        <kbd>⌘F</kbd></label>
      <span class="h-sp"></span>
      <span class="h-close" id="closeHelp"><kbd>esc</kbd>关闭</span>
    </div>

function kwCard(k, q) {
  const hl = s => q ? s.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<span class="mark">$1</span>') : s;
  const tags = [k.sel && '<span class="tag sel">可用选中文字</span>', k.ai && '<span class="tag ai">AI</span>', k.mine && `<span class="tag mine">${k.wf ? '工作流' : '自定义'}</span>`,
    k.isNew && '<span class="tag new">新</span>', k.hot && `<span class="tag hot">${k.hot}</span>`, k.used === 0 && !k.mine && !k.isNew && '<span class="tag">还没用过</span>', k.off && `<span class="tag" style="color:var(--warn)">${k.off}</span>`].filter(Boolean).join('');
  return `<div class="kwc ${k.off ? 'off' : ''} ${st.focus === k.id ? 'focus' : ''}" data-kw="${k.id}"><div class="ic">${ic(k.icon)}</div><div class="main">
    <div class="top">${k.kws.map((w, i) => `<span class="kw ${i ? 'alt' : ''}">${hl(w)}</span>`).join('')}</div>
    <div class="nm">${hl(k.name)}</div><div class="ds">${hl(k.ds)}</div>${tags ? `<div class="tags">${tags}</div>` : ''}</div></div>`;
}
function keyBox(title, rows, link) {

}

/* ------------------------------ Search ------------------------------ */
function norm(s) { return s.toLowerCase().replace(/\s+/g, '').replace(/cmd|command/g, '⌘').replace(/opt|option|alt/g, '⌥').replace(/ctrl|control/g, '⌃').replace(/shift/g, '⇧').replace(/enter|return/g, '↩'); }
function search(q) {
  const n = norm(q);
  const kw = KWS.filter(k => [...k.kws, k.name, k.ds].some(s => norm(s).includes(n)));
  const sys = SYSTEM.filter(([k, t]) => k.includes(n) || t.includes(q));
  const keys = [...GLOBAL_KEYS.filter(r => r[2]).map(r => [r[0], r[2], '全局']), ...KEYWORD_KEYS.map(r => [r[0], r[2], '关键词快捷键']),
    ...LAUNCHER_KEYS.map(r => [r[0], r[1], '启动器']), ...RESULT_KEYS.map(r => [r[0], r[1], '结果上']), ...CHAT_KEYS.map(r => [r[0], r[1], '对话窗口'])]
    .filter(([t, k]) => norm(t).includes(n) || norm(k).includes(n));
  const cmds = SLASH.filter(([k, t]) => k.includes(n) || t.includes(q));
  const faq = FAQ.map((f, i) => [f, i]).filter(([[qq, a]]) => qq.includes(q) || a.replace(/<[^>]+>/g, '').includes(q));
  return { kw, sys, keys, cmds, faq, total: kw.length + sys.length + keys.length + cmds.length + faq.length };
}
function renderSearch() {
  const q = st.query, r = search(q);
  if (!r.total) {
    return `<div class="empty"><div class="big">没有找到「${q}」</div>换个说法，或者直接问 AI：它知道 Typeflux 的全部功能和你当前的设置。<br>
      <div class="askai" id="askai"><span class="ic">${ic('spark', 18)}</span>问 AI：「Typeflux ${q}」<kbd style="margin-left:8px">⌘↩</kbd></div>
      <div style="margin-top:26px;font-size:12px;color:var(--text3)">试试：<span class="kw" data-try="截图">截图</span> <span class="kw" data-try="⌘K">⌘K</span> <span class="kw" data-try="翻译">翻译</span> <span class="kw" data-try="权限">权限</span></div></div>`;
  }
  let first = true;
  const row = (icon, t, d, right, attrs = '') => { const f = first; first = false; return `<div class="sr-row ${f ? 'focus' : ''}" ${attrs}><div class="ic">${ic(icon)}</div><div><div class="t">${t}</div><div class="d">${d}</div></div><div class="r">${right}</div></div>`; };
  const grp = (t, rows) => rows.length ? `<div class="sr-group"><h3>${t} · ${rows.length}</h3>${rows.join('')}</div>` : '';
  return `<div style="font-size:12px;color:var(--text3);margin-bottom:10px">「${q}」共 ${r.total} 个结果 · ↑↓ 选择 · ↩ 查看 · ⌘↩ 试一试</div>`
    + grp('关键词', r.kw.map(k => row(k.icon, `${k.kws.map((w, i) => `<span class="kw ${i ? 'alt' : ''}">${w}</span>`).join(' ')} ${k.name}`, k.ds, k.hot ? K(k.hot.split('').join(' ')) : '<span style="font-size:12px;color:var(--text3)">↩ 详情</span>', `data-kw="${k.id}"`)))
    + grp('快捷键', r.keys.map(([t, k, where]) => row('key', t, where, K(k))))
    + grp('系统命令', r.sys.map(([k, t]) => row('power', `<span class="kw">${k}</span> ${t}`, '在启动器里输入名称', '')))
    + grp('对话命令', r.cmds.map(([k, t]) => row('slash', `<span class="kw">${k}</span> ${t}`, '在输入框里先输入 /', '')))
    + grp('常见问题', r.faq.map(([[qq], i]) => row('help', qq, '常见问题', '', `data-gofaq="${i}"`)));
}

function renderMain() {
  if (st.query) { $('#main').innerHTML = renderSearch(); }
  else $('#main').innerHTML = secStart() + secKeywords() + secShortcuts(st.hlKey) + secLauncher() + secCommands() + secFaq();
  bindMain();
  renderFoot();
}
function bindMain() {
  document.querySelectorAll('[data-filter]').forEach(p => p.onclick = () => { st.filter = p.dataset.filter; renderMain(); go('keywords'); });
  document.querySelectorAll('[data-kw]').forEach(c => c.onclick = () => openDrawer(c.dataset.kw));
  document.querySelectorAll('[data-faq]').forEach(c => c.onclick = () => { st.openFaq = st.openFaq === +c.dataset.faq ? -1 : +c.dataset.faq; renderMain(); go('faq'); });
  document.querySelectorAll('[data-gofaq]').forEach(c => c.onclick = () => { st.openFaq = +c.dataset.gofaq; st.query = ''; $('#q').value = ''; go('faq'); });
  document.querySelectorAll('[data-try]').forEach(c => c.onclick = () => { $('#q').value = c.dataset.try; onQuery(); });
  document.querySelectorAll('[data-start]').forEach(c => c.onclick = () => c.dataset.start === 'kw' ? go('keywords') : toast(c.dataset.start === 'voice' ? '关闭指南，在原来的应用里按住 fn 说一句话' : '关闭指南并打开' + (c.dataset.start === 'ask' ? '随便问' : '启动器')));
  const ax = $('#fixAx'); if (ax) ax.onclick = () => { st.axOK = true; toast('打开「系统设置 → 隐私与安全性 → 辅助功能」；授权后这里自动变绿'); renderMain(); go('faq'); };
  const ai = $('#askai'); if (ai) ai.onclick = () => toast('关闭指南，打开启动器并把问题交给 AI（附带 Typeflux 帮助文档作为上下文）');
  document.querySelectorAll('.act').forEach(a => a.onclick = () => toast('关闭指南，打开 Typeflux 设置对应的页面'));
}
function renderFoot() {
  $('#foot').innerHTML = st.drawer
    ? `<span>${K('↩')}在启动器中试一试</span><span>${K('⌘ ,')}去设置</span><span>${K('←')}返回</span><span class="sp"></span><span>${K('esc')}关闭详情</span>`
    : st.query
      ? `<span>${K('↑ ↓')}选择</span><span>${K('↩')}查看</span><span>${K('⌘ ↩')}${search(st.query).total ? '试一试' : '问 AI'}</span><span class="sp"></span><span>${K('esc')}清空搜索</span>`
      : `<span>直接打字即可搜索</span><span>${K('↑ ↓ ← →')}选择</span><span>${K('↩')}详情</span><span>${K('⌘ 1')}–${K('6')}切换分区</span><span class="sp"></span><span>${K('esc')}关闭</span>`;
}

/* ------------------------------ Drawer ------------------------------ */
function openDrawer(id) {
  const k = KWS.find(x => x.id === id); if (!k) return;
  st.drawer = id; st.focus = id;
  const ex = k.ex || [[`${k.kws[0]} ${k.sel ? '这里是一段文字' : ''}`.trim(), k.name]];
  const keys = k.keys || [['↩', '运行 / 打开'], ['⌘↩', '改为问 AI'], ['esc', '退出关键词']];
  $('#drawer').innerHTML = `<div class="dr-hd"><div class="ic">${ic(k.icon, 22)}</div><div><div class="nm">${k.name}</div>
      <div style="display:flex;gap:5px;margin-top:4px">${k.kws.map((w, i) => `<span class="kw ${i ? 'alt' : ''}">${w}</span>`).join('')}</div></div><span class="x" id="drClose"><kbd>esc</kbd></span></div>
    <div class="dr-bd">
      <h4>做什么</h4><p>${k.ds}</p>
      ${k.sel ? '<p style="font-size:12px;color:var(--ok)">✓ 先选中文字，再打开启动器输入关键词按 ↩，会直接处理选中的文字。</p>' : ''}
      <h4>怎么用 · 点一下直接试</h4>${ex.map(([i, o]) => `<div class="ex"><span class="in">${i}</span><span class="out">${o}</span></div>`).join('')}
      <h4>结果上的按键</h4>${keys.map(([kk, t]) => `<div class="krow" style="border-top:0;padding:4px 0"><div class="lb">${t}</div><div class="ks">${K(kk.split('').join(' ').replace('e s c', 'esc'))}</div></div>`).join('')}
      <h4>全局快捷键</h4>${k.hot ? `<p>${K(k.hot.split('').join(' '))} 选中文字后在任何应用里按下，${k.id === 'rw' ? '直接润色并替换' : k.id === 'fy' ? '直接翻译并浮窗显示' : '直接执行'}。</p>` : '<p>还没有设置。<span style="color:var(--accent);cursor:pointer">给它设一个快捷键 →</span></p>'}
      <h4>使用情况</h4><p>${k.used ? `用过 ${k.used} 次` : '还没用过'}${k.mine ? ' · 你自己添加的' : ' · 内置'}</p>
    </div>
    <div class="dr-ft"><span class="btn">${ic('gear', 14)}去设置</span><span class="sp"></span><span class="btn primary" id="tryKw">在启动器中试一试<kbd>↩</kbd></span></div>`;
  $('#drawer').classList.add('on');
  $('#drClose').onclick = closeDrawer;
  $('#tryKw').onclick = () => tryKeyword(k);
  document.querySelectorAll('.ex').forEach(e => e.onclick = () => tryKeyword(k, e.querySelector('.in').textContent));
  renderMain();
}
function closeDrawer() { st.drawer = null; $('#drawer').classList.remove('on'); renderFoot(); }
function tryKeyword(k, text) {
  closeDrawer(); $('#help').classList.remove('on');
  const t = text && !text.includes('（') ? text : k.kws[0] + ' ';
  const [w, ...rest] = t.split(' ');
  showLauncher(`<span class="chip">${ic(k.icon, 13)}${w}</span><span>${rest.join(' ')}</span><span class="caret"></span>`,
    [[k.icon, k.name, rest.join(' ') ? '↩ 运行' : '输入内容，或按 ↩ 处理选中的文字', true]], `<span>从使用指南打开</span><span class="sp"></span><span>${K('↩')}运行</span><span>${K('esc')}返回指南</span>`);
  annos([]);
}

    [['help', '使用指南', '关键词、快捷键和常见问题 · help 后面加文字可以直接搜索', true, '↩ 打开'],
     ['spark', '问 AI：help', '', false, '⌘↩']],
    `<span class="qbtn" title="使用指南 (?)">?</span><span>help · 使用指南</span><span class="sp"></span><span>${K('↩')}打开</span><span>${K('⌘ ↩')}问 AI</span>`);

/* ------------------------------ Keyboard ------------------------------ */
function onQuery() {
  st.query = $('#q').value.trim(); st.hlKey = null;
  if (st.drawer) closeDrawer();
  renderNav(); renderMain(); $('#main').scrollTop = 0;
}
$('#q').addEventListener('input', onQuery);
$('#closeHelp').onclick = () => { $('#help').classList.remove('on'); launcherEntry(); };
document.addEventListener('keydown', e => {
  if (!$('#help').classList.contains('on')) return;
  if (e.key === 'Escape') { e.preventDefault(); if (st.drawer) closeDrawer(); else if (st.query) { $('#q').value = ''; onQuery(); } else { $('#help').classList.remove('on'); launcherEntry(); } return; }
  if (e.metaKey && /^[1-6]$/.test(e.key)) { e.preventDefault(); st.query = ''; $('#q').value = ''; go(SECTIONS[+e.key - 1][0]); return; }
  if (e.key === 'Enter' && st.query) { const f = document.querySelector('.sr-row.focus'); if (f) f.click(); else if (e.metaKey) toast('关闭指南，把问题交给 AI'); }
  if (e.key === 'Enter' && st.drawer) { tryKeyword(KWS.find(k => k.id === st.drawer)); }
  if (document.activeElement !== $('#q') && e.key.length === 1 && !e.metaKey) $('#q').focus();
});
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }

  home: '<b>② 总览</b>：全屏遮罩，盖住当前屏幕（鼠标所在的屏幕）。左边分区导航（⌘1–6），右边一页滚到底。直接打字就会搜索。「快速上手」用 4 张卡片讲清 4 个入口；「你可能还不知道」挑几个用户还没用过的关键词。',

const ANNOS = {
  entry: [[995, 215, '<b>help</b> 是一个普通关键词（插件 <b>help</b>，别名 帮助 / ?），可以在关键词设置里改名或停用'], [995, 345, '底栏 <b>?</b> 按钮；或只输入 <b>?</b> 再按 ↩（<b>? 截图</b> 直接搜索）']],
  home: [[760, 86, '打开时焦点在搜索框；任何字符键都会输入到这里'], [24, 330, '分区导航，<b>⌘1–6</b> 跳转'], [1040, 440, '<b>你可能还不知道</b>：来自 AskKeywordUsage，挑 3 个从没用过的内置关键词']],
  keywords: [[1040, 456, '数据来自用户设置，不是写死的文案；新插件加进来自动出现']],
  detail: [[600, 460, '点示例 = 关闭指南 + 打开启动器 + 填好输入，用户按 ↩ 即可']],
  shortcuts: [[420, 652, '没设置的显示「未设置 · 设置…」，告诉用户这个功能存在']],
  search: [[760, 86, '「cmd k」「ctrl」「enter」会被转换成符号再匹配']],
  empty: [[880, 330, '问 AI 时把帮助内容作为上下文附带，回答基于用户当前的设置']],
  faq: [[880, 160, '状态检查复用 PrivacyGuard 和现有的连接状态']],
};
function show(id) {
  document.querySelectorAll('.pill[data-screen]').forEach(p => p.classList.toggle('on', p.dataset.screen === id));
  $('#caption').innerHTML = CAPTIONS[id];
  closeDrawer(); st.query = ''; $('#q').value = ''; st.filter = 'all'; st.focus = null; st.hlKey = null; st.openFaq = 0; st.axOK = false;
  const overlay = id !== 'entry';
  $('#help').classList.toggle('on', overlay);
  $('#launcher').style.display = overlay ? 'none' : 'block';
  if (!overlay) launcherEntry();
  if (overlay) { renderNav(); renderMain(); $('#main').scrollTop = 0; setTimeout(() => $('#q').focus(), 0); }
  if (id === 'keywords') go('keywords');
  if (id === 'detail') { go('keywords'); openDrawer('fy'); }
  if (id === 'shortcuts') go('shortcuts');
  if (id === 'faq') go('faq');
  if (id === 'search') { $('#q').value = '截图'; onQuery(); }
  if (id === 'empty') { $('#q').value = '怎么同步到手机'; onQuery(); }
  if (id === 'home') st.section = 'start', renderNav();
  annos(ANNOS[id] || []);
  history.replaceState(null, '', '?' + new URLSearchParams({ ...Object.fromEntries(new URLSearchParams(location.search)), s: id }));
}
$('#lRows').addEventListener('click', () => show('home'));
document.addEventListener('keydown', e => { if (!$('#help').classList.contains('on') && e.key === 'Enter' && $('#launcher').style.display !== 'none') show('home'); });
document.querySelectorAll('.pill[data-screen]').forEach(p => p.onclick = () => show(p.dataset.screen));
$('#themeToggle').onclick = () => { document.body.classList.toggle('light'); $('#themeToggle').classList.toggle('on'); };
$('#annoToggle').onclick = () => { document.body.classList.toggle('noanno'); $('#annoToggle').classList.toggle('on', !document.body.classList.contains('noanno')); };

const params = new URLSearchParams(location.search);
if (params.get('light') === '1') { document.body.classList.add('light'); $('#themeToggle').classList.add('on'); }
if (params.get('noanno') === '1') document.body.classList.add('noanno');
if (params.get('solo')) document.body.classList.add('solo');
$('#annoToggle').classList.toggle('on', !document.body.classList.contains('noanno'));
show(params.get('solo') || params.get('s') || 'home');
</script>
</body>
