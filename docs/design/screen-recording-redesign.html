<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typeflux · 录屏改版（可交互设计稿）</title>
<style>
:root {
  --text: #eeeeef; --text2: #b8b8bb; --text3: #85858a; --accent: #2f8cff; --accent-soft: #15263e;
  --border: rgba(255,255,255,.10); --glass: rgba(44,44,52,.96); --press: rgba(255,255,255,.12); --hover: rgba(255,255,255,.08);
  --tile: rgba(255,255,255,.07); --pop: #2c2c34; --stage: #0e0e10; --danger: #ff4d4f; --rec: #ff3b30; --warn: #ffb020; --ok: #29c76e;
  --desk: linear-gradient(135deg, #1d2a3f 0%, #2b1f3a 55%, #3a2a24 100%);
  --app: #17181c; --app2: #202127; --appText: #e6e6ea; --appText2: #9a9aa3; --appLine: rgba(255,255,255,.08);
  --win: #1e1f24; --win2: #26272d; --menubar: rgba(30,30,36,.55); --shadow: 0 8px 28px rgba(0,0,0,.35);
  --dim: rgba(0,0,0,.42); --blur: none;
}
body.light {
  --text: #141414; --text2: #474747; --text3: #85868a; --accent: #1f6fe0; --accent-soft: #e7efff;
  --border: #e2e5ea; --glass: rgba(255,255,255,.97); --press: rgba(0,0,0,.09); --hover: rgba(0,0,0,.06);
  --tile: #eef0f3; --pop: #fff; --stage: #d9dde3;
  --desk: linear-gradient(135deg, #b9cbe6 0%, #d8c8e8 55%, #ecd6c6 100%);
  --app: #ffffff; --app2: #f4f5f7; --appText: #1d1d1f; --appText2: #6e6e73; --appLine: rgba(0,0,0,.08);
  --win: #f6f6f8; --win2: #ffffff; --menubar: rgba(255,255,255,.55); --shadow: 0 8px 28px rgba(20,30,50,.18);
  --dim: rgba(20,30,50,.28);
}
/* Liquid Glass: the same surfaces, translucent and blurred, with a top highlight. */
body.glass { --glass: rgba(40,40,48,.58); --pop: rgba(44,44,52,.72); --blur: blur(22px) saturate(1.7); --border: rgba(255,255,255,.16); }
body.glass.light { --glass: rgba(255,255,255,.62); --pop: rgba(255,255,255,.78); --border: rgba(255,255,255,.7); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  color: var(--text); background: var(--stage); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
button { font: inherit; color: inherit; }
svg { flex: none; display: block; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

/* ---------- Stage ---------- */
.stagebar { width: 1180px; max-width: calc(100vw - 32px); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 18px 0 6px; color: var(--text2); }
.stagebar b { color: var(--text); font-size: 14px; margin-right: 6px; }
.stagebar .grp { color: var(--text3); font-size: 11px; margin-left: 6px; }
.stagebar .sp { flex: 1; }
.pill { border: 1px solid var(--border); background: var(--tile); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 12px; user-select: none; }
.pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.caption { width: 1180px; max-width: calc(100vw - 32px); color: var(--text3); font-size: 12px; padding: 0 0 12px; min-height: 30px; }
.caption b { color: var(--text2); font-weight: 600; }
body.solo .stagebar, body.solo .caption { display: none; }
.desk { width: 1180px; height: 720px; border-radius: 14px; background: var(--desk); position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.4); user-select: none; }
body.solo .desk { border-radius: 0; box-shadow: none; }

/* ---------- Desktop: menu bar and two app windows ---------- */
.menubar { position: absolute; left: 0; right: 0; top: 0; height: 26px; background: var(--menubar); backdrop-filter: blur(20px); display: flex; align-items: center; gap: 16px; padding: 0 14px; font-size: 12.5px; color: var(--text); z-index: 5; }
.menubar b { font-weight: 700; }
.menubar .sp { flex: 1; }
.menubar .mbi { display: flex; align-items: center; gap: 5px; opacity: .85; }
.mbrec { display: flex; align-items: center; gap: 5px; background: var(--rec); color: #fff; border-radius: 5px; padding: 1px 7px; font-size: 11.5px; cursor: pointer; }
.mbrec.paused { background: var(--warn); color: #241a00; }
.app { position: absolute; background: var(--app); border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.35); color: var(--appText); }
.app .tb { height: 34px; background: var(--app2); border-bottom: 1px solid var(--appLine); display: flex; align-items: center; padding: 0 12px; gap: 8px; }
.dots { display: flex; gap: 7px; } .dots i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; display: block; }
.dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
.dots.mute i { background: var(--text3); opacity: .35; }
.app .tb .t { margin-left: 8px; font-weight: 600; font-size: 12px; color: var(--appText2); }
.app .side { position: absolute; left: 0; top: 34px; bottom: 0; width: 150px; border-right: 1px solid var(--appLine); padding: 12px 8px; }
.app .side div { height: 26px; border-radius: 6px; padding: 4px 10px; color: var(--appText2); font-size: 12.5px; }
.app .side div.on { background: rgba(127,127,140,.14); color: var(--appText); font-weight: 600; }
.app .main { position: absolute; left: 150px; top: 34px; right: 0; bottom: 0; padding: 18px 22px; }
.app h3 { margin: 0 0 4px; font-size: 17px; }
.app .muted { color: var(--appText2); font-size: 12px; }
.kpis { display: flex; gap: 10px; margin-top: 14px; }
.kpi { flex: 1; background: var(--app2); border-radius: 10px; padding: 10px 12px; }
.kpi .n { font-size: 19px; font-weight: 700; margin-top: 2px; }
.kpi .d { font-size: 11px; color: #29c76e; }
.chart { margin-top: 12px; height: 170px; background: var(--app2); border-radius: 10px; padding: 12px; }
.bars { display: flex; align-items: flex-end; gap: 9px; height: 118px; margin-top: 8px; }
.bars i { flex: 1; background: linear-gradient(#5aa2ff, #2f8cff); border-radius: 4px 4px 0 0; display: block; }
.code { padding: 12px 16px; font: 12px/1.75 ui-monospace, Menlo, monospace; color: var(--appText2); white-space: pre; }
.code b { color: #c792ea; font-weight: 400; } .code i { color: #82aaff; font-style: normal; } .code u { color: #c3e88d; text-decoration: none; }
body.light .code b { color: #9b3fb8; } body.light .code i { color: #2a5bd7; } body.light .code u { color: #3a8a1c; }
.cursor { position: absolute; width: 18px; height: 18px; pointer-events: none; z-index: 60; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }

/* ---------- Capture overlay ---------- */
.layer { position: absolute; inset: 0; z-index: 10; }
.layer.pick { cursor: crosshair; }
.hole { position: absolute; box-shadow: 0 0 0 9999px var(--dim); pointer-events: none; border-radius: 1px; }
.hole.region { border: 1.5px solid var(--accent); }
.hole.win { border-radius: 12px; box-shadow: 0 0 0 9999px var(--dim), inset 0 0 0 2px var(--accent); background: rgba(47,140,255,.10); }
.hole.display { box-shadow: inset 0 0 0 3px var(--accent); background: rgba(47,140,255,.10); }
.handle { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 1.5px solid var(--accent); transform: translate(-50%,-50%); pointer-events: auto; }
.sizechip { position: absolute; background: rgba(0,0,0,.72); color: #fff; font: 11px ui-monospace, Menlo, monospace; padding: 3px 7px; border-radius: 5px; white-space: nowrap; pointer-events: none; }
.target-label { position: absolute; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 18px; border-radius: 12px;
  background: rgba(0,0,0,.66); color: #fff; text-align: center; pointer-events: none; }
.target-label b { font-size: 14px; white-space: nowrap; } .target-label span { white-space: nowrap; } .target-label span { font-size: 12px; opacity: .78; }

/* Recording frame: corner brackets, not a dim mask, so the user keeps working. */
.recframe { position: absolute; pointer-events: none; border: 1.5px solid rgba(255,59,48,.75); }
.recframe.paused { border: 1.5px dashed var(--warn); }
.recframe i { position: absolute; width: 16px; height: 16px; border: 3px solid var(--rec); }
.recframe.paused i { border-color: var(--warn); }
.recframe i:nth-child(1) { left: -3px; top: -3px; border-right: 0; border-bottom: 0; }
.recframe i:nth-child(2) { right: -3px; top: -3px; border-left: 0; border-bottom: 0; }
.recframe i:nth-child(3) { left: -3px; bottom: -3px; border-right: 0; border-top: 0; }
.recframe i:nth-child(4) { right: -3px; bottom: -3px; border-left: 0; border-top: 0; }

/* ---------- Toolbar (same tokens as the screenshot toolbar) ---------- */
.bar { position: absolute; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 12px; background: var(--glass); border: 1px solid var(--border);
  box-shadow: var(--shadow); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); z-index: 30; white-space: nowrap; }
body.glass .bar, body.glass .pop, body.glass .pill2, body.glass .toast { box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.18); }
.ib { min-width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; color: var(--text); opacity: .78; position: relative; padding: 0 7px; font-size: 12.5px; }
.ib:hover { background: var(--hover); opacity: 1; }
.ib.on { background: var(--accent-soft); color: var(--accent); opacity: 1; }
.ib.dis { opacity: .28; cursor: default; }
.ib.dis:hover { background: transparent; }
.ib .badge { position: absolute; right: 2px; top: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 1.5px var(--glass); }
.ib .caret { opacity: .6; margin-left: -2px; }
.sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; flex: none; }
.grip { width: 14px; height: 30px; display: grid; place-items: center; color: var(--text3); cursor: grab; }
.seg { display: inline-flex; background: var(--tile); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; min-width: 26px; height: 26px; padding: 0 9px; border-radius: 6px; cursor: pointer; color: var(--text2); font-size: 12.5px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
.seg button.on { background: var(--press); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.18); font-weight: 600; }
body.light .seg button.on { background: #fff; }
.seg.sm button { height: 22px; font-size: 12px; padding: 0 8px; }
.primary { height: 30px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.primary.rec { background: var(--rec); }
.primary:disabled { opacity: .4; cursor: default; }
.primary .k { font-weight: 400; opacity: .75; font-size: 11.5px; }
.ghost { height: 30px; padding: 0 11px; border-radius: 8px; border: 0; background: var(--tile); color: var(--text); display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.ghost:hover { background: var(--press); }
.ghost.danger { color: var(--danger); background: transparent; }
.ghost.danger:hover { background: rgba(255,77,79,.12); }
.recdot { width: 10px; height: 10px; border-radius: 50%; background: #fff; display: block; }
.summary { position: absolute; z-index: 30; display: flex; align-items: center; gap: 10px; transform: translateX(-50%); font-size: 11.5px; color: #fff; white-space: nowrap; pointer-events: none; }
.summary span { background: rgba(0,0,0,.6); padding: 3px 9px; border-radius: 999px; }
.summary kbd, .hint kbd { font: 11px ui-monospace, Menlo, monospace; background: rgba(255,255,255,.16); border-radius: 4px; padding: 0 4px; margin-right: 3px; }

/* ---------- Popovers ---------- */
.pop { position: absolute; background: var(--pop); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.45); padding: 12px 14px; z-index: 40;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
.pop h5 { margin: 0 0 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.pop .row { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 10px; min-height: 32px; }
.pop .row .k { color: var(--text2); font-size: 12px; }
.pop .note { font-size: 11.5px; color: var(--text3); margin-top: 8px; line-height: 1.5; }
.pop .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.pop hr { border: 0; border-top: 1px solid var(--border); margin: 8px 0; }
.select { height: 26px; border-radius: 7px; background: var(--tile); border: 0; padding: 0 9px; font-size: 12px; color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tog { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; color: var(--text2); white-space: nowrap; }
.tog i { width: 30px; height: 18px; border-radius: 999px; background: var(--tile); border: 1px solid var(--border); position: relative; display: block; }
.tog i::after { content: ""; position: absolute; top: 1px; left: 1px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .12s; }
.tog.on i { background: var(--accent); border-color: var(--accent); }
.tog.on i::after { left: 13px; }
.meter { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
.meter i { width: 3px; border-radius: 1px; background: var(--ok); display: block; transition: height .08s; }
.tip { position: absolute; background: rgba(0,0,0,.84); color: #fff; font-size: 11.5px; padding: 5px 9px; border-radius: 6px; white-space: nowrap; pointer-events: none; z-index: 50; transform: translateX(-50%); }

/* ---------- Camera bubble ---------- */
.cam { position: absolute; border-radius: 14px; overflow: hidden; z-index: 20; cursor: grab; box-shadow: 0 6px 20px rgba(0,0,0,.45), 0 0 0 2px rgba(255,255,255,.85);
  background: radial-gradient(circle at 50% 38%, #f2c9a8 0 17%, transparent 17.5%), radial-gradient(ellipse at 50% 105%, #3d5a80 0 42%, transparent 42.5%), linear-gradient(160deg, #6b7a8f, #2e3440); }
.cam.static { cursor: default; }
.cam .rz { position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px; cursor: nwse-resize; border-right: 3px solid #fff; border-bottom: 3px solid #fff; border-radius: 0 0 6px 0; opacity: .9; }
.cam .tag { position: absolute; left: 6px; top: 6px; font-size: 10px; background: rgba(0,0,0,.55); color: #fff; padding: 1px 6px; border-radius: 999px; display: flex; align-items: center; gap: 4px; }
.cam .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.snap { position: absolute; width: 28px; height: 28px; border: 2px dashed rgba(255,255,255,.6); border-radius: 8px; pointer-events: none; z-index: 19; }

/* ---------- Countdown ---------- */
.count { position: absolute; transform: translate(-50%,-50%); width: 132px; height: 132px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center; z-index: 30;
  font: 600 64px/1 -apple-system, BlinkMacSystemFont, sans-serif; }
.count svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.count circle.run { animation: ring 1s linear infinite; }
@keyframes ring { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 389; } }
.hint { position: absolute; transform: translateX(-50%); z-index: 30; background: rgba(0,0,0,.66); color: #fff; font-size: 12px; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }

/* ---------- Recording pill ---------- */
.pill2 { position: absolute; z-index: 30; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 14px; background: var(--glass); border: 1px solid var(--border);
  box-shadow: var(--shadow); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); white-space: nowrap; }
.live { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 8px; height: 30px; }
.live .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); animation: pulse 1.2s ease-in-out infinite; }
.live.paused .dot { background: var(--warn); animation: none; }
.live .time { font: 600 14px ui-monospace, "SF Mono", Menlo, monospace; min-width: 48px; }
.live.paused .time { animation: blink 1.2s steps(2) infinite; }
.live .lim { color: var(--text3); font-size: 12px; margin-left: -4px; }
.live .state { font-size: 12px; color: var(--warn); }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes blink { 50% { opacity: .35; } }
.gifbar { position: absolute; left: 10px; right: 10px; bottom: 2px; height: 2px; border-radius: 2px; background: var(--tile); overflow: hidden; }
.gifbar i { display: block; height: 100%; background: var(--accent); }
.gifbar.near i { background: var(--warn); }
.stop { height: 30px; padding: 0 12px 0 10px; border-radius: 9px; border: 0; background: var(--rec); color: #fff; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; cursor: pointer; }
.stop .sq { width: 10px; height: 10px; border-radius: 2px; background: #fff; }

/* ---------- Editor window ---------- */
.editor { position: absolute; left: 130px; top: 54px; width: 920px; height: 632px; border-radius: 12px; background: var(--win); z-index: 25; box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px var(--border);
  display: flex; flex-direction: column; overflow: hidden; color: var(--text); }
body.glass .editor { background: color-mix(in srgb, var(--win) 82%, transparent); backdrop-filter: blur(30px) saturate(1.6); }
.etb { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--border); flex: none; }
.etb .name { font-weight: 600; font-size: 13px; padding: 3px 6px; border-radius: 6px; outline: none; border: 1px solid transparent; }
.etb .name:hover { border-color: var(--border); }
.etb .name:focus { border-color: var(--accent); background: var(--tile); }
.etb .ext { color: var(--text3); font-size: 13px; margin-left: -8px; }
.etb .sp { flex: 1; }
.player { margin: 14px 16px 0; flex: 1 1 auto; min-height: 200px; border-radius: 10px; background: #0b0b0d; position: relative; overflow: hidden; display: grid; place-items: center; }
.frame { position: relative; overflow: hidden; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255,255,255,.06); }
.bigplay { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 56px; height: 56px; border-radius: 50%; background: rgba(0,0,0,.55); display: grid; place-items: center; cursor: pointer; color: #fff; backdrop-filter: blur(8px); }
.transport { display: flex; align-items: center; gap: 8px; padding: 8px 16px 0; flex: none; }
.transport .t { font: 12px ui-monospace, Menlo, monospace; color: var(--text2); }
.transport .sp { flex: 1; }
.transport .meta { font-size: 11.5px; color: var(--text3); }
.timeline { position: relative; margin: 8px 16px 0; height: 104px; flex: none; }
.ruler { position: absolute; left: 0; right: 0; top: 0; height: 16px; font: 10px ui-monospace, Menlo, monospace; color: var(--text3); }
.ruler span { position: absolute; transform: translateX(-50%); top: 0; }
.ruler span:first-child { transform: none; }
.ruler span:first-child::after { left: 0; }
.ruler span::after { content: ""; position: absolute; left: 50%; top: 13px; width: 1px; height: 4px; background: var(--text3); opacity: .6; }
.strip { position: absolute; left: 0; right: 0; top: 20px; height: 52px; border-radius: 7px; overflow: hidden; display: flex; background: #000; }
.strip .th { flex: 1; border-right: 1px solid rgba(0,0,0,.6); position: relative; overflow: hidden; }
.wave { position: absolute; left: 0; right: 0; top: 76px; height: 24px; border-radius: 6px; background: var(--tile); overflow: hidden; display: flex; align-items: center; gap: 1px; padding: 0 2px; }
.wave i { flex: 1; background: var(--accent); opacity: .55; border-radius: 1px; display: block; }
.wave .lbl { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 10.5px; color: var(--text2); background: var(--win); padding: 0 5px; border-radius: 4px; }
.wave.none { justify-content: center; font-size: 11px; color: var(--text3); }
.shade { position: absolute; top: 20px; bottom: 4px; background: rgba(0,0,0,.55); pointer-events: none; }
body.light .shade { background: rgba(240,242,246,.72); }
.sel { position: absolute; top: 18px; bottom: 2px; border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent); pointer-events: none; }
.th-handle { position: absolute; top: 18px; bottom: 2px; width: 12px; background: var(--accent); cursor: ew-resize; display: grid; place-items: center; z-index: 3; }
.th-handle.l { border-radius: 6px 0 0 6px; transform: translateX(-12px); }
.th-handle.r { border-radius: 0 6px 6px 0; }
.th-handle::after { content: ""; width: 2px; height: 18px; border-radius: 1px; background: rgba(255,255,255,.85); }
.playhead { position: absolute; top: 12px; bottom: 0; width: 2px; margin-left: -1px; background: #fff; z-index: 4; pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.playhead::before { content: ""; position: absolute; left: -5px; top: -2px; width: 12px; height: 12px; border-radius: 3px 3px 6px 6px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.timeline.locked { opacity: .5; pointer-events: none; }
.selinfo { display: flex; align-items: center; gap: 10px; padding: 8px 16px 0; font-size: 12px; color: var(--text2); flex: none; }
.selinfo b { color: var(--text); font-variant-numeric: tabular-nums; }
.selinfo .sp { flex: 1; }
.selinfo .keys { color: var(--text3); font-size: 11.5px; }

// ---------- Fixed desktop geometry (desk points) ----------

const WINDOWS = {

const S = {
  phase: 'setup', mode: 'region', format: 'mp4',
  sys: true, mic: true, cam: false, micDenied: false,
  camCorner: 'br', camSize: 0.22,
  quality: 1920, gifQuality: 960, fps: 30, countdown: 3, cursor: true,
  region: { x: 250, y: 118, w: 560, h: 340 }, win: 'a', hoverWin: null,

};
let timers = [];
const clearTimers = () => { timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = []; };

const target = () => S.mode === 'region' ? S.region : S.mode === 'window' ? WINDOWS[S.win] : DISPLAY;
const fmt = s => { s = Math.max(0, Math.floor(s)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };

const sec = s => `${s.toFixed(1)} 秒`;

const maxDim = () => isGif() ? S.gifQuality : S.quality;

}
function estimateMB(seconds) {
  const [w, h] = outSize(); const px = w * h / (1920 * 1080);

}
const micOn = () => S.mic && !S.micDenied;

function optionsPop() {

// ---------- Editor ----------
function miniFrame(w, h, t, i = 0) {
  // A scaled copy of the recorded area, with the pointer moving over time.
  const src = target(), sc = Math.min(w / src.w, h / src.h);
  const fw = Math.round(src.w * sc), fh = Math.round(src.h * sc);
  const cx = 0.25 + 0.5 * (0.5 + 0.5 * Math.sin(t * 0.7 + i)), cy = 0.3 + 0.4 * (0.5 + 0.5 * Math.cos(t * 0.5));
  const a = WINDOWS.a, b = WINDOWS.b;

      <div class="app" style="left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px">${appA()}</div>
      ${S.mode === 'window' && S.win === 'a' ? '' : `<div class="app" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px">${appB()}</div>`}</div></div>`;
  const cam = S.cam ? (() => { const r = camRect({ x: 0, y: 0, w: src.w, h: src.h }); return `<div class="cam static" style="left:${r.x * sc}px;top:${r.y * sc}px;width:${r.w * sc}px;height:${r.h * sc}px;border-radius:${14 * sc}px;box-shadow:0 0 0 ${Math.max(1, 2 * sc)}px rgba(255,255,255,.85)"></div>`; })() : '';
  const cur = S.cursor ? `<svg style="position:absolute;left:${cx * fw}px;top:${cy * fh}px;width:${Math.max(8, 18 * sc)}px;height:${Math.max(8, 18 * sc)}px" viewBox="0 0 20 20"><path d="M4 2.5v13.2l3.4-3.1 2.2 5 2.3-1-2.2-4.9h4.6L4 2.5Z" fill="#fff" stroke="#000" stroke-width="1.1"/></svg>` : '';
  return `<div class="frame" style="width:${fw}px;height:${fh}px">${inner}${cam}${cur}</div>`;
}
let WAVE = [];
for (let i = 0; i < 150; i++) WAVE.push(0.15 + 0.85 * Math.abs(Math.sin(i * 0.37) * Math.cos(i * 0.11 + 1) * (0.6 + 0.4 * Math.sin(i * 1.7))));

  return `<div class="layer" style="background:rgba(0,0,0,.18)"><div class="editor" id="editor">

    <div style="font-size:12px;color:var(--text2)">还没保存，丢弃后无法恢复。</div><div class="acts"><button class="ghost" data-act="closepop">保留</button><button class="primary" style="background:var(--danger)" data-act="discardNow">丢弃</button></div></div>` : ''}</div>`;

// ---------- Render ----------
function render() {
  let html = desktop();
  if (S.screen === 'compare') html += `<div class="layer" style="background:var(--dim)"></div>` + compareLayer();
  else if (S.phase === 'setup' && !S.cancelled) html += setupLayer();
  else if (S.phase === 'countdown') html += countdownLayer();
  else if (S.phase === 'recording') html += recordingLayer();
  else if (S.phase === 'editor' || S.phase === 'export') html += editorLayer();
  if (S.cancelled) html += `<div class="hint" style="left:50%;top:330px">已取消。点上方「区域」重新开始。</div>`;
  html += toastLayer();
  if (S.phase === 'setup' && !S.cancelled && S.screen !== 'compare') html += CURSOR.replace('class="cursor"', `class="cursor" style="left:${S.mouse.x}px;top:${S.mouse.y}px;display:none"`);
  desk.innerHTML = html;
  if (S.tip) showTip(S.tip.el, S.tip.text);
}

// ---------- Tooltips ----------
function showTip(sel, text) {
  const el = typeof sel === 'string' ? desk.querySelector(sel) : sel;
  if (!el || !desk.contains(el)) return;
  const d = desk.getBoundingClientRect(), r = el.getBoundingClientRect();
  const tip = document.createElement('div');
  tip.className = 'tip'; tip.textContent = text;
  const above = r.top - d.top > 60;
  tip.style.left = (r.left - d.left + r.width / 2) + 'px';
  tip.style.top = above ? (r.top - d.top - 30) + 'px' : (r.bottom - d.top + 8) + 'px';
  desk.appendChild(tip);
}
desk.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]');
  desk.querySelectorAll('.tip').forEach(t => t.remove());
  if (el && !drag) showTip(el, el.dataset.tip);
});

// ---------- Flow ----------
function startCountdown() {
  clearTimers(); S.pop = null; S.tip = null;
  if (!S.countdown) return startRecording();
  S.phase = 'countdown'; S.cd = S.countdown; render();
  timers.push(setInterval(() => { S.cd--; if (S.cd <= 0) startRecording(); else render(); }, 1000));
}
function startRecording(at = 0) {
  clearTimers(); S.phase = 'recording'; S.elapsed = at; S.paused = false; S.pop = null; render();
  timers.push(setInterval(() => {
    if (S.paused || S.pop) return;
    S.elapsed++;
    if (isGif() && S.elapsed >= 30) return stopRecording();
    render();
  }, 1000));
  timers.push(setInterval(animateMeter, 110));
}
function stopRecording() {
  clearTimers();
  S.dur = Math.round((Math.max(isGif() ? Math.min(S.elapsed, 30) : S.elapsed, 2) + 0.4) * 10) / 10;
  S.a = 0; S.b = S.dur; S.head = 0; S.playing = false; S.phase = 'editor'; S.pop = null; render();
}
function animateMeter() {
  const m = desk.querySelector('#meter'); if (!m) return;
  const lvl = 0.25 + Math.random() * 0.75;
  m.querySelectorAll('i').forEach((i, k) => { const on = lvl > k / 4; i.style.height = (on ? 4 + k * 3 : 3) + 'px'; i.style.opacity = on ? 1 : .3; i.style.background = k === 3 && on ? 'var(--warn)' : 'var(--ok)'; });
}
function togglePlay() {
  S.playing = !S.playing;
  clearTimers();
  if (S.playing) {
    if (S.head < S.a || S.head >= S.b - 0.05) S.head = S.a;
    timers.push(setInterval(() => { S.head += 0.1; if (S.head >= S.b) { S.head = S.b; S.playing = false; clearTimers(); } render(); }, 100));
  }
  render();
}
function exportNow() {
  clearTimers(); S.playing = false; S.phase = 'export'; S.pct = 0; render();
  timers.push(setInterval(() => { S.pct += 7 + Math.random() * 6; if (S.pct >= 100) { clearTimers(); S.phase = 'done'; S.toast = 'saved'; render(); } else render(); }, 160));
}

const ACTIONS = {
  sys: () => { if (!isGif()) S.sys = !S.sys; },
  mic: () => { if (isGif()) return; if (S.micDenied) { S.pop = S.pop === 'perm' ? null : 'perm'; return; } S.mic = !S.mic; },
  cam: () => { S.cam = !S.cam; },
  options: () => { S.pop = S.pop === 'options' ? null : 'options'; },
  cursor: () => { S.cursor = !S.cursor; },
  cancel: () => { clearTimers(); S.cancelled = true; S.pop = null; },
  start: () => startCountdown(),
  micOffNow: () => { S.mic = false; S.micDenied = false; S.pop = null; },
  grantMic: () => { S.micDenied = false; S.mic = true; S.pop = null; },
  pause: () => { S.paused = !S.paused; S.pop = null; },
  restart: () => { S.pop = S.pop === 'restart' ? null : 'restart'; },
  restartNow: () => startCountdown(),
  discard: () => { S.pop = S.pop === 'discard' ? null : 'discard'; },
  discardNow: () => { clearTimers(); S.pop = null; S.phase = 'setup'; S.cancelled = true; },
  closepop: () => { S.pop = null; },
  stop: () => stopRecording(),
  play: () => togglePlay(),
  resetTrim: () => { S.a = 0; S.b = S.dur; },
  fit30: () => { S.b = Math.min(S.dur, S.a + 30); S.head = Math.min(Math.max(S.head, S.a), S.b); },
  tomp4: () => { S.format = 'mp4'; },
  save: () => exportNow(),
  saveAs: () => exportNow(),
  copyFile: () => { S.toast = null; exportNow(); },
  cancelExport: () => { clearTimers(); S.phase = 'editor'; },
  discardEditor: () => { S.pop = S.pop === 'discardEditor' ? null : 'discardEditor'; },
  toastClose: () => { S.toast = null; S.cancelled = S.phase !== 'editor'; },
  openRecovered: () => { S.toast = null; S.dur = 42.4; S.a = 0; S.b = 42.4; S.head = 0; S.phase = 'editor'; },
};
desk.addEventListener('click', e => {
  const t = e.target;
  const goto = t.closest('[data-goto]'); if (goto) return show(goto.dataset.goto);
  const mode = t.closest('[data-mode]'); if (mode) { S.mode = mode.dataset.mode; S.pop = null; S.hoverWin = null; return render(); }
  const f = t.closest('[data-fmt]');
  if (f) { S.format = f.dataset.fmt; if (S.phase === 'editor' && isGif() && S.b - S.a > 30) {} return render(); }
  const q = t.closest('[data-q]'); if (q) { if (isGif()) S.gifQuality = +q.dataset.q; else S.quality = +q.dataset.q; return render(); }
  const fp = t.closest('[data-fps]'); if (fp) { S.fps = +fp.dataset.fps; return render(); }
  const cd = t.closest('[data-cd]'); if (cd) { S.countdown = +cd.dataset.cd; return render(); }
  const a = t.closest('[data-act]');
  if (a && ACTIONS[a.dataset.act]) { ACTIONS[a.dataset.act](); desk.querySelectorAll('.tip').forEach(x => x.remove()); return render(); }
  // A click on a window in window mode selects it; on the display in display mode keeps it.
  if (S.phase === 'setup' && S.mode === 'window' && t.closest('#pick') && !t.closest('.bar,.pop,.cam')) {
    const w = winAt(pt(e)); if (w) { S.win = w; S.hoverWin = null; render(); }
  }
  if (S.pop && !t.closest('.pop,.bar,.pill2') && S.phase === 'setup') { S.pop = null; render(); }
});

// ---------- Pointer: region drawing, window hover, camera drag, trim ----------
let drag = null;
const pt = e => { const r = desk.getBoundingClientRect(); return { x: Math.round(e.clientX - r.left), y: Math.round(e.clientY - r.top) }; };
const winAt = p => ['b', 'a'].find(k => { const w = WINDOWS[k]; return p.x >= w.x && p.x <= w.x + w.w && p.y >= w.y && p.y <= w.y + w.h; }) || null;
const clampRegion = r => {
  const x1 = Math.max(0, Math.min(r.x, r.x + r.w)), y1 = Math.max(26, Math.min(r.y, r.y + r.h));
  const x2 = Math.min(DESK.w, Math.max(r.x, r.x + r.w)), y2 = Math.min(DESK.h, Math.max(r.y, r.y + r.h));
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
};
desk.addEventListener('mousedown', e => {
  const p = pt(e), t = e.target;
  if (S.phase === 'setup' && !S.cancelled && S.screen !== 'compare') {
    if (t.closest('.bar,.pop,.summary')) return;
    if (t.id === 'camrz') { drag = { kind: 'camsize', p, size: S.camSize }; e.preventDefault(); return; }
    if (t.closest('#cam')) { drag = { kind: 'cam', p }; e.preventDefault(); return; }
    if (S.pop) return;
    if (S.mode !== 'region') return;
    const h = t.closest('[data-h]'), r = S.region;
    if (h) { const [u, v] = h.dataset.h.split(',').map(Number); drag = { kind: 'resize', u, v, start: { ...r } }; }
    else if (p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h) drag = { kind: 'move', p, start: { ...r } };
    else { drag = { kind: 'new', p }; S.region = { x: p.x, y: p.y, w: 0, h: 0 }; }
    e.preventDefault(); return;
  }
  if ((S.phase === 'editor') && t.closest('#tl')) {
    const tl = desk.querySelector('#tl').getBoundingClientRect();
    const toT = ev => Math.max(0, Math.min(S.dur, (ev.clientX - tl.left) / tl.width * S.dur));
    const h = t.closest('[data-drag]');
    drag = { kind: h ? 'trim-' + h.dataset.drag : 'scrub', toT };
    if (!h) { S.head = Math.min(Math.max(toT(e), S.a), S.b); render(); }
    e.preventDefault();
  }
});
window.addEventListener('mousemove', e => {
  const p = pt(e);
  if (!drag) {
    if (S.phase === 'setup' && S.mode === 'window' && !S.pop && S.screen !== 'compare') {
      if (e.target.closest && e.target.closest('.bar,.summary')) return;
      const w = winAt(p); if (w !== S.hoverWin) { S.hoverWin = w; render(); }
    }
    return;
  }
  const d = drag;
  if (d.kind === 'new') S.region = clampRegion({ x: d.p.x, y: d.p.y, w: p.x - d.p.x, h: p.y - d.p.y });
  else if (d.kind === 'move') {
    const s = d.start; S.region = { ...s, x: Math.max(0, Math.min(DESK.w - s.w, s.x + p.x - d.p.x)), y: Math.max(26, Math.min(DESK.h - s.h, s.y + p.y - d.p.y)) };
  } else if (d.kind === 'resize') {
    const s = d.start; let x1 = s.x, y1 = s.y, x2 = s.x + s.w, y2 = s.y + s.h;
    if (d.u === 0) x1 = p.x; if (d.u === 1) x2 = p.x; if (d.v === 0) y1 = p.y; if (d.v === 1) y2 = p.y;
    S.region = clampRegion({ x: x1, y: y1, w: x2 - x1, h: y2 - y1 });
  } else if (d.kind === 'cam') {
    const t = target(); S.camCorner = (p.y > t.y + t.h / 2 ? 'b' : 't') + (p.x > t.x + t.w / 2 ? 'r' : 'l');
  } else if (d.kind === 'camsize') {
    S.camSize = Math.max(0.12, Math.min(0.4, d.size + (p.x - d.p.x) / 900));
  } else if (d.kind === 'trim-a') { S.a = Math.min(d.toT(e), S.b - 0.5); S.head = Math.max(S.head, S.a); }
  else if (d.kind === 'trim-b') { S.b = Math.max(d.toT(e), S.a + 0.5); S.head = Math.min(S.head, S.b); }
  else if (d.kind === 'scrub') S.head = Math.min(Math.max(d.toT(e), S.a), S.b);
  render();
});
window.addEventListener('mouseup', () => { if (drag) { drag = null; render(); } });

// ---------- Keyboard ----------
window.addEventListener('keydown', e => {
  if (e.target.isContentEditable) { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } return; }
  if (S.phase === 'setup' && !S.cancelled) {
    if (e.key === 'Enter') { e.preventDefault(); startCountdown(); }
    if (e.key === 'Escape') { if (S.pop) S.pop = null; else ACTIONS.cancel(); render(); }
    if (e.key === 'Tab') { e.preventDefault(); const m = ['region', 'window', 'display']; S.mode = m[(m.indexOf(S.mode) + 1) % 3]; render(); }
  } else if (S.phase === 'countdown') {
    if (e.key === 'Escape') { clearTimers(); S.phase = 'setup'; render(); }
    if (e.key === ' ') { e.preventDefault(); startRecording(); }
  } else if (S.phase === 'editor') {
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    if (e.key === 'i' || e.key === 'I') { S.a = Math.min(S.head, S.b - 0.5); render(); }
    if (e.key === 'o' || e.key === 'O') { S.b = Math.max(S.head, S.a + 0.5); render(); }
    if (e.key === 's' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); exportNow(); }
  }
});

// ---------- Screens ----------
const CAPTIONS = {
  compare: '<b>现状 vs 方案</b>：问题不在功能缺失，而在「先填表、再操作」的交互模型。改版把录屏放回屏幕上，和截图共用一套浮层语言。点下面的流程卡片跳到对应画面。',
  region: '<b>区域</b>：和截图一样直接在屏幕上拖。可拖动选区、拖 8 个把手改大小、在外面重新拖一个。工具条固定在屏幕底部中间（可拖走），开始后自动隐藏，不会被录进去；下方一行写明最终会得到什么。<b>↩</b> 开始，<b>esc</b> 取消，<b>⇥</b> 切换来源。',
  window: '<b>窗口</b>：鼠标移到哪个窗口，哪个窗口高亮并显示应用名和尺寸，点一下选中。录的是窗口本身：它被遮挡、移动时仍然录得到。试试把鼠标在两个窗口之间移动。',
  display: '<b>全屏</b>：整块屏幕高亮。多显示器时，每块屏幕各自高亮，点哪块录哪块，不用在下拉框里认 “Display 1 / 2”。',
  options: '<b>选项</b>：低频设置收进一个弹层：画质（只缩小不放大）、帧率、倒计时、鼠标指针、保存位置。GIF 模式下画质只给「小 / 标准」，帧率固定 10。',
  camera: '<b>摄像头</b>：打开开关，选区里立刻出现实时画面（此时才请求摄像头权限）。拖动画面到任意一侧，松手吸附到最近的角；拖右下角改大小（12%–40%）。',
  gif: '<b>GIF</b>：切到 GIF，声音按钮直接变灰（悬停说明原因），下方摘要写明「10 FPS · 无声 · 最长 30 秒」。不再需要一段长说明文字。',
  perm: '<b>缺权限</b>：麦克风按钮带黄点，点开说明去哪里开、开了以后不用重来；也可以一键「这次不录麦克风」。权限问题在开始之前就解决，而不是点开始后弹错误。',
  countdown: '<b>倒计时</b>：选区中央 3-2-1，空格立即开始、esc 回到准备。工具条已经消失。',
  recording: '<b>录制中</b>：录制范围只画四角红框，不压暗、不挡操作。控制收成一枚胶囊，放在录制范围外（贴不下时放进内侧底部，且不会被录进去）：计时、麦克风电平、暂停、重来、丢弃、停止。菜单栏同步显示计时，点一下就停止。',
  paused: '<b>已暂停</b>：红点变黄、计时闪烁、边框变成虚线，一眼就知道「现在没在录」。暂停的时间不会出现在文件里。',
  giflimit: '<b>GIF 将满</b>：GIF 计时显示「/ 00:30」和进度条，最后 5 秒变黄并提示，到 30 秒自动停止进入剪辑。',
  discard: '<b>丢弃确认</b>：危险操作只做一次轻量确认，默认按钮是「继续录制」。录制计时在确认期间暂停显示。',
  editor: '<b>剪辑</b>：一个窗口完成预览、剪辑、导出。时间轴是缩略图 + 声音波形，拖两端蓝色把手剪掉头尾，点击 / 拖动定位播放头，<b>I / O</b> 设起止、<b>空格</b> 播放。标题里的文件名可以直接改；底部写明尺寸、帧率和预计大小。',
  gifeditor: '<b>GIF 超长</b>：在 MP4 录制里改存 GIF，选段超过 30 秒时，保存按钮置灰，同时给出两个可以直接点的解决办法，而不是只报错。',
  export: '<b>保存中</b>：保存按钮原位变成进度条，可以取消；时间轴锁定。',
  saved: '<b>已保存</b>：剪辑窗口关闭，右下角弹出和截图同款的 Toast：缩略图可以直接拖进聊天 / 邮件，旁边是在 Finder 中显示、复制、打开。',
  recover: '<b>恢复</b>：Typeflux 退出时还没保存的录制，下次启动用同一个 Toast 提示，一键打开剪辑或丢弃。',
};
function reset() {
  clearTimers();
  Object.assign(S, { phase: 'setup', mode: 'region', format: 'mp4', sys: true, mic: true, cam: false, micDenied: false, camCorner: 'br', camSize: 0.22,
    quality: 1920, gifQuality: 960, fps: 30, countdown: 3, cursor: true, region: { x: 250, y: 118, w: 560, h: 340 }, win: 'a', hoverWin: null,
    pop: null, tip: null, cd: 3, elapsed: 0, paused: false, dur: 12.4, a: 0, b: 12.4, head: 0, playing: false, pct: 0, toast: null, cancelled: false });
}
function show(id) {
  reset(); S.screen = id;
  const setups = {
    region: () => {}, window: () => { S.mode = 'window'; S.hoverWin = 'b'; }, display: () => { S.mode = 'display'; },
    options: () => { S.pop = 'options'; }, camera: () => { S.cam = true; },
    gif: () => { S.format = 'gif'; S.tip = { el: '[data-act="mic"]', text: 'GIF 不含声音' }; },
    perm: () => { S.micDenied = true; S.pop = 'perm'; },
  };
  if (setups[id]) setups[id]();
  if (id === 'countdown') { S.cam = true; render(); startCountdown(); }
  else if (id === 'recording') { S.cam = true; startRecording(8); }
  else if (id === 'paused') { S.cam = true; startRecording(23); S.paused = true; }
  else if (id === 'giflimit') { S.format = 'gif'; S.mode = 'window'; S.win = 'b'; startRecording(26); }
  else if (id === 'discard') { startRecording(14); S.pop = 'discard'; }
  else if (id === 'editor') { S.cam = true; S.dur = 18.6; S.a = 1.8; S.b = 15.2; S.head = 6.4; S.phase = 'editor'; }
  else if (id === 'gifeditor') { S.format = 'gif'; S.dur = 48.2; S.a = 4; S.b = 46; S.head = 12; S.phase = 'editor'; }
  else if (id === 'export') { S.cam = true; S.dur = 18.6; S.a = 1.8; S.b = 15.2; S.head = 1.8; S.phase = 'export'; S.pct = 46; }
  else if (id === 'saved') { S.dur = 18.6; S.a = 1.8; S.b = 15.2; S.phase = 'done'; S.toast = 'saved'; }
  else if (id === 'recover') { S.phase = 'done'; S.toast = 'recover'; }
  if (S.phase === 'setup' && id !== 'compare') S.screen = 'setup';
  if (id === 'compare') S.screen = 'compare';
  document.querySelectorAll('.pill[data-screen]').forEach(p => p.classList.toggle('on', p.dataset.screen === id));
  $('#caption').innerHTML = CAPTIONS[id] || '';
  history.replaceState(null, '', '?' + new URLSearchParams({ ...Object.fromEntries(new URLSearchParams(location.search)), s: id }));
  render();
  if (S.tip) S.tip = null; // only for the first paint
}
document.querySelectorAll('.pill[data-screen]').forEach(p => p.addEventListener('click', () => show(p.dataset.screen)));
$('#themeToggle').addEventListener('click', e => { document.body.classList.toggle('light'); e.target.classList.toggle('on'); render(); });
$('#glassToggle').addEventListener('click', e => { document.body.classList.toggle('glass'); e.target.classList.toggle('on'); render(); });

const params = new URLSearchParams(location.search);
if (params.get('light') === '1') { document.body.classList.add('light'); $('#themeToggle').classList.add('on'); }
if (params.get('glass') === '1') { document.body.classList.add('glass'); $('#glassToggle').classList.add('on'); }
if (params.get('solo')) document.body.classList.add('solo');
show(params.get('solo') || params.get('s') || 'compare');
</script>
</body>
</html>
