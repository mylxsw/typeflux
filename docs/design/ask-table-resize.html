<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typeflux · 对话表格</title>
<style>
:root{color-scheme:dark;--ink:#eeeeef;--sub:#a9a9ae;--rule:#37373c;--blue:#70b1fc;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:0 auto}nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:12px 0 14px}button{font:inherit;color:inherit;cursor:pointer}nav button{border:0;background:transparent;color:#95959c;border-radius:7px;padding:6px 11px}nav button[aria-pressed=true]{background:#323239;color:#f6f6f7}nav button:hover{background:#28282d}.scene{background:#19191c;color:var(--ink);border:1px solid #38383e;border-radius:14px;overflow:hidden}.bar{display:flex;align-items:center;gap:7px;height:39px;padding:0 16px;border-bottom:1px solid #303036;background:#202024}.dot{width:9px;height:9px;border-radius:50%;background:#ff6059}.dot:nth-child(2){background:#febc2e}.dot:nth-child(3){background:#29c840}.bar span{margin:auto;font-size:12px;color:var(--sub);transform:translateX(-20px)}.body{padding:24px clamp(12px,4%,32px) 28px}.prompt{margin:0 0 27px auto;width:fit-content;padding:8px 14px;border-radius:15px;background:#232c38;color:#d3dce7;font-size:13px}.intro{margin:0 0 20px;color:#d2d2d6}.titlebar{display:flex;align-items:center;justify-content:space-between;min-height:36px;gap:8px;padding-bottom:5px}h3{font-size:16px;margin:0;font-weight:650}h3 small{font-weight:450;font-size:13px;color:var(--sub);margin-left:5px}.actions,.zoom{display:flex;align-items:center;gap:3px}.actions{opacity:0;transition:opacity .14s;pointer-events:none}.unit:hover .actions,.unit:focus-within .actions,.hovered .actions,.expanded .actions{opacity:1;pointer-events:auto}.dragging .actions{opacity:0}.cmd,.zoom button{display:inline-flex;align-items:center;gap:5px;background:transparent;color:#bbbcc3;border:0;border-radius:5px;padding:6px;font-size:12px}.cmd:hover,.zoom button:hover{background:#35353b;color:white}.cmd svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.frame{position:relative;border:1px solid var(--rule);border-radius:8px;overflow:hidden}.scroll{overflow:auto}.sheet{position:relative;--split:78%;--size:13px}.head,.row{display:grid;grid-template-columns:var(--split) minmax(0,1fr);align-items:stretch}.head{background:#242429;color:#b9b9bf;font-size:12px;font-weight:550}.head span,.row span{padding:9px 14px}.head span:last-child,.row span:last-child{text-align:right}.row{font-size:var(--size);border-top:1px solid #303035;line-height:1.45}.row span:first-child{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.row span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:#c4c4ca}.handle{position:absolute;left:var(--split);top:0;width:14px;height:33px;transform:translateX(-50%);touch-action:none;cursor:col-resize;z-index:2}.handle:before{content:"";display:block;background:#53535a;width:1px;height:15px;margin:9px auto}.handle:hover:before,.handle:focus-visible:before,.dragging .handle:before{background:var(--blue);width:3px;border-radius:4px}.dragging .sheet:after{content:"";position:absolute;top:0;bottom:0;left:var(--split);width:1px;background:var(--blue);pointer-events:none}.dragging{user-select:none}.widthlabel{display:none;position:absolute;right:15px;top:7px;background:#304258;border:1px solid #54677f;padding:2px 5px;border-radius:4px;color:#daeaff;white-space:nowrap;font:10px ui-monospace,monospace}.dragging .widthlabel{display:block}.zoom{display:none;color:var(--sub);font-size:12px}.expanded .zoom{display:flex}.expanded .bar,.expanded .intro,.expanded .prompt{display:none}.expanded .body{padding:24px 16px}.expanded{background:#101012}.expanded .unit{max-width:980px;margin:auto;background:#202024;border:1px solid #39393e;border-radius:12px;padding:14px}.expanded .titlebar{padding-bottom:12px}.expanded .cmd.expand{display:none}.expanded h3 small{display:none}.hint{color:#a2a2aa;font-size:12px;line-height:1.6;margin:10px 0}.zoom output{min-width:34px;text-align:center}button:focus-visible,.handle:focus-visible{outline:2px solid var(--blue)}@media(max-width:460px){.cmd b{display:none}.prompt{font-size:12px}.body{padding:16px 12px}.row span,.head span{padding:9px}.intro{font-size:13px}.expanded h3{font-size:14px}}
</style>
<main><nav aria-label="设计稿状态"><button data-mode="read">阅读</button><button data-mode="hover">悬停</button><button data-mode="drag">拖动</button><button data-mode="expand">展开</button></nav>
<section class="scene"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>Typeflux · 对话</span></div><div class="body"><p class="prompt">这个目录下有一些 dmg 安装包，帮我列出来</p><p class="intro">下载文件夹中共有 <strong>16 个 .dmg 安装包</strong>，按归属分组如下：</p>
<div class="unit"><div class="titlebar"><h3>Typeflux 相关 <small>（10 个）</small></h3><div class="actions"><button class="cmd copy" title="复制表格"><svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="9" rx="1.5"/><path d="M10.5 4V2.8a1 1 0 0 0-1-1H3.2a1 1 0 0 0-1 1v7.1a1 1 0 0 0 1 1H4"/></svg><b>复制</b></button><button class="cmd expand" title="展开表格"><svg viewBox="0 0 16 16"><path d="M9 2h5v5m0-5-5.5 5.5M7 14H2V9m0 5 5.5-5.5"/></svg><b>展开</b></button><div class="zoom"><button id="minus" aria-label="缩小">−</button><output>100%</output><button id="plus" aria-label="放大">＋</button><button id="close" aria-label="关闭展开视图">✕</button></div></div></div>
<div class="frame"><div class="scroll"><div class="sheet" role="table" aria-label="安装包"><div class="head" role="row"><span role="columnheader">文件名</span><span role="columnheader">大小</span></div><div class="handle" role="separator" aria-orientation="vertical" aria-label="调整文件名列宽" tabindex="0" title="拖动调宽，双击恢复自动列宽"><div class="widthlabel"></div></div></div></div></div></div></div></section><p class="hint">拖动「文件名」和「大小」之间的分隔线，双击恢复自动列宽。</p></main>
<script>
const $=s=>document.querySelector(s), scene=$('.scene'), sheet=$('.sheet'), handle=$('.handle');
const names=['hotfix-38d120af','test-107b7553','test-1d62cd7b','test-439a14a2','test-4ec0839a','test-61d058a4','test-8dd41355'].map(x=>'Typeflux-1.0.0-'+x+'-apple-silicon.dmg');
for(const name of names){const row=document.createElement('div');row.className='row';row.setAttribute('role','row');row.innerHTML='<span role="cell">'+name+'</span><span role="cell">约 97 MB</span>';sheet.append(row)}
let ratio=null,zoom=100,mode='hover',moving=false;
function layout(){const w=sheet.clientWidth;const px=Math.round(Math.max(110,Math.min(w-82,(ratio===null?w-Math.min(126,Math.max(86,w*.19)):w*ratio))));sheet.style.setProperty('--split',px+'px');handle.setAttribute('aria-valuenow',Math.round(100*px/w));$('.widthlabel').textContent=px+' pt';}
function setMode(next){mode=next;scene.classList.toggle('expanded',next==='expand');scene.classList.toggle('hovered',next==='hover');scene.classList.toggle('dragging',next==='drag');document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===next)));sheet.style.setProperty('--size',(next==='expand'?13*zoom/100:13)+'px');layout()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('.expand').onclick=()=>setMode('expand');$('#close').onclick=()=>setMode('hover');document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mode==='expand')setMode('hover')});
function zoomBy(d){zoom=Math.min(180,Math.max(80,zoom+d));$('output').textContent=zoom+'%';setMode('expand')}
$('#plus').onclick=()=>zoomBy(10);$('#minus').onclick=()=>zoomBy(-10);
handle.onpointerdown=e=>{moving=true;handle.setPointerCapture(e.pointerId);scene.classList.add('dragging');e.preventDefault()};
handle.onpointermove=e=>{if(!moving)return;const r=sheet.getBoundingClientRect();ratio=Math.max(110/r.width,Math.min(1-82/r.width,(e.clientX-r.left)/r.width));layout()};
handle.onlostpointercapture=()=>{moving=false;setMode(mode==='drag'?'hover':mode)};
handle.ondblclick=()=>{ratio=null;layout()};
handle.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home'].includes(e.key))return;e.preventDefault();ratio=e.key==='Home'?null:(handle.offsetLeft+(e.key==='ArrowRight'?8:-8))/sheet.clientWidth;layout()};
$('.copy').onclick=async()=>{const data=['文件名\t大小',...names.map(n=>n+'\t约 97 MB')].join('\n');let copied=false;try{await navigator.clipboard.writeText(data);copied=true}catch{const t=document.createElement('textarea');t.value=data;document.body.append(t);t.select();copied=document.execCommand('copy');t.remove()}const b=$('.copy b');b.textContent=copied?'已复制':'复制失败';setTimeout(()=>b.textContent='复制',1200)};
new ResizeObserver(layout).observe(sheet);setMode('hover');
</script></html>
