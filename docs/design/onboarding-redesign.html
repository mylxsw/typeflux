<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Typeflux · Onboarding 重构 设计稿</title>
<style>
  :root {
    --font: -apple-system, "SF Pro Text", Inter, "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", "WenQuanYi Zen Hei", "Helvetica Neue", sans-serif;
  }
  /* ===== theme tokens (mirror StudioTheme) ===== */
  .t-light {
    --wall: radial-gradient(1200px 700px at 18% 0%, #c9d8f5 0%, transparent 60%), radial-gradient(900px 700px at 100% 100%, #e9d6f2 0%, transparent 55%), #dfe4ee;
    --menubar: rgba(246,246,248,.72); --menubar-text: #1d1d1f;
    --win: #f7f7f9; --win-grad: radial-gradient(520px 320px at 100% 0%, rgba(37,99,235,.09), transparent 70%);
    --card: #ffffff; --card-2: #f2f3f6; --well: #eceef2;
    --text: #1d1d1f; --text-2: #5f6168; --text-3: #9a9ca3;
    --hair: rgba(0,0,0,.08); --hair-2: rgba(0,0,0,.14);
    --accent: #2563eb; --accent-soft: rgba(37,99,235,.10); --accent-line: rgba(37,99,235,.38); --accent-text: #1d4fd7;
    --ok: #16a34a; --ok-soft: rgba(22,163,74,.10); --warn: #c2410c; --warn-soft: rgba(234,88,12,.10); --warn-line: rgba(234,88,12,.32);
    --shadow: 0 30px 80px rgba(20,30,60,.22), 0 4px 14px rgba(20,30,60,.10);
    --card-shadow: 0 1px 2px rgba(0,0,0,.05);
    --key-top: #ffffff; --key-bot: #e7e8ec; --key-edge: #c9cbd2; --key-text: #2b2c30;
    --chip: rgba(0,0,0,.05);
  }
  .t-dark {
    --wall: radial-gradient(1200px 700px at 18% 0%, #23324f 0%, transparent 60%), radial-gradient(900px 700px at 100% 100%, #3a2546 0%, transparent 55%), #121318;
    --menubar: rgba(30,30,34,.72); --menubar-text: #ececee;
    --win: #1c1c1f; --win-grad: radial-gradient(520px 320px at 100% 0%, rgba(23,140,255,.14), transparent 70%);
    --card: #26262a; --card-2: #2d2d32; --well: #19191c;
    --text: #f2f2f4; --text-2: #a7a8ae; --text-3: #6f7077;
    --hair: rgba(255,255,255,.08); --hair-2: rgba(255,255,255,.15);
    --accent: #178cff; --accent-soft: rgba(23,140,255,.16); --accent-line: rgba(23,140,255,.5); --accent-text: #78b8ff;
    --ok: #32d17a; --ok-soft: rgba(50,209,122,.14); --warn: #ffa057; --warn-soft: rgba(255,160,87,.12); --warn-line: rgba(255,160,87,.35);
    --shadow: 0 30px 80px rgba(0,0,0,.6), 0 4px 14px rgba(0,0,0,.35);
    --card-shadow: 0 1px 0 rgba(255,255,255,.04) inset;
    --key-top: #3a3a40; --key-bot: #2c2c31; --key-edge: #18181b; --key-text: #f0f0f2;
    --chip: rgba(255,255,255,.07);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 13px/1.45 var(--font); background: #0d0d10; color: #e8e8ea; -webkit-font-smoothing: antialiased; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ===== tool bar (not part of the design) ===== */
  .tb { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 24px; background: rgba(13,13,16,.92); border-bottom: 1px solid #222; backdrop-filter: blur(10px); }
  .tb h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 650; }
  .pill { display: inline-flex; background: #1f1f24; border: 1px solid #2c2c33; border-radius: 9px; padding: 2px; }
  .pill button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 7px; color: #a5a6ad; font-size: 12px; }
  .pill button.on { background: #3a3a44; color: #fff; }
  select.scr { background: #1f1f24; color: #ddd; border: 1px solid #2c2c33; border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 12px; }
  .tb .hint { color: #7d7e86; font-size: 12px; }
  .proto { padding: 28px 24px 40px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .caption { color: #9fa0a7; font-size: 12.5px; max-width: 1280px; width: 1280px; }
  .caption b { color: #eee; }
  .board { display: none; grid-template-columns: repeat(2, 640px); gap: 26px 28px; padding: 28px 24px 60px; justify-content: center; }
  .board .cell { width: 640px; }
  .board .lbl { color: #b9bac0; font-size: 12px; margin: 0 0 8px; } .board .lbl b { color: #fff; margin-right: 6px; }
  .board .thumb { width: 640px; height: 400px; overflow: hidden; border-radius: 10px; border: 1px solid #26262c; cursor: pointer; }
  .board .thumb .desk { transform: scale(.5); transform-origin: 0 0; }
  body.view-board .board { display: grid; } body.view-board .proto { display: none; }
  body.bare .tb, body.bare .caption { display: none; } body.bare .proto { padding: 0; }
  body.bare { background: transparent; }

  /* ===== desk / wallpaper ===== */
  .desk { position: relative; width: 1280px; height: 800px; overflow: hidden; background: var(--wall); color: var(--text); border-radius: 10px; font: 13px/1.45 var(--font); }
  body.bare .desk { border-radius: 0; }
  .menubar { position: absolute; inset: 0 0 auto 0; height: 26px; background: var(--menubar); backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 14px; gap: 18px; font-size: 13px; color: var(--menubar-text); z-index: 5; }
  .menubar .apple { font-size: 14px; } .menubar b { font-weight: 650; }
  .menubar .right { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 12.5px; }
  .mb-tf { width: 22px; height: 18px; display: inline-flex; align-items: center; justify-content: center; border-radius: 5px; position: relative; }
  .mb-tf.hl { background: rgba(127,127,127,.25); }
  .mb-tf .dot { position: absolute; right: 0; top: 1px; width: 6px; height: 6px; border-radius: 50%; background: #ff9f0a; }

  /* ===== onboarding window ===== */
  .win { position: absolute; left: 200px; top: 74px; width: 880px; height: 640px; border-radius: 14px; background: var(--win-grad), var(--win); box-shadow: var(--shadow); border: 1px solid var(--hair-2); overflow: hidden; display: flex; flex-direction: column; }
  .win.dim { filter: saturate(.9); }
  .titlebar { height: 52px; flex: none; display: flex; align-items: center; padding: 0 18px; position: relative; }
  .lights { display: flex; gap: 8px; } .lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #d9d9dc; }
  .t-dark .lights i:nth-child(3) { background: #48484c; }
  .stepper { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); }
  .stepper .st { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 4px; border-radius: 99px; }
  .stepper .n { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 650; background: var(--chip); color: var(--text-2); }
  .stepper .st.on { color: var(--text); background: var(--card); box-shadow: 0 0 0 1px var(--hair); font-weight: 600; }
  .stepper .st.on .n { background: var(--accent); color: #fff; }
  .stepper .st.done .n { background: var(--ok-soft); color: var(--ok); }
  .stepper .bar { width: 18px; height: 1px; background: var(--hair-2); }
  .lang { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 7px; color: var(--text-2); font-size: 12px; border: 1px solid var(--hair); background: var(--card); }
  .body { flex: 1; min-height: 0; padding: 6px 64px 0; display: flex; flex-direction: column; }
  .footer { height: 68px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 28px 0 28px; border-top: 1px solid var(--hair); }
  .footer .helper { color: var(--text-3); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
  .footer .sp { flex: 1; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 16px; border-radius: 8px; font-size: 13px; font-weight: 550; cursor: pointer; user-select: none; white-space: nowrap; border: 1px solid transparent; }
  .btn.primary { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.08) inset; }
  .btn.primary.lg { height: 36px; padding: 0 22px; font-size: 13.5px; }
  .btn.primary.off { opacity: .45; cursor: default; }
  .btn.ghost { color: var(--text-2); }
  .btn.ghost:hover { background: var(--chip); }
  .btn.sec { background: var(--card); color: var(--text); border-color: var(--hair-2); box-shadow: var(--card-shadow); }
  .btn.sm { height: 26px; padding: 0 11px; font-size: 12px; border-radius: 7px; }
  .link { color: var(--accent-text); cursor: pointer; }
  .muted { color: var(--text-2); } .faint { color: var(--text-3); }

  .h-title { font-size: 26px; font-weight: 700; letter-spacing: -.2px; margin: 10px 0 6px; }
  .h-sub { color: var(--text-2); font-size: 14px; margin: 0 0 22px; max-width: 640px; }

  /* keycaps */
  .kc { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 11.5px; font-weight: 600; color: var(--key-text);
    background: linear-gradient(180deg, var(--key-top), var(--key-bot)); border: 1px solid var(--key-edge); border-bottom-width: 2px; font-family: var(--font); vertical-align: middle; }
  .kc.lg { min-width: 54px; height: 50px; border-radius: 11px; font-size: 17px; padding: 0 12px; border-bottom-width: 3px; }
  .kc.xl { min-width: 76px; height: 64px; border-radius: 13px; font-size: 20px; padding: 0 16px; border-bottom-width: 4px; }
  .kc.wide { min-width: 140px; }
  .kc.press { transform: translateY(2px); border-bottom-width: 1px; background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 80%, #000)); color: #fff; border-color: color-mix(in srgb, var(--accent) 60%, #000); box-shadow: 0 0 0 5px var(--accent-soft); }
  .plus { color: var(--text-3); margin: 0 6px; font-size: 13px; }

  /* generic card */
  .card { background: var(--card); border: 1px solid var(--hair); border-radius: 12px; box-shadow: var(--card-shadow); }
  .tag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; font-size: 10.5px; font-weight: 600; background: var(--chip); color: var(--text-2); }
  .tag.req { background: var(--accent-soft); color: var(--accent-text); }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.rec { background: linear-gradient(90deg, rgba(124,58,237,.14), rgba(37,99,235,.14)); color: var(--accent-text); }

  /* ===== welcome ===== */
  .welcome { align-items: center; text-align: center; padding-top: 10px; }
  .logo { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 10px 28px rgba(37,99,235,.28); }
  .welcome .h-title { font-size: 30px; margin-top: 16px; }
  .welcome .h-sub { margin: 0 auto 30px; font-size: 15px; }
  .pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; text-align: left; }
  .pillar { padding: 16px 16px 18px; }
  .pillar .art { height: 132px; border-radius: 9px; background: var(--well); margin-bottom: 14px; position: relative; overflow: hidden; border: 1px solid var(--hair); }
  .pillar h3 { margin: 0 0 4px; font-size: 14.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .pillar p { margin: 0; color: var(--text-2); font-size: 12.5px; line-height: 1.5; }
  .pillar .keys { margin-top: 10px; display: flex; align-items: center; gap: 4px; color: var(--text-3); font-size: 11.5px; }
  /* pillar arts */
  .art-doc { position: absolute; left: 14px; right: 14px; top: 16px; bottom: 0; background: var(--card); border-radius: 8px 8px 0 0; border: 1px solid var(--hair); padding: 12px 12px; font-size: 11.5px; color: var(--text); }
  .art-doc .ln { height: 6px; border-radius: 3px; background: var(--chip); margin-bottom: 7px; }
  .art-doc .typed { font-size: 11.5px; } .art-doc .typed .cur { display: inline-block; width: 1.5px; height: 13px; background: var(--accent); vertical-align: -2px; }
  .voicepill { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 99px; background: rgba(28,28,31,.92); color: #fff; font-size: 11px; box-shadow: 0 6px 18px rgba(0,0,0,.25); white-space: nowrap; }
  .wave { display: inline-flex; align-items: center; gap: 2px; height: 14px; } .wave i { width: 2.5px; border-radius: 2px; background: #5fb0ff; }
  .art-launch { position: absolute; left: 14px; right: 14px; top: 22px; border-radius: 11px; background: rgba(40,40,44,.94); color: #eee; font-size: 11.5px; box-shadow: 0 8px 22px rgba(0,0,0,.25); overflow: hidden; }
  .art-launch .q { padding: 9px 11px; border-bottom: 1px solid rgba(255,255,255,.08); color: #fff; }
  .art-launch .r { white-space: nowrap; display: flex; align-items: center; gap: 7px; padding: 6px 11px; color: #ddd; } .art-launch .r.on { background: rgba(255,255,255,.08); }
  .art-launch .r .ap { width: 16px; height: 16px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; }
  .art-launch .r .k { margin-left: auto; color: #8d8d93; font-size: 10.5px; }
  .art-chat { position: absolute; inset: 10px 12px 0 12px; display: flex; flex-direction: column; gap: 6px; font-size: 10.5px; }
  .art-chat .bub { padding: 5px 9px; }
  .bub { max-width: 84%; padding: 7px 10px; border-radius: 11px; line-height: 1.45; }
  .bub.me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bub.ai { align-self: flex-start; background: var(--card); color: var(--text); border: 1px solid var(--hair); border-bottom-left-radius: 4px; }
  .ctxchip { align-self: flex-end; display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-2); background: var(--card); border: 1px solid var(--hair); border-radius: 6px; padding: 2px 7px; }

  /* ===== permissions ===== */
  .perm-list { padding: 4px 0; }
  .perm { display: flex; align-items: center; gap: 14px; padding: 15px 18px; }
  .perm + .perm { border-top: 1px solid var(--hair); }
  .perm .ic { width: 38px; height: 38px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; flex: none; color: #fff; }
  .perm .ic svg { width: 20px; height: 20px; }
  .perm .tx { flex: 1; min-width: 0; }
  .perm .tt { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .perm .ds { color: var(--text-2); font-size: 12.5px; margin-top: 2px; }
  .perm .feat { display: inline-flex; gap: 5px; margin-top: 6px; }
  .perm .feat span { font-size: 10.5px; color: var(--text-3); border: 1px solid var(--hair); border-radius: 5px; padding: 0 5px; }
  .granted { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-weight: 600; font-size: 12.5px; }
  .granted .ck { width: 20px; height: 20px; border-radius: 50%; background: var(--ok); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .granted .ck svg { width: 12px; height: 12px; stroke-width: 2.6; }
  .waiting { display: inline-flex; align-items: center; gap: 8px; color: var(--accent-text); font-size: 12.5px; font-weight: 550; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: sp 0.9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .privacy { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--text-2); font-size: 12.5px; padding: 0 4px; }
  .privacy svg { color: var(--ok); }
  .perm.pending { background: var(--accent-soft); }
  .perm.optional .tt { color: var(--text); }

  /* system settings mock (outside the onboarding window) */
  .sys { position: absolute; left: 640px; top: 250px; width: 560px; height: 420px; border-radius: 12px; background: var(--win); border: 1px solid var(--hair-2); box-shadow: var(--shadow); overflow: hidden; display: flex; z-index: 8; }
  .sys .side { width: 170px; background: var(--card-2); border-right: 1px solid var(--hair); padding: 40px 10px 10px; font-size: 12px; color: var(--text-2); }
  .sys .side div { padding: 5px 8px; border-radius: 6px; display: flex; gap: 7px; align-items: center; }
  .sys .side div.on { background: var(--accent); color: #fff; }
  .sys .side i { width: 14px; height: 14px; border-radius: 4px; background: #8e8e93; display: inline-block; } .sys .side div.on i { background: rgba(255,255,255,.85); }
  .sys .main { flex: 1; padding: 14px 18px; }
  .sys .main h4 { margin: 2px 0 6px; font-size: 14px; } .sys .main p { margin: 0 0 12px; color: var(--text-2); font-size: 11.5px; }
  .sys .row { display: flex; align-items: center; gap: 9px; padding: 9px 10px; background: var(--card); border: 1px solid var(--hair); font-size: 12.5px; }
  .sys .row:first-of-type { border-radius: 8px 8px 0 0; } .sys .row + .row { border-top: none; } .sys .row:last-of-type { border-radius: 0 0 8px 8px; }
  .sys .row .ap { width: 20px; height: 20px; border-radius: 5px; }
  .tog { margin-left: auto; width: 34px; height: 20px; border-radius: 99px; background: var(--hair-2); position: relative; }
  .tog::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .tog.on { background: var(--ok); } .tog.on::after { left: 16px; }
  .sys .row.hl { box-shadow: 0 0 0 2px var(--accent) inset; position: relative; z-index: 1; }
  .coach { position: absolute; z-index: 9; width: 250px; padding: 12px 14px; border-radius: 12px; background: rgba(28,28,31,.94); color: #fff; font-size: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .coach b { display: block; font-size: 13px; margin-bottom: 3px; }
  .coach .faint2 { color: #a1a1a8; }
  .coach::after { content: ""; position: absolute; width: 12px; height: 12px; background: inherit; transform: rotate(45deg); }
  .coach.arrow-r::after { right: -5px; top: 22px; } .coach.arrow-u::after { top: -5px; left: 30px; } .coach.arrow-d::after { bottom: -5px; left: 30px; }

  /* ===== AI ===== */
  .ai-opts { margin-top: -6px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .opt { padding: 14px 14px 13px; position: relative; cursor: pointer; }
  .opt.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .opt .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .opt .oi { width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: #fff; }
  .opt .radio { margin-left: auto; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--hair-2); }
  .opt.on .radio { border: 5px solid var(--accent); }
  .opt h4 { margin: 0; font-size: 14px; font-weight: 650; }
  .opt p { margin: 0; color: var(--text-2); font-size: 12px; line-height: 1.5; }
  .opt ul { margin: 6px 0 0; padding: 0; list-style: none; color: var(--text-2); font-size: 11.5px; }
  .opt li { display: flex; gap: 6px; align-items: center; margin-top: 3px; } .opt li svg { width: 12px; height: 12px; color: var(--ok); stroke-width: 2.4; }
  .detail { margin-top: 12px; padding: 16px 20px; min-height: 168px; }
  .detail h5 { margin: 0 0 4px; font-size: 13.5px; font-weight: 650; }
  .signin { display: flex; gap: 10px; margin-top: 14px; }
  .signin .btn { height: 38px; flex: 1; font-size: 13px; }
  .signin img { width: 15px; height: 15px; }
  .terms { margin-top: 12px; font-size: 11.5px; color: var(--text-3); }
  .acct { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg,#6366f1,#22d3ee); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
  .quota { margin-top: 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .quota div { background: var(--card-2); border-radius: 9px; padding: 9px 11px; font-size: 11.5px; color: var(--text-2); }
  .quota b { display: block; color: var(--text); font-size: 13px; font-weight: 600; margin-bottom: 1px; }
  .provs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
  .prov { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 7px; border-radius: 8px; border: 1px solid var(--hair); background: var(--card); font-size: 12px; }
  .prov img { width: 15px; height: 15px; border-radius: 3px; }
  .prov.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .t-dark .prov img.mono, .t-dark .apple, .t-dark .signin img.ap-logo { filter: invert(1); }
  .fields { display: grid; grid-template-columns: 1fr 200px auto; gap: 10px; align-items: end; }
  .fld label { display: block; font-size: 11.5px; color: var(--text-2); margin-bottom: 5px; }

/* ---------- shared chrome ---------- */
const STEPS = ["权限", "AI", "上手"];
function stepper(active) {
  // active: 0..2 for steps, 3 = all done
  return `<div class="stepper">${STEPS.map((s, i) => {
    const cls = i < active ? "done" : i === active ? "on" : "";
    const n = i < active ? `<svg class="i" style="width:11px;height:11px;stroke-width:2.8"><use href="#i-check"/></svg>` : (i + 1);
    return (i ? `<span class="bar"></span>` : "") + `<span class="st ${cls}"><span class="n">${n}</span>${s}</span>`;
  }).join("")}</div>`;

  <div class="body"><div class="h-title" style="font-size:22px">三个按键，上手 Typeflux</div><p class="h-sub" style="margin-bottom:14px">跟着各试一次就记住了。</p>
    <div class="prac">${tasksCol("launch", done)}<div class="sandbox">${sb}</div></div></div>${f}`;
}
function launcherOverlay() {
  return `<div class="launcher"><div class="in">128*3<span class="cur"></span><span class="mic">${ic("mic")}</span><span class="send">${ic("arrowup")}</span></div>
    <div class="res"><div class="row on"><span class="ap" style="background:#8e8e93">=</span><span class="calc">384</span><span class="r">↩ 复制结果</span></div>
      <div class="sec">问 AI</div><div class="row"><span class="ap" style="background:#7c3aed">${ic("spark")}</span>128*3<span class="r">⌘↩</span></div></div>
    <div class="bot"><span class="m">Typeflux Cloud ⌄</span><span class="r"><span>↩ 复制</span><span>⌘↩ 问 AI</span><span>esc 关闭</span></span></div></div>`;
}
function tryAI(variant) {
  const none = variant === "none";
  const done = variant === "ok" ? ["voice", "launch", "ai"] : ["voice", "launch"];
  let sb = `<div class="sb-head"><h3>在启动器里输入问题，按 ${kc("⌘")}${kc("↩")} 交给 AI</h3><p>也可以点 🎙 用语音提问。选中的文字和当前屏幕会自动带上，点一下就能去掉。</p></div>`;
  if (none) sb += `<div class="infobox" style="margin-top:16px">${ic("info")}<div><b>AI 还没有连接</b><span class="muted">连接后就能在启动器里提问、和 AI 对话。语音输入和启动器搜索不受影响。</span>
      <div style="display:flex;gap:8px;margin-top:10px"><span class="btn primary sm" data-go="ai">连接 AI</span><span class="btn ghost sm" data-go="done">先跳过</span></div></div></div>`;
  else sb += `<div class="samples"><span class="faint" style="font-size:12px;align-self:center">试试问：</span><span class="sample">帮我写一封请假邮件，明天下午</span><span class="sample">把选中的文字翻译成英文</span><span class="sample">这一屏讲了什么</span></div>
    <div class="ghostlaunch">${variant === "ok" ? `<span class="granted"><span class="ck">${ic("check")}</span>AI 已经回答了，对话保存在对话窗口里</span>` : `${ic("spark")} 先按 ⌘ Space 打开启动器`}</div>`;
  const f = none ? footer({ back: true, helper: "已完成 2 / 2", primary: "完成", go: "done" }) : variant === "ok" ? footer({ back: true, helper: "已完成 3 / 3", primary: "完成", go: "done" }) : practiceFooter(done);
  return `${titlebar({ step: 2 })}
  <div class="body"><div class="h-title" style="font-size:22px">三个按键，上手 Typeflux</div><p class="h-sub" style="margin-bottom:14px">跟着各试一次就记住了。</p>
    <div class="prac">${tasksCol("ai", done, none)}<div class="sandbox">${sb}</div></div></div>${f}`;
}
function askLauncherOverlay() {
  return `<div class="launcher"><div class="in">帮我写一封请假邮件，明天下午<span class="cur"></span><span class="mic">${ic("mic")}</span><span class="send on">${ic("arrowup")}</span></div>
    <div class="res"><div class="sec">问 AI</div><div class="row on"><span class="ap" style="background:#7c3aed">${ic("spark")}</span>帮我写一封请假邮件，明天下午<span class="r">⌘↩ 在对话中打开</span></div>
      <div class="sec">应用</div><div class="row"><span class="ap" style="background:#3b82f6">✉</span>邮件<span class="r">应用</span></div></div>
    <div class="bot"><span class="m">Typeflux Cloud ⌄</span><span class="r"><span>↩ 打开</span><span class="hl">⌘↩ 问 AI</span><span>esc 关闭</span></span></div></div>`;
}
function chatOverlay() {
  return `<div class="chat"><div class="head"><div class="lights"><i></i><i></i><i></i></div>请假邮件<span style="margin-left:auto;font-weight:400" class="faint">Typeflux Cloud</span></div>
    <div class="msgs"><div class="q">帮我写一封请假邮件，明天下午</div>
      <div class="a"><b>主题：</b>明天下午请假申请<br><br>王经理，您好：<br><br>因个人事务，我想申请明天（10 月 13 日）下午半天假，时间为 13:30–18:00。手头的需求评审材料今天下班前会整理好并同步给小李，紧急事项可以随时电话联系我。<br><br>麻烦您批准，谢谢！<span class="stream"></span></div></div>

}

function done(aiOff = false) {
  return `${titlebar({ step: 3 })}
  <div class="body done">
    <span class="bigok">${ic("check")}</span>
    <div class="h-title" style="margin-top:20px">一切就绪</div>

      <div class="card"><div class="ks">${kc("fn", "lg")}</div><h4>按住说话</h4><p>松开后写进当前应用</p></div>
      <div class="card"><div class="ks">${kc("⌘", "lg")}${kc("Space", "lg wide")}</div><h4>打开启动器</h4><p>搜索、计算、翻译、剪贴板</p></div>
      <div class="card" style="${aiOff ? "opacity:.55" : ""}"><div class="ks">${kc("⌘", "lg")}${kc("↩", "lg")}</div><h4>问 AI</h4><p>${aiOff ? "连接 AI 后可用" : "在启动器里把问题交给 AI"}</p></div>
    </div>
    <div class="more">

function menubarHint() {
  return `<div class="menuhint"><b>Typeflux 在这里</b>点菜单栏图标可以打开设置、查看历史、切换人设。

}
function resumeSettings() {
  const it = (i, t, on) => `<div class="it ${on ? "on" : ""}">${ic(i)}${t}</div>`;
  return `<div class="settings"><div class="sb">
      ${it("gear", "通用", true)}${it("mic", "语音输入")}${it("search", "启动器")}${it("spark", "AI 对话")}${it("model", "模型")}${it("keyboard", "快捷键")}${it("lock", "权限")}
      <div class="resume"><b>完成设置</b><span class="muted">还差 1 步，语音输入才能使用</span><div class="prog"><i></i></div>
        <div class="todo-l"><span class="todo" style="width:12px;height:12px;border-radius:50%;border:1.5px dashed var(--hair-2);display:inline-block"></span>允许辅助功能</div>
        <span class="btn primary sm" style="margin-top:10px;width:100%" data-go="perm">继续设置</span></div></div>
    <div class="content"><h2>通用</h2><div class="skel"></div><div class="skel"></div><div class="skel" style="height:120px"></div></div></div>`;
}

/* ---------- registry ---------- */
const S = [
  { id: "welcome", name: "0 欢迎", win: welcome, note: "<b>欢迎</b>：一句话讲清产品是什么，三张卡片对应三个能力和各自的按键。界面语言默认跟随系统，右上角可以改，不再单独占一步。" },
  { id: "perm", name: "1 权限 · 初始", win: () => perm("init"), note: "<b>权限</b>：只要两项必需权限，每项写清楚「用来做什么、影响哪些功能」。屏幕录制标为可选，默认推到真正用到时再申请。" },
  { id: "perm-ax", name: "1 权限 · 辅助功能引导", win: () => perm("ax"), overlay: permAxOverlay, note: "<b>辅助功能引导</b>：系统设置打开后，在它旁边显示一个提示卡，指出要打开哪个开关。Typeflux 轮询授权状态，打开后自动变成「已允许」，不用切回来手动刷新。" },
  { id: "perm-done", name: "1 权限 · 已完成", win: () => perm("done"), note: "<b>必需权限完成</b>：主按钮可用；可选项保持「需要时再说」，不挡路。" },
  { id: "perm-skip", name: "1 权限 · 稍后授权", win: () => perm("init"), overlay: permSkipOverlay, note: "<b>稍后授权</b>：不强制。说清缺权限时哪些能用、哪些不能用，之后由菜单栏和设置里的「完成设置」卡片接住。" },
  { id: "ai", name: "2 AI · 云端（未登录）", win: () => aiScreen("cloud"), note: "<b>AI</b>：三种方式三张卡片，默认选中 Typeflux Cloud。语音识别用内置本机模型，单独一行说明「已就绪」，不再让用户在 11 个语音引擎里挑。" },
  { id: "ai-cloud-ok", name: "2 AI · 云端已登录", win: () => aiScreen("cloud-ok"), note: "<b>登录完成</b>：从浏览器回来后显示账号、套餐和额度，说清哪些功能走云端、哪些不消耗额度。" },
  { id: "ai-key", name: "2 AI · 自己的 API Key", win: () => aiScreen("key"), note: "<b>自己的 Key</b>：服务商芯片 + Key + 模型 + 测试连接，一屏完成。Base URL 等高级项收进链接。" },
  { id: "ai-local", name: "2 AI · 本机模型", win: () => aiScreen("local"), note: "<b>本机模型</b>：自动检测 Ollama 和已安装的模型；没检测到时给下载链接和重新检测。" },
  { id: "ai-skip", name: "2 AI · 暂不使用", win: () => aiScreen("cloud"), overlay: aiSkipOverlay, note: "<b>暂不使用 AI</b>：说清不连接 AI 时哪些能用。选择后练习里的「问」一项会变成提示，完成页对应卡片变灰。" },
  { id: "try-voice", name: "3 上手 · 说（待试）", win: () => tryVoice("idle"), note: "<b>上手 · 说</b>：页面里放一个真实可输入的备忘录，焦点已经在里面。用户按住 fn 说话，结果直接写进来，比看说明更快记住。" },
  { id: "try-voice-rec", name: "3 上手 · 说（录音中）", win: () => tryVoice("rec"), note: "<b>录音中</b>：大键帽显示按下状态，底部是和真实使用时一样的录音浮条（实时字幕 + 计时）。" },
  { id: "try-voice-ok", name: "3 上手 · 说（完成）", win: () => tryVoice("ok"), note: "<b>写入成功</b>：高亮新写入的文字，并点明自动去掉了口头禅，让用户马上感受到「比打字好」。" },
  { id: "try-voice-fn", name: "3 上手 · 说（fn 被占用）", win: () => tryVoice("fn"), note: "<b>fn 被系统占用</b>：只在检测到问题时出现，给一键打开键盘设置；外接键盘可以一键改用右 ⌘ / 右 ⌥。" },
  { id: "try-launch", name: "3 上手 · 找（待试）", win: () => tryLaunch("idle"), note: "<b>上手 · 找</b>：提示按 ⌘ Space，给几个有代表性的输入（算式、应用、翻译关键词、剪贴板）。" },
  { id: "try-launch-open", name: "3 上手 · 找（启动器已打开）", win: () => tryLaunch("idle"), overlay: launcherOverlay, note: "<b>启动器已打开</b>：真实的启动器出现在屏幕中间，引导窗口留在后面。出了结果就算完成。" },
  { id: "try-launch-conflict", name: "3 上手 · 找（与聚焦搜索冲突）", win: () => tryLaunch("conflict"), note: "<b>快捷键冲突</b>：⌘ Space 默认属于聚焦搜索。检测到冲突时推荐改用 ⌥ Space，也可以去系统设置关掉聚焦搜索的快捷键。" },
  { id: "try-ai", name: "3 上手 · 问（待试）", win: () => tryAI("idle"), note: "<b>上手 · 问</b>：在启动器里把问题交给 AI，同时告诉用户选中文字和屏幕会自动带上。" },
  { id: "try-ai-launcher", name: "3 上手 · 问（启动器中）", win: () => tryAI("idle"), overlay: askLauncherOverlay, note: "<b>启动器中提问</b>：底栏的 ⌘↩ 问 AI 高亮，告诉用户下一步按什么。" },
  { id: "try-ai-chat", name: "3 上手 · 问（对话窗口）", win: () => tryAI("ok"), overlay: chatOverlay, note: "<b>对话窗口</b>：⌘↩ 后打开对话窗口并流式回答，这一项完成。" },
  { id: "try-ai-none", name: "3 上手 · 问（未连接 AI）", win: () => tryAI("none"), note: "<b>未连接 AI</b>：这一项变成提示，可以回去连接或跳过，不计入完成数。" },
  { id: "done", name: "4 完成", win: () => done(false), note: "<b>完成</b>：三个按键做成速查卡，再列三个常用的次要功能。默认勾选「登录时打开」。" },
  { id: "menubar", name: "5 首次进入 · 菜单栏提示", win: null, overlay: menubarHint, mb: { tf: true, hl: true, app: "备忘录" }, note: "<b>首次进入</b>：引导窗口关闭后，从菜单栏图标弹出一次性提示，告诉用户 Typeflux 在哪。" },
  { id: "resume", name: "6 跳过后 · 设置中的完成卡片", win: null, overlay: resumeSettings, mb: { tf: true, dot: true, app: "Typeflux" }, note: "<b>跳过后找回</b>：跳过了必需步骤时，菜单栏图标带橙点，设置侧栏底部显示「完成设置」卡片，点一下回到缺的那一步。" },
];
const byId = Object.fromEntries(S.map(s => [s.id, s]));
const order = S.map(s => s.id);
const BACK = { perm: "welcome", "perm-ax": "welcome", "perm-done": "welcome", "perm-skip": "welcome", ai: "perm-done", "ai-cloud-ok": "perm-done", "ai-key": "perm-done", "ai-local": "perm-done", "ai-skip": "perm-done",
  "try-voice": "ai-cloud-ok", "try-voice-rec": "ai-cloud-ok", "try-voice-ok": "ai-cloud-ok", "try-voice-fn": "ai-cloud-ok", "try-launch": "try-voice-ok", "try-launch-open": "try-voice-ok", "try-launch-conflict": "try-voice-ok",
  "try-ai": "try-launch", "try-ai-launcher": "try-launch", "try-ai-chat": "try-launch", "try-ai-none": "ai", done: "try-ai-chat" };
// clicking around inside a practice sandbox advances its micro-states
const ADVANCE = { "try-voice": "try-voice-rec", "try-voice-rec": "try-voice-ok", "try-launch": "try-launch-open", "try-launch-open": "try-launch-ok", "try-ai": "try-ai-launcher", "try-ai-launcher": "try-ai-chat" };
byId["try-launch-ok"] = { id: "try-launch-ok", name: "3 上手 · 找（完成）", win: () => tryLaunch("ok"), note: "<b>找 · 完成</b>" };

function renderDesk(s, theme) {
  const mb = s.mb || { tf: true };
  return `<div class="desk t-${theme}">${menubar(mb)}${s.win ? `<div class="win">${s.win()}</div>` : ""}${s.overlay ? s.overlay() : ""}</div>`;
}

let state = { id: "welcome", theme: "light", view: "proto" };
function parseHash() {
  const h = location.hash.slice(1).split("&");
  for (const p of h) {
    if (!p) continue;
    const [k, v] = p.split("=");
    if (v === undefined && byId[k]) state.id = k;
    else if (k === "theme") state.theme = v;
    else if (k === "view") state.view = v;
    else if (k === "bare") document.body.classList.add("bare");
  }
}
function render() {
  const s = byId[state.id] || byId.welcome;
  document.getElementById("stage").innerHTML = renderDesk(s, state.theme);
  document.getElementById("caption").innerHTML = s.note || "";
  document.getElementById("scrSel").value = state.id;
  document.querySelectorAll("#themePill button").forEach(b => b.classList.toggle("on", b.dataset.v === state.theme));
  document.querySelectorAll("#viewPill button").forEach(b => b.classList.toggle("on", b.dataset.v === state.view));
  document.body.classList.toggle("view-board", state.view === "board");
  if (state.view === "board") {
    document.getElementById("board").innerHTML = S.map(x => `<div class="cell"><div class="lbl"><b>${x.name}</b></div><div class="thumb" data-open="${x.id}">${renderDesk(x, state.theme)}</div></div>`).join("");
  }
}
function go(id) {
  if (!id) return;
  if (id === "back") id = BACK[state.id] || "welcome";
  if (!byId[id]) return;
  state.id = id; history.replaceState(null, "", `#${id}&theme=${state.theme}`); render();
}
document.getElementById("scrSel").innerHTML = S.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
document.getElementById("scrSel").onchange = e => go(e.target.value);
document.getElementById("themePill").onclick = e => { if (e.target.dataset.v) { state.theme = e.target.dataset.v; go(state.id); } };
document.getElementById("viewPill").onclick = e => { if (e.target.dataset.v) { state.view = e.target.dataset.v; render(); } };
document.addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open) { state.view = "proto"; go(open.dataset.open); return; }
  const g = e.target.closest("[data-go]");
  if (g && g.dataset.go) { go(g.dataset.go); return; }
  if (e.target.closest(".sandbox") && ADVANCE[state.id]) go(ADVANCE[state.id]);
  else if (e.target.closest(".launcher") && ADVANCE[state.id]) go(ADVANCE[state.id]);
});
document.addEventListener("keydown", e => {
  const i = order.indexOf(state.id);
  if (e.key === "ArrowRight" && i < order.length - 1) go(order[i + 1]);
  if (e.key === "ArrowLeft" && i > 0) go(order[i - 1]);
});
parseHash(); render();
</script>
