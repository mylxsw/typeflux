<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typeflux · 对话 内嵌浏览器（高保真可交互稿）</title>
<style>
  :root {
    --page: #0c0c0d; --win: #1e1e20; --side: #232326; --panel: #19191b; --card: #2b2b2e; --card-2: #323236;
    --hair: rgba(255,255,255,.09); --hair-2: rgba(255,255,255,.16); --text: #f2f2f2; --text-2: #a8a8ab; --text-3: #6e6e73;
    --accent: #0a84ff; --accent-soft: #15263e; --accent-text: #8ebdff; --hover: rgba(255,255,255,.07); --ctl: #3a3a3d;
    --ok: #30d158; --ok-soft: rgba(48,209,88,.14); --warn: #ffb340; --warn-soft: rgba(255,179,64,.13);
    --danger: #ff6961; --danger-soft: rgba(255,105,97,.13); --agent: #5e9eff; --agent-glow: rgba(94,158,255,.55);
    --web-bg: #ffffff; --web-text: #1f2328; --web-2: #59636e; --web-hair: #d1d9e0; --web-soft: #f6f8fa;
    --shadow: 0 30px 80px rgba(0,0,0,.55);
  }
  body.light {
    --page: #dfe2e7; --win: #fafafa; --side: #f1f1f3; --panel: #f4f4f6; --card: #ffffff; --card-2: #f2f2f4;
    --hair: rgba(15,23,42,.08); --hair-2: rgba(15,23,42,.14); --text: #1d1d1f; --text-2: #5b5b60; --text-3: #9a9aa0;
    --accent: #2563eb; --accent-soft: #e7efff; --accent-text: #1d4ed8; --hover: rgba(15,23,42,.05); --ctl: #e3e3e6;
    --agent: #2563eb; --agent-glow: rgba(37,99,235,.40); --shadow: 0 30px 80px rgba(15,23,42,.22);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--text); overflow: hidden;
    font: 13px/1.45 -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Noto Sans CJK SC", sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input { font: inherit; color: inherit; }
  svg { flex: none; }

  /* ---------- prototype controls (outside the product window) ---------- */
  .proto { position: fixed; top: 0; left: 0; right: 0; height: 46px; display: flex; align-items: center; gap: 6px; padding: 0 18px;
    background: rgba(0,0,0,.35); border-bottom: 1px solid rgba(255,255,255,.06); z-index: 50; color: #d6d6d9; font-size: 12px; }
  body.light .proto { background: rgba(255,255,255,.6); color: #333; border-color: rgba(0,0,0,.06); }
  .proto b { font-weight: 650; margin-right: 10px; }
  .proto button { height: 28px; padding: 0 11px; border-radius: 8px; background: rgba(255,255,255,.07); font-size: 12px; }
  body.light .proto button { background: rgba(0,0,0,.06); }
  .proto button.on { background: var(--accent); color: #fff; }
  .proto .sp { flex: 1; }
  .proto .hint { color: #8a8a8f; margin-left: 8px; }

  .stage { position: absolute; top: 46px; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  .window { width: min(1480px, calc(100vw - 48px)); height: min(920px, calc(100vh - 46px - 40px)); background: var(--win); border-radius: 14px;
    box-shadow: var(--shadow); border: 1px solid var(--hair-2); position: relative; overflow: hidden; display: flex; transition: width .35s ease; }
  .window.narrow { width: 920px; }

  /* ---------- sidebar ---------- */
  .sidebar { width: 264px; flex: none; background: var(--side); border-right: 1px solid var(--hair); display: flex; flex-direction: column; }
  .window.narrow .sidebar { display: none; }
  .tl-row { height: 52px; display: flex; align-items: center; padding: 0 12px 0 18px; gap: 8px; }
  .lights { display: flex; gap: 8px; } .lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; display: block; }
  .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .tl-row .sp { flex: 1; }
  .icon-btn { width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); position: relative; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn.on { background: var(--accent-soft); color: var(--accent-text); }
  .search { margin: 2px 14px 10px; height: 32px; border-radius: 9px; background: var(--hover); display: flex; align-items: center; gap: 7px; padding: 0 10px; color: var(--text-3); }
  .search kbd { margin-left: auto; font: 600 10.5px/1 -apple-system, sans-serif; padding: 3px 5px; border-radius: 5px; background: var(--hover); color: var(--text-3); }
  .group { font-size: 11.5px; color: var(--text-3); padding: 8px 20px 4px; }
  .conv { margin: 1px 10px; height: 34px; border-radius: 8px; display: flex; align-items: center; padding: 0 10px; gap: 8px; color: var(--text-2); white-space: nowrap; overflow: hidden; }
  .conv span { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .conv:hover { background: var(--hover); }
  .conv.sel { background: var(--accent-soft); color: var(--text); font-weight: 600; }
  .conv .globe { color: var(--agent); }
  .side-foot { margin-top: auto; padding: 12px 14px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--hair); }
  .avatar { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg,#3b82f6,#8b5cf6); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .side-foot .who { flex: 1; font-size: 12px; } .side-foot .who b { display: block; font-size: 12.5px; }
  .side-foot .who span { color: var(--text-3); }

  /* ---------- chat column ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .header { height: 52px; display: flex; align-items: center; padding: 0 12px; gap: 8px; flex: none; }
  .window.narrow .header { padding-left: 84px; }
  .window:not(.narrow) .header .lights { display: none; }
  .window.narrow .header .lights { position: absolute; left: 18px; }
  .capsule { height: 34px; border-radius: 17px; border: 1px solid var(--hair-2); display: flex; align-items: center; padding: 0 14px; gap: 8px; font-weight: 600; background: var(--card); max-width: 360px; }
  .capsule .state { font-weight: 500; font-size: 12px; color: var(--agent); display: none; align-items: center; gap: 5px; }
  .capsule .state i { width: 6px; height: 6px; border-radius: 50%; background: var(--agent); animation: pulse 1.2s infinite; }
  .running .capsule .state { display: inline-flex; }
  .header .sp { flex: 1; }
  .tools { height: 34px; border-radius: 17px; border: 1px solid var(--hair-2); display: flex; align-items: center; padding: 0 4px; gap: 2px; background: var(--card); }
  @keyframes pulse { 50% { opacity: .35; } }

  .thread { flex: 1; overflow-y: auto; padding: 8px 0 24px; scroll-behavior: smooth; }
  .col { max-width: 720px; margin: 0 auto; padding: 0 28px; }
  .msg-user { display: flex; justify-content: flex-end; margin: 14px 0; }
  .msg-user div { background: var(--accent-soft); color: var(--text); border: 1px solid rgba(94,158,255,.22); padding: 8px 14px; border-radius: 16px; max-width: 80%; font-weight: 550; }
  .msg-ai { margin: 12px 0; font-size: 13.5px; line-height: 1.65; }
  .msg-ai p { margin: 0 0 8px; }
  .msg-ai ul { margin: 0 0 8px; padding-left: 20px; } .msg-ai li { margin: 2px 0; }
  .muted { color: var(--text-3); }

  /* browser activity group in the transcript */
  .act { border: 1px solid var(--hair); border-radius: 12px; background: var(--card); margin: 10px 0; overflow: hidden; }
  .act-h { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; cursor: pointer; }
  .act-h .ttl { font-weight: 600; } .act-h .meta { color: var(--text-3); font-size: 12px; }
  .act-h .sp { flex: 1; }
  .act-h .chev { transition: transform .2s; color: var(--text-3); }
  .act.collapsed .chev { transform: rotate(-90deg); }
  .act.collapsed .steps { display: none; }
  .steps { border-top: 1px solid var(--hair); padding: 6px 0; }
  .step { display: flex; align-items: center; gap: 10px; padding: 5px 14px; font-size: 12.5px; color: var(--text-2); }
  .step .dot { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
  .step.done .dot { color: var(--ok); }
  .step.run .dot { border: 2px solid var(--agent); border-top-color: transparent; animation: spin .8s linear infinite; }
  .step.wait .dot { border: 2px solid var(--warn); }
  .step.stop .dot { color: var(--danger); }
  .step code { font: 11.5px ui-monospace, Menlo, monospace; color: var(--text-3); margin-left: auto; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .step .thumb { margin-left: auto; width: 54px; height: 34px; border-radius: 5px; border: 1px solid var(--hair-2); background: linear-gradient(180deg, #f6f8fa 0 28%, #fff 28%), #fff; background-size: 100% 100%; box-shadow: inset 0 -14px 0 -10px #dbe6f5; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* hand-off / approval cards */
  .card { border: 1px solid var(--hair-2); border-radius: 12px; background: var(--card); padding: 12px 14px; margin: 10px 0; }
  .card.warn { border-color: rgba(255,179,64,.35); background: linear-gradient(0deg, var(--warn-soft), var(--warn-soft)), var(--card); }
  .card.agent { border-color: rgba(94,158,255,.35); background: linear-gradient(0deg, var(--accent-soft), var(--accent-soft)); }
  .card-h { display: flex; align-items: center; gap: 8px; font-weight: 650; margin-bottom: 4px; }
  .card-b { color: var(--text-2); font-size: 12.5px; }
  .card-b .site { display: inline-flex; align-items: center; gap: 5px; color: var(--text); font-weight: 600; }
  .card-a { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn { height: 28px; padding: 0 12px; border-radius: 8px; background: var(--ctl); font-size: 12.5px; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { filter: brightness(1.12); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: transparent; color: var(--text-2); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .resolved { font-size: 12px; color: var(--text-3); margin-top: 8px; display: flex; align-items: center; gap: 6px; }
  .note-card { display: flex; align-items: center; gap: 12px; border: 1px solid var(--hair-2); border-radius: 12px; padding: 10px 12px; background: var(--card); margin: 10px 0; }
  .note-card .ic { width: 34px; height: 34px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); display: flex; align-items: center; justify-content: center; }
  .note-card b { display: block; } .note-card span { color: var(--text-3); font-size: 12px; }
  .note-card .sp { flex: 1; }
  .todo { list-style: none; padding: 0 !important; }
  .todo li { display: flex; gap: 8px; align-items: flex-start; }
  .todo li::before { content: ""; width: 13px; height: 13px; border: 1.5px solid var(--text-3); border-radius: 4px; margin-top: 5px; flex: none; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: var(--hover); color: var(--text-2); margin-left: 4px; }

  /* composer */
  .composer-wrap { padding: 0 24px 18px; flex: none; }
  .composer { max-width: 720px; margin: 0 auto; border-radius: 18px; background: var(--card); border: 1px solid var(--hair-2); box-shadow: 0 16px 40px rgba(0,0,0,.25); }
  .chips { display: flex; gap: 6px; padding: 10px 12px 0; flex-wrap: wrap; }
  .chips:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 8px; border-radius: 8px; background: var(--hover); font-size: 12px; color: var(--text-2); max-width: 320px; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.suggest { border: 1px dashed var(--hair-2); background: transparent; cursor: pointer; }
  .chip.suggest:hover { color: var(--text); border-color: var(--accent); }
  .chip .x { width: 16px; height: 16px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .chip .x:hover { background: var(--hover); }
  .editor { padding: 13px 16px 4px; min-height: 46px; }
  .editor input { width: 100%; background: transparent; border: 0; outline: 0; font-size: 14px; }
  .editor input::placeholder { color: var(--text-3); }
  .cfoot { display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 10px; position: relative; }
  .cfoot .sp { flex: 1; }
  .model { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border-radius: 8px; font-weight: 600; }
  .model:hover { background: var(--hover); }
  .pill-toggle { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 14px; font-size: 12px; color: var(--text-2); border: 1px solid var(--hair-2); }
  .pill-toggle.on { color: var(--accent-text); background: var(--accent-soft); border-color: transparent; }
  .send { width: 32px; height: 32px; border-radius: 50%; background: var(--ctl); color: var(--text-3); display: inline-flex; align-items: center; justify-content: center; }
  .send.on { background: var(--accent); color: #fff; }
  .send.stop { background: var(--text); color: var(--win); }
  .menu { position: absolute; bottom: 44px; left: 8px; width: 250px; background: var(--card-2); border: 1px solid var(--hair-2); border-radius: 12px; padding: 6px; box-shadow: var(--shadow); display: none; z-index: 20; }
  .menu.open { display: block; }
  .menu .mi { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 7px; color: var(--text); width: 100%; text-align: left; }
  .menu .mi:hover { background: var(--hover); }
  .menu .mi small { margin-left: auto; color: var(--text-3); }
  .menu hr { border: 0; border-top: 1px solid var(--hair); margin: 5px 4px; }

  /* ---------- divider ---------- */
  .divider { width: 9px; margin: 0 -4px; flex: none; cursor: col-resize; position: relative; z-index: 5; }
  .divider::after { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: var(--hair); }
  .divider:hover::after, .divider.drag::after { background: var(--accent); width: 2px; left: 3.5px; }
  .window.narrow .divider, .window.no-browser .divider { display: none; }

  /* ---------- browser panel ---------- */
  .browser { width: 600px; flex: none; background: var(--panel); display: flex; flex-direction: column; min-width: 0; position: relative; }
  .window.no-browser .browser { display: none; }
  .window.narrow .browser { position: absolute; top: 0; right: 0; bottom: 0; width: min(600px, calc(100% - 60px)) !important; z-index: 30;
    border-left: 1px solid var(--hair-2); box-shadow: -20px 0 60px rgba(0,0,0,.45); }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.28); z-index: 29; display: none; }
  .window.narrow:not(.no-browser) .scrim { display: block; }

  .tabstrip { height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 10px; flex: none; }
  .tab { height: 32px; min-width: 0; max-width: 200px; flex: 0 1 200px; border-radius: 9px; display: flex; align-items: center; gap: 7px; padding: 0 6px 0 10px; color: var(--text-2); position: relative; cursor: default; }
  .tab:hover { background: var(--hover); }
  .tab.sel { background: var(--card); color: var(--text); box-shadow: 0 0 0 1px var(--hair-2); }
  .tab .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12.5px; }
  .tab .close { opacity: 0; width: 18px; height: 18px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; }
  .tab:hover .close, .tab.sel .close { opacity: 1; }
  .tab .close:hover { background: var(--hover); }
  .tab .ai { position: absolute; left: 4px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--agent); box-shadow: 0 0 0 2px var(--panel); display: none; }
  .tab.agent .ai { display: block; animation: pulse 1.2s infinite; }
  .tabstrip .sp { flex: 1; min-width: 8px; }
  .fav { width: 16px; height: 16px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font: 700 9.5px/1 -apple-system, sans-serif; color: #fff; flex: none; }
  .fav.gh { background: #24292f; } .fav.gm { background: #ea4335; } .fav.xhs { background: #ff2442; } .fav.fs { background: #3370ff; } .fav.nt { background: var(--ctl); color: var(--text-2); }
  .fav.web { background: #6b7280; }

  .navbar { height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 10px 8px; flex: none; }
  .url { flex: 1; height: 32px; border-radius: 16px; background: var(--card); border: 1px solid var(--hair); display: flex; align-items: center; gap: 7px; padding: 0 12px; min-width: 0; }
  .url:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .url input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; font-size: 12.5px; color: var(--text); }
  .url input::placeholder { color: var(--text-3); }
  .url .lock { color: var(--text-3); }
  .url .aiflag { font-size: 11px; color: var(--accent-text); background: var(--accent-soft); border-radius: 6px; padding: 1px 6px; white-space: nowrap; display: none; }
  .url.ai .aiflag { display: inline-block; }

  .viewport-wrap { flex: 1; margin: 0 10px 10px; border-radius: 12px; position: relative; overflow: hidden; border: 1px solid var(--hair); min-height: 0; }
  .viewport { position: absolute; inset: 0; overflow: auto; background: var(--web-bg); color: var(--web-text); }
  .viewport.ntp { background: var(--panel); color: var(--text); }
  .glow { position: absolute; inset: 0; pointer-events: none; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--agent), inset 0 0 28px var(--agent-glow); opacity: 0; transition: opacity .3s; }
  .agent-on .glow { opacity: 1; animation: breathe 2.4s ease-in-out infinite; }
  .paused .glow { opacity: .35; animation: none; }
  @keyframes breathe { 50% { box-shadow: inset 0 0 0 2px var(--agent), inset 0 0 12px var(--agent-glow); } }
  .shield { position: absolute; inset: 0; z-index: 3; display: none; cursor: pointer; }
  .agent-on:not(.paused) .shield { display: block; }

  .cursor { position: absolute; z-index: 6; left: 50%; top: 40%; pointer-events: none; transition: left .7s cubic-bezier(.4,.1,.2,1), top .7s cubic-bezier(.4,.1,.2,1); display: none; }
  .agent-on .cursor { display: block; }
  .agent-on.paused .cursor { display: none; }
  .cursor .lbl { position: absolute; left: 18px; top: 18px; background: var(--agent); color: #fff; font-size: 11px; font-weight: 600; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  .cursor.click::after { content: ""; position: absolute; left: -10px; top: -10px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--agent); animation: ripple .5s ease-out; }
  @keyframes ripple { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

  .ctrlbar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; z-index: 8;
    display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 22px; background: rgba(28,28,30,.92); color: #f2f2f2;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); transition: all .25s; white-space: nowrap; backdrop-filter: blur(12px); max-width: calc(100% - 24px); }
  .agent-on .ctrlbar { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  .ctrlbar .live { width: 8px; height: 8px; border-radius: 50%; background: var(--agent); animation: pulse 1.2s infinite; flex: none; }
  .paused .ctrlbar .live { background: var(--warn); animation: none; }
  .ctrlbar .what { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ctrlbar .what b { font-weight: 650; }
  .ctrlbar button { height: 28px; padding: 0 11px; border-radius: 14px; background: rgba(255,255,255,.12); font-size: 12px; font-weight: 600; color: #fff; display: inline-flex; align-items: center; gap: 5px; flex: none; }
  .ctrlbar button:hover { background: rgba(255,255,255,.2); }
  .ctrlbar button.stop { background: rgba(255,105,97,.22); color: #ff8a84; }

  .banner { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 9; display: none; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border-radius: 12px;
    background: #fff8e6; color: #5c3d00; border: 1px solid #f5d27a; box-shadow: 0 8px 24px rgba(0,0,0,.12); font-size: 12.5px; }
  .banner.show { display: flex; }
  .banner .sp { flex: 1; } .banner b { font-weight: 650; }
  .banner .btn { background: #1f2328; color: #fff; }
  .banner.user { background: #eef4ff; color: #0b3a8c; border-color: #b9d0ff; }

  /* ---------- new tab page ---------- */
  .ntp-in { padding: 28px 26px; }
  .ntp h4 { font-size: 13px; font-weight: 600; margin: 0 0 12px; color: var(--text); }
  .ntp .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 26px; }
  .ntp .tile { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 11px; background: var(--card); border: 1px solid var(--hair); cursor: pointer; }
  .ntp .tile:hover { border-color: var(--hair-2); background: var(--card-2); }
  .ntp .tile small { margin-left: auto; color: var(--text-3); font-size: 11px; }
  .ntp .sites { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 26px; }
  .ntp .site { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 10px; border-radius: 12px; cursor: pointer; position: relative; }
  .ntp .site:hover { background: var(--hover); }

  /* ---------- sites & sign-ins sheet ---------- */
  .sheet-scrim { position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: none; align-items: center; justify-content: center; }
  .sheet-scrim.open { display: flex; }
  .sheet { width: min(560px, calc(100% - 32px)); max-height: calc(100% - 60px); overflow: auto; background: var(--card); border-radius: 16px; border: 1px solid var(--hair-2); box-shadow: var(--shadow); }
  .sheet-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px; }

  .sheet .sub { color: var(--text-3); font-size: 12px; padding: 0 18px 12px; }
  .srow { display: grid; grid-template-columns: 30px 1fr auto auto; gap: 12px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--hair); }
  .srow .fav { width: 30px; height: 30px; border-radius: 8px; font-size: 12px; }
  .srow b { display: block; font-weight: 600; } .srow span { color: var(--text-3); font-size: 12px; }
  .seg { display: inline-flex; background: var(--hover); border-radius: 8px; padding: 2px; }
  .seg button { height: 24px; padding: 0 9px; border-radius: 6px; font-size: 11.5px; color: var(--text-2); }

  .sheet-f { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--text-3); }
  .sheet-f .sp { flex: 1; }
  .empty { padding: 28px 18px; text-align: center; color: var(--text-3); border-top: 1px solid var(--hair); }

  .toast { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); background: rgba(28,28,30,.94); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 12.5px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .pmenu { position: absolute; top: 88px; right: 14px; width: 230px; background: var(--card-2); border: 1px solid var(--hair-2); border-radius: 12px; padding: 6px; box-shadow: var(--shadow); display: none; z-index: 20; }

(() => {
  const $ = s => document.querySelector(s);
  const win = $('#win'), col = $('#col'), thread = $('#thread'), viewport = $('#viewport'), vpwrap = $('#vpwrap');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------------- state ----------------
  const SITE_META = {
    'github.com': { fav: 'gh', letter: 'G', name: 'GitHub' },
    'mail.google.com': { fav: 'gm', letter: 'M', name: 'Gmail' },
    'www.xiaohongshu.com': { fav: 'xhs', letter: '小', name: '小红书' },
    'www.feishu.cn': { fav: 'fs', letter: '飞', name: '飞书' },
  };
  const initialSites = () => ([
    { host: 'mail.google.com', account: 'mylxsw@gmail.com', perm: 'read', used: '今天 09:12' },
    { host: 'www.feishu.cn', account: '李 · 产品组', perm: 'ask', used: '昨天' },
  ]);
  let S;
  function resetState() {
    S = {
      tabs: [{ id: 1, url: '', title: '新标签页', history: [''], hi: 0 }], sel: 1, nextId: 2,
      sites: initialSites(), ghLoggedIn: false, ghFilter: 'all', ghRead: false,
      chips: [], agent: null, browserOpen: true, panelW: 600,
    };
  }

  // ---------------- toast ----------------
  let toastT;
  function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800); }

  // ---------------- tabs ----------------
  const tab = () => S.tabs.find(t => t.id === S.sel);
  const hostOf = url => { try { return new URL(url).host; } catch { return ''; } };
  function favFor(host) {
    const m = SITE_META[host];
    return m ? `<span class="fav ${m.fav}">${m.letter}</span>` : host ? `<span class="fav web">${esc(host[0].toUpperCase())}</span>` : `<span class="fav nt"><svg width="11" height="11"><use href="#i-globe"/></svg></span>`;
  }
  function renderTabs() {
    const strip = $('#tabstrip');
    strip.innerHTML = S.tabs.map(t => `<div class="tab ${t.id === S.sel ? 'sel' : ''} ${S.agent && S.agent.tabId === t.id ? 'agent' : ''}" data-id="${t.id}">
      <i class="ai"></i>${t.incognito ? '<svg width="14" height="14" style="color:var(--text-3)"><use href="#i-incog"/></svg>' : favFor(hostOf(t.url))}
      <span class="t">${esc(t.title)}</span><button class="close" data-close="${t.id}" title="关闭"><svg width="10" height="10"><use href="#i-x"/></svg></button></div>`).join('') +
      `<button class="icon-btn" id="newTab" title="新标签页 ⌘T"><svg width="15" height="15"><use href="#i-plus"/></svg></button><span class="sp"></span>
       <button class="icon-btn" id="closePanel" title="收起浏览器"><svg width="16" height="16"><use href="#i-rside"/></svg></button>`;
  }
  $('#tabstrip').addEventListener('click', e => {
    const c = e.target.closest('[data-close]');
    if (c) { closeTab(+c.dataset.close); e.stopPropagation(); return; }
    if (e.target.closest('#newTab')) { newTab(); return; }
    if (e.target.closest('#closePanel')) { setBrowser(false); return; }
    const t = e.target.closest('.tab'); if (t) { S.sel = +t.dataset.id; render(); }
  });
  function newTab(url = '', opts = {}) {
    const t = { id: S.nextId++, url: '', title: '新标签页', history: [''], hi: 0, incognito: !!opts.incognito };
    S.tabs.push(t); S.sel = t.id; if (url) navigate(url, { tabId: t.id }); else render(); return t;
  }
  function closeTab(id) {
    if (S.agent && S.agent.tabId === id) { toast('AI 正在使用该标签页，先停止任务'); return; }
    const i = S.tabs.findIndex(t => t.id === id); S.tabs.splice(i, 1);
    if (!S.tabs.length) newTab(); else if (S.sel === id) S.sel = S.tabs[Math.max(0, i - 1)].id;
    render();
  }
  function normalize(input) {
    const v = input.trim(); if (!v) return '';
    if (/^https?:\/\//.test(v)) return v;
    if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v)) return 'https://' + v;
    return 'https://www.google.com/search?q=' + encodeURIComponent(v);
  }
  function titleFor(url) {
    const h = hostOf(url);
    if (h === 'github.com') return url.includes('/notifications') ? (S.ghLoggedIn ? 'Notifications' : 'Sign in to GitHub') : (S.ghLoggedIn ? 'GitHub' : 'Sign in to GitHub');
    if (h === 'www.google.com') return decodeURIComponent((url.split('q=')[1] || '')) + ' - Google 搜索';
    return SITE_META[h] ? SITE_META[h].name : h;
  }
  function navigate(url, { tabId = S.sel, push = true } = {}) {
    const t = S.tabs.find(x => x.id === tabId); if (!t) return;
    if (push) { t.history = t.history.slice(0, t.hi + 1); t.history.push(url); t.hi = t.history.length - 1; }
    t.url = url; t.title = url ? titleFor(url) : '新标签页';
    render();
  }
  $('#navBack').onclick = () => { const t = tab(); if (t.hi > 0) { t.hi--; navigate(t.history[t.hi], { push: false }); } };
  $('#navFwd').onclick = () => { const t = tab(); if (t.hi < t.history.length - 1) { t.hi++; navigate(t.history[t.hi], { push: false }); } };
  $('#navReload').onclick = () => { viewport.style.opacity = .4; setTimeout(() => viewport.style.opacity = 1, 250); };
  $('#urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') { const u = normalize(e.target.value); if (u) navigate(u); e.target.blur(); } });

  // ---------------- pages ----------------
  function pageHTML(t) {
    const h = hostOf(t.url);
    if (!t.url) return ntpHTML(t);
    if (h === 'github.com') return S.ghLoggedIn ? ghNotifications() : ghLogin();
    if (h === 'www.google.com') return `<div class="web-generic"><h1>${esc(t.title)}</h1><p>搜索结果（原型占位）。在真实实现中，这是 WKWebView 加载的页面。</p><div class="blk" style="width:80%"></div><div class="blk" style="width:65%"></div><div class="blk" style="width:72%"></div></div>`;
    const m = SITE_META[h];
    return `<div class="web-generic"><h1>${esc(m ? m.name : h)}</h1><p>${esc(t.url)}</p><p>真实网页内容由 WKWebView 渲染。原型中用占位块表示页面结构。</p><div class="blk" style="width:90%"></div><div class="blk" style="width:70%"></div><div class="blk" style="width:82%"></div><div class="blk" style="width:55%"></div></div>`;
  }
  function ntpHTML(t) {
    const signed = S.sites.map(s => `<div class="site" data-go="https://${s.host}${s.host === 'github.com' ? '/notifications' : ''}">${favFor(s.host).replace('class="fav', 'class="fav')}<i class="on"></i><span>${esc(SITE_META[s.host]?.name || s.host)}</span></div>`).join('');
    return `<div class="ntp-in">
      ${t.incognito ? `<div class="tip" style="margin-bottom:18px"><svg width="14" height="14"><use href="#i-incog"/></svg><span>无痕标签页：关闭后不保留 Cookie 与历史，AI 默认不可读取。</span></div>` : ''}
      <h4>已登录的站点</h4>
      <div class="sites">${signed}<div class="site add" data-go="https://github.com/notifications"><span class="fav"><svg width="16" height="16"><use href="#i-plus"/></svg></span><span>登录新站点</span></div></div>
      <h4>让 AI 帮你</h4>
      <div class="grid2">
        <div class="tile" data-ask="帮我把 GitHub 上未读的通知整理成待办清单，存到笔记里。"><span class="fav gh">G</span>整理 GitHub 未读通知<small>浏览器</small></div>
        <div class="tile" data-ask="查一下 Gmail 里本周所有的发票邮件，汇总金额。"><span class="fav gm">M</span>汇总本周发票邮件<small>只读</small></div>
        <div class="tile" data-ask="把这个页面的要点总结给我"><svg width="16" height="16"><use href="#i-note"/></svg>总结当前页面<small>@ 引用</small></div>
        <div class="tile" data-ask="对比这三个页面里的价格和配置"><svg width="16" height="16"><use href="#i-chart"/></svg>对比多个标签页<small>多标签</small></div>
      </div>
      <div class="tip"><svg width="14" height="14"><use href="#i-shield"/></svg><span>这里的登录状态独立于你的 Safari / Chrome，只保存在本机。AI 只有在你允许的站点上才能读取或操作页面；遇到登录、支付等敏感步骤会交给你完成。</span></div>
    </div>`;
  }
  function ghLogin() {
    return `<div class="gh-top"><div class="gh-logo">G</div></div><div class="gh-login"><h2>Sign in to GitHub</h2>
      <div class="gh-box"><label>Username or email address</label><input id="ghUser" autocomplete="off"><label>Password</label><input id="ghPass" type="password"><button class="gh-btn" id="ghSignIn">Sign in</button></div>
      <div class="gh-alt">New to GitHub? <a>Create an account</a></div></div>`;
  }
  const GH = [
    { k: 'pr', repo: 'mylxsw/typeflux #412', t: 'Ask: support embedded browser panel', who: 'review requested', time: '12 分钟前' },
    { k: 'ci', repo: 'mylxsw/typeflux-api', t: 'CI failed on main: TestBillingWebhook', who: 'workflow run', time: '40 分钟前' },
    { k: 'is', repo: 'mylxsw/typeflux #398', t: '升级到 macOS 26 后热键偶发失效', who: 'mentioned you', time: '2 小时前' },
    { k: 'pr', repo: 'mylxsw/realtime-asr #57', t: 'Reduce first-token latency for streaming ASR', who: 'assigned', time: '昨天' },
    { k: 'is', repo: 'mylxsw/typeflux-docs #33', t: '文档：本地模型安装步骤缺失截图', who: 'comment', time: '昨天' },
  ];
  function ghNotifications() {
    return `<div class="gh-top"><div class="gh-logo">G</div><b style="font-size:14px">Notifications</b><span style="margin-left:auto;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6)"></span></div>
      <div class="gh-main"><div class="gh-filter"><span data-f="all" class="${S.ghFilter === 'all' ? 'sel' : ''}">All</span><span data-f="unread" id="ghUnread" class="${S.ghFilter === 'unread' ? 'sel' : ''}">Unread · ${S.ghRead ? 0 : GH.length}</span><span class="sp"></span><button class="gh-mark" id="ghMark">Mark all as read</button></div>
      <div class="gh-list">${GH.map((n, i) => `<div class="gh-item ${S.ghRead ? 'read' : 'unread'}" data-i="${i}"><span class="ico ${n.k}"></span><div><span class="repo">${esc(n.repo)}</span><b>${esc(n.t)}</b><span class="repo">${esc(n.who)}</span></div><time>${n.time}</time></div>`).join('')}</div></div>`;
  }
  viewport.addEventListener('click', e => {
    const go = e.target.closest('[data-go]'); if (go) { navigate(go.dataset.go); return; }
    const ask = e.target.closest('[data-ask]'); if (ask) { $('#prompt').value = ask.dataset.ask; $('#prompt').focus(); syncSend(); return; }
    const f = e.target.closest('[data-f]'); if (f) { S.ghFilter = f.dataset.f; renderPage(); return; }
    if (e.target.closest('#ghMark')) { S.ghRead = true; renderPage(); return; }
    if (e.target.closest('#ghSignIn')) { userSignedIn(); }
  });

  function userSignedIn() {
    const u = ($('#ghUser') || {}).value || 'mylxsw';
    S.ghLoggedIn = true;
    if (!S.sites.find(s => s.host === 'github.com')) S.sites.unshift({ host: 'github.com', account: u || 'mylxsw', perm: 'ask', used: '刚刚' });
    S.tabs.filter(t => hostOf(t.url) === 'github.com').forEach(t => t.title = titleFor(t.url));
    render();
    toast('已登录 github.com · 登录信息仅保存在本机');
    if (S.agent && S.agent.waitingLogin) { S.agent.waitingLogin(); }
  }

  // ---------------- render ----------------
  function renderPage() {
    const t = tab();
    viewport.classList.toggle('ntp', !t.url);
    viewport.innerHTML = pageHTML(t);
  }
  function render() {
    renderTabs(); renderPage();
    const t = tab(), ui = $('#urlInput');
    if (document.activeElement !== ui) ui.value = t.url ? t.url.replace(/^https:\/\//, '') : '';
    const site = S.sites.find(s => s.host === hostOf(t.url));
    $('#urlBox').classList.toggle('ai', !!site && site.perm !== 'off' && !t.incognito);
    $('#navBack').style.opacity = t.hi > 0 ? 1 : .35; $('#navFwd').style.opacity = t.hi < t.history.length - 1 ? 1 : .35;
    win.classList.toggle('no-browser', !S.browserOpen);
    $('#toggleBrowser').classList.toggle('on', S.browserOpen);
    $('#browser').style.width = S.panelW + 'px';
    renderChips(); renderSites();
  }

  // ---------------- composer ----------------
  function renderChips() {
    const t = tab(); const el = $('#chips'); let html = '';
    S.chips.forEach((c, i) => html += `<span class="chip">${favFor(hostOf(c.url))}<span>${esc(c.title)}</span><span class="x" data-rm="${i}"><svg width="9" height="9"><use href="#i-x"/></svg></span></span>`);
    if (S.browserOpen && t.url && !S.chips.find(c => c.url === t.url) && !S.agent) html += `<span class="chip suggest" id="suggestChip">${favFor(hostOf(t.url))}<span>引用「${esc(t.title)}」</span></span>`;
    el.innerHTML = html;
  }
  $('#chips').addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]'); if (rm) { S.chips.splice(+rm.dataset.rm, 1); renderChips(); return; }
    if (e.target.closest('#suggestChip')) attachTab();
  });
  function attachTab() { const t = tab(); if (!t.url) { toast('当前是新标签页，没有可引用的网页'); return; } if (!S.chips.find(c => c.url === t.url)) S.chips.push({ url: t.url, title: t.title }); renderChips(); }
  const syncSend = () => $('#sendBtn').classList.toggle('on', !!$('#prompt').value.trim() && !S.agent);
  $('#prompt').addEventListener('input', syncSend);
  $('#prompt').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  $('#sendBtn').onclick = () => S.agent ? stopAgent('你停止了任务') : send();
  function send() {
    const v = $('#prompt').value.trim(); if (!v || S.agent) return;
    $('#prompt').value = ''; syncSend();
    if (/github/i.test(v)) { runDemo(v); return; }
    addUser(v);
    const ctx = S.chips.length ? `（已引用 ${S.chips.length} 个网页作为上下文）` : '';
    S.chips = []; renderChips();
    addHTML(`<div class="msg-ai"><p>原型中仅「GitHub 通知」场景有完整脚本${ctx}。试试点击上方「② AI 操作演示」，或在新标签页里点「整理 GitHub 未读通知」。</p></div>`);
  }
  $('#plusBtn').onclick = e => { $('#plusMenu').classList.toggle('open'); e.stopPropagation(); };
  $('#miAttachTab').onclick = () => { attachTab(); closeMenus(); };
  $('#miOpenBrowser').onclick = () => { setBrowser(true); closeMenus(); };
  $('#miUseSafari').onclick = () => { $('#browserToggle').classList.remove('on'); toast('本对话将改用你正在使用的 Safari / Chrome（AppleScript 通道）'); closeMenus(); };
  $('#browserToggle').onclick = e => { e.currentTarget.classList.toggle('on'); toast(e.currentTarget.classList.contains('on') ? 'AI 可以在内嵌浏览器中操作' : 'AI 不会使用浏览器'); };
  $('#moreBtn').onclick = e => { $('#pmenu').classList.toggle('open'); e.stopPropagation(); };
  $('#pmSafari').onclick = () => { toast('已在 Safari 中打开当前页面'); closeMenus(); };
  $('#pmIncog').onclick = () => { newTab('', { incognito: true }); tab().title = '无痕标签页'; render(); closeMenus(); };
  $('#pmAttach').onclick = () => { attachTab(); closeMenus(); };
  $('#pmSites').onclick = () => { openSheet(); closeMenus(); };
  $('#pmClear').onclick = () => { const h = hostOf(tab().url); closeMenus(); if (!h) return toast('新标签页没有站点数据'); signOut(h); };
  function closeMenus() { $('#plusMenu').classList.remove('open'); $('#pmenu').classList.remove('open'); }
  document.addEventListener('click', e => { if (!e.target.closest('.menu,.pmenu')) closeMenus(); });

  // ---------------- browser panel open/close/resize ----------------
  function setBrowser(open) { S.browserOpen = open; render(); }
  $('#toggleBrowser').onclick = () => setBrowser(!S.browserOpen);
  $('#scrim').onclick = () => setBrowser(false);
  const div = $('#divider');
  div.addEventListener('mousedown', e => {
    e.preventDefault(); div.classList.add('drag');
    const startX = e.clientX, startW = S.panelW, max = win.clientWidth - 264 - 420;
    const move = ev => { S.panelW = Math.max(380, Math.min(max, startW + (startX - ev.clientX))); $('#browser').style.width = S.panelW + 'px'; };
    const up = () => { div.classList.remove('drag'); document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  });
  document.addEventListener('keydown', e => { if (e.metaKey && e.shiftKey && e.key.toLowerCase() === 'b') { e.preventDefault(); setBrowser(!S.browserOpen); } });

  // ---------------- sites sheet ----------------
  const PERMS = [['off', '禁止'], ['ask', '每次询问'], ['read', '仅读取'], ['act', '可操作']];
  function renderSites() {
    const rows = $('#siteRows');
    rows.innerHTML = S.sites.length ? S.sites.map(s => `<div class="srow">${favFor(s.host)}<div><b>${esc(SITE_META[s.host]?.name || s.host)}</b><span>${esc(s.account)} · ${esc(s.host)} · ${esc(s.used)}</span></div>
      <div class="seg" data-host="${s.host}">${PERMS.map(([k, l]) => `<button data-perm="${k}" class="${s.perm === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <button class="icon-btn" title="退出并清除数据" data-signout="${s.host}"><svg width="15" height="15"><use href="#i-trash"/></svg></button></div>`).join('')
      : `<div class="empty">还没有登录任何站点。在浏览器中正常登录即可，登录状态会自动出现在这里。</div>`;
  }
  $('#siteRows').addEventListener('click', e => {
    const p = e.target.closest('[data-perm]');
    if (p) { const host = p.parentElement.dataset.host; S.sites.find(s => s.host === host).perm = p.dataset.perm; render(); toast(`${SITE_META[host]?.name || host}：AI 权限已改为「${p.textContent}」`); return; }
    const so = e.target.closest('[data-signout]'); if (so) signOut(so.dataset.signout);
  });
  function signOut(host) {
    if (S.agent && hostOf(tab().url) === host) return toast('AI 正在使用该站点，先停止任务');
    S.sites = S.sites.filter(s => s.host !== host); if (host === 'github.com') { S.ghLoggedIn = false; S.ghRead = false; }
    S.tabs.forEach(t => { if (hostOf(t.url) === host) t.title = titleFor(t.url); });
    render(); toast(`已退出 ${host} 并清除其 Cookie 与本地存储`);
  }
  $('#clearAll').onclick = () => { if (S.agent) return toast('AI 正在使用浏览器，先停止任务'); [...S.sites].forEach(s => signOut(s.host)); toast('已退出全部站点'); };
  const openSheet = () => $('#sheet').classList.add('open');
  $('#sitesBtn').onclick = openSheet;
  $('#sheetClose').onclick = () => $('#sheet').classList.remove('open');
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('#sheet').classList.remove('open'); });

  // ---------------- transcript helpers ----------------
  function addHTML(html) { const d = document.createElement('div'); d.innerHTML = html; const el = d.firstElementChild; col.appendChild(el); thread.scrollTop = thread.scrollHeight; return el; }
  const addUser = t => addHTML(`<div class="msg-user"><div>${esc(t)}</div></div>`);
  function seedThread() {
    col.innerHTML = '';
    addHTML(`<div class="msg-ai muted" style="text-align:center;font-size:12px;margin:20px 0">右侧是 Typeflux 内嵌浏览器。你可以自己浏览、登录账号，也可以让 AI 在里面替你操作。</div>`);
  }

  // ---------------- agent demo ----------------
  let runToken = 0;
  class Stopped extends Error {}
  async function gate(token) {
    // Honors pause/takeover and stop between every agent step.
    while (S.agent && S.agent.paused) await sleep(120);
    if (!S.agent || token !== runToken) throw new Stopped();
  }
  async function step(token, ms) { const end = Date.now() + ms; while (Date.now() < end) { await gate(token); await sleep(60); } await gate(token); }
  function setCtrl(text) { $('#ctrlWhat').innerHTML = `<b>Typeflux</b> ${esc(text)}`; }
  function moveCursor(sel) {
    const target = viewport.querySelector(sel); const c = $('#cursor'); if (!target) return;
    const r = target.getBoundingClientRect(), w = vpwrap.getBoundingClientRect();
    c.style.left = (r.left - w.left + Math.min(40, r.width / 2)) + 'px'; c.style.top = (r.top - w.top + r.height / 2) + 'px';
  }
  function clickFx(sel) {
    const c = $('#cursor'); c.classList.remove('click'); void c.offsetWidth; c.classList.add('click');
    const t = viewport.querySelector(sel); if (t) { t.classList.add('hl'); setTimeout(() => t.classList.remove('hl'), 700); }
  }
  function stepRow(group, text, state, extra = '') {
    const el = document.createElement('div'); el.className = 'step ' + state;
    el.innerHTML = `<span class="dot">${state === 'done' ? '<svg width="13" height="13"><use href="#i-check"/></svg>' : ''}</span><span class="txt">${text}</span>${extra}`;
    group.querySelector('.steps').appendChild(el); group.querySelector('.meta').textContent = group.querySelectorAll('.step').length + ' 步';
    thread.scrollTop = thread.scrollHeight; return el;
  }
  function finish(el, state = 'done') { el.className = 'step ' + state; el.querySelector('.dot').innerHTML = state === 'done' ? '<svg width="13" height="13"><use href="#i-check"/></svg>' : state === 'stop' ? '<svg width="11" height="11"><use href="#i-x"/></svg>' : ''; }
  function setAgentUI(on) {
    vpwrap.classList.toggle('agent-on', on); vpwrap.classList.remove('paused');
    $('#main').classList.toggle('running', on);
    const sb = $('#sendBtn'); sb.classList.toggle('stop', on); sb.innerHTML = on ? '<svg width="12" height="12"><use href="#i-stop"/></svg>' : '<svg width="15" height="15"><use href="#i-up"/></svg>';
    syncSend(); renderTabs(); renderChips();
  }
  function banner(html, cls = '') { const b = $('#banner'); b.className = 'banner show ' + cls; b.innerHTML = html; }
  const hideBanner = () => $('#banner').className = 'banner';

  function setPaused(p, byUser) {
    if (!S.agent) return; S.agent.paused = p;
    vpwrap.classList.toggle('paused', p);
    $('#cbPause').innerHTML = p ? '<svg width="12" height="12"><use href="#i-play"/></svg><span>继续</span>' : '<svg width="12" height="12"><use href="#i-pause"/></svg><span>暂停</span>';
    if (p && byUser === 'take') { banner(`<svg width="16" height="16"><use href="#i-hand"/></svg><span><b>你正在操作</b> · AI 已暂停，不会读取你在此期间的输入</span><span class="sp"></span><button class="btn" id="giveBack">交还给 AI</button>`, 'user'); $('#giveBack').onclick = () => { hideBanner(); setPaused(false); }; }
    else if (!p && !S.agent.waitingLogin) hideBanner();
    setCtrl(p ? '已暂停' : S.agent.lastAction || '正在操作');
  }
  $('#cbPause').onclick = () => setPaused(!S.agent.paused, 'pause');
  $('#cbTake').onclick = () => setPaused(true, 'take');
  // Touching the page while the AI acts is an implicit take-over, never a race with it.
  $('#shield').onclick = () => setPaused(true, 'take');
  $('#cbStop').onclick = () => stopAgent('你停止了任务');
  function stopAgent(reason) {
    if (!S.agent) return; const g = S.agent.group; runToken++;
    g.querySelectorAll('.step.run,.step.wait').forEach(r => finish(r, 'stop'));
    stepRow(g, reason + '，浏览器已交还给你', 'stop'); finish(g.querySelector('.step:last-child'), 'stop');
    col.querySelectorAll('.card .card-a .btn').forEach(b => b.disabled = true);
    S.agent = null; hideBanner(); setAgentUI(false);
  }

  // Steps after a hand-off card continue in a new group so the transcript stays chronological.
  function newGroup() {
    if (S.agent && S.agent.group) S.agent.group.classList.add('collapsed');
    const g = addHTML(`<div class="act"><div class="act-h"><svg width="15" height="15" style="color:var(--agent)"><use href="#i-globe"/></svg><span class="ttl">使用浏览器</span><span class="meta">0 步</span><span class="sp"></span><svg class="chev" width="14" height="14"><use href="#i-chev"/></svg></div><div class="steps"></div></div>`);
    g.querySelector('.act-h').onclick = () => g.classList.toggle('collapsed');
    if (S.agent) S.agent.group = g;
    return g;
  }
  async function runDemo(prompt) {
    if (S.agent) return;
    const token = ++runToken;
    setBrowser(true);
    addUser(prompt);
    let group = newGroup();
    // Reuse the current blank tab, otherwise open a dedicated tab for the agent.
    const t = tab().url ? newTab() : tab();
    S.agent = { tabId: t.id, group, paused: false }; setAgentUI(true);
    try {
      let r = stepRow(group, '打开 <b>github.com/notifications</b>', 'run', '<code>browser.open</code>'); setCtrl('正在打开 github.com…'); S.agent.lastAction = '正在打开 github.com';
      await step(token, 700); navigate('https://github.com/notifications', { tabId: t.id }); finish(r); await step(token, 500);

      if (!S.ghLoggedIn) {
        r = stepRow(group, '检测到登录页，等待你登录', 'wait');
        setPaused(true);
        banner(`<svg width="16" height="16"><use href="#i-key"/></svg><span><b>请登录 GitHub</b> · AI 已暂停，不会看到你输入的账号和密码</span><span class="sp"></span><button class="btn" id="bannerDone">我已登录，继续</button>`);
        const card = addHTML(`<div class="card warn"><div class="card-h"><svg width="15" height="15"><use href="#i-key"/></svg>需要你登录</div>
          <div class="card-b">在右侧浏览器中登录 <span class="site"><span class="fav gh">G</span>github.com</span>。登录完成后我会继续，登录信息只保存在这台 Mac。</div>
          <div class="card-a"><button class="btn primary" data-a="done">我已登录，继续</button><button class="btn ghost" data-a="skip">跳过这一步</button></div></div>`);
        await new Promise(res => {
          const done = () => { if (!S.agent) return; S.agent.waitingLogin = null; if (!S.ghLoggedIn) userSignedIn(); res(); };
          S.agent.waitingLogin = done;
          $('#bannerDone').onclick = done;
          card.querySelector('[data-a=done]').onclick = done;
          card.querySelector('[data-a=skip]').onclick = () => stopAgent('你跳过了登录');
          const poll = setInterval(() => { if (token !== runToken) { clearInterval(poll); res(); } }, 200);
        });
        if (token !== runToken) throw new Stopped();
        hideBanner(); setPaused(false);
        await gate(token);
        card.querySelectorAll('.btn').forEach(b => b.disabled = true);
        card.insertAdjacentHTML('beforeend', `<div class="resolved"><svg width="12" height="12"><use href="#i-check"/></svg>已登录 github.com</div>`);
        finish(r); r.querySelector('.txt').innerHTML = '你已登录 github.com';
        group = newGroup();
        navigate('https://github.com/notifications', { tabId: t.id, push: false });
      }

      r = stepRow(group, '读取页面：5 条未读通知', 'run', '<code>browser.read</code>'); setCtrl('正在读取页面…'); S.agent.lastAction = '正在读取页面';
      moveCursor('.gh-list'); await step(token, 1100); finish(r);
      r = stepRow(group, '点击 <b>Unread</b> 筛选', 'run', '<code>browser.click</code>'); setCtrl('点击「Unread」'); S.agent.lastAction = '点击「Unread」';
      moveCursor('#ghUnread'); await step(token, 800); clickFx('#ghUnread'); S.ghFilter = 'unread'; renderPage(); finish(r); await step(token, 500);
      r = stepRow(group, '截图核对结果', 'done', '<span class="thumb"></span>'); await step(token, 600);

      r = stepRow(group, '等待确认：标记为已读', 'wait'); setCtrl('等待你确认'); moveCursor('#ghMark');
      const ap = addHTML(`<div class="card agent"><div class="card-h"><svg width="15" height="15"><use href="#i-shield"/></svg>允许修改 github.com 上的数据吗？</div>
        <div class="card-b">我会点击 <b>Mark all as read</b>，把 5 条通知标记为已读。这一步会改变你账号中的数据。</div>
        <div class="card-a"><button class="btn primary" data-a="once">允许一次</button><button class="btn" data-a="site">始终允许此站点</button><button class="btn ghost" data-a="no">不要标记</button></div></div>`);
      const choice = await new Promise(res => {
        ap.querySelectorAll('[data-a]').forEach(b => b.onclick = () => res(b.dataset.a));
        const poll = setInterval(() => { if (token !== runToken) { clearInterval(poll); res('stopped'); } }, 200);
      });
      await gate(token);
      ap.querySelectorAll('.btn').forEach(b => b.disabled = true);
      ap.insertAdjacentHTML('beforeend', `<div class="resolved"><svg width="12" height="12"><use href="#i-check"/></svg>${choice === 'no' ? '已拒绝，通知保持未读' : choice === 'site' ? '已允许 · 以后 github.com 上的操作不再询问' : '已允许一次'}</div>`);
      if (choice === 'site') { const s = S.sites.find(x => x.host === 'github.com'); if (s) s.perm = 'act'; renderSites(); }
      finish(r); r.querySelector('.txt').innerHTML = choice === 'no' ? '你选择保留未读' : '你已允许标记为已读';
      group = newGroup();
      if (choice !== 'no') {
        r = stepRow(group, '点击 <b>Mark all as read</b>', 'run', '<code>browser.click</code>'); setCtrl('点击「Mark all as read」');
        await step(token, 600); clickFx('#ghMark'); S.ghRead = true; renderPage(); finish(r);
      }
      r = stepRow(group, '保存到笔记「GitHub 待办 · 10/18」', 'run', '<code>notebook.create</code>'); setCtrl('正在保存到笔记…'); await step(token, 800); finish(r);
      group.classList.add('collapsed');
      S.agent = null; setAgentUI(false);
      addHTML(`<div class="msg-ai"><p>整理好了，5 条未读通知按优先级排成了待办：</p>
        <ul class="todo"><li><span><b>Review PR #412</b> Ask: support embedded browser panel <span class="tag">需要你评审</span></span></li>
        <li><span><b>修复 typeflux-api CI</b> TestBillingWebhook 在 main 上失败 <span class="tag">阻塞</span></span></li>
        <li><span>回复 #398：升级 macOS 26 后热键偶发失效（你被 @ 了）</span></li>
        <li><span>跟进 realtime-asr #57 首字延迟优化（已分配给你）</span></li>
        <li><span>补充 typeflux-docs #33 本地模型安装截图</span></li></ul></div>`);
      addHTML(`<div class="note-card"><span class="ic"><svg width="16" height="16"><use href="#i-note"/></svg></span><div><b>GitHub 待办 · 10/18</b><span>已保存到笔记 · 5 项${choice === 'no' ? '' : ' · GitHub 上已标记为已读'}</span></div><span class="sp"></span><button class="btn">打开</button></div>`);
    } catch (e) { if (!(e instanceof Stopped)) throw e; }
  }

  // ---------------- scenes ----------------
  function scene(name) {
    document.querySelectorAll('[data-scene]').forEach(b => b.classList.toggle('on', b.dataset.scene === name));
    if (name !== 'narrow') win.classList.remove('narrow');
    $('#sheet').classList.remove('open');
    if (name === 'reset' || name === 'demo' || name === 'browse') { runToken++; S && S.agent && (S.agent = null); resetState(); setAgentUI(false); hideBanner(); seedThread(); render(); }
    if (name === 'browse') { navigate('https://www.xiaohongshu.com/explore'); newTab('https://mail.google.com/mail/u/0/'); S.sel = 1; render(); toast('试试：地址栏输入 github.com 回车，然后在页面里登录'); }
    if (name === 'demo') runDemo('帮我把 GitHub 上未读的通知整理成待办清单，存到笔记里。');
    if (name === 'sites') openSheet();
    if (name === 'narrow') { win.classList.add('narrow'); setBrowser(true); toast('窄窗口：侧栏让位，浏览器以抽屉形式覆盖在对话上'); }
  }
  document.querySelectorAll('[data-scene]').forEach(b => b.onclick = () => scene(b.dataset.scene));
  $('#themeBtn').onclick = () => document.body.classList.toggle('light');
  const params = new URLSearchParams(location.search);
  if (params.get('theme') === 'light') document.body.classList.add('light');

  resetState(); seedThread(); render();
  // Deep link: ?scene=browse|demo|sites|narrow&theme=light
  const sc = params.get('scene'); if (sc) scene(sc);
})();
</script>
</body>
</html>
