<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Typeflux · Onboarding v3 可交互设计稿</title>
<style>
:root { --font: -apple-system, "SF Pro Text", Inter, "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; --display: -apple-system, "SF Pro Display", Inter, "PingFang SC", "Noto Sans SC", sans-serif; --mono: "SF Mono", ui-monospace, Menlo, "DejaVu Sans Mono", monospace; --spring: cubic-bezier(.2,.9,.25,1.12); --ease: cubic-bezier(.25,.8,.25,1); }

/* ---------- tokens: neutral chrome, colour only as light inside the stage ---------- */
.t-dark { --wall: radial-gradient(1200px 760px at 18% -10%, #2b3550 0%, transparent 60%), radial-gradient(1000px 700px at 110% 115%, #33264a 0%, transparent 58%), linear-gradient(165deg, #16181e, #0c0d10);
  --mb: rgba(20,20,24,.55); --mb-t: #ececef;
  --glass: rgba(34,34,38,.78); --glass-hi: rgba(255,255,255,.05); --panel: rgba(255,255,255,.035); --solid: #1d1d20; --solid-2: #252528; --well: #121214;
  --t1: #f4f4f6; --t2: #a6a6ad; --t3: #6b6b72; --hair: rgba(255,255,255,.07); --hair2: rgba(255,255,255,.13); --edge: rgba(255,255,255,.14);
  --acc: #1a8cff; --acc-soft: rgba(26,140,255,.16); --acc-t: #7fbbff; --ok: #3ccf7a; --warn: #ffa53d; --warn-soft: rgba(255,165,61,.12);
  --shadow: 0 40px 100px rgba(0,0,0,.55), 0 8px 24px rgba(0,0,0,.35); --pop: 0 24px 60px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
  --kt: #46464c; --kb: #2f2f34; --ke: #121214; --ktx: #f2f2f4; --kl: rgba(255,255,255,.1);
  --chip: rgba(255,255,255,.07); --hover: rgba(255,255,255,.06); --doc: #232326; --doc-t: #e9e9ec; --sel: rgba(26,140,255,.38); }
.t-light { --wall: radial-gradient(1200px 760px at 18% -10%, #cbd9f4 0%, transparent 60%), radial-gradient(1000px 700px at 110% 115%, #e8dcf2 0%, transparent 58%), linear-gradient(165deg, #eceff4, #dfe2e8);
  --mb: rgba(248,248,250,.6); --mb-t: #1d1d1f;
  --glass: rgba(250,250,252,.82); --glass-hi: rgba(255,255,255,.7); --panel: rgba(0,0,0,.025); --solid: #ffffff; --solid-2: #f4f4f6; --well: #eceef1;
  --t1: #1c1c1e; --t2: #5f5f66; --t3: #9a9aa1; --hair: rgba(0,0,0,.07); --hair2: rgba(0,0,0,.12); --edge: rgba(0,0,0,.1);
  --acc: #2563eb; --acc-soft: rgba(37,99,235,.1); --acc-t: #1d4fd7; --ok: #1f9d55; --warn: #c25a00; --warn-soft: rgba(234,118,12,.1);
  --shadow: 0 40px 100px rgba(30,40,70,.22), 0 8px 24px rgba(30,40,70,.1); --pop: 0 24px 60px rgba(30,40,70,.22), 0 2px 8px rgba(30,40,70,.1);
  --kt: #ffffff; --kb: #ececf0; --ke: #c4c4cb; --ktx: #2a2a2e; --kl: rgba(255,255,255,1);
  --chip: rgba(0,0,0,.05); --hover: rgba(0,0,0,.04); --doc: #ffffff; --doc-t: #1d1d1f; --sel: rgba(37,99,235,.24); }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 13px/1.45 var(--font); background: #0a0a0c; color: #e6e6e9; -webkit-font-smoothing: antialiased; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
button { font: inherit; }

/* ---------- page chrome (not part of the design) ---------- */
.tb { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 22px; background: rgba(10,10,12,.92); border-bottom: 1px solid #222; backdrop-filter: blur(10px); }
.tb h1 { font-size: 14px; margin: 0 6px 0 0; font-weight: 650; }
.pill { display: inline-flex; background: #1c1c21; border: 1px solid #2b2b32; border-radius: 9px; padding: 2px; }
.pill button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 7px; color: #a3a4ab; font-size: 12px; }
.pill button.on { background: #383842; color: #fff; }
select.scr { background: #1c1c21; color: #ddd; border: 1px solid #2b2b32; border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 12px; }
.tbtn { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 8px; background: #1c1c21; border: 1px solid #2b2b32; color: #ddd; font-size: 12px; }
.legend { color: #85868e; font-size: 11.5px; display: flex; gap: 10px; flex-wrap: wrap; }
.legend b { color: #d6d6da; font-weight: 600; background: #24242a; border: 1px solid #33333b; border-radius: 5px; padding: 0 5px; font-size: 11px; }
.proto { padding: 22px 0 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.caption { color: #9d9ea5; font-size: 12.5px; width: 1280px; line-height: 1.65; }
.caption b { color: #f0f0f2; }
.board { display: none; padding: 16px 24px 60px; }
.board h3 { color: #ddd; font-size: 13px; margin: 24px 0 10px; font-weight: 650; }
.board .grid { display: grid; grid-template-columns: repeat(4, 320px); gap: 16px; }
.board .lbl { color: #b5b6bd; font-size: 11.5px; margin: 0 0 6px; }
.board .thumb { width: 320px; height: 200px; overflow: hidden; border-radius: 8px; border: 1px solid #25252b; cursor: pointer; }
.board .thumb .desk { transform: scale(.25); transform-origin: 0 0; pointer-events: none; }
body.view-board .board { display: block; } body.view-board .proto { display: none; }
body.bare .tb, body.bare .caption { display: none; } body.bare .proto { padding: 0; } body.bare { background: transparent; }
.still *, .still *::before, .still *::after { animation-play-state: paused !important; transition: none !important; }
.still .scene, .still .launcher, .still .capsule, .still .cardx, .still .toast, .still .alert, .still .syswin, .still .coach, .still .shelf, .still .tpanel, .still .preview, .still .ringbox, .still .medal, .still .granted .c, .still .okc, .still .step, .still .appr, .still .thumb-float, .still .kchip { animation: none !important; }

/* ---------- desk ---------- */
.desk { position: relative; width: 1280px; height: 800px; overflow: hidden; background: var(--wall); color: var(--t1); border-radius: 12px; font: 13px/1.45 var(--font); user-select: none; }
body.bare .desk { border-radius: 0; }
.menubar { position: absolute; inset: 0 0 auto 0; height: 26px; background: var(--mb); backdrop-filter: blur(24px) saturate(1.6); display: flex; align-items: center; padding: 0 14px; gap: 18px; font-size: 13px; color: var(--mb-t); z-index: 60; }
.menubar b { font-weight: 650; } .menubar .apple { width: 13px; height: 13px; } .t-dark .menubar .apple { filter: invert(1); }
.menubar .r { margin-left: auto; display: flex; gap: 15px; align-items: center; font-size: 12.5px; }
.mbi { height: 18px; padding: 0 4px; display: inline-flex; align-items: center; border-radius: 5px; position: relative; }
.mbi.hl { background: rgba(127,127,127,.28); } .mbi img { width: 15px; height: 15px; border-radius: 4px; }
.mbi .dot { position: absolute; right: 1px; top: 1px; width: 6px; height: 6px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 1.5px var(--mb); }

.win { position: absolute; border-radius: 18px; background: var(--glass); backdrop-filter: blur(48px) saturate(1.6); border: 1px solid var(--edge); box-shadow: var(--shadow), inset 0 1px 0 var(--glass-hi); overflow: hidden; }
.lights { display: flex; gap: 8px; } .lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.lights.dim i { background: var(--hair2); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 16px; border-radius: 99px; font-size: 13px; font-weight: 560; cursor: pointer; white-space: nowrap; border: 1px solid transparent; color: var(--t1); background: none; transition: background .15s, transform .12s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn.pri { background: var(--acc); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 6px 16px color-mix(in srgb, var(--acc) 35%, transparent); }
.btn.pri.lg { height: 40px; padding: 0 24px; font-size: 14px; }
.btn.pri[disabled] { opacity: .35; box-shadow: none; cursor: default; }
.btn.sec { background: var(--chip); border-color: var(--hair); } .btn.sec:hover { background: var(--hover); }
.btn.ghost { color: var(--t2); } .btn.ghost:hover { background: var(--hover); color: var(--t1); }
.btn.sm { height: 27px; padding: 0 12px; font-size: 12px; }
.muted { color: var(--t2); } .faint { color: var(--t3); }
.sp { flex: 1; }

/* keycaps */
.kc { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 11.5px; font-weight: 600; color: var(--ktx); font-family: var(--font); vertical-align: middle;
  background: linear-gradient(180deg, var(--kt), var(--kb)); border: 1px solid var(--ke); border-bottom-width: 2px; box-shadow: inset 0 1px 0 var(--kl); }
.kc.big { min-width: 66px; height: 60px; border-radius: 13px; font-size: 19px; padding: 0 16px; border-bottom-width: 4px; box-shadow: inset 0 1px 0 var(--kl), 0 8px 18px rgba(0,0,0,.25); transition: transform .08s, border-bottom-width .08s, background .12s, box-shadow .2s; cursor: pointer; }
.kc.big.w { min-width: 168px; }
.kc.on { background: linear-gradient(180deg, color-mix(in srgb, var(--acc) 82%, #fff), var(--acc)); color: #fff; border-color: color-mix(in srgb, var(--acc) 50%, #000); }
.kc.big.on { transform: translateY(3px); border-bottom-width: 1px; box-shadow: 0 0 0 8px var(--acc-soft), 0 2px 6px rgba(0,0,0,.25); }
.kw { display: inline-flex; align-items: center; height: 21px; padding: 0 7px; border-radius: 6px; background: var(--chip); border: 1px solid var(--hair); font-family: var(--mono); font-size: 11.5px; color: var(--t1); vertical-align: middle; }

/* ---------- SETUP window ---------- */
.setup { left: 160px; top: 66px; width: 960px; height: 664px; display: flex; flex-direction: column; }
.setup .top { height: 52px; flex: none; display: flex; align-items: center; padding: 0 20px; position: relative; }
.steps { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
.steps i { width: 6px; height: 6px; border-radius: 3px; background: var(--hair2); transition: width .3s var(--ease), background .3s; } .steps i.on { width: 20px; background: var(--t2); } .steps i.done { background: var(--t3); }
.setup .foot { height: 72px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 28px; }
.setup .foot .note { color: var(--t3); font-size: 12px; display: flex; align-items: center; gap: 7px; }

/* welcome */
.wel { flex: 1; display: grid; grid-template-columns: 380px 1fr; padding: 0 0 0 56px; min-height: 0; }
.wel .copy { display: flex; flex-direction: column; justify-content: center; padding-bottom: 24px; }
.wel .logo { width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 10px 26px rgba(0,0,0,.3); }
.wel h1 { font: 700 38px/1.15 var(--display); letter-spacing: -.8px; margin: 22px 0 12px; }
.wel p.lead { color: var(--t2); font-size: 14.5px; line-height: 1.65; margin: 0 0 24px; }
.wel .verbs { display: flex; flex-direction: column; gap: 2px; }
.verb { display: flex; align-items: center; gap: 12px; padding: 9px 12px 9px 10px; border-radius: 11px; color: var(--t3); transition: background .3s, color .3s; font-size: 13.5px; cursor: pointer; }
.verb b { color: inherit; font-weight: 650; width: 18px; } .verb .k { margin-left: auto; display: flex; gap: 3px; opacity: .55; }
.verb.on { background: var(--panel); color: var(--t1); box-shadow: inset 0 0 0 1px var(--hair); } .verb.on .k { opacity: 1; }
.verb svg { width: 17px; height: 17px; }
.hero { position: relative; margin: 0 24px 6px 22px; border-radius: 18px; overflow: hidden; background: #0e1016; border: 1px solid var(--hair); }
.t-light .hero { background: #dfe5ef; }
.hero .wall { position: absolute; inset: 0; background: radial-gradient(600px 400px at 30% 10%, rgba(var(--h), .38), transparent 60%), radial-gradient(500px 380px at 90% 100%, rgba(120,90,200,.25), transparent 60%); }
.hero .scene { position: absolute; inset: 0; opacity: 0; transition: opacity .6s var(--ease), transform .8s var(--ease); transform: scale(.985); }
.hero .scene.on { opacity: 1; transform: none; }
.hero .cap { position: absolute; left: 22px; bottom: 18px; right: 22px; display: flex; align-items: center; gap: 10px; color: #fff; font-size: 12.5px; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
.t-light .hero .cap { color: #1d1d1f; text-shadow: none; }
.hero .prog { display: flex; gap: 5px; margin-left: auto; } .hero .prog i { width: 18px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; position: relative; }
.t-light .hero .prog i { background: rgba(0,0,0,.12); }
.hero .prog i.on::after { content: ""; position: absolute; inset: 0; background: currentColor; animation: fillp 3.2s linear forwards; transform-origin: 0 50%; }
.hero .prog i.done::after { content: ""; position: absolute; inset: 0; background: currentColor; opacity: .7; }
@keyframes fillp { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.mini-doc { position: absolute; left: 36px; right: 36px; top: 44px; height: 250px; border-radius: 13px; background: var(--doc); color: var(--doc-t); box-shadow: 0 20px 50px rgba(0,0,0,.35); padding: 16px 20px; font-size: 14px; line-height: 1.75; }
.mini-doc .bar { display: flex; gap: 6px; margin-bottom: 14px; } .mini-doc .bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--hair2); }

/* goals */
.gl { flex: 1; display: grid; grid-template-columns: 1fr 260px; gap: 24px; padding: 4px 40px 0 48px; min-height: 0; }
.h2 { font: 700 28px/1.2 var(--display); letter-spacing: -.5px; margin: 6px 0 6px; }
.sub { color: var(--t2); font-size: 14px; margin: 0 0 18px; line-height: 1.55; }
.gtiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.gt { position: relative; text-align: left; border-radius: 15px; border: 1px solid var(--hair); background: var(--panel); padding: 10px 12px 12px; cursor: pointer; color: var(--t1); transition: border-color .2s, background .2s, transform .15s; overflow: hidden; }
.gt:hover { background: var(--hover); } .gt:active { transform: scale(.985); }
.gt.on { border-color: color-mix(in srgb, var(--acc) 70%, transparent); background: var(--acc-soft); }
.gt .art { height: 58px; border-radius: 10px; margin-bottom: 10px; position: relative; overflow: hidden; background: var(--well); }
.gt b { display: block; font-size: 13.5px; font-weight: 650; } .gt span.d { display: block; font-size: 11.5px; color: var(--t2); margin-top: 3px; line-height: 1.45; }
.gt .chk { position: absolute; right: 10px; top: 10px; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--hair2); background: rgba(0,0,0,.2); display: flex; align-items: center; justify-content: center; transition: all .2s var(--spring); z-index: 2; }
.gt.on .chk { background: var(--acc); border-color: var(--acc); } .gt .chk svg { width: 12px; height: 12px; stroke-width: 2.8; color: #fff; opacity: 0; transform: scale(.4); transition: all .2s var(--spring); } .gt.on .chk svg { opacity: 1; transform: none; }
.plan { border-radius: 16px; background: var(--panel); border: 1px solid var(--hair); padding: 18px; align-self: start; margin-top: 10px; }
.plan h4 { margin: 0 0 2px; font-size: 13.5px; } .plan .t { color: var(--t3); font-size: 12px; margin-bottom: 12px; }
.plan .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; border-top: 1px solid var(--hair); }
.plan .n { width: 20px; height: 20px; border-radius: 50%; background: var(--chip); font-size: 11px; font-weight: 650; display: inline-flex; align-items: center; justify-content: center; color: var(--t2); }
.plan .row .m { margin-left: auto; color: var(--t3); font-size: 11.5px; }
.plan .perm { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 11.5px; font-weight: 550; background: var(--chip); color: var(--t2); white-space: nowrap; }
.tag svg { width: 12px; height: 12px; } .tag.acc { background: var(--acc-soft); color: var(--acc-t); }

/* permissions */
.pm { flex: 1; padding: 4px 56px 0; display: flex; flex-direction: column; min-height: 0; }
.prow { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 16px; background: var(--panel); border: 1px solid var(--hair); transition: border-color .3s, background .3s; }
.prow + .prow { margin-top: 10px; }
.prow.ok { border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.prow .pi { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--chip); flex: none; }
.prow .pi svg { width: 22px; height: 22px; }
.prow .tx { flex: 1; } .prow .tx b { font-size: 14.5px; font-weight: 650; } .prow .tx p { margin: 3px 0 0; color: var(--t2); font-size: 12.5px; }
.prow .uses { display: flex; gap: 5px; margin-top: 8px; }
.granted { display: inline-flex; align-items: center; gap: 7px; color: var(--ok); font-weight: 600; font-size: 13px; }
.granted .c { width: 22px; height: 22px; border-radius: 50%; background: var(--ok); color: #fff; display: inline-flex; align-items: center; justify-content: center; animation: pop .35s var(--spring); }
.granted .c svg { width: 13px; height: 13px; stroke-width: 2.8; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.later { margin-top: 18px; display: flex; align-items: center; gap: 10px; color: var(--t3); font-size: 12.5px; flex-wrap: wrap; }
.later .tag { background: none; border: 1px dashed var(--hair2); }
.alert { position: absolute; z-index: 70; left: 50%; top: 210px; transform: translateX(-50%); width: 280px; border-radius: 16px; background: rgba(236,236,238,.96); color: #1d1d1f; text-align: center; padding: 20px 18px 16px; box-shadow: 0 30px 80px rgba(0,0,0,.45); animation: dlg .3s var(--spring); }
.t-dark .alert { background: rgba(48,48,52,.97); color: #f2f2f4; }
@keyframes dlg { from { transform: translateX(-50%) scale(.92); opacity: 0; } }
.alert img { width: 52px; height: 52px; border-radius: 12px; } .alert b { display: block; font-size: 13px; margin: 10px 0 6px; } .alert p { font-size: 11.5px; margin: 0 0 16px; line-height: 1.45; opacity: .75; }
.alert .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .alert button { height: 28px; border-radius: 7px; border: none; background: rgba(127,127,127,.2); color: inherit; font-size: 12.5px; cursor: pointer; } .alert button.d { background: #0a84ff; color: #fff; }
.syswin { position: absolute; z-index: 70; left: 620px; top: 200px; width: 560px; height: 380px; display: flex; animation: dlg2 .35s var(--spring); }
@keyframes dlg2 { from { transform: translateY(10px) scale(.97); opacity: 0; } }
.syswin .side { width: 170px; background: var(--panel); border-right: 1px solid var(--hair); padding: 44px 8px 8px; font-size: 12px; color: var(--t2); }
.syswin .side div { padding: 5px 9px; border-radius: 6px; } .syswin .side .on { background: var(--acc); color: #fff; }
.syswin .main { flex: 1; padding: 16px 18px; }
.syswin .r { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--panel); border: 1px solid var(--hair); font-size: 12.5px; }
.syswin .r + .r { border-top: none; } .syswin .r:first-of-type { border-radius: 9px 9px 0 0; } .syswin .r:last-of-type { border-radius: 0 0 9px 9px; }
.syswin .r.hl { box-shadow: inset 0 0 0 2px var(--acc); }
.tog { margin-left: auto; width: 36px; height: 21px; border-radius: 99px; background: var(--hair2); position: relative; cursor: pointer; transition: background .2s; border: none; display: inline-block; flex: none; }
.tog::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .22s var(--spring); }
.tog.on { background: #34c759; } .tog.on::after { left: 17px; }
.coach { position: absolute; z-index: 75; width: 250px; padding: 12px 14px; border-radius: 13px; background: rgba(20,20,23,.96); color: #fff; font-size: 12px; line-height: 1.55; box-shadow: 0 16px 36px rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); animation: dlg2 .35s var(--spring); }
.coach b { display: block; font-size: 13px; margin-bottom: 2px; }
.coach::after { content: ""; position: absolute; width: 12px; height: 12px; background: inherit; border: inherit; transform: rotate(45deg); }
.coach.r::after { right: -7px; top: 20px; border-left: none; border-bottom: none; } .coach.u::after { top: -7px; left: 26px; border-right: none; border-bottom: none; }

/* ---------- PLAYGROUND ---------- */
.pg { left: 40px; top: 44px; width: 1200px; height: 732px; display: flex; }
.rail { width: 236px; flex: none; margin: 8px 0 8px 8px; border-radius: 13px; background: var(--panel); border: 1px solid var(--hair); display: flex; flex-direction: column; padding: 16px 10px 10px; position: relative; }
.rail .hd { display: flex; align-items: center; gap: 10px; padding: 30px 8px 0; }
.ring-p { width: 34px; height: 34px; flex: none; } .ring-p circle { fill: none; stroke-width: 3; } .ring-p .bg { stroke: var(--hair2); } .ring-p .fg { stroke: var(--t1); stroke-linecap: round; transition: stroke-dasharray .6s var(--ease); }
.rail .hd b { display: block; font-size: 13.5px; } .rail .hd span { font-size: 11.5px; color: var(--t3); }
.rail .grp { font-size: 11px; font-weight: 600; color: var(--t3); padding: 16px 10px 6px; letter-spacing: .2px; }
.chp { border-radius: 10px; padding: 7px 8px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: background .15s; }

.chp.now { background: var(--chip); }
.beats { margin: 2px 0 6px 22px; padding-left: 16px; border-left: 1px solid var(--hair2); }
.bt { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--t3); padding: 5px 8px; border-radius: 7px; cursor: pointer; }
.bt:hover { color: var(--t2); }
.bt i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--hair2); flex: none; margin-left: -20.5px; background: var(--solid); }
.bt.done { color: var(--t2); } .bt.done i { background: var(--t2); border-color: var(--t2); }
.bt.now { color: var(--t1); font-weight: 600; background: var(--hover); } .bt.now i { border-color: var(--acc); background: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.rail .bot { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--hair); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 0 32px; }

.ttl { font: 700 27px/38px var(--display); letter-spacing: -.5px; margin-top: 6px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }

.stage { position: relative; height: 520px; flex: none; border-radius: 18px; overflow: hidden; background: radial-gradient(700px 420px at 50% 0%, rgba(var(--h), .14), transparent 70%), var(--well); border: 1px solid var(--hair); }

.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); animation: pl 1.6s ease-out infinite; margin: 0 6px 0 4px; } @keyframes pl { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--acc) 50%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }

/* in-stage elements */

.cur { display: inline-block; width: 2px; height: 19px; background: var(--acc); vertical-align: -4px; border-radius: 1px; animation: blink 1.05s steps(2, start) infinite; } @keyframes blink { to { visibility: hidden; } }
.ph { color: var(--t3); }
.ins-new { background: var(--acc-soft); border-radius: 4px; animation: glow 1.6s var(--ease) forwards; } @keyframes glow { 0% { background: color-mix(in srgb, var(--acc) 45%, transparent); } 100% { background: var(--acc-soft); } }

.capsule .live { color: #d7d7dc; overflow: hidden; text-overflow: ellipsis; } .capsule .live .tail { color: #8a8a92; } .capsule .t { color: #8a8a92; font-variant-numeric: tabular-nums; }
.capsule.proc .live { background: linear-gradient(90deg, #8a8a92 0%, #fff 50%, #8a8a92 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 1s linear infinite; } @keyframes shim { to { background-position: -200% 0; } }

.result-chip { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--t2); background: var(--panel); border: 1px solid var(--hair); border-radius: 99px; padding: 4px 11px; }

.count { position: absolute; z-index: 12; transform: translate(-50%,-50%); width: 120px; height: 120px; border-radius: 50%; background: rgba(20,20,23,.75); backdrop-filter: blur(10px); color: #fff; display: flex; align-items: center; justify-content: center; font: 700 56px var(--display); }

.strip { height: 50px; margin: 12px 16px 6px; border-radius: 9px; background: repeating-linear-gradient(90deg, #2c2f38 0 62px, #343844 62px 64px); position: relative; }

.preview .pf { display: flex; align-items: center; gap: 10px; padding: 8px 16px 14px; font-size: 12px; color: var(--t2); }
.bar-p { height: 6px; border-radius: 3px; background: var(--chip); width: 200px; overflow: hidden; } .bar-p i { display: block; height: 100%; background: var(--acc); }

/* workflow gallery */
.gal { position: absolute; left: 20px; right: 20px; top: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

/* ring */
.ringbox { position: absolute; z-index: 30; width: 300px; height: 300px; margin: -150px 0 0 -150px; pointer-events: none; animation: bloom .3s var(--spring); }
@keyframes bloom { from { transform: scale(.55); opacity: 0; } }
.ringbox svg { width: 300px; height: 300px; overflow: visible; filter: drop-shadow(0 18px 40px rgba(0,0,0,.35)); }
.ringbox .sl { fill: rgba(40,40,44,.84); stroke: rgba(255,255,255,.13); stroke-width: 1; }

.rl svg { width: 18px; height: 18px; display: block; margin: 0 auto 3px; } .rl.on { color: #fff; }

.rc small { display: block; font-weight: 500; color: var(--t3); font-size: 10.5px; }

.ptr { position: absolute; z-index: 35; width: 18px; height: 22px; pointer-events: none; }
.rdel { pointer-events: auto; cursor: pointer; }

/* chat */

.chat .cm { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.chat .ch { height: 46px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--hair); font-size: 13px; font-weight: 600; }

.chat .msgs { flex: 1; padding: 16px 26px; display: flex; flex-direction: column; gap: 12px; font-size: 13.5px; line-height: 1.7; overflow: hidden; }
.chat .q { align-self: flex-end; background: var(--chip); padding: 8px 14px; border-radius: 16px 16px 4px 16px; max-width: 76%; }
.chat .step { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--t2); padding: 7px 12px; border-radius: 10px; border: 1px solid var(--hair); background: var(--panel); width: fit-content; animation: dlg2 .3s var(--spring); }

.chat .step .ok2 { color: var(--ok); display: inline-flex; } .chat .step .no2 { color: var(--warn); display: inline-flex; } .chat .step code { font-family: var(--mono); font-size: 11.5px; color: var(--t1); }
.chat .ans b { font-weight: 650; }
.chat .appr { border-radius: 14px; border: 1px solid var(--hair2); background: var(--solid-2); padding: 13px 15px; max-width: 470px; animation: dlg2 .3s var(--spring); }
.t-dark .chat .appr { background: #2a2a2e; }
.chat .appr b { display: block; font-size: 13.5px; } .chat .appr .p { font-size: 12px; color: var(--t3); margin: 3px 0 11px; }
.chat .appr .acts { display: flex; gap: 8px; }
.chat .comp { margin: 0 18px 14px; border-radius: 18px; border: 1px solid var(--hair2); background: var(--panel); padding: 10px 12px 10px 14px; display: flex; flex-direction: column; gap: 9px; flex: none; }
.chat .ctx { display: flex; gap: 6px; } .chat .ctx button { all: unset; display: inline-flex; align-items: center; gap: 6px; height: 25px; padding: 0 9px; border-radius: 8px; background: var(--chip); font-size: 11.5px; cursor: pointer; } .chat .ctx button.off { opacity: .4; text-decoration: line-through; } .chat .ctx svg { width: 13px; height: 13px; }
.chat .ci2 { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.chat .ci2 .ph { flex: 1; } .chat .send { width: 30px; height: 30px; border-radius: 50%; background: var(--acc); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border: none; }
.chat .ctl { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--t2); } .chat .ctl b { color: var(--t1); font-weight: 600; }

.t-dark .modebar { background: #2a2a2e; }
.modebar .seg button { padding: 5px 13px; }
.flow { position: absolute; left: 20px; right: 20px; bottom: 20px; height: 270px; border-radius: 14px; background: var(--panel); border: 1px solid var(--hair); }
.flow svg { width: 100%; height: 100%; }

.pvf { border-radius: 16px; background: var(--panel); border: 1px solid var(--hair); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }

.pvf b { font-size: 15px; font-weight: 600; }

.kcard { border-radius: 14px; background: var(--panel); border: 1px solid var(--hair); padding: 16px 12px 14px; }

.nextc b { display: block; font-size: 13.5px; } .nextc span { font-size: 12px; color: var(--t3); }
.confetti i { position: absolute; width: 6px; height: 10px; border-radius: 2px; top: -20px; animation: fall 2.4s var(--ease) forwards; }
@keyframes fall { to { transform: translateY(560px) rotate(540deg); opacity: 0; } }

<script>

/* ================= content model ================= */

const HERO = [

  { k: "ring", cap: "按住 ⌃⌥Space，在指针旁划一下就执行", art: () => ringSVG(240, 220, ["dictation", "ask", "translate", "screenshot", "ocr", "clipboard"], 2, "Typeflux", true) },
  { k: "chat", cap: "Agent 看得懂你的屏幕，也能替你动手", art: () => `<div class="mini-doc" style="top:40px;height:280px;font-size:13px;line-height:1.6"><div class="bar"><i></i><i></i><i></i></div><div style="display:flex;justify-content:flex-end"><span style="background:var(--chip);padding:6px 12px;border-radius:14px 14px 4px 14px">把下载里上周的截图归档到「截图/2026-10」</span></div><div style="margin-top:12px;display:flex;flex-direction:column;gap:7px;align-items:flex-start"><span class="result-chip">${ic("folder", "width:13px;height:13px")}列出 ~/Downloads · 23 张截图</span><span class="result-chip">${ic("check", "width:13px;height:13px;color:var(--ok)")}移动了 23 个文件</span></div><div style="margin-top:12px">好了。另外有 4 张重复的截图，要删掉吗？</div></div>` },
];
function sWelcome() {
  const h = HERO[st.slide];
  const verbs = [["mic", "说", "语音输入", kc("fn")], ["search", "找", "启动器 · 剪贴板 · 截图", kc("⌘") + kc("Space")], ["ring", "划", "圆环", kc("⌃") + kc("⌥") + kc("Space")], ["chat", "问", "Agent 对话", kc("⌘") + kc("↩")]];

    <div class="verbs">${verbs.map((v, i) => `<div class="verb ${i === st.slide ? "on" : ""}" data-slide="${i}">${ic(v[0])}<b>${v[1]}</b><span>${v[2]}</span><span class="k">${v[3]}</span></div>`).join("")}</div></div>
    <div class="hero" style="--h:${chOf(h.k).h}"><div class="wall"></div>${HERO.map((x, i) => `<div class="scene ${i === st.slide ? "on" : ""}">${x.art()}</div>`).join("")}
      <div class="cap"><span>${h.cap}</span><span class="prog">${HERO.map((_, i) => `<i class="${i === st.slide ? "on" : i < st.slide ? "done" : ""}"></i>`).join("")}</span></div></div></div>`,
    `<span class="note">${ic("globe")}简体中文 ${ic("chevd", "width:12px")}</span><span class="sp"></span><span class="note">${ic("clock")}设置约 1 分钟</span><button class="btn pri lg" data-go="goals">开始</button>`);
}
const GT = {
  voice: { d: "说话即输入，一句话改写", art: () => `<div style="position:absolute;left:12px;top:15px;right:12px;height:28px;border-radius:14px;background:rgba(20,20,23,.9);display:flex;align-items:center;gap:8px;padding:0 12px;color:#ddd;font-size:11px;white-space:nowrap">${wave(9)}下午三点开会</div>` },
  launch: { d: "打开、找回、截图", art: () => `<div style="position:absolute;left:12px;top:11px;right:12px;height:36px;border-radius:12px;background:rgba(48,48,52,.92);display:flex;align-items:center;gap:8px;padding:0 12px;color:#eee;font-size:12px"><span style="font-family:var(--mono);font-size:11px;background:rgba(26,140,255,.25);color:#9ccbff;padding:1px 6px;border-radius:5px">fy</span>hello<span style="margin-left:auto;opacity:.55">你好</span></div>` },
  tools: { d: "翻译、录 GIF、小工具", art: () => `<div style="position:absolute;left:12px;top:10px;width:62px;height:38px;border:2px solid #ff453a;border-radius:6px"></div><div style="position:absolute;left:86px;top:19px;height:22px;white-space:nowrap;border-radius:99px;background:rgba(20,20,23,.9);color:#fff;font-size:10.5px;display:flex;align-items:center;gap:6px;padding:0 10px"><i style="width:7px;height:7px;border-radius:50%;background:#ff453a"></i>00:07 · GIF</div>` },
  ring: { d: "指针旁一划即达", art: () => `<svg viewBox="0 0 120 58" style="position:absolute;inset:0;margin:auto;width:120px;height:58px">${[0, 1, 2, 3, 4, 5].map(i => { const a0 = -Math.PI / 2 + (i - .5) * Math.PI / 3 + .07, a1 = a0 + Math.PI / 3 - .14, R = 26, r = 10; const p = (a, rr) => `${(60 + rr * Math.cos(a)).toFixed(1)},${(29 + rr * Math.sin(a)).toFixed(1)}`; return `<path d="M${p(a0, r)} L${p(a0, R)} A${R},${R} 0 0 1 ${p(a1, R)} L${p(a1, r)} A${r},${r} 0 0 0 ${p(a0, r)}Z" fill="${i === 1 ? "#1a8cff" : "rgba(160,160,170,.4)"}"/>`; }).join("")}</svg>` },
  chat: { d: "看得懂屏幕，能动手", art: () => `<div style="position:absolute;right:12px;top:8px;padding:3px 10px;border-radius:11px 11px 3px 11px;background:#1a8cff;color:#fff;font-size:11px">这张表哪个月最高？</div><div style="position:absolute;left:12px;top:32px;padding:3px 10px;border-radius:11px 11px 11px 3px;background:rgba(160,160,170,.3);font-size:11px">7 月，环比 +32%</div>` },
};
function permsFor(goals) { const p = []; if (goals.voice || goals.chat) p.push("mic"); if (goals.voice || goals.launch || goals.ring) p.push("ax"); return p; }
function sGoals() {
  const picked = CH.filter(c => st.goals[c.k]), all = CH.every(c => st.goals[c.k]);
  const tiles = CH.map(c => `<button class="gt ${st.goals[c.k] ? "on" : ""}" data-goal="${c.k}"><span class="chk">${ic("check")}</span><div class="art" style="background:radial-gradient(180px 70px at 50% 130%, rgba(${c.h},.4), transparent 70%), var(--well)">${GT[c.k].art()}</div><b>${c.n}</b><span class="d">${GT[c.k].d}</span></button>`).join("");

  return setupWin(0, `<div class="gl"><div><div class="h2">你最想先用哪几个？</div><p class="sub">按你的选择申请权限、安排顺序。</p>
      <div class="gtiles">${tiles}<button class="gt ${all ? "on" : ""}" data-goal="all" style="border-style:dashed"><span class="chk">${ic("check")}</span><div class="art" style="display:flex;align-items:center;justify-content:center;background:none;border:1px dashed var(--hair2)">${ic("grid", "width:22px;height:22px;color:var(--t2)")}</div><b>都想试试</b><span class="d">五个功能全部选上，按推荐顺序上手。</span></button></div></div>
    <div class="plan"><h4>你的上手计划</h4><div class="t">${picked.length ? `${picked.length} 个功能 · 约 ${total} 分钟 · 随时可以暂停` : "至少选一个"}</div>
      ${picked.map((c, i) => `<div class="row"><span class="n">${i + 1}</span>${c.short || c.n}<span class="m">${c.time}</span></div>`).join("")}
      <div class="row" style="flex-direction:column;align-items:flex-start;gap:6px"><span class="faint" style="font-size:11.5px">现在需要的权限</span><div class="perm">${perms.length ? perms.map(p => p === "mic" ? `<span class="tag">${ic("mic")}麦克风</span>` : `<span class="tag">${ic("access")}辅助功能</span>`).join("") : `<span class="faint" style="font-size:12px">不需要</span>`}</div></div>

function sPerms() {

  if (need.includes("ax")) rows.push(row("ax", "access", "辅助功能", "把文字写进当前应用", ["语音输入", "启动器", ...(st.goals.ring ? ["圆环"] : ["剪贴板粘贴"])]));

    `<button class="btn ghost" data-go="goals">返回</button><span class="sp"></span>${ready ? "" : `<button class="btn ghost" data-go="first">稍后再说</button>`}<button class="btn pri" data-go="first" ${ready ? "" : "disabled"}>开始上手</button>`) + ov;

/* ================= PLAYGROUND ================= */
const BEAT = {};

document.addEventListener("keyup", e => {

const lastMouse = { x: 0, y: 0 };
let drag = null;
const deskPt = e => { const d = $(".desk").getBoundingClientRect(); return [Math.round(e.clientX - d.left), Math.round(e.clientY - d.top)]; };
const clampX = (x, z) => Math.max(150, Math.min(z.width - 150, x)), clampY = (y, z) => Math.max(150, Math.min(z.height - 150, y));
document.addEventListener("mousedown", e => {
  if (st.view !== "proto" || !e.target.closest || !e.target.closest("#desk-host")) return;

function updShot() { const old = $("#shotLayer"); if (!old) { render(); return; } document.querySelectorAll(".shot-tools, .coach.u").forEach(n => n.remove()); const tmp = document.createElement("div"); tmp.innerHTML = shotLayer(); old.replaceWith(...tmp.children); }

const BOARD = [["welcome", 0], ["welcome", 2], ["goals"], ["perms", "mic"], ["perms", "ax"], ["v-dictate", "rec"], ["v-dictate", "done"], ["v-rewrite", "needai"], ["v-rewrite", "done"], ["v-tune", "done"], ["l-open"], ["l-open", "open"], ["l-keyword", "fy"], ["l-clip", "open"], ["l-shot", "arrow"], ["t-translate", "conflict"], ["t-record", "rec"], ["t-record", "preview"], ["t-flow", "run"], ["r-gesture", "open"], ["r-custom", "done"], ["c-ask", "stream"], ["c-agent", "strict"], ["c-agent", "yolo"], ["c-private", "private"], ["done-voice"], ["finish"], ["menubar"], ["jit-launcher", "_"], ["whatsnew"]];
