<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Typeflux · 分功能 Onboarding 设计稿</title>
<style>
  :root { --font: -apple-system, "SF Pro Text", Inter, "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", "WenQuanYi Zen Hei", "Helvetica Neue", sans-serif; --mono: "SF Mono", ui-monospace, Menlo, "DejaVu Sans Mono", monospace; }

  /* ===== tokens: neutral grey, accent only for selection / primary, orange only for problems (AskTheme · StudioTheme) ===== */
  .t-dark {
    --wall: radial-gradient(1100px 680px at 12% -8%, #2a3346 0%, transparent 62%), radial-gradient(900px 640px at 105% 110%, #2c2638 0%, transparent 58%), linear-gradient(160deg, #15171c, #0e0f12);
    --menubar: rgba(22,22,26,.62); --menubar-text: #ececee;
    --glass: rgba(38,38,42,.80); --glass-2: rgba(255,255,255,.045); --solid: #1f1f22; --solid-2: #262629; --well: rgba(0,0,0,.22);
    --text: #f2f2f3; --text-2: #a4a4aa; --text-3: #6e6e74;
    --hair: rgba(255,255,255,.075); --hair-2: rgba(255,255,255,.14); --edge: rgba(255,255,255,.16);
    --accent: #178cff; --accent-soft: rgba(23,140,255,.17); --accent-text: #7db9ff;
    --warn: #ffa53d; --warn-soft: rgba(255,165,61,.11); --warn-line: rgba(255,165,61,.32);
    --done: #8fd19e;
    --shadow: 0 34px 90px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.35);
    --key-top: #404046; --key-bot: #303035; --key-edge: #141416; --key-text: #f1f1f3; --key-lip: rgba(255,255,255,.08);
    --chip: rgba(255,255,255,.07); --hover: rgba(255,255,255,.06);
    --doc: #2a2a2e; --doc-text: #e9e9eb;
  }
  .t-light {
    --wall: radial-gradient(1100px 680px at 12% -8%, #cfdcf3 0%, transparent 62%), radial-gradient(900px 640px at 105% 110%, #e6dcef 0%, transparent 58%), linear-gradient(160deg, #e8ebf1, #dfe2e8);
    --menubar: rgba(246,246,248,.66); --menubar-text: #1d1d1f;
    --glass: rgba(248,248,250,.84); --glass-2: rgba(0,0,0,.03); --solid: #ffffff; --solid-2: #f3f3f5; --well: rgba(0,0,0,.035);
    --text: #1d1d1f; --text-2: #626268; --text-3: #9b9ba1;
    --hair: rgba(0,0,0,.07); --hair-2: rgba(0,0,0,.13); --edge: rgba(0,0,0,.10);
    --accent: #2563eb; --accent-soft: rgba(37,99,235,.10); --accent-text: #1d4fd7;
    --warn: #c25a00; --warn-soft: rgba(234,118,12,.09); --warn-line: rgba(234,118,12,.30);
    --done: #2f8a4a;
    --shadow: 0 34px 90px rgba(25,35,60,.22), 0 6px 18px rgba(25,35,60,.10);
    --key-top: #ffffff; --key-bot: #ececef; --key-edge: #c8c8ce; --key-text: #2a2a2e; --key-lip: rgba(255,255,255,.9);
    --chip: rgba(0,0,0,.05); --hover: rgba(0,0,0,.04);
    --doc: #ffffff; --doc-text: #1d1d1f;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 13px/1.45 var(--font); background: #0b0b0d; color: #e7e7ea; -webkit-font-smoothing: antialiased; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ===== tool bar (not part of the design) ===== */
  .tb { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 11px 24px; background: rgba(11,11,13,.92); border-bottom: 1px solid #222; backdrop-filter: blur(10px); }
  .tb h1 { font-size: 14px; margin: 0 6px 0 0; font-weight: 650; }
  .pill { display: inline-flex; background: #1c1c21; border: 1px solid #2b2b32; border-radius: 9px; padding: 2px; }
  .pill button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 7px; color: #a3a4ab; font-size: 12px; }
  .pill button.on { background: #383842; color: #fff; }
  select.scr { background: #1c1c21; color: #ddd; border: 1px solid #2b2b32; border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 12px; max-width: 320px; }
  .tb .hint { color: #77787f; font-size: 12px; }
  .proto { padding: 26px 24px 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .caption { color: #9d9ea5; font-size: 12.5px; width: 1280px; line-height: 1.6; }
  .caption b { color: #f0f0f2; }
  .board { display: none; padding: 20px 24px 60px; }
  .board h3 { color: #ddd; font-size: 13px; margin: 26px 0 10px; font-weight: 650; letter-spacing: .3px; }
  .board .grid { display: grid; grid-template-columns: repeat(3, 416px); gap: 18px; }
  .board .lbl { color: #b5b6bd; font-size: 11.5px; margin: 0 0 6px; }
  .board .thumb { width: 416px; height: 260px; overflow: hidden; border-radius: 8px; border: 1px solid #25252b; cursor: pointer; }
  .board .thumb .desk { transform: scale(.325); transform-origin: 0 0; }
  body.view-board .board { display: block; } body.view-board .proto { display: none; }
  body.bare .tb, body.bare .caption { display: none; } body.bare .proto { padding: 0; } body.bare { background: transparent; }

  /* ===== desk ===== */
  .desk { position: relative; width: 1280px; height: 800px; overflow: hidden; background: var(--wall); color: var(--text); border-radius: 10px; font: 13px/1.45 var(--font); }
  body.bare .desk { border-radius: 0; }
  .menubar { position: absolute; inset: 0 0 auto 0; height: 26px; background: var(--menubar); backdrop-filter: blur(24px); display: flex; align-items: center; padding: 0 14px; gap: 18px; font-size: 13px; color: var(--menubar-text); z-index: 30; }
  .menubar b { font-weight: 650; } .menubar .apple { width: 13px; height: 13px; opacity: .9; }
  .t-dark .menubar .apple { filter: invert(1); }
  .menubar .right { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 12.5px; }
  .mb-tf { width: 24px; height: 18px; display: inline-flex; align-items: center; justify-content: center; border-radius: 5px; position: relative; }
  .mb-tf.hl { background: rgba(127,127,127,.28); }
  .mb-tf img { width: 15px; height: 15px; border-radius: 4px; }
  .mb-tf .dot { position: absolute; right: 0; top: 1px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1.5px var(--menubar); }

  /* generic window */
  .win { position: absolute; border-radius: 16px; background: var(--glass); backdrop-filter: blur(40px) saturate(1.5); border: 1px solid var(--edge); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
  .win.back { filter: brightness(.94); }
  .lights { display: flex; gap: 8px; } .lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .lights.off i { background: var(--hair-2); }
  .tbar { height: 52px; flex: none; display: flex; align-items: center; padding: 0 18px; gap: 12px; position: relative; }
  .tbar .ttl { font-weight: 650; font-size: 13.5px; }
  .tbar .sub { color: var(--text-3); font-size: 12px; }
  .sp { flex: 1; }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 14px; border-radius: 99px; font-size: 12.5px; font-weight: 560; cursor: pointer; user-select: none; white-space: nowrap; border: 1px solid transparent; color: var(--text); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary.lg { height: 36px; padding: 0 22px; font-size: 13.5px; }
  .btn.primary.off { opacity: .4; cursor: default; }
  .btn.sec { background: var(--chip); border-color: var(--hair); }
  .btn.ghost { color: var(--text-2); }
  .btn.ghost:hover, .btn.sec:hover { background: var(--hover); }
  .btn.sm { height: 26px; padding: 0 11px; font-size: 12px; }
  .link { color: var(--accent-text); cursor: pointer; }
  .muted { color: var(--text-2); } .faint { color: var(--text-3); }

  /* keycaps (keycapSurface) */
  .kc { display: inline-flex; align-items: center; justify-content: center; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 6px; font-size: 11.5px; font-weight: 600; color: var(--key-text); font-family: var(--font);
    background: linear-gradient(180deg, var(--key-top), var(--key-bot)); border: 1px solid var(--key-edge); border-bottom-width: 2px; box-shadow: inset 0 1px 0 var(--key-lip); vertical-align: middle; }
  .kc.lg { min-width: 52px; height: 48px; border-radius: 11px; font-size: 17px; padding: 0 12px; border-bottom-width: 3px; box-shadow: inset 0 1px 0 var(--key-lip), 0 4px 10px rgba(0,0,0,.18); }
  .kc.xl { min-width: 74px; height: 64px; border-radius: 13px; font-size: 20px; padding: 0 16px; border-bottom-width: 4px; box-shadow: inset 0 1px 0 var(--key-lip), 0 6px 14px rgba(0,0,0,.22); }
  .kc.wide { min-width: 150px; } .kc.mid { min-width: 96px; }
  .kc.on { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent)); color: #fff; border-color: color-mix(in srgb, var(--accent) 55%, #000); transform: translateY(2px); border-bottom-width: 1px; box-shadow: 0 0 0 6px var(--accent-soft); }
  .kw { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 5px; background: var(--chip); border: 1px solid var(--hair); font-family: var(--mono); font-size: 11.5px; color: var(--text); }

  /* ===== setup window ===== */
  .setup { left: 190px; top: 70px; width: 900px; height: 650px; }
  .setup .body { flex: 1; min-height: 0; padding: 0 64px; display: flex; flex-direction: column; }
  .setup .foot { height: 70px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 28px; border-top: 1px solid var(--hair); }
  .setup .foot .helper { color: var(--text-3); font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
  .dots { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--hair-2); } .dots i.on { width: 18px; background: var(--text-2); } .dots i.done { background: var(--text-3); }
  .h1 { font-size: 27px; font-weight: 700; letter-spacing: -.3px; margin: 6px 0 6px; }
  .lead { color: var(--text-2); font-size: 14px; margin: 0 0 22px; max-width: 640px; }

  /* welcome */
  .welcome { align-items: center; text-align: center; justify-content: center; padding-bottom: 20px; }
  .welcome .caps .cap { padding: 22px 12px 18px; }
  .appicon { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 12px 30px rgba(0,0,0,.28); }
  .welcome .h1 { font-size: 32px; margin-top: 18px; }
  .welcome .lead { margin: 0 auto 30px; font-size: 15px; }
  .caps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; }
  .cap { border-radius: 14px; background: var(--glass-2); border: 1px solid var(--hair); padding: 16px 12px 14px; text-align: center; }
  .cap .g { width: 40px; height: 40px; border-radius: 11px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; background: var(--chip); color: var(--text); }
  .cap .g svg { width: 20px; height: 20px; }
  .cap b { display: block; font-size: 13px; font-weight: 650; }
  .cap span { display: block; color: var(--text-3); font-size: 11.5px; margin-top: 3px; line-height: 1.45; }
  .cap .k { margin-top: 10px; display: flex; gap: 3px; justify-content: center; }

  /* goals */
  .goals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .goal { border-radius: 14px; border: 1px solid var(--hair); background: var(--glass-2); padding: 12px 16px; display: flex; gap: 14px; align-items: flex-start; cursor: pointer; position: relative; }
  .goal.on { border-color: var(--accent); background: var(--accent-soft); }
  .goal .g { width: 38px; height: 38px; border-radius: 10px; background: var(--chip); display: flex; align-items: center; justify-content: center; flex: none; }
  .goal .g svg { width: 19px; height: 19px; }
  .goal b { font-size: 14px; font-weight: 650; display: block; }
  .goal p { margin: 3px 0 0; color: var(--text-2); font-size: 12px; line-height: 1.5; }
  .goal .meta { margin-top: 5px; color: var(--text-3); font-size: 11.5px; display: flex; gap: 10px; }
  .goal .box { position: absolute; right: 14px; top: 14px; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--hair-2); display: flex; align-items: center; justify-content: center; }
  .goal.on .box { background: var(--accent); border-color: var(--accent); color: #fff; } .goal .box svg { width: 12px; height: 12px; stroke-width: 2.6; }
  .goal.wide { grid-column: span 2; }

  /* rows (grouped list, 44pt rows like Settings) */
  .group { border-radius: 12px; background: var(--glass-2); border: 1px solid var(--hair); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 52px; }
  .row + .row { border-top: 1px solid var(--hair); }
  .row .g { width: 30px; height: 30px; border-radius: 8px; background: var(--chip); display: flex; align-items: center; justify-content: center; flex: none; }
  .row .tx { flex: 1; min-width: 0; }
  .row .t { font-size: 13.5px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .row .d { color: var(--text-2); font-size: 12px; margin-top: 2px; }
  .row .tags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
  .tag { display: inline-flex; align-items: center; gap: 4px; height: 19px; padding: 0 7px; border-radius: 99px; font-size: 10.5px; font-weight: 550; background: var(--chip); color: var(--text-2); }
  .tag.acc { background: var(--accent-soft); color: var(--accent-text); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .ok { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12.5px; font-weight: 560; }
  .ok .c { width: 18px; height: 18px; border-radius: 50%; background: var(--text); color: var(--solid); display: inline-flex; align-items: center; justify-content: center; }
  .ok .c svg { width: 11px; height: 11px; stroke-width: 2.8; }
  .wait { display: inline-flex; align-items: center; gap: 8px; color: var(--accent-text); font-size: 12px; }
  .spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: sp .9s linear infinite; } @keyframes sp { to { transform: rotate(360deg); } }
  .sec-t { font-size: 11.5px; font-weight: 600; color: var(--text-3); margin: 16px 2px 8px; letter-spacing: .3px; }
  .fine { color: var(--text-3); font-size: 12px; display: flex; gap: 8px; align-items: center; margin-top: 12px; }

  /* AI options */
  .seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .opt { border-radius: 14px; border: 1px solid var(--hair); background: var(--glass-2); padding: 14px; cursor: pointer; }
  .opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .opt .top { display: flex; gap: 8px; align-items: center; } .opt b { font-size: 13.5px; }
  .opt .radio { margin-left: auto; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--hair-2); } .opt.on .radio { border: 5px solid var(--accent); }
  .opt p { margin: 6px 0 0; color: var(--text-2); font-size: 12px; line-height: 1.5; }
  .needs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .acct { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--text); color: var(--solid); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }

  /* ===== hub window ===== */
  .hub { left: 120px; top: 62px; width: 1040px; height: 680px; flex-direction: row; }
  .hub .side { width: 248px; flex: none; margin: 8px 0 8px 8px; border-radius: 12px; background: var(--glass-2); border: 1px solid var(--hair); display: flex; flex-direction: column; padding: 14px 10px 10px; }
  .hub .side .head { display: flex; align-items: center; gap: 9px; padding: 22px 6px 4px; }
  .hub .side .head img { width: 22px; height: 22px; border-radius: 6px; }
  .hub .side .head b { font-size: 14px; }
  .overall { margin: 10px 6px 14px; }
  .overall .bar { height: 4px; border-radius: 2px; background: var(--chip); overflow: hidden; margin-top: 6px; } .overall .bar i { display: block; height: 100%; background: var(--text-2); border-radius: 2px; }
  .overall span { font-size: 11.5px; color: var(--text-3); }
  .trk { display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 9px; cursor: pointer; }
  .trk + .trk { margin-top: 2px; }
  .trk.on { background: var(--accent-soft); }
  .trk .g { width: 28px; height: 28px; border-radius: 8px; background: var(--chip); display: flex; align-items: center; justify-content: center; flex: none; }
  .trk.on .g { color: var(--accent-text); }
  .trk .n { font-size: 13px; font-weight: 600; line-height: 1.25; } .trk.on .n { color: var(--accent-text); }
  .trk .s { font-size: 11px; color: var(--text-3); }
  .trk .r { margin-left: auto; }
  .ring-p { width: 18px; height: 18px; }
  .ring-p circle { fill: none; stroke-width: 2.4; }
  .side .bottom { margin-top: auto; border-top: 1px solid var(--hair); padding-top: 8px; }
  .side .bl { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; color: var(--text-2); font-size: 12.5px; }
  .hub .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .hub .content { flex: 1; min-height: 0; padding: 4px 34px 0; display: flex; flex-direction: column; }
  .hub .foot { height: 62px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 26px 0 34px; border-top: 1px solid var(--hair); }
  .hub .foot .helper { color: var(--text-3); font-size: 12px; }

  /* track overview */
  .hero { height: 214px; border-radius: 14px; background: var(--well); border: 1px solid var(--hair); position: relative; overflow: hidden; margin-bottom: 16px; }
  .tov h2 { font-size: 22px; margin: 2px 0 4px; letter-spacing: -.2px; }
  .tov .lead { margin: 0 0 14px; font-size: 13px; }
  .lessons .row { cursor: pointer; padding: 11px 14px; min-height: 48px; }
  .lessons .num { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--hair-2); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-2); font-weight: 600; flex: none; }
  .lessons .num.done { background: var(--text); border-color: var(--text); color: var(--solid); } .lessons .num.done svg { width: 11px; height: 11px; stroke-width: 2.8; }
  .lessons .num.cur { border-color: var(--accent); color: var(--accent-text); }
  .lessons .dur { color: var(--text-3); font-size: 11.5px; }

  /* lesson player */
  .lhead { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .lhead .crumb { color: var(--text-3); font-size: 12px; }
  .lsteps { display: flex; gap: 4px; margin-left: auto; } .lsteps i { width: 22px; height: 4px; border-radius: 2px; background: var(--hair-2); } .lsteps i.done { background: var(--text-2); } .lsteps i.on { background: var(--accent); }
  .ltitle { font-size: 21px; font-weight: 700; margin: 0 0 4px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; letter-spacing: -.2px; }
  .ldesc { color: var(--text-2); font-size: 13px; margin: 0 0 14px; }
  .stage { flex: 1; min-height: 0; border-radius: 14px; background: var(--well); border: 1px solid var(--hair); position: relative; overflow: hidden; margin-bottom: 14px; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
  .status.good { color: var(--text); font-weight: 560; }
  .status .c { width: 18px; height: 18px; border-radius: 50%; background: var(--text); color: var(--solid); display: inline-flex; align-items: center; justify-content: center; } .status .c svg { width: 11px; height: 11px; stroke-width: 2.8; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); animation: pl 1.4s ease-in-out infinite; } @keyframes pl { 50% { box-shadow: 0 0 0 8px transparent; } }

  /* sandbox doc */
  .doc { position: absolute; left: 22px; right: 22px; top: 20px; bottom: 0; background: var(--doc); border-radius: 11px 11px 0 0; border: 1px solid var(--hair); border-bottom: none; color: var(--doc-text); }
  .doc .bar { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid var(--hair); font-size: 11.5px; color: var(--text-3); }
  .doc .bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--hair-2); } .doc .bar span { margin-left: 8px; }
  .doc .txt { padding: 16px 18px; font-size: 14.5px; line-height: 1.7; }
  .doc .ph { color: var(--text-3); }
  .cur { display: inline-block; width: 1.6px; height: 18px; background: var(--accent); vertical-align: -3px; }
  .sel { background: color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 2px; }
  .newt { background: var(--accent-soft); border-radius: 3px; }
  .strike { text-decoration: line-through; color: var(--text-3); }

  /* voice capsule (Overlay) */

<script>

  { k: "chat", ic: "chat", n: "Agent 对话", s: "4 课 · 约 3 分钟", d: "能看懂上下文、会用工具的 AI 助手，也可以完全在本机私密运行。",

/* ---------- shared chrome ---------- */

function dots(n, total = 5) { return `<div class="dots">${Array.from({ length: total }, (_, i) => `<i class="${i < n ? "done" : i === n ? "on" : ""}"></i>`).join("")}</div>`; }
function setupWin(inner, { step = 0, foot = "" } = {}) {

function sfoot({ back = true, helper = "", extra = "", primary = "继续", go = "", off = false, lg = false }) {

}

/* ===================== PART 1 · first-run setup ===================== */
function sWelcome() {
  const caps = TR.map(t => {
    const keys = { voice: kc("fn"), launch: kc("⌘") + kc("Space"), tools: kw("lp") + kw("fy"), ring: kc("⌃") + kc("⌥") + kc("Space"), chat: kc("⌘") + kc("↩") }[t.k];
    const sub = { voice: "说话就能输入", launch: "打开、找回、截图", tools: "翻译、录屏、自动化", ring: "指针旁的快捷菜单", chat: "会用工具的 AI" }[t.k];

}

  return setupWin(`<div class="body"><div class="h1">你想先用 Typeflux 做什么？</div><p class="lead">选几个最想用的，我们只申请它们需要的权限，并按这个顺序带你上手。其余功能随时都能用。</p>
    <div class="goals">${g}<div class="goal" style="align-items:center;border-style:dashed;background:none"><div class="g">${ic("map")}</div><div><b>我都想看看</b><p>全部选中，按推荐顺序上手。</p></div><span class="box"></span></div></div></div>`,
    { step: 1, foot: sfoot({ helper: "已选 3 项 · 需要 3 项权限", primary: "继续", go: "perms" }) });
}
function permRow(icn, t, d, needs, state) {
  const right = state === "ok" ? `<span class="ok">${okc}已允许</span>` : state === "wait" ? `<span class="wait"><span class="spin"></span>在系统设置中打开开关…</span>` : state === "later" ? `<span class="btn ghost sm">用到时再问</span>` : `<span class="btn sec sm" data-go="perms-ok">允许</span>`;
  return `<div class="row"><span class="g">${ic(icn)}</span><div class="tx"><div class="t">${t}</div><div class="d">${d}</div><div class="tags">${needs.map(n => `<span class="tag">${n}</span>`).join("")}</div></div>${right}</div>`;
}
function sPerms(v) {
  const s = v === "ok" ? ["ok", "ok"] : v === "wait" ? ["ok", "wait"] : ["ask", "ask"];
  const remain = s.filter(x => x !== "ok").length;
  return setupWin(`<div class="body"><div class="h1">只需要这几项权限</div><p class="lead">根据你选的功能生成。每一项都写明了用在哪里；没选的功能，第一次用到时再问。</p>
    <div class="sec-t">现在需要</div>
    <div class="group">${permRow("mic", "麦克风", "听见你说的话。Typeflux 只在你按住快捷键时录音。", ["语音输入", "Agent 对话 · 语音提问"], s[0])}
      ${permRow("access", "辅助功能", "把文字写进当前应用、读取你选中的文字。", ["语音输入", "启动器", "剪贴板粘贴"], s[1])}</div>
    <div class="sec-t">用到时再问</div>
    <div class="group">${permRow("screen", "屏幕录制", "截图、录屏，以及让 AI 看懂当前屏幕。", ["截图", "Agent 对话 · 屏幕上下文"], "later")}</div>
    <div class="fine">${ic("lock")}语音默认在本机识别；截图和屏幕内容只在你提问时随问题发送。</div></div>`,
    { step: 2, foot: sfoot({ helper: remain ? `还差 ${remain} 项` : `${ic("check")}全部就绪`, extra: remain ? `<span class="btn ghost" data-go="ai">稍后授权</span>` : "", primary: "继续", off: remain > 0, go: remain ? "" : "ai" }) });
}
function sysSettings() {
  return `<div class="win" style="left:650px;top:300px;width:520px;height:360px;z-index:12;flex-direction:row">
    <div style="width:160px;background:var(--glass-2);border-right:1px solid var(--hair);padding:40px 8px;font-size:12px;color:var(--text-2)">${["通用", "外观", "辅助功能", "隐私与安全性", "键盘"].map((x, i) => `<div style="padding:5px 8px;border-radius:6px;${i === 3 ? "background:var(--accent);color:#fff" : ""}">${x}</div>`).join("")}</div>
    <div style="flex:1;padding:16px 16px"><div style="font-weight:650;font-size:14px;margin-bottom:4px">‹ 辅助功能</div><div class="faint" style="font-size:11.5px;margin-bottom:12px">允许下面的应用控制你的电脑。</div>
      <div class="group">${["Raycast", "Typeflux", "终端"].map((x, i) => `<div class="row" style="min-height:40px;padding:8px 12px;${i === 1 ? "box-shadow:inset 0 0 0 2px var(--accent)" : ""}">${i === 1 ? `<img src="${LOGO}" style="width:20px;height:20px;border-radius:5px">` : `<span class="g" style="width:20px;height:20px"></span>`}<span style="font-size:12.5px">${x}</span><span class="sp"></span><span style="width:32px;height:19px;border-radius:99px;background:${i === 0 ? "#34c759" : "var(--hair-2)"};position:relative"><i style="position:absolute;top:2px;${i === 0 ? "right" : "left"}:2px;width:15px;height:15px;border-radius:50%;background:#fff"></i></span></div>`).join("")}</div></div></div>
    <div class="coach r" style="left:356px;top:430px"><b>打开 Typeflux 的开关</b>打开后会自动回到 Typeflux，不用手动切换。</div>`;

function sAI() {

    <div class="seg3">
      <div class="opt on"><div class="top">${ic("cloud")}<b>Typeflux Cloud</b><span class="tag acc">推荐</span><span class="radio"></span></div><p>登录即用。含每月免费额度，联网搜索、识图，对话多设备同步。</p></div>

function sReady() {
  const picked = ["voice", "launch", "chat"].map(trk);
  return setupWin(`<div class="body" style="align-items:center;text-align:center"><div class="medal" style="margin-top:22px">${ic("check", "stroke-width:2.2")}</div>
    <div class="h1" style="margin-top:18px">准备好了</div><p class="lead" style="margin:0 auto 22px">现在就能用。按你选的顺序，每个功能一两分钟就能上手。</p>
    <div class="group" style="width:540px;text-align:left">${picked.map((t, i) => `<div class="row"><span class="g">${ic(t.ic)}</span><div class="tx"><div class="t">${i + 1}. ${t.n}</div><div class="d">${t.s}</div></div>${i === 0 ? `<span class="tag acc">从这里开始</span>` : ""}</div>`).join("")}</div>

    { step: 4, foot: sfoot({ extra: `<span class="btn ghost" data-go="menubar">以后再说</span>`, primary: "开始上手：语音输入", go: "voice-1", lg: true }) });

/* ===================== PART 2 · hub ===================== */
const PROG = { voice: 0, launch: 0, tools: 0, ring: 0, chat: 0 };
function ringP(done, total) {
  const r = 7, c = 2 * Math.PI * r, f = done / total;
  if (done >= total) return `<span class="ok"><span class="c" style="width:18px;height:18px">${ic("check")}</span></span>`;
  return `<svg class="ring-p" viewBox="0 0 18 18"><circle cx="9" cy="9" r="${r}" stroke="var(--hair-2)"/><circle cx="9" cy="9" r="${r}" stroke="var(--text-2)" stroke-dasharray="${c * f} ${c}" transform="rotate(-90 9 9)"/></svg>`;
}
function hub(active, mainHTML, prog, { foot = "", picked = ["voice", "launch", "chat"] } = {}) {
  const total = TR.reduce((a, t) => a + t.L.length, 0), done = Object.values(prog).reduce((a, b) => a + b, 0);
  const order = [...picked, ...TR.map(t => t.k).filter(k => !picked.includes(k))];
  const rows = order.map((k, i) => { const t = trk(k); return `${i === picked.length ? `<div class="sec-t" style="margin:12px 8px 4px">更多功能</div>` : ""}<div class="trk ${k === active ? "on" : ""}" data-go="${k}"><span class="g">${ic(t.ic)}</span><div><div class="n">${t.n}</div><div class="s">${prog[k]} / ${t.L.length} 课</div></div><span class="r">${ringP(prog[k], t.L.length)}</span></div>`; }).join("");
  return `<div class="win hub"><div class="side"><div class="lights" style="position:absolute;left:22px;top:22px"><i></i><i></i><i></i></div>
      <div class="head"><img src="${LOGO}"><b>上手 Typeflux</b></div>
      <div class="overall"><span>已学会 ${done} / ${total}</span><div class="bar"><i style="width:${done / total * 100}%"></i></div></div>
      <div class="sec-t" style="margin:4px 8px 4px">你选的</div>${rows}
      <div class="bottom"><div class="bl">${ic("help")}使用指南</div><div class="bl">${ic("x")}关闭，稍后在菜单栏继续</div></div></div>
    <div class="main">${mainHTML}${foot}</div></div>`;
}
function trackOverview(k, prog) {

  const n = labels.length, R = 140, r = 52, gap = 0.035;
  let paths = "", lbls = "";
  labels.forEach((l, i) => {
    const a0 = -Math.PI / 2 + (i - .5) * 2 * Math.PI / n + gap, a1 = -Math.PI / 2 + (i + .5) * 2 * Math.PI / n - gap;
    const p = (a, rad) => `${150 + rad * Math.cos(a)},${150 + rad * Math.sin(a)}`;
    paths += `<path class="sl ${i === onIdx ? "on" : ""}" d="M${p(a0, r + 4)} L${p(a0, R)} A${R},${R} 0 0 1 ${p(a1, R)} L${p(a1, r + 4)} A${r + 4},${r + 4} 0 0 0 ${p(a0, r + 4)}Z"/>`;
    const am = -Math.PI / 2 + i * 2 * Math.PI / n, lr = (R + r) / 2 + 2;
    lbls += `<div class="ringlbl ${i === onIdx ? "on" : ""}" style="left:${150 + lr * Math.cos(am)}px;top:${150 + lr * Math.sin(am)}px">${ic(l[0])}${l[1]}</div>`;
  });
  return `<div class="ringwrap" style="left:${cx - 150}px;top:${cy - 150}px"><svg class="ringsvg" viewBox="0 0 300 300">${paths}<circle class="hub" cx="150" cy="150" r="${r - 2}"/></svg>${lbls}<div class="ringc">${center}</div></div>`;
}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${TR.slice(0, 4).map(t => `<div class="group" style="padding:14px 16px"><div style="display:flex;align-items:center;gap:8px;font-weight:650">${ic(t.ic)}${t.n}</div><div class="faint" style="font-size:12px;margin:5px 0 10px">${t.d}</div><span class="link" style="font-size:12px">${t.k === "voice" || t.k === "launch" ? "再看一遍" : "去上手"} ›</span></div>`).join("")}</div></div></div>`;
}
function upgrade() {
  return deskDoc() + `<div class="win" style="left:390px;top:180px;width:500px;height:440px;z-index:20"><div class="tbar"><div class="lights off"><i></i><i></i><i></i></div></div>
    <div style="padding:0 34px;text-align:center"><div class="h1" style="font-size:22px">Typeflux 现在不只是语音输入</div><p class="lead" style="margin:0 auto 18px;font-size:13px">你已经在用语音输入了。这些是之后新增的功能，每个一两分钟就能上手。</p>
      <div class="group" style="text-align:left">${TR.slice(1).map(t => `<div class="row" style="min-height:46px;padding:10px 14px"><span class="g">${ic(t.ic)}</span><div class="tx"><div class="t" style="font-size:13px">${t.n}</div><div class="d" style="font-size:11.5px">${t.s}</div></div></div>`).join("")}</div></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;padding:18px 24px"><span class="btn ghost">以后再说</span><span class="btn primary">去上手中心</span></div></div>`;
}

/* ---------- registry ---------- */
const S = [
  { id: "welcome", g: "1 首次启动", name: "欢迎", fn: () => sWelcome(), note: "<b>欢迎</b>：一句话讲清 Typeflux 是什么，五个功能各配一个按键。不讲配置。" },
  { id: "goals", g: "1 首次启动", name: "选择用途", fn: () => sGoals(), note: "<b>选择用途</b>：用户选想先用的功能（默认选语音输入、启动器、Agent 对话）。选择决定：申请哪些权限、要不要连接 AI、上手中心的顺序。没选的功能不会被隐藏。" },
  { id: "perms", g: "1 首次启动", name: "权限（按用途生成）", fn: () => sPerms("ask"), note: "<b>权限</b>：清单由所选用途生成。每项写明用在哪些功能上；屏幕录制、摄像头等放到「用到时再问」。" },
  { id: "perms-wait", g: "1 首次启动", name: "权限 · 系统设置引导", fn: () => sPerms("wait") + sysSettings(), note: "<b>辅助功能引导</b>：系统设置旁浮出提示，指出要打开哪个开关；授权后自动回到 Typeflux。" },
  { id: "perms-ok", g: "1 首次启动", name: "权限 · 已就绪", fn: () => sPerms("ok"), note: "<b>权限就绪</b>" },
  { id: "ai", g: "1 首次启动", name: "连接 AI", fn: () => sAI(), note: "<b>连接 AI</b>：只在所选用途用到 AI 时出现，并列出会用到 AI 的功能。只选了语音输入时整页跳过（语音识别内置本机模型）。" },
  { id: "ready", g: "1 首次启动", name: "准备好了", fn: () => sReady(), note: "<b>准备好了</b>：首次设置到此结束（约 1 分钟）。显示按用途排好的上手计划，可以马上开始，也可以以后再说。" },
  { id: "voice", g: "2 上手中心", name: "上手中心 · 语音输入", fn: () => trackOverview("voice", P({})), note: "<b>上手中心</b>：一个普通的应用窗口（与使用指南、笔记本同款），左边是功能，右边是课程。每课 15–50 秒，在真实功能里完成，随时可以跳过。进度保存在本机。" },
  { id: "voice-1", g: "3 语音输入", name: "第 1 课 · 等待", fn: () => voice1(false), note: "<b>按住说话</b>：练习区是一个真实的文本框，焦点已经在里面。" },
  { id: "voice-1-rec", g: "3 语音输入", name: "第 1 课 · 录音中", fn: () => voice1(true), note: "<b>录音中</b>：底部是平时一样的录音胶囊（实时字幕 + 计时），学到的就是真实用法。" },
  { id: "voice-1-ok", g: "3 语音输入", name: "第 1 课 · 完成", fn: () => voice1("ok"), note: "<b>写入成功</b>：高亮写入的文字，并对比原话，让用户看到口头禅被去掉了。" },
  { id: "voice-2", g: "3 语音输入", name: "第 2 课 · 说一句话改写", fn: () => voice2(), note: "<b>改写选中文字</b>：有选中文字时，按住 fn 说的话会被当成指令（recordingIntent = askSelection）。" },
  { id: "voice-2-ok", g: "3 语音输入", name: "第 2 课 · 完成", fn: () => voice2("ok"), note: "<b>改写完成</b>：显示原文和结果，提示 ⌘Z 撤销。" },
  { id: "voice-4", g: "3 语音输入", name: "第 4 课 · 词汇表", fn: () => voice4(), note: "<b>词汇表</b>：对比加词前后的识别结果，让用户明白为什么要加。" },
  { id: "voice-done", g: "3 语音输入", name: "完成一个功能", fn: () => trackDone("voice", P({ voice: 4 }), "launch"), note: "<b>完成一个功能</b>：给一张速查卡，并引导到下一个功能；也可以今天先到这里。" },
  { id: "launch", g: "4 启动器 · 剪贴板 · 截图", name: "功能总览", fn: () => trackOverview("launch", P({ voice: 4 })), note: "<b>启动器 · 剪贴板 · 截图</b>：5 课。" },
  { id: "launch-1", g: "4 启动器 · 剪贴板 · 截图", name: "第 1 课 · 打开启动器", fn: () => launch1(), note: "<b>打开启动器</b>：真实的启动器出现在屏幕中间，上手中心留在后面。检测到冲突（⌘Space 被聚焦搜索占用）时，这里给出改用 ⌥Space 的选项。" },
  { id: "launch-2", g: "4 启动器 · 剪贴板 · 截图", name: "第 2 课 · 关键词", fn: () => launch2(), note: "<b>关键词</b>：从 50 多个关键词里挑 9 个最常用的；完整列表交给 help。点卡片会打开启动器并填好示例。" },
  { id: "launch-4", g: "4 启动器 · 剪贴板 · 截图", name: "第 4 课 · 剪贴板", fn: () => launch4(), note: "<b>剪贴板</b>：用户当前选的面板样式（这里是底部卡片架）会真实打开。" },
  { id: "launch-5", g: "4 启动器 · 剪贴板 · 截图", name: "第 5 课 · 截图", fn: () => launch5(), note: "<b>截图</b>：截图工具栏上的引导卡片只在第一次出现；屏幕录制权限在这一步才请求。" },
  { id: "tools-1", g: "5 录屏 · 翻译 · 工作流", name: "第 1 课 · 翻译", fn: () => tools1(), note: "<b>翻译</b>：三个翻译快捷键默认都不设置，这一课让用户录一个自己顺手的（演示值 ⌃⌥T），并检查冲突。" },
  { id: "tools-3", g: "5 录屏 · 翻译 · 工作流", name: "第 3 课 · 录屏与 GIF", fn: () => tools3("rec"), note: "<b>录屏</b>：用 gif 录一段区域，录制控制条和提示讲清 GIF 的 30 秒上限。" },
  { id: "tools-4", g: "5 录屏 · 翻译 · 工作流", name: "第 4 课 · 工作流", fn: () => tools4(), note: "<b>工作流</b>：从示例库添加 fx，马上在启动器里跑一次。只用随应用发布、已信任的示例，不涉及导入第三方代码。" },
  { id: "ring-1", g: "6 圆环", name: "第 1 课 · 按住划向松开", fn: () => ring1(), note: "<b>圆环</b>：圆环在指针处打开，键帽显示按住状态，指针轨迹指向「翻译」。圆环快捷键只在首次运行且没被占用时自动设置；没有快捷键时这一课先让用户录一个。" },
  { id: "ring-3", g: "6 圆环", name: "第 3 课 · 自定义", fn: () => ring3(), note: "<b>自定义圆环</b>：左边是可添加的类型，右边是实时预览。" },
  { id: "chat-1", g: "7 Agent 对话", name: "第 1 课 · 带上下文提问", fn: () => chat1(), note: "<b>带上下文提问</b>：对话窗口里的上下文标签和工具调用记录，让用户知道它看了什么。" },
  { id: "chat-2", g: "7 Agent 对话", name: "第 2 课 · 工具权限", fn: () => chat2(), note: "<b>工具权限</b>：用一次真实的「移动文件」确认，解释严格 / 标准 / YOLO 三种模式的区别。默认标准。" },
  { id: "chat-3", g: "7 Agent 对话", name: "第 3 课 · 私密与临时", fn: () => chat3(), note: "<b>私密与临时对话</b>：讲清数据存在哪、经不经过服务器。" },
  { id: "chat-4", g: "7 Agent 对话", name: "第 4 课 · 扩展能力", fn: () => chat4(), note: "<b>扩展能力</b>：技能、MCP、笔记本、记忆。只做介绍，不要求现在配置。" },
  { id: "all-done", g: "7 Agent 对话", name: "全部完成", fn: () => allDone(), note: "<b>全部完成</b>：最常用的 6 个按键做成速查表。完成后菜单栏里的「继续上手」消失。" },
  { id: "jit-launcher", g: "8 情境提示", name: "第一次打开启动器", fn: () => jitLauncher(), note: "<b>情境提示 · 启动器</b>：没学过这一课的用户第一次打开启动器时，底部出现一行提示，点 × 或用过一次关键词后不再出现。" },
  { id: "jit-ring", g: "8 情境提示", name: "第一次打开圆环", fn: () => jitRing(), note: "<b>情境提示 · 圆环</b>" },
  { id: "jit-record", g: "8 情境提示", name: "第一次录屏", fn: () => jitRecord(), note: "<b>情境提示 · 录屏</b>：权限在第一次用到时才请求，并说明麦克风、摄像头只在打开时才要。" },
  { id: "jit-chat", g: "8 情境提示", name: "第一次打开对话窗口", fn: () => jitChat(), note: "<b>情境提示 · 对话窗口</b>：空白页直接展示能做什么，并标出当前的工具权限。" },
  { id: "menubar", g: "9 回到上手", name: "菜单栏 · 继续上手", fn: () => menubarMenu(), mb: { app: "备忘录", hl: true, dot: true }, note: "<b>菜单栏</b>：没学完时，菜单顶部显示进度和下一课，图标上有一个小圆点（只在首次设置后的 7 天内显示）。" },
  { id: "help", g: "9 回到上手", name: "使用指南 · 开始页", fn: () => helpStart(), note: "<b>使用指南</b>：「开始」页顶部加一张「继续上手」卡片，功能卡片可以直接进入对应课程。" },
  { id: "upgrade", g: "9 回到上手", name: "老用户 · 新功能", fn: () => upgrade(), mb: { app: "Typeflux" }, note: "<b>老用户</b>：已经完成旧版引导的用户不再走首次设置，只在更新后显示一次新功能介绍，引导到上手中心。" },
];
const byId = Object.fromEntries(S.map(s => [s.id, s]));
S.forEach((s, i) => { s.prev = S[i - 1]?.id; });
const ADV = { "voice-1": "voice-1-rec", "voice-1-rec": "voice-1-ok", "voice-2": "voice-2-ok", "perms": "perms-wait", "perms-wait": "perms-ok" };
const ALIAS = { "voice-3": "voice-4", "launch-3": "launch-4", "tools-2": "tools-3", "ring-2": "ring-3", "launch-done": "tools-1", "tools": "tools-1", "ring": "ring-1", "chat": "chat-1" };

function renderDesk(s, theme) {
  return `<div class="desk t-${theme}">${menubar(s.mb || {})}${s.fn()}</div>`;
}
let state = { id: "welcome", theme: "dark", view: "proto" };
function parseHash() {
  for (const p of location.hash.slice(1).split("&")) {
    const [k, v] = p.split("=");
    if (v === undefined && byId[k]) state.id = k;
    else if (k === "theme") state.theme = v;
    else if (k === "view") state.view = v;
    else if (k === "bare") document.body.classList.add("bare");
  }
}
function render() {
  const s = byId[state.id];
  document.getElementById("stage").innerHTML = renderDesk(s, state.theme);
  document.getElementById("caption").innerHTML = s.note || "";
  document.getElementById("scrSel").value = state.id;
  document.querySelectorAll("#themePill button").forEach(b => b.classList.toggle("on", b.dataset.v === state.theme));
  document.querySelectorAll("#viewPill button").forEach(b => b.classList.toggle("on", b.dataset.v === state.view));
  document.body.classList.toggle("view-board", state.view === "board");
  if (state.view === "board") {
    const groups = [...new Set(S.map(s => s.g))];
    document.getElementById("board").innerHTML = groups.map(g => `<h3>${g}</h3><div class="grid">${S.filter(s => s.g === g).map(s => `<div><div class="lbl">${s.name}</div><div class="thumb" data-open="${s.id}">${renderDesk(s, state.theme)}</div></div>`).join("")}</div>`).join("");
  }
}
function go(id) {
  if (!id) return;
  if (id === "back") id = byId[state.id].prev || "welcome";
  id = ALIAS[id] || id;
  if (!byId[id]) return;
  state.id = id; history.replaceState(null, "", `#${id}&theme=${state.theme}`); render();
}
document.getElementById("scrSel").innerHTML = [...new Set(S.map(s => s.g))].map(g => `<optgroup label="${g}">${S.filter(s => s.g === g).map(s => `<option value="${s.id}">${s.name}</option>`).join("")}</optgroup>`).join("");
document.getElementById("scrSel").onchange = e => go(e.target.value);
document.getElementById("themePill").onclick = e => { if (e.target.dataset.v) { state.theme = e.target.dataset.v; go(state.id); } };
document.getElementById("viewPill").onclick = e => { if (e.target.dataset.v) { state.view = e.target.dataset.v; render(); } };
document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]"); if (o) { state.view = "proto"; go(o.dataset.open); return; }
  const g = e.target.closest("[data-go]"); if (g && g.dataset.go) { go(g.dataset.go); return; }
  if (e.target.closest(".stage, .launcher, .shelf") && ADV[state.id]) go(ADV[state.id]);
});
document.addEventListener("keydown", e => {
  const i = S.findIndex(s => s.id === state.id);
  if (e.key === "ArrowRight" && i < S.length - 1) go(S[i + 1].id);
  if (e.key === "ArrowLeft" && i > 0) go(S[i - 1].id);
});
parseHash(); render();
</script>
