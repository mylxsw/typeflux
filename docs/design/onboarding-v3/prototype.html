<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typeflux Onboarding 重设计 v3 · 可交互原型 (GUL-634)</title>
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;--pad:34px}
.theme-dark{
 --bg1:#17171a;--bg2:#0f0f12;--glow:rgba(10,132,255,.16);
 --card:rgba(255,255,255,.045);--card-hi:rgba(255,255,255,.07);--muted:rgba(255,255,255,.05);--sel:rgba(58,58,64,.96);
 --stroke:rgba(255,255,255,.07);--stroke2:rgba(255,255,255,.12);--selStroke:rgba(255,255,255,.28);
 --t1:rgba(245,245,247,.96);--t2:rgba(235,235,245,.6);--t3:rgba(235,235,245,.38);
 --accent:#0a84ff;--accentSoft:rgba(10,132,255,.16);--ok:#30d158;--okSoft:rgba(48,209,88,.12);--warn:#ff9f0a;--warnSoft:rgba(255,159,10,.12);--err:#ff6961;
 --plate:#ffffff;--plateLine:rgba(0,0,0,.12);--key:rgba(255,255,255,.08);--keyLine:rgba(255,255,255,.14);
 --footer:rgba(30,31,38,.96);--menu:#2b2b30;--field:rgba(0,0,0,.25);
 --shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.12);
 --art1:radial-gradient(120% 120% at 30% 0%,#4b3a8c 0%,#2a2350 45%,#16151d 100%);
 --art2:radial-gradient(120% 120% at 70% 0%,#203a4d 0%,#1b2330 50%,#141519 100%);
 --hero:radial-gradient(120% 90% at 20% 0%,#3b2a66 0%,#221d36 45%,#18171c 100%);
}
.theme-light{
 --bg1:#fbfaf9;--bg2:#eff1f5;--glow:rgba(0,122,255,.10);
 --card:#ffffff;--card-hi:#ffffff;--muted:#f3f3f6;--sel:rgba(0,122,255,.07);
 --stroke:rgba(0,0,0,.08);--stroke2:rgba(0,0,0,.13);--selStroke:rgba(0,122,255,.28);
 --t1:#1d1d1f;--t2:#6e6e75;--t3:#a1a1a8;
 --accent:#007aff;--accentSoft:rgba(0,122,255,.10);--ok:#28a745;--okSoft:rgba(40,167,69,.1);--warn:#c46f00;--warnSoft:rgba(255,159,10,.12);--err:#d70015;
 --plate:#ffffff;--plateLine:rgba(0,0,0,.1);--key:#ffffff;--keyLine:rgba(0,0,0,.14);
 --footer:rgba(246,247,249,.97);--menu:#f7f7f9;--field:#ffffff;
 --shadow:0 30px 80px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.16);
 --art1:radial-gradient(120% 120% at 30% 0%,#dcd2ff 0%,#ece7fb 50%,#f7f6fb 100%);
 --art2:radial-gradient(120% 120% at 70% 0%,#d6e8f5 0%,#eaf1f7 50%,#f6f7f9 100%);
 --hero:radial-gradient(120% 90% at 20% 0%,#e6ddfc 0%,#f0ecfa 45%,#f7f7f9 100%);
}
*{box-sizing:border-box}
html,body{margin:0;background:#0b0b0e;color:#e6e6ea;font-family:var(--font);-webkit-font-smoothing:antialiased}
body.page-light{background:#e3e3e8;color:#1d1d1f}
button{font-family:inherit}
.deck{display:flex;flex-direction:column;align-items:center;padding:18px 24px 40px;gap:10px}
.bar{width:1250px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.bar h1{font-size:15px;font-weight:600;margin:0}.bar h1 small{font-weight:400;opacity:.55;margin-left:8px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.chips .lbl{font-size:11.5px;opacity:.5;margin-right:2px}
.chip{border:1px solid rgba(127,127,140,.32);background:transparent;color:inherit;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.chip.on{background:#0a84ff;border-color:#0a84ff;color:#fff}.chip.sm{padding:3px 9px;font-size:11.5px}
.ctrls{display:flex;gap:12px;font-size:12px;align-items:center}
.ctrls select{font:inherit;font-size:12px;background:transparent;color:inherit;border:1px solid rgba(127,127,140,.32);border-radius:6px;padding:3px 6px}
.stage{display:flex;gap:24px;align-items:flex-start;width:1250px;margin-top:6px}
.notes{width:266px;font-size:12.5px;line-height:1.65}
.notes h3{font-size:11.5px;letter-spacing:.5px;opacity:.5;margin:0 0 6px;font-weight:600}
.notes ul{margin:0 0 16px;padding-left:16px}.notes li{margin-bottom:5px}
.notes .bad li::marker{color:#ff6b6b}.notes .good li::marker{color:#34c759}

/* window + v0.4 backdrop */
.win{width:960px;height:664px;border-radius:12px;color:var(--t1);box-shadow:var(--shadow);position:relative;overflow:hidden;flex:none;font-size:13px;
 background:radial-gradient(460px 460px at 100% 0%,var(--glow),transparent 70%),linear-gradient(135deg,var(--bg1),var(--bg2))}
.lights{position:absolute;left:20px;top:20px;display:flex;gap:8px;z-index:50}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;display:block;cursor:pointer}
.lights i:nth-child(2){background:#febc2e;cursor:default}.lights i:nth-child(3){background:#28c840;cursor:default}
.body{position:absolute;inset:0}
.screen{position:absolute;inset:0}
.noanim .screen,.noanim .guide,.noanim .alert{animation:none!important}
.screen.in{animation:in .3s cubic-bezier(.2,.8,.2,1)}.screen.inb{animation:inb .3s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(16px)}}@keyframes inb{from{opacity:0;transform:translateX(-16px)}}
@media (prefers-reduced-motion:reduce){.screen.in,.screen.inb{animation:none}}
.page{position:absolute;left:0;right:0;top:52px;bottom:88px;padding:6px var(--pad) 0;display:flex;flex-direction:column}
.page.center{justify-content:center;padding-bottom:10px}

/* editorial header */
.hd{display:flex;align-items:flex-start;margin-bottom:20px}
.hd.c{flex-direction:column;align-items:center;text-align:center;position:relative}
.hd .tx{flex:1}
.eb{font-size:9.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);opacity:.92;margin-bottom:8px}
.hd h2{margin:0;font-size:30px;font-weight:700;letter-spacing:-.3px;line-height:1.15;display:flex;align-items:center;gap:10px}
.hd.c h2{justify-content:center}
.hd p{margin:8px 0 0;font-size:13px;color:var(--t2)}
.pill{font-size:10px;font-weight:600;color:var(--t3);padding:5px 10px;border-radius:999px;background:var(--muted);box-shadow:inset 0 0 0 1px var(--stroke);white-space:nowrap;font-variant-numeric:tabular-nums}
.hd.c .pill{position:absolute;right:0;top:0}

/* floating footer (v0.4) */
.foot{position:absolute;left:20px;right:20px;bottom:18px;height:58px;border-radius:20px;background:var(--footer);box-shadow:inset 0 0 0 1px var(--stroke);display:flex;align-items:center;gap:14px;padding:0 10px;z-index:10}
.foot .sp{flex:1}
.foot .hint{font-size:11.5px;color:var(--t3)}
.cbtn{height:38px;border-radius:999px;border:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;font-weight:600;padding:0 16px;white-space:nowrap}
.cbtn.sec{background:var(--muted);color:var(--t1);box-shadow:inset 0 0 0 1px var(--stroke)}
.cbtn.pri{background:var(--accent);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);padding:0 18px;letter-spacing:.4px;font-weight:700}
.cbtn.ter{background:none;color:var(--t2);padding:0 10px;font-weight:600}
.cbtn.ter:hover{color:var(--t1)}
.cbtn:hover{filter:brightness(1.07)}.cbtn:active{transform:scale(.98)}
.cbtn[disabled]{opacity:.38;pointer-events:none}

/* base controls */
svg.i{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border-radius:18px;box-shadow:inset 0 0 0 1px var(--stroke)}
.btn{height:30px;padding:0 13px;border-radius:999px;border:none;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--t1);background:var(--muted);box-shadow:inset 0 0 0 1px var(--stroke2)}
.btn.p{background:var(--accent);color:#fff;box-shadow:none}
.btn.g{background:none;box-shadow:none;color:var(--t2)}
.btn:hover{filter:brightness(1.08)}.btn[disabled]{opacity:.4;pointer-events:none}
.link{color:var(--accent);background:none;border:none;padding:0;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.badge{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border-radius:999px;padding:5px 8px;background:var(--muted);color:var(--t3);white-space:nowrap}
.badge.a{background:var(--accentSoft);color:var(--accent)}.badge.ok{background:var(--okSoft);color:var(--ok)}.badge.w{background:var(--warnSoft);color:var(--warn)}
.msg{font-size:12px;display:inline-flex;align-items:center;gap:5px}
.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}.msg.warn{color:var(--warn)}.msg.mute{color:var(--t3)}
.spin{width:13px;height:13px;border-radius:50%;border:1.8px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;flex:none;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.radio{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--stroke2);flex:none;display:grid;place-items:center}
.radio.on{background:var(--accent);box-shadow:none}
.radio.on:after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.sel-card{position:relative;transition:background .15s,box-shadow .15s}
.sel-card.on{background:var(--sel);box-shadow:inset 0 0 0 1px var(--selStroke)}
.sel-card.on:before{content:"";position:absolute;inset:-3px;border-radius:inherit;box-shadow:0 0 0 1.2px var(--accent);pointer-events:none;opacity:.85}
.plate{width:38px;height:38px;border-radius:12px;background:var(--plate);box-shadow:inset 0 0 0 1px var(--plateLine);display:grid;place-items:center;flex:none;overflow:hidden}
.plate img{width:26px;height:26px;object-fit:contain}
.plate .ltr{font-size:14px;font-weight:700;color:#1d1d1f}
.plate.sym{background:var(--muted);box-shadow:inset 0 0 0 1px var(--stroke)}
.plate.sym svg{width:17px;height:17px;color:var(--accent)}
.field-l{font-size:11px;font-weight:600;color:var(--t2);margin:0 0 6px}
.field{height:34px;border-radius:10px;background:var(--field);box-shadow:inset 0 0 0 1px var(--stroke2);display:flex;align-items:center;padding:0 11px;gap:6px}
.field input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--t1);font:inherit;font-size:13px}
.field input::placeholder{color:var(--t3)}
.field:focus-within{box-shadow:0 0 0 3px var(--accentSoft),inset 0 0 0 1px var(--accent)}
.field.bad{box-shadow:inset 0 0 0 1px var(--err)}
.pop{height:34px;border-radius:10px;background:var(--muted);box-shadow:inset 0 0 0 1px var(--stroke2);display:flex;align-items:center;gap:8px;padding:0 10px 0 11px;cursor:pointer;position:relative;user-select:none}
.pop .v{flex:1}.pop .m{color:var(--t3);font-size:11.5px}
.menu{position:absolute;left:0;top:calc(100% + 4px);min-width:100%;background:var(--menu);border-radius:9px;padding:5px;z-index:40;box-shadow:0 12px 32px rgba(0,0,0,.32),inset 0 0 0 .5px var(--stroke2);cursor:default;color:var(--t1)}
.menu.up{top:auto;bottom:calc(100% + 4px)}
.menu .mi{height:26px;border-radius:5px;padding:0 9px 0 24px;display:flex;align-items:center;gap:10px;position:relative;white-space:nowrap;font-size:13px}
.menu .mi:hover{background:var(--accent);color:#fff}.menu .mi:hover .m{color:rgba(255,255,255,.75)}
.menu .mi .ck{position:absolute;left:8px}
.menu .mi .m{margin-left:auto;padding-left:18px;font-size:11.5px;color:var(--t3)}
.menu .mi img{width:16px;height:16px;border-radius:4px;background:#fff}
.menu .sepr{height:1px;background:var(--stroke);margin:4px 6px}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 8px;border-radius:7px;background:var(--key);box-shadow:inset 0 0 0 1px var(--keyLine),0 1px 0 var(--keyLine);font-size:12px;font-weight:600;color:var(--t1)}
.kcs{display:inline-flex;gap:4px}

/* welcome */
.wel{position:absolute;left:0;right:0;top:0;bottom:88px;display:grid;grid-template-columns:1fr 452px}
.wel .l{padding:76px 28px 0 44px;display:flex;flex-direction:column}
.appicon{width:52px;height:52px;border-radius:12px}
.wel h2{font-size:32px;line-height:1.25;font-weight:700;margin:22px 0 10px;letter-spacing:-.3px}
.wel .lead{color:var(--t2);font-size:14px}
.verbs{margin-top:24px}
.verb{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:10px;color:var(--t2)}
.verb b{color:var(--t1);font-weight:600}.verb .kcs{margin-left:auto}
.wel .r{padding:20px 20px 0 0}
.hero{height:100%;border-radius:18px;background:var(--hero);position:relative;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--stroke)}
.hero .cap{position:absolute;left:20px;bottom:18px;font-size:13px;font-weight:500}
.doc{width:320px;background:var(--bg1);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.3),inset 0 0 0 1px var(--stroke);padding:16px 18px;line-height:1.7}
.caret{display:inline-block;width:1.5px;height:15px;background:var(--accent);vertical-align:-2px;animation:bl 1s step-end infinite}
@keyframes bl{50%{opacity:0}}
.hud{margin:14px auto 0;width:max-content;display:flex;align-items:center;gap:8px;background:rgba(22,22,26,.88);color:#fff;border-radius:999px;padding:6px 14px 6px 10px;font-size:12px}
.wave{display:flex;gap:2px;align-items:center;height:14px}
.wave i{width:2.5px;border-radius:2px;background:#0a84ff;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{0%,100%{height:4px}50%{height:14px}}
.langsel{display:flex;align-items:center;gap:6px;color:var(--t2);font-size:12.5px;font-weight:600;cursor:pointer;position:relative;padding:0 10px}

/* route */
.routes{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:780px;margin:0 auto;width:100%}
.rc{border:none;font:inherit;color:inherit;text-align:left;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--stroke);padding:10px 10px 18px;cursor:pointer;display:flex;flex-direction:column}
.rc:hover{background:var(--card-hi)}
.art{height:156px;border-radius:13px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--stroke)}
.art.cloud{background:var(--art1)}
.art.own{background:var(--art2)}
.orb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:15px;box-shadow:0 10px 30px rgba(10,132,255,.35)}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.theme-light .ring{box-shadow:inset 0 0 0 1px rgba(80,60,160,.14)}
.cap{position:absolute;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);color:var(--t1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.theme-light .cap{background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 4px 12px rgba(60,40,140,.08)}
.cap svg{width:12px;height:12px}
.mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,38px);gap:12px;justify-content:center;align-content:center}
.mosaic .plate{box-shadow:0 6px 16px rgba(0,0,0,.25),inset 0 0 0 1px var(--plateLine)}
.mosaic .plate:nth-child(odd){transform:translateY(-6px)}
.rc .meta{display:flex;align-items:flex-start;gap:10px;padding:16px 8px 0}
.rc .meta .t{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.rc .meta .d{font-size:12.5px;color:var(--t2);margin-top:5px}
.rc .meta .radio{margin-left:auto;margin-top:2px}
.alt{text-align:center;margin-top:20px}

/* account */
.acct{width:460px;margin:0 auto;padding:22px}
.acct .top{display:flex;align-items:center;gap:14px}
.acct .top b{font-size:17px;font-weight:700;display:block}
.acct .top span{font-size:12px;color:var(--t2)}
.caps{margin-top:18px;border-top:1px solid var(--stroke);padding-top:6px}
.caprow{display:flex;align-items:center;gap:12px;height:44px}
.caprow .ic{width:28px;height:28px;border-radius:8px;background:var(--muted);display:grid;place-items:center}
.caprow .n{flex:1;font-weight:600}
.prog{height:4px;border-radius:2px;background:var(--muted);overflow:hidden;width:120px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.bigbtn{height:40px;width:100%;border-radius:999px;border:none;background:var(--accent);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px}

/* provider pages (v0.4 two-column) */
.two{position:relative;display:grid;grid-template-columns:330px 1fr;gap:18px;flex:1;min-height:0}
.plist{overflow:auto;display:flex;flex-direction:column;gap:8px;padding:3px 4px 12px 3px;margin:-3px;-webkit-mask-image:linear-gradient(#000 88%,transparent)}
.pc{border:none;font:inherit;color:inherit;text-align:left;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--stroke);cursor:pointer;flex:none}
.pc:hover{background:var(--card-hi)}
.pc .tx{flex:1;min-width:0}
.pc .tx b{display:block;font-size:13.5px;font-weight:600}
.pc .tx span{display:block;font-size:11px;color:var(--t2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.more{justify-content:center;color:var(--t2);font-weight:600;font-size:12.5px;padding:12px;background:none;box-shadow:inset 0 0 0 1px var(--stroke);border-style:dashed;position:relative}
.cfg{padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-height:0}
.cfg .eb{margin-bottom:0}
.cfg .nm{display:flex;align-items:center;gap:12px}
.cfg .nm b{font-size:18px;font-weight:700}
.cfg .ds{font-size:12px;color:var(--t2);margin-top:-6px}
.cfg .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cfg .act{margin-top:auto;display:flex;align-items:center;gap:12px;padding-top:14px;border-top:1px solid var(--stroke)}
.result{border-radius:12px;padding:10px 12px;background:var(--okSoft);font-size:12.5px;display:flex;align-items:center;gap:10px}
.result.err{background:rgba(255,105,97,.12)}
.result .q{flex:1;color:var(--t1)}

/* permissions */
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.sec-h b{font-size:13px;font-weight:700}
.sec-h .badge{margin-left:2px}
.prow{display:flex;align-items:center;gap:14px;padding:12px 16px}
.prow + .prow{border-top:1px solid var(--stroke)}
.prow .ic{width:38px;height:38px;border-radius:12px;background:var(--muted);display:grid;place-items:center;color:var(--accent);flex:none}
.prow .ic svg{width:16px;height:16px}
.prow.done .ic{background:var(--okSoft);color:var(--ok)}
.prow .tx{flex:1;min-width:0}
.prow .tx b{display:block;font-size:13px;font-weight:600}
.prow .tx span{font-size:11.5px;color:var(--t2)}
.prow.sm{padding:9px 16px}.prow.sm .ic{width:30px;height:30px;border-radius:9px}
.disc{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.disc .chev{transition:transform .2s;color:var(--t3)}
.disc.open .chev{transform:rotate(90deg)}
.scroller{overflow:auto;flex:1;min-height:0;margin:0 -6px;padding:3px 6px 12px;-webkit-mask-image:linear-gradient(#000 90%,transparent)}
.guide{position:absolute;right:20px;bottom:92px;width:270px;background:var(--menu);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.4),inset 0 0 0 .5px var(--stroke2);padding:14px;z-index:30;animation:in .25s}
.guide .gh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;margin-bottom:10px}
.guide .gh .x{margin-left:auto;color:var(--t3);cursor:pointer;display:flex}
.sys{border-radius:9px;background:var(--bg1);box-shadow:inset 0 0 0 1px var(--stroke2);padding:6px}
.sys .r{display:flex;align-items:center;gap:8px;height:28px;padding:0 6px;border-radius:6px;font-size:12px}
.sys .r.hl{background:var(--accentSoft)}
.sys img,.sys .ph{width:16px;height:16px;border-radius:4px}.sys .ph{background:#8a8a90}
.tog{margin-left:auto;width:26px;height:15px;border-radius:8px;background:var(--muted);position:relative;transition:background .2s;box-shadow:inset 0 0 0 1px var(--stroke2)}
.tog:after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tog.on{background:var(--ok)}.tog.on:after{left:13px}
.guide .st{margin-top:10px;font-size:12px;color:var(--t2);display:flex;align-items:center;gap:6px}

/* shortcuts */
.sk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sk{display:flex;align-items:center;gap:12px;height:60px;padding:0 12px 0 14px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--stroke);position:relative}
.sk.bad{box-shadow:inset 0 0 0 1px rgba(255,159,10,.55)}
.sk.rec{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--sel)}
.sk .ic{width:32px;height:32px;border-radius:10px;background:var(--muted);display:grid;place-items:center;color:var(--accent);flex:none}
.sk .tx{flex:1;min-width:0}
.sk .tx b{display:block;font-size:13px;font-weight:600}
.sk .tx span{display:block;font-size:11px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .tx span.w{color:var(--warn)}
.kbtn{border:none;background:none;padding:4px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:4px;position:relative}
.kbtn:hover{background:var(--muted)}
.kbtn .unset{height:26px;padding:0 10px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--stroke2);border:1px dashed transparent;display:flex;align-items:center;font-size:12px;color:var(--t3);font-weight:600}
.kbtn .recing{height:26px;padding:0 10px;border-radius:7px;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--accentSoft)}}
.sk .more{width:22px;height:26px;border:none;background:none;color:var(--t3);cursor:pointer;border-radius:6px;display:grid;place-items:center;position:relative}
.sk .more:hover{background:var(--muted)}
.fix{position:absolute;right:12px;bottom:-1px;transform:translateY(100%);z-index:5}
.grp-t{font-size:9.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--t3);margin:4px 2px 8px}

/* try */
.trygrid{display:grid;grid-template-columns:270px 1fr;gap:18px;flex:1;min-height:0}
.feat{display:flex;align-items:center;gap:12px;height:54px;padding:0 12px;border-radius:14px;cursor:pointer;border:none;background:none;color:var(--t1);font:inherit;width:100%;text-align:left;margin-bottom:6px}
.feat:hover{background:var(--card)}
.feat.on{background:var(--card);box-shadow:inset 0 0 0 1px var(--stroke)}
.feat .ic{width:32px;height:32px;border-radius:10px;background:var(--muted);display:grid;place-items:center}
.feat.on .ic{background:var(--accent);color:#fff}
.feat .nm{flex:1;font-weight:600}
.feat.off .nm{color:var(--t3)}
.pg{border-radius:18px;background:var(--hero);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-shadow:inset 0 0 0 1px var(--stroke)}
.pg .ins{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.tbox{width:100%;max-width:400px;min-height:92px;background:var(--bg1);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.22),inset 0 0 0 1px var(--stroke);padding:14px 16px;line-height:1.7}
.lc{width:100%;max-width:420px;background:var(--bg1);border-radius:12px;box-shadow:0 18px 48px rgba(0,0,0,.3),inset 0 0 0 1px var(--stroke2);overflow:hidden}
.lc .q{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:15px;border-bottom:1px solid var(--stroke)}
.lc .rs{padding:5px}.lc .rs div{display:flex;align-items:center;gap:9px;height:34px;padding:0 9px;border-radius:7px}
.lc .rs div.sel{background:var(--accent);color:#fff}.lc .rs div span{margin-left:auto;font-size:11.5px;opacity:.7}

/* dialogs */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding-top:120px}
.alert{width:260px;background:var(--menu);border-radius:12px;padding:20px 16px 16px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 0 0 .5px var(--stroke2);animation:pp .18s}
@keyframes pp{from{transform:scale(.96);opacity:0}}
.alert img{width:48px;height:48px;border-radius:11px}
.alert b{display:block;font-size:13px;margin:10px 0 4px}
.alert p{margin:0 0 16px;font-size:11.5px;color:var(--t2);line-height:1.5}
.alert .bs{display:flex;gap:8px}.alert .bs .btn{flex:1;height:28px;border-radius:7px;justify-content:center;font-weight:500}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(28,28,32,.94);color:#fff;font-size:12px;padding:7px 12px;border-radius:8px;z-index:70;white-space:nowrap}
</style>
</head>

 case 'alert-quit': S.alert=null;return toast('已关闭，可从菜单栏「继续设置…」回来');
 case 'to-custom': S.route='custom';return go('speech');
 case 'login': S.login='waiting';toast('已在浏览器中打开登录页');return later(1600,()=>{if(S.login!=='waiting')return;S.login='exchanging';later(800,()=>{S.login='done';});});
 case 'reopen': return toast('已重新打开登录页');
 case 'cancel-login': S.login='cancelled';return render();
 case 'relogin': S.login='idle';S.cloudLocal=false;S.cloudDl=0;return render();
 case 'cloud-local': S.cloudLocal=true;S.cloudDl=1;render();{const t=setInterval(()=>{S.cloudDl=Math.min(100,S.cloudDl+9);if(S.cloudDl>=100)clearInterval(t);render();},160);}return;
 case 'stt': S.stt=v;S.sttKey='';S.sttTest='idle';S.menu=null;return render();
 case 'local-pick': S.localModel=+v;S.menu=null;S.sttTest='idle';return render();
 case 'dl': return startDl(S.localModel);
 case 'dl-cancel': S.dl[S.localModel]=0;return render();
 case 'oauth': toast('已在浏览器中打开 Google 授权');return later(1200,()=>{S.sttKey='oauth';});
 case 'mic': if(S.sttTest==='rec'||S.sttTest==='busy')return; if(!S.micAsked){S.alert='micPrompt';S.alertFrom='speech';return render();} return runTest();
 case 'mic-allow': S.alert=null;S.micAsked=true;S.micDenied=false;S.perm.mic=true;if(S.alertFrom==='speech')return runTest();return render();
 case 'mic-deny': S.alert=null;S.micAsked=true;S.micDenied=true;return render();
 case 'skip-stt': S.sttSkipped=true;S.sttTest='idle';return go('llm');
 case 'llm': S.llm=v;S.llmKey='';S.menu=null;S.llmModel=null;S.llmTest='idle';{const p=findL(v);S.llmState=(p.kind==='none'||(p.kind==='ollama'&&S.ollamaUp))?'ok':'idle';}return render();
 case 'model-pick': S.llmModel=v;S.menu=null;return render();
 case 'llm-test': S.llmTest='busy';render();return later(900,()=>{S.llmTest='ok';});
 case 'ollama-retry': S.ollamaUp=true;S.llmState='ok';return render();
 case 'skip-llm': S.llmSkipped=true;return go('perms');
 case 'grant':
  if(v==='mic'){ if(S.micDenied){S.permBusy='mic';render();return later(1400,()=>{S.permBusy=null;S.micDenied=false;S.perm.mic=true;});} S.alert='micPrompt';S.alertFrom='perms';return render(); }
  S.permBusy='ax';S.guide='ax';render();return later(1800,()=>{S.perm.ax=true;render();later(700,()=>{S.permBusy=null;S.guide=null;});});
 case 'grant-opt':
  if(['calendar','camera','notifications'].includes(v)){S.alert='optPrompt';S._opt=v;ALERTS.optPrompt.t=`“Typeflux”想要访问${OPTIONAL.find(o=>o[0]===v)[1]}`;ALERTS.optPrompt.p=OPTIONAL.find(o=>o[0]===v)[2]+'。';return render();}
  S.permBusy=v;S.guide=v;render();return later(1800,()=>{S.opt[v]=true;render();later(700,()=>{S.permBusy=null;S.guide=null;});});
 case 'opt-allow': S.alert=null;S.opt[S._opt]=true;return render();
 case 'opt-deny': S.alert=null;return render();
 case 'opt-toggle': S.optOpen=!S.optOpen;return render();
 case 'guide-x': S.guide=null;return render();
 case 'skip-perms': S.permsSkipped=true;return go('shortcuts');
 case 'sk-record': S.menu=null;S.rec=S.rec===v?null:v;return render();
 case 'sk-reset': S.menu=null;sk(v).k=clone(SK0.find(x=>x.id===v).k);return render();
 case 'sk-clear': S.menu=null;sk(v).k=[];return render();
 case 'sk-preset': S.menu=null;sk('activation').k=[{fn:'fn',rcmd:'右 ⌘',ropt:'右 ⌥'}[v]];return render();
 case 'sk-suggest': sk(v).k=clone(SUGGEST[v]);return render();
 case 'sk-reset-all': S.sk=clone(SK0);S.rec=null;return render();
 case 'skip-sk': S.sk=clone(SK0);return go('try');
 case 'fixfn': if(S.fnBusy)return;S.fnBusy=true;S.guide='fn';render();return later(1600,()=>{S.fnFixed=true;render();later(700,()=>{S.fnBusy=false;S.guide=null;});});
 case 'feat': S.feat=v;return render();
 case 'tried': S.tried[S.feat]=true;return render();
 case 'to-connect': S.hist=[];return go('route',-1);
 case 'finish': return toast('设置完成，Typeflux 在菜单栏待命');
 case 'noop': return toast('会在浏览器中打开');
 }
}
document.addEventListener('click',e=>{
 const j=e.target.closest('[data-j]');if(j)return applyState(j.dataset.j,0);
 const s=e.target.closest('[data-st]');if(s)return applyState(S.screen,+s.dataset.st);
 const inMenu=e.target.closest('.menu');
 if(S.menu&&!inMenu&&!e.target.closest('[data-a="menu"]')){S.menu=null;render();return;}
 const el=e.target.closest('[data-a]');if(!el||el.disabled||el.dataset.a==='hold')return;
 if(el.dataset.a==='menu'&&inMenu){const inner=e.target.closest('.menu [data-a]');if(inner&&inner!==el)return act(inner.dataset.a,inner);return;}
 act(el.dataset.a,el);
});
document.addEventListener('dblclick',e=>{if(e.target.closest('.rc'))act('next');});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('[data-a="hold"]'))return;S.recv=true;S.practice='';render();
 const up=()=>{document.removeEventListener('pointerup',up);S.recv=false;S.practice='周五前把新版首页的设计稿发给我。';S.tried.voice=true;render();};document.addEventListener('pointerup',up);});
document.addEventListener('input',e=>{
 if(e.target.id==='sttkey'){S.sttKey=e.target.value;S.sttTest='idle';render();}
 if(e.target.id==='llmkey'){S.llmKey=e.target.value;S.llmTest='idle';S.llmState=S.llmKey?'busy':'idle';render();clearTimeout(act.k);if(S.llmKey)act.k=setTimeout(()=>{S.llmState=S.llmKey.toLowerCase().includes('bad')?'fail':'ok';render();},900);}
});
const KEYNAME={' ':'Space',Enter:'↩',Tab:'Tab',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Backspace:'⌫'};
document.addEventListener('keydown',e=>{
 if(S.rec){ e.preventDefault();
  if(e.key==='Escape'){S.rec=null;return render();}
  const mods=['Control','Alt','Shift','Meta'];
  if(mods.includes(e.key)){ if(sk(S.rec).voice&&(e.code==='MetaRight'||e.code==='AltRight')){sk(S.rec).k=[e.code==='MetaRight'?'右 ⌘':'右 ⌥'];S.rec=null;render();} return; }
  const k=[]; if(e.ctrlKey)k.push('⌃'); if(e.altKey)k.push('⌥'); if(e.shiftKey)k.push('⇧'); if(e.metaKey)k.push('⌘');
  const base=KEYNAME[e.key]||(e.code.startsWith('Key')?e.code.slice(3):e.code.startsWith('Digit')?e.code.slice(5):e.key.toUpperCase());
  if(!k.length&&!/^F\d+$/.test(base)){toast('需要至少一个修饰键（⌘ ⌥ ⌃ ⇧）');return;}
  k.push(base); sk(S.rec).k=k; S.rec=null; return render(); }
 if(e.key==='Escape'){if(S.menu){S.menu=null;render();}else if(S.alert){S.alert=null;render();}else if(e.target.tagName!=='INPUT')back();return;}
 if(e.key==='Enter'){const p=document.querySelector('#body .alert .btn.p')||document.querySelector('#body .foot .cbtn.pri:not([disabled])');if(p){e.preventDefault();p.click();}}
});
document.getElementById('c-theme').onchange=e=>{S.theme=e.target.value;render();};
document.getElementById('c-reset').onclick=()=>{const t=S.theme;S=clone(S0);S.sk=clone(SK0);S.theme=t;render();};
const q=new URLSearchParams(location.search);
if(q.get('theme')){S.theme=q.get('theme');document.getElementById('c-theme').value=S.theme;}
if(q.get('screen'))applyState(q.get('screen'),+(q.get('st')||0));else render();
</script>
</body>
