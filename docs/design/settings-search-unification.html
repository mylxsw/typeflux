<!DOCTYPE html>
<html lang="zh-Hans" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Typeflux · 设置界面控件统一规范 — 交互设计稿</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Noto Sans CJK SC", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, "Noto Sans Mono CJK SC", monospace;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --accent: #0a84ff; --accent-rgb: 10,132,255; --accent-hover: #2b95ff;
  --green: #30d158;
}
[data-theme="dark"] {
  color-scheme: dark;
  --page: #0b0b10; --win-bg: #1c1c21; --sidebar-tint: rgba(44,44,52,.55);
  --text: rgba(255,255,255,.92); --text-2: rgba(235,235,245,.62); --text-3: rgba(235,235,245,.38);
  --sep: rgba(255,255,255,.08); --hover: rgba(255,255,255,.06); --press: rgba(255,255,255,.11);
  --card: rgba(255,255,255,.045); --card-border: rgba(255,255,255,.07);
  --control: rgba(255,255,255,.075); --control-border: rgba(255,255,255,.10); --raised: #48484f;
  --accent-soft: rgba(10,132,255,.22); --danger: #ff453a; --danger-rgb: 255,69,58;
  --glass-fill: rgba(44,44,52,.42); --glass-strong: rgba(38,38,44,.86);
  --glass-rim-a: rgba(255,255,255,.40); --glass-rim-b: rgba(255,255,255,.12); --glass-hi: rgba(255,255,255,.12);
  --glass-shadow: 0 12px 34px rgba(0,0,0,.38), 0 1px 2px rgba(0,0,0,.35);
  --ambient-a: rgba(10,132,255,.16); --ambient-b: rgba(124,58,237,.12);
  --win-border: rgba(255,255,255,.12); --annot: #ff9f0a;
}
[data-theme="light"] {
  color-scheme: light;
  --page: #e9ebf0; --win-bg: #f6f6f8; --sidebar-tint: rgba(255,255,255,.6);
  --text: rgba(0,0,0,.86); --text-2: rgba(60,60,67,.68); --text-3: rgba(60,60,67,.42);
  --sep: rgba(0,0,0,.08); --hover: rgba(0,0,0,.045); --press: rgba(0,0,0,.085);
  --card: #ffffff; --card-border: rgba(0,0,0,.07);
  --control: rgba(0,0,0,.045); --control-border: rgba(0,0,0,.07); --raised: #ffffff;
  --accent-soft: rgba(10,132,255,.14); --danger: #ff3b30; --danger-rgb: 255,59,48; --accent-hover: #0077ed;
  --glass-fill: rgba(255,255,255,.55); --glass-strong: rgba(255,255,255,.9);
  --glass-rim-a: rgba(255,255,255,.95); --glass-rim-b: rgba(255,255,255,.55); --glass-hi: rgba(255,255,255,.7);
  --glass-shadow: 0 10px 30px rgba(30,30,60,.14), 0 1px 2px rgba(30,30,60,.12);
  --ambient-a: rgba(10,132,255,.10); --ambient-b: rgba(168,85,247,.08);
  --win-border: rgba(0,0,0,.10); --annot: #d97706;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; padding: 32px 40px 64px; min-width: 1240px; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 12px; height: 12px; }
h1 { font-size: 22px; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 19px; margin: 56px 0 6px; font-weight: 650; }
h3 { font-size: 15px; margin: 30px 0 12px; font-weight: 650; }
.sub { color: var(--text-2); margin: 0 0 18px; max-width: 1180px; }
code { font-family: var(--mono); font-size: .9em; }
kbd { font-family: var(--font); font-size: 10.5px; color: var(--text-3); padding: 0 5px; border-radius: 5px; box-shadow: inset 0 0 0 .5px var(--sep); background: var(--hover); line-height: 17px; display: inline-block; }
.topbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
.topbar .lb { color: var(--text-3); font-size: 12px; margin-left: 8px; }
.pill { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--hover); box-shadow: inset 0 0 0 .5px var(--sep); }
.pill button { height: 26px; padding: 0 12px; border-radius: 999px; color: var(--text-2); font-size: 12px; }
.pill button.on { background: var(--accent); color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .thumb, .ind { transition: none !important; } .btn:active { transform: none !important; } }

/* ---------- Liquid glass ---------- */
.glass { position: relative; background: var(--glass-fill); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi); isolation: isolate; }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(155deg, var(--glass-rim-a) 0%, rgba(255,255,255,0) 34%, rgba(255,255,255,0) 64%, var(--glass-rim-b) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; z-index: 2; }
.glass > * { position: relative; z-index: 3; }
.glass.strong { background: var(--glass-strong); }

/* ================= CONTROLS ================= */
/* Button: sizes L 36 / R 30 / S 24, all capsules. */
.btn { --h: 30px; --px: 14px; --fs: 13px; --ic: 12px; --gap: 6px;
  height: var(--h); padding: 0 var(--px); border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: var(--gap);
  font-size: var(--fs); font-weight: 500; white-space: nowrap; flex: none; position: relative;
  background-color: var(--control); box-shadow: inset 0 0 0 .5px var(--control-border); color: var(--text);
  transition: transform .25s var(--spring), background-color .15s, box-shadow .15s; outline: none; }
.btn:not(.icon):not(.s):not(.link):not(.popup):not(.fmenu) { min-width: 64px; }
.btn svg.i { width: var(--ic); height: var(--ic); stroke-width: 2; }
.btn.l { --h: 36px; --px: 18px; --fs: 14px; --ic: 14px; --gap: 7px; font-weight: 600; }
.btn.s { --h: 24px; --px: 10px; --fs: 12px; --ic: 11px; --gap: 5px; }
.btn.icon { width: var(--h); padding: 0; }
.btn:hover, .btn.is-hover { background-image: linear-gradient(var(--hover), var(--hover)); }
.btn:active, .btn.is-press { background-image: linear-gradient(var(--press), var(--press)); transform: scale(.97); }
.btn.primary { background-color: var(--accent); color: #fff; font-weight: 600; box-shadow: none; }
.btn.primary:hover, .btn.primary.is-hover { background-color: var(--accent-hover); background-image: none; }
.btn.primary:active, .btn.primary.is-press { background-image: linear-gradient(rgba(0,0,0,.12), rgba(0,0,0,.12)); }
.btn.plain { background-color: transparent; box-shadow: none; color: var(--text-2); }
.btn.plain:hover, .btn.plain.is-hover { color: var(--text); }
.btn.link { background: none !important; box-shadow: none; color: var(--accent); padding: 0 4px; }
.btn.link:hover, .btn.link.is-hover { opacity: .78; }
.btn.glass-b { background-color: var(--glass-fill); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 0 0 .5px var(--glass-rim-b), 0 4px 14px rgba(0,0,0,.22); }
.btn.danger { color: var(--danger); }
.btn.danger.primary { background-color: var(--danger); color: #fff; }
.btn:focus-visible, .btn.is-focus, .btn[data-autofocus]:focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3.5px rgba(var(--accent-rgb), .30); }
.btn.primary:focus-visible, .btn.primary.is-focus { box-shadow: 0 0 0 1px var(--win-bg), 0 0 0 3.5px rgba(var(--accent-rgb), .45); }
.btn.danger.primary:focus-visible, .btn.danger.primary.is-focus { box-shadow: 0 0 0 1px var(--win-bg), 0 0 0 3.5px rgba(var(--danger-rgb), .45); }
.btn[disabled], .btn.is-disabled { opacity: .45; pointer-events: none; }
.btn.is-loading { pointer-events: none; }
.spin { width: var(--ic); height: var(--ic); border-radius: 50%; border: 1.6px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
/* Pop-up button and menus */
.btn.popup { justify-content: space-between; font-weight: 400; min-width: 100px; padding-right: 10px; }
.btn.popup .v { overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.btn.popup > svg:last-child, .btn .chev { color: var(--text-3); width: 10px !important; height: 10px !important; stroke-width: 2.4 !important; }
.btn.primary .chev { color: rgba(255,255,255,.85); }
.btn.fmenu { font-weight: 500; padding-right: 10px; }
.btn.fmenu .n { color: var(--text-3); font-weight: 400; }
.btn.fmenu.active { background-color: var(--accent-soft); box-shadow: none; color: var(--accent); }
.btn.fmenu.active .n, .btn.fmenu.active .chev { color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
.anchor { position: relative; display: inline-flex; }
.menu { position: absolute; top: calc(100% + 5px); left: 0; min-width: 100%; max-width: 360px; max-height: 360px; overflow: auto; border-radius: 12px; padding: 5px; z-index: 60; }
.menu.right { left: auto; right: 0; }
.menu.static { position: relative; top: 0; display: inline-block; min-width: 220px; }
.mi { width: 100%; min-height: 26px; border-radius: 7px; padding: 3px 10px 3px 6px; display: flex; align-items: center; gap: 6px; font-size: 13px; text-align: left; white-space: nowrap; }
.mi .ck { width: 14px; flex: none; display: inline-flex; }
.mi .n { margin-left: auto; padding-left: 16px; color: var(--text-3); font-size: 11.5px; }
.mi .tx { display: flex; flex-direction: column; min-width: 0; }
.mi .msub { font-size: 11.5px; color: var(--text-2); }
.mi .tx { line-height: 1.35; }
.mi.rich { min-height: 44px; }
.mi.danger { color: var(--danger); }
.mi:hover, .mi.kb { background: var(--accent); color: #fff; }
.mi:hover .n, .mi.kb .n, .mi:hover .msub, .mi.kb .msub { color: rgba(255,255,255,.8); }
.msep { height: .5px; background: var(--sep); margin: 5px 6px; }
.mhead { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 6px 8px 2px; }
.msearch { padding: 4px 4px 6px; }
/* Underline tabs */
.utabs { position: relative; display: flex; gap: 22px; border-bottom: .5px solid var(--sep); margin-bottom: 12px; }
.utab { height: 32px; font-size: 13px; font-weight: 500; color: var(--text-2); }
.utab:hover { color: var(--text); }
.utab.on { color: var(--text); font-weight: 600; }
.utab .ct { color: var(--text-3); font-weight: 500; margin-left: 4px; font-size: 11px; font-variant-numeric: tabular-nums; }
.ind { position: absolute; bottom: -.5px; height: 2px; border-radius: 2px; background: var(--accent); transition: left .2s ease, width .2s ease; }
.utab:focus-visible { outline: none; border-radius: 6px; box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .3); }
/* Segmented */
.seg { position: relative; display: inline-flex; padding: 2px; border-radius: 999px; background: var(--control); box-shadow: inset 0 0 0 .5px var(--control-border); height: 30px; align-items: center; flex: none; }
.seg.s { height: 24px; }
.seg.fill { display: flex; width: 100%; }
.seg.fill button { flex: 1; }
.seg .thumb { position: absolute; top: 2px; bottom: 2px; border-radius: 999px; background: var(--raised); box-shadow: 0 1px 3px rgba(0,0,0,.18), inset 0 0 0 .5px var(--control-border); transition: left .18s ease, width .18s ease; }
.seg button { position: relative; z-index: 1; height: 26px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
.seg.s button { height: 20px; padding: 0 9px; font-size: 12px; }
.seg button:hover { color: var(--text); }
.seg button .n { color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.seg button.on { color: var(--text); font-weight: 600; }
.seg button.on .n { color: var(--text-2); }
.seg button svg.i { width: 13px; height: 13px; }
/* Pane list */
.panes { width: 200px; flex: none; overflow: auto; padding-right: 2px; }
.pane { width: 100%; height: 30px; border-radius: 7px; display: flex; align-items: center; gap: 9px; padding: 0 10px; font-size: 13px; text-align: left; }
.pane svg.i { width: 16px; height: 16px; color: var(--text-2); }
.pane:hover { background: var(--hover); }
.pane.on { background: var(--accent-soft); font-weight: 600; }
.pane.on svg.i { color: var(--accent); }
.pane .st { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
.pane .st.ok { background: var(--green); }
.phead { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 14px 10px 4px; }
.phead:first-child { padding-top: 0; }
/* Search field */
.sf { position: relative; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px 0 11px; border-radius: 999px; flex: 1 1 320px; min-width: 200px; max-width: 320px;
  background: var(--control); box-shadow: inset 0 0 0 .5px var(--control-border); transition: box-shadow .18s; color: var(--text-3); }
.sf.fillw { max-width: none; min-width: 0; width: 100%; flex: none; }
.sf.focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3.5px rgba(var(--accent-rgb), .30); color: var(--text-2); }
.sf input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 13px; color: var(--text); }
.sf input::placeholder { color: var(--text-3); }
.sf .count { font-size: 11px; color: var(--text-3); white-space: nowrap; }
.sf .clr { width: 16px; height: 16px; border-radius: 50%; display: none; align-items: center; justify-content: center; background: var(--text-3); color: var(--win-bg); }
.sf .clr svg { width: 8px; height: 8px; stroke-width: 2.6; }
.sf.has .clr { display: inline-flex; }
.sf.has .kb, .sf.focus .kb { display: none; }
/* Text field */
.tf { height: 30px; width: 100%; border-radius: 8px; padding: 0 10px; border: 0; outline: 0; background: var(--control); box-shadow: inset 0 0 0 .5px var(--control-border); font-size: 13px; transition: box-shadow .18s; }
.tf.mono { font-family: var(--mono); font-size: 12px; }
.tf:focus, .tf.is-focus { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3.5px rgba(var(--accent-rgb), .30); }
.tf.err { box-shadow: inset 0 0 0 1px var(--danger); }
.tf.err:focus { box-shadow: inset 0 0 0 1px var(--danger), 0 0 0 3.5px rgba(var(--danger-rgb), .25); }
.errmsg { color: var(--danger); font-size: 11.5px; margin-top: 4px; }
.sw { width: 30px; height: 18px; border-radius: 999px; background: var(--press); position: relative; transition: background .2s; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .3s var(--spring); }
.sw.on { background: var(--green); }
.sw.on::after { transform: translateX(12px); }

/* ================= WINDOW ================= */
.win { position: relative; width: 1100px; height: 760px; border-radius: 16px; overflow: hidden; background: var(--win-bg);
  box-shadow: 0 0 0 .5px var(--win-border), 0 30px 80px rgba(0,0,0,.35); display: flex; transition: width .3s ease; }
.win.narrow { width: 860px; }
.win::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(600px 400px at 10% 0%, var(--ambient-a), transparent 70%), radial-gradient(500px 360px at 90% 100%, var(--ambient-b), transparent 70%); }
.sidebar { position: relative; z-index: 2; width: 196px; flex: none; margin: 10px 0 10px 10px; border-radius: 14px; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; background: var(--sidebar-tint); }
.traffic { display: flex; gap: 8px; padding: 2px 6px 16px; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; padding: 0 8px 14px; }
.brand small { color: var(--text-3); font-weight: 500; font-size: 10px; }
.nav { height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: 7px; color: var(--text); font-size: 13px; text-align: left; width: 100%; }
.nav:hover { background: var(--hover); }
.nav.on { background: var(--accent-soft); font-weight: 600; }
.nav.on svg { color: var(--accent); }
.main { position: relative; z-index: 1; flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 26px 28px 0; }
.page-title { font-size: 22px; font-weight: 700; margin: 0 0 10px; letter-spacing: -.01em; }
.scroll { flex: 1; overflow: auto; padding: 4px 28px 28px; margin: -4px -28px 0; }
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.toolbar .flex { flex: 1; }
.body-split { display: flex; gap: 18px; flex: 1; min-height: 0; }
.body-split > .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
/* Grouped list */
.sec-label { display: flex; align-items: center; gap: 7px; padding: 0 4px; margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--text-2); min-height: 24px; }
.sec-label .n { font-weight: 400; font-size: 11px; color: var(--text-3); }
.sec-label .acts { margin-left: auto; display: flex; gap: 6px; }
.group { background: var(--card); border-radius: 12px; box-shadow: inset 0 0 0 .5px var(--card-border); margin-bottom: 18px; overflow: hidden; }
.group:has(.menu) { overflow: visible; }
.row { position: relative; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 12px; transition: background .15s; }
.row.single { min-height: 36px; padding: 5px 12px; }
.row.compact { min-height: 30px; padding: 3px 12px; }
.row:hover { background: var(--hover); }
.row.kbsel { background: var(--accent-soft); }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: var(--sep-left, 50px); height: .5px; background: var(--sep); }
.row.noicon + .row.noicon::before { --sep-left: 12px; }
.tile { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex: none; color: #fff; font-size: 12px; font-weight: 700; }
.tile svg { width: 15px; height: 15px; }
.rbody { flex: 1; min-width: 0; }
.rtitle { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.rtitle .t { overflow: hidden; text-overflow: ellipsis; }
.rsub { font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.tag { height: 16px; padding: 0 6px; border-radius: 999px; font-size: 10.5px; font-weight: 500; display: inline-flex; align-items: center; background: var(--hover); color: var(--text-2); box-shadow: inset 0 0 0 .5px var(--sep); flex: none; }
.tag.mono { font-family: var(--mono); font-size: 10px; }
mark { background: none; color: var(--accent); font-weight: 700; }
.acc { display: flex; align-items: center; gap: 10px; flex: none; color: var(--text-3); }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-2); }
.status i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); display: block; }
.status.ok i { background: var(--green); }
.status.run { color: var(--green); }
.row .hov { opacity: 0; transition: opacity .15s; }
.row:hover .hov, .row .hov.open { opacity: 1; }
.cols2 { columns: 2; column-gap: 0; }
.cols2 .row { break-inside: avoid; }
/* Form */
.form { background: var(--card); border-radius: 12px; box-shadow: inset 0 0 0 .5px var(--card-border); margin-bottom: 18px; }
.frow { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; padding: 10px 14px; }
.frow + .frow::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: .5px; background: var(--sep); }
.frow .lbl b { display: block; font-weight: 500; font-size: 13px; }
.frow .lbl span { font-size: 11.5px; color: var(--text-2); }
.frow .ctl { width: 220px; flex: none; display: flex; justify-content: flex-end; }
.frow .ctl.wide { width: 280px; }
/* Empty */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 64px 20px; color: var(--text-2); gap: 8px; }
.empty .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--hover); display: flex; align-items: center; justify-content: center; color: var(--text-3); margin-bottom: 4px; }
.empty .ic svg { width: 22px; height: 22px; }
.empty b { color: var(--text); font-size: 14px; font-weight: 600; }
.empty .acts { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
/* Split (placement B) */
.split { display: flex; gap: 14px; flex: 1; min-height: 0; padding-bottom: 20px; }
.lpane { width: 248px; flex: none; background: var(--card); border-radius: 12px; box-shadow: inset 0 0 0 .5px var(--card-border); display: flex; flex-direction: column; padding: 10px; min-height: 0; }
.narrow .lpane { width: 210px; }
.lpane .head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px 4px; font-weight: 600; font-size: 13px; }
.lpane .head .n { color: var(--text-3); font-weight: 400; font-size: 11.5px; margin-left: 5px; }

/** Button. style: primary | secondary | plain | link | glass | danger | danger-primary; size: l | r | s */
function btn(label, o = {}) {
  const { icon, style = 'secondary', size = 'r', iconOnly = false, data = '', cls = '', chevron = false, title = '', spec = '' } = o;
  const st = { primary: 'primary', secondary: '', plain: 'plain', link: 'link', glass: 'glass-b', danger: 'danger', 'danger-primary': 'danger primary' }[style];
  const lead = cls.includes('is-loading') ? '<span class="spin"></span>' : (icon ? I(icon) : '');
  const tip = title || (iconOnly ? label : '');
  return `<button class="btn ${st} ${size === 'r' ? '' : size} ${iconOnly ? 'icon' : ''} ${cls}" ${data} ${tip ? `title="${esc(tip)}" aria-label="${esc(tip)}"` : ''} ${spec ? `data-spec="${spec}"` : ''}>${lead}${iconOnly ? '' : esc(label)}${chevron ? I('down', 'chev') : ''}</button>`;
}
/** Toolbar secondary button: collapses to an icon-only circle in narrow windows. */
const tbBtn = (label, icon, data = '', chevron = false) => btn(label, { icon, iconOnly: S.narrow, data, title: label, chevron: chevron && !S.narrow });
/** Menu panel. items: {label, v, sub, count, icon, color, danger} | 'sep' | {head} */
function menu(key, items, sel, o = {}) {
  if (S.pop !== key) return '';
  let idx = -1;
  const body = items.map(it => {
    if (it === 'sep') return '<div class="msep"></div>';
    if (it.head) return `<div class="mhead">${esc(it.head)}</div>`;
    idx++;
    const lead = it.color ? `<span class="tile" style="width:22px;height:22px;border-radius:6px;font-size:10px;background:${it.color}">${esc(it.label[0])}</span>` : (it.icon ? I(it.icon, 'sm') : '');
    return `<button class="mi ${it.sub ? 'rich' : ''} ${it.danger ? 'danger' : ''} ${S.menuIdx === idx ? 'kb' : ''}" data-pick="${key}" data-v="${esc(it.v ?? it.label)}">
      ${o.noCheck ? '' : `<span class="ck">${sel === (it.v ?? it.label) ? I('check', 'sm') : ''}</span>`}${lead}
      ${it.sub ? `<span class="tx"><span>${esc(it.label)}</span><span class="msub">${esc(it.sub)}</span></span>` : esc(it.label)}
      ${it.count != null ? `<span class="n">${it.count}</span>` : ''}</button>`;
  }).join('');
  return `<div class="menu glass strong ${o.right ? 'right' : ''}" data-spec="${o.spec || '菜单 · 圆角 12 · 项 26 / 圆角 7'}">${o.search || ''}${body}</div>`;
}
/** Pop-up button (choose one value). */
function popup(key, opts, value, o = {}) {
  const cur = opts.find(x => x[0] === value) || opts[0];
  const lead = o.lead ? o.lead(cur) : '';
  return `<div class="anchor" ${o.w ? `style="width:${o.w}px"` : ''}><button class="btn popup ${o.size === 's' ? 's' : ''}" data-pop="${key}" ${o.w ? 'style="width:100%"' : ''} data-spec="TFPopUpButton · ${o.size === 's' ? '24' : '30'}pt">
    <span class="v">${lead}${esc(cur[1])}</span>${I('updown')}</button>
    ${menu(key, opts.map(([v, l]) => ({ v, label: l })), value)}</div>`;
}
/** Filter menu: shows "option · count", accent tint when not on the default. */
function filterMenu(key, opts, value, def = 'all') {
  const cur = opts.find(o => o[0] === value) || opts[0];
  return `<div class="anchor"><button class="btn fmenu ${value !== def ? 'active' : ''}" data-pop="filter:${key}" data-spec="TFFilterMenu">${esc(cur[1])} <span class="n">· ${cur[2]}</span>${I('down', 'chev')}</button>
    ${menu('filter:' + key, opts.map(([v, l, n]) => ({ v, label: l, count: n })), value)}</div>`;
}
/** Segmented control with a sliding thumb. opts: [value, label, count, icon] */
function segmented(key, opts, value, o = {}) {

}
/** Filter control: a segmented control, or a filter menu when there are >4 options or the window is narrow. */

    <div class="group" style="margin:0">${row({ q: '', icon: tile('1Password', '#0a84ff'), title: '1Password', sub: 'com.1password.1password', acc: '<span class="status run">运行中</span>' + btn('选择', { size: 's' }) })}
    ${row({ q: '', title: 'Raycast', tags: ['自动添加'], cls: 'compact', acc: btn('更多操作', { icon: 'dots', style: 'plain', size: 's', iconOnly: true }) })}</div></div>
  <div class="spec"><h5>表单行（标准）</h5><p class="d">左边是标签和说明，右边是控件；控件列 220pt（长内容 280pt）。</p>
    <div class="form" style="margin:0">${frow('界面语言', '重新打开窗口后生效', inert(popup('_lang', OPT.language, 'zh', { w: 220 })))}${frow('外观', null, inert(segmented('_ap', [['light', '浅色'], ['dark', '深色'], ['auto', '自动']], 'auto', { fill: true, id: 'apx' })))}${frow('登录时打开', null, sw(true, ''))}</div></div>
  <div class="spec"><h5>Sheet 底部 / 确认对话框（标准）</h5><p class="d">右对齐 [取消] [主要]；Return = 主要，Esc = 取消。危险确认：红色填充，默认焦点在「取消」。</p>
    <div class="mini-win"><div class="sh-foot" style="margin:0">${btn('帮助', { icon: 'help', iconOnly: true })}<span class="flex"></span>${btn('取消')}${btn('保存', { style: 'primary' })}</div></div>
    <div class="mini-win" style="margin-top:10px"><div class="sh-foot" style="margin:0"><span class="flex"></span>${btn('取消', { cls: 'is-focus' })}${btn('删除', { style: 'danger-primary' })}</div></div></div>
  <div class="spec"><h5>整页空状态 / 引导（大）</h5><p class="d">只用一个大号主要按钮，可以再加一个链接。</p>
    <div class="empty" style="padding:18px"><div class="ic">${I('server')}</div><b>还没有 MCP 服务器</b><div class="acts">${btn('添加 MCP 服务器', { icon: 'plus', style: 'primary', size: 'l' })}${btn('了解 MCP', { style: 'link' })}</div></div></div>
  <div class="spec"><h5>浮层（玻璃）</h5><p class="d">浮在内容上的操作条用玻璃按钮；开启「减少透明度」时改为不透明底色。</p>
    <div class="backdrop" style="padding:30px"><div class="bar glass">${btn('复制', { icon: 'copy', style: 'glass' })}${btn('问 AI', { icon: 'spark', style: 'glass' })}${btn('更多', { icon: 'dots', style: 'glass', iconOnly: true })}</div></div></div>
</div>

<h3>页面改动一览</h3>
<table class="cmp">
  <tr><th>页面</th><th>现在</th><th>统一后</th></tr>
  <tr><td>模型</td><td>搜索框挤在标题栏右上角；没有筛选；「添加自定义服务商」圆角 7</td><td>工具条：搜索 + 分段筛选 + 主要按钮（胶囊）；列表行统一</td></tr>
  <tr><td>词库</td><td>放大镜按钮点开才展开；来源筛选是独立的胶囊；两列卡片网格</td><td>常显搜索 + 分段筛选；「更多」改为操作菜单；紧凑列表行，行尾「⋯」</td></tr>
  <tr><td>人设</td><td>自绘搜索框和约 22pt 的小按钮</td><td>列表栏：小号「新建」+ 30pt 搜索；删除走确认对话框</td></tr>
  <tr><td>应用专属人设</td><td>搜索框是 2pt 蓝线；没有底部按钮</td><td>系统焦点环；分段带数量；底部 [取消] [完成]</td></tr>
  <tr><td>Agent</td><td>分区列表圆角 8；技能筛选没有数量</td><td>分区列表圆角 7，窄窗口收成选择器；筛选带数量；MCP 空状态用大号按钮</td></tr>
  <tr><td>启动器 · 关键词</td><td>「全部 · 37」在搜索框左边</td><td>筛选菜单移到右边，生效时着色；「添加关键词」改为主要按钮 + 操作菜单</td></tr>
  <tr><td>表单页（设置、联网搜索…）</td><td>选择器 36pt，旁边的按钮 30pt，高度不齐</td><td>选择器 30pt；控件列 220pt；危险操作用红字次要按钮 + 确认对话框</td></tr>
</table>`;
}

/* ================= Render ================= */
const SL = {};
function slide() {
  document.querySelectorAll('[data-slide]').forEach(c => {
    const on = c.querySelector(':scope > .on'), th = c.querySelector(':scope > .thumb, :scope > .ind');
    if (!th) return;
    if (!on) { th.style.width = '0'; return; }
    const id = c.dataset.slide, to = { l: on.offsetLeft, w: on.offsetWidth }, from = SL[id];
    if (from && (from.l !== to.l || from.w !== to.w)) {
      th.style.transition = 'none'; th.style.left = from.l + 'px'; th.style.width = from.w + 'px'; void th.offsetWidth; th.style.transition = '';
    }
    th.style.left = to.l + 'px'; th.style.width = to.w + 'px'; SL[id] = to;
  });
}
function paneNav(sec) {
  const n = NAV.find(x => x.id === sec), cur = S.pane[sec];
  const c = n.panes.flatMap(([, ps]) => ps).find(p => p[0] === cur);
  if (S.narrow) {
    return `<div class="toolbar"><div class="anchor"><button class="btn popup" data-pop="pane:${sec}" style="min-width:180px" data-spec="分区选择器（窄窗口）"><span class="v">${I(c[2], 'sm')}${esc(c[1])}</span>${I('updown')}</button>
      ${menu('pane:' + sec, n.panes.flatMap(([h, ps], i) => [...(i ? ['sep'] : []), { head: h }, ...ps.map(p => ({ v: p[0], label: p[1], icon: p[2] }))]), cur)}</div></div>`;
  }
  return `<div class="panes" data-spec="TFPaneList · 200pt">${n.panes.map(([h, ps]) => `<div class="phead">${h}</div>${ps.map(p => `<button class="pane ${cur === p[0] ? 'on' : ''}" data-pane="${sec}" data-v="${p[0]}">${I(p[2])}${p[1]}${p[3] ? `<span class="st ${p[3]}"></span>` : ''}</button>`).join('')}`).join('')}</div>`;
}
let libScroll = null;
function render() {
  document.getElementById('win').classList.toggle('narrow', S.narrow);
  document.getElementById('nav').innerHTML = NAV.map(n => `<button class="nav ${S.section === n.id ? 'on' : ''}" data-section="${n.id}">${I(n.icon)}${n.label}</button>`).join('');
  const n = NAV.find(x => x.id === S.section);
  let content;
  if (n.tabs) {
    const counts = { vocab: vocab.length, personas: personas.mine.length + personas.builtin.length };
    const p = S.page[n.id];
    const pages = { 'models.asr': () => pageModels('models.asr', asr, false), 'models.llm': () => pageModels('models.llm', llm, true), vocab: pageVocab, personas: pagePersonas };
    content = utabs('tabs-' + n.id, n.tabs.map(([v, l]) => [v, l, counts[v]]), p, 'data-page') + pages[p]();
  } else if (n.panes) {
    const pages = { skills: pageSkills, memory: pageMemory, mcp: pageMCP, web: pageWeb, image: pageImage, keywords: pageKeywords, general: pageLauncherGeneral, clip: pageClip };
    const inner = pages[S.pane[n.id]]();
    content = S.narrow ? paneNav(n.id) + inner : `<div class="body-split">${paneNav(n.id)}<div class="col">${inner}</div></div>`;
  } else content = pageSettings();
  const prevScroll = document.querySelector('#main .scroll')?.scrollTop || 0;
  document.getElementById('main').innerHTML = `<div class="page-title">${TITLES[S.section]}</div>${content}`;
  const sc = document.querySelector('#main .scroll'); if (sc && S._keepScroll) sc.scrollTop = prevScroll;
  S._keepScroll = false;
  const scrim = document.getElementById('scrim'), sheet = document.getElementById('sheet');
  scrim.classList.toggle('open', !!(S.sheet || S.dialog));
  sheet.className = 'sheet glass strong ' + (S.dialog ? 'dialog' : S.sheet === 'gallery' ? 'wide' : '');
  sheet.innerHTML = S.dialog ? dialog() : S.sheet === 'apps' ? sheetApps() : S.sheet === 'gallery' ? sheetGallery() : '';
  document.getElementById('lib').innerHTML = lib();
  slide();
  if (S.focusKey) {
    const el = document.querySelector(`[data-search="${S.focusKey}"]`);
    if (el) { el.focus({ preventScroll: true }); const k = el.value.length; el.setSelectionRange(k, k); }
  } else if (S.dialog) document.querySelector('#sheet [data-autofocus]')?.focus();
  if (S.kbIndex >= 0) currentRows()[S.kbIndex]?.classList.add('kbsel');
}
const currentKey = () => S.sheet || (S.section === 'settings' ? null : (NAV.find(x => x.id === S.section).tabs ? S.page[S.section] : S.pane[S.section]));
const currentRows = () => [...(S.sheet ? document.getElementById('sheet') : document.getElementById('main')).querySelectorAll('.row, .litem[data-persona], .gcard')];
const menuItems = () => [...document.querySelectorAll('.menu:not(.static) .mi')];
const closePop = () => { if (S.pop === 'model') { S.q.model = ''; if (S.focusKey === 'model') S.focusKey = null; } S.pop = null; S.menuIdx = -1; };

/* ================= Events ================= */
function onPick(key, v) {
  const i = key.indexOf(':'), kind = i < 0 ? key : key.slice(0, i), name = key.slice(i + 1);
  if (kind === 'filter') { S.filter[name] = v; S.kbIndex = -1; }
  else if (kind === 'set') S.set[name] = v;
  else if (kind === 'pane') S.pane[name] = v;
  else if (kind === 'demo') S.demo[name] = v;
  else if (key === 'model') S.set.model = v;
  closePop();
  if (S.focusKey === 'model') S.focusKey = null;
}
document.addEventListener('input', e => {
  const k = e.target.dataset.search;
  if (k && !e.isComposing) { S.q[k] = e.target.value; S.focusKey = k; S.kbIndex = -1; S.menuIdx = -1; render(); return; }
  const f = e.target.dataset.field;
  if (f) { S.set[f] = e.target.value; const pos = e.target.selectionStart; S._keepScroll = true; render(); const el = document.querySelector(`[data-field="${f}"]`); el.focus(); el.setSelectionRange(pos, pos); }
});
document.addEventListener('compositionend', e => {
  const k = e.target.dataset?.search;
  if (k) { S.q[k] = e.target.value; S.focusKey = k; S.kbIndex = -1; render(); }
});
document.addEventListener('focusin', e => { const k = e.target.dataset?.search; if (k && S.focusKey !== k) { S.focusKey = k; S.kbIndex = -1; e.target.closest('.sf').classList.add('focus'); } });
document.addEventListener('focusout', e => {
  const k = e.target.dataset?.search;
  if (k) setTimeout(() => { if (document.activeElement?.dataset?.search !== k && S.focusKey === k) { S.focusKey = null; document.querySelector(`[data-search="${k}"]`)?.closest('.sf')?.classList.remove('focus'); } });
});
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-section]');
  if (!e.target.closest('.menu, [data-pop]') && S.pop) { closePop(); if (!t || !e.target.closest('#win, #lib')) { render(); return; } }
  if (e.target === document.getElementById('scrim')) { S.sheet = null; S.dialog = null; render(); return; }
  if (!t) return;
  const d = t.dataset;
  const keep = !!e.target.closest('#lib');
  if (d.section) { S.section = d.section; S.kbIndex = -1; S.focusKey = null; }
  else if (d.page) { S.page[S.section] = d.page; S.kbIndex = -1; S.focusKey = null; }
  else if (d.pane) { S.pane[d.pane] = d.v; S.kbIndex = -1; S.focusKey = null; }
  else if (d.clear) { S.q[d.clear] = ''; S.focusKey = d.clear; S.kbIndex = -1; }
  else if (d.seg) onPick(d.seg, d.v);
  else if (d.pick) onPick(d.pick, d.v);
  else if (d.pop) { const open = S.pop === d.pop; closePop(); if (!open) { S.pop = d.pop; if (S.pop === 'model') S.focusKey = 'model'; } S._keepScroll = true; }
  else if (d.demoUtab) S.demo.utab = d.demoUtab;
  else if (d.persona) S.persona = d.persona;
  else if (d.skill) { const s = skills.find(x => x[0] === d.skill); s[3] = !s[3]; S._keepScroll = true; }
  else if (d.kw) { const k = keywords.find(x => x[0] === d.kw); k[4] = !k[4]; S._keepScroll = true; }
  else if (d.toggle) { S.set[d.toggle] = !S.set[d.toggle]; S._keepScroll = true; }
  else if (d.sheet) { S.sheet = d.sheet; S.focusKey = null; S.kbIndex = -1; }
  else if (d.dialog) { S.dialog = d.dialog; S.focusKey = null; }
  else if (d.close !== undefined) { if (S.dialog) S.dialog = null; else S.sheet = null; S.focusKey = null; }
  else if (d.act) { S.busy = true; S._keepScroll = true; setTimeout(() => { S.busy = false; S._keepScroll = true; render(); }, 1400); }
  else return;
  if (keep || d.pick || d.seg) S._keepScroll = true;
  render();
});
document.addEventListener('keydown', e => {
  if (S.pop) {
    const items = menuItems();
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!items.length) return;
      S.menuIdx = (S.menuIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((m, i) => m.classList.toggle('kb', i === S.menuIdx)); items[S.menuIdx].scrollIntoView({ block: 'nearest' }); return;
    }
    if (e.key === 'Enter' && S.menuIdx >= 0) { e.preventDefault(); items[S.menuIdx]?.click(); return; }
    if (e.key === 'Escape') { e.preventDefault(); closePop(); S._keepScroll = true; render(); return; }
  }
  const key = currentKey();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') {
    if (!key || !document.querySelector(`[data-search="${key}"]`)) return;
    e.preventDefault(); S.focusKey = key; S.kbIndex = -1; render(); return;
  }
  if (e.key === 'Escape') {
    if (S.focusKey) {
      if (S.q[S.focusKey]) { S.q[S.focusKey] = ''; render(); }
      else { document.activeElement.blur(); S.focusKey = null; render(); }
      return;
    }
    if (S.dialog) { S.dialog = null; render(); return; }
    if (S.sheet) { S.sheet = null; render(); }
    return;
  }
  const ae = document.activeElement;
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && ae?.classList.contains('utab')) {
    e.preventDefault();
    const tabs = [...ae.parentElement.querySelectorAll('.utab')], i = tabs.indexOf(ae);
    const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    const sel = next.dataset.page ? `.utab[data-page="${next.dataset.page}"]` : `.utab[data-demo-utab="${next.dataset.demoUtab}"]`;
    next.click(); document.querySelector(sel)?.focus(); return;
  }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && (S.focusKey || S.kbIndex >= 0)) {
    const rows = currentRows(); if (!rows.length) return;
    e.preventDefault();
    if (S.focusKey) { ae.blur(); S.focusKey = null; S.kbIndex = 0; }
    else S.kbIndex = Math.max(0, Math.min(rows.length - 1, S.kbIndex + (e.key === 'ArrowDown' ? 1 : -1)));
    S._keepScroll = true; render(); currentRows()[S.kbIndex]?.scrollIntoView({ block: 'nearest' });
  }
});
function pill(id, fn) {
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset.v);
  });
}
pill('themePill', v => { document.documentElement.dataset.theme = v; });
pill('annotPill', v => document.body.classList.toggle('annot', v === 'on'));
pill('widthPill', v => { S.narrow = v === 'narrow'; closePop(); render(); setTimeout(slide, 320); });
render();
</script>
